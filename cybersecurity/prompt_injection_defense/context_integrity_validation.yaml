    retrieval_validation: "Validate vector distances and check retrieved contexts for indirect injections."
    knowledge_source_security: "Enforce strict access controls and change audits on source dataset repositories."
    context_integrity: "Validate that the injected context matches the original source chunk without mutation."
  foundation_model_security:
    foundation_model_hardening: "Apply adversarial training and weight pruning to model files."
    foundation_model_monitoring: "Continuous checking of model activations and drift indicators."
    foundation_model_assurance: "Quarterly third-party model audit and red-teaming checks."
