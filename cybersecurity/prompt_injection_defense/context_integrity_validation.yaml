    reasoning_validation: "Review internal execution trace graphs against templates."
    reasoning_tamper_detection: "Monitor internal scratchpad structures for state injection mutations."
    reasoning_assurance: "Independent parsers check that agent reasoning outputs follow safe constraints."
  memory_security:
    memory_access_controls: "Enforce strict read-write access limits on conversation history files."
    memory_integrity: "Hash conversation records and verify signature integrity checks before retrieval injections."
    memory_retention_controls: "Expire and erase short-term memory keys after session inactivity timeouts."
    memory_tampering_detection: "Audit memory stores for poisoning payloads or adversarial state manipulations."
