dependencies:
  - "urn:enterprise:cybersecurity:central_siem"
  - "urn:enterprise:compliance:identity_provider"
metrics:
  - metric_name: "context_integrity_validation_attack_detection_rate"
    formula: "COUNT(detected_attacks) / COUNT(total_attacks)"
    target: ">= 0.98"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_attack_detection_rate_metric_trend_log"
  - metric_name: "context_integrity_validation_prompt_injection_block_rate"
    formula: "COUNT(blocked_injections) / COUNT(total_prompt_injections)"
    target: ">= 0.99"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_prompt_injection_block_rate_metric_trend_log"
  - metric_name: "context_integrity_validation_security_control_effectiveness_score"
    formula: "AVG(control_validation_rate * (1 - bypass_rate))"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_security_control_effectiveness_score_metric_trend_log"
  - metric_name: "context_integrity_validation_mean_time_to_detect"
    formula: "AVG(detection_timestamp - attack_timestamp)"
    target: "<= 5m"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_mean_time_to_detect_metric_trend_log"
  - metric_name: "context_integrity_validation_mean_time_to_respond"
    formula: "AVG(response_timestamp - detection_timestamp)"
    target: "<= 15m"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_mean_time_to_respond_metric_trend_log"
  - metric_name: "context_integrity_validation_agent_security_score"
    formula: "MIN(agent_control_checks_status)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_agent_security_score_metric_trend_log"
  - metric_name: "context_integrity_validation_runtime_security_score"
    formula: "AVG(runtime_integrity_checks)"
    target: ">= 0.98"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_runtime_security_score_metric_trend_log"
  - metric_name: "context_integrity_validation_threat_coverage_score"
    formula: "COUNT(mapped_atlas_tactics) / COUNT(total_atlas_tactics)"
    target: ">= 0.90"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_threat_coverage_score_metric_trend_log"
  - metric_name: "context_integrity_validation_vulnerability_remediation_rate"
    formula: "COUNT(patched_cves) / COUNT(total_cves)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_vulnerability_remediation_rate_metric_trend_log"
  - metric_name: "context_integrity_validation_security_assurance_score"
    formula: "MIN(security_assurance_checks)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Security Engineer"
    data_source: "central_security_telemetry_db"
    evidence_generated: "context_integrity_validation_security_assurance_score_metric_trend_log"
kpis:
  - "Context Integrity Validation overall security index target >= 0.98"
  - "Incident detection SLA <= 5 minutes"
  - "Incident response SLA <= 15 minutes"
kris:
  - "Number of unresolved vulnerabilities in Context Integrity Validation operations"
  - "Control signature verification failure rate"
  - "Telemetry pipeline latency spikes"
thresholds:
  critical_security_score: 0.9
  warning_security_score: 0.95
  evidence_verification_max_latency_seconds: 5
evidence_requirements:
  - "Cryptographically signed firewall and guardrail logs"
  - "System process execution hash registers"
  - "Validation check outputs and review signatures"
validation_rules:
  signature_verification: "Verify target signature using authority ledger keys."
  configuration_check: "Compare active Context Integrity Validation safety configs with baseline hashes."
reporting_requirements:
  security_dashboard: "Monthly updates on overall security scores, control metrics, and incidents."
