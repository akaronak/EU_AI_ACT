metrics:
  - metric_name: "evidence_traceability_metadata_evidence_integrity_score"
    formula: "COUNT(valid_sealed_hashes) / COUNT(total_hashes)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "REAL_TIME"
    owner: "Evidence Steward"
    data_source: "hsm_logs_vault"
    evidence_generated: "Signed Cryptographic Seal Ledger entry."
  - metric_name: "evidence_traceability_metadata_evidence_quality_score"
    formula: "COUNT(complete_records) / COUNT(total_records)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Evidence Steward"
    data_source: "completeness_validation_logs"
    evidence_generated: "Evidence collection log package."
  - metric_name: "evidence_traceability_metadata_evidence_traceability_score"
    formula: "COUNT(traceable_records) / COUNT(total_records)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "CONTINUOUS"
    owner: "Assurance Lead"
    data_source: "traceability_ledger_db"
    evidence_generated: "Weekly Traceability Validation Reports."
  - metric_name: "evidence_traceability_metadata_attestation_readiness_score"
    formula: "MIN(readiness_checklist_status)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Audit Director"
    data_source: "completeness_validation_logs"
    evidence_generated: "Signed Attestation Certificates."
  - metric_name: "evidence_traceability_metadata_attestation_accuracy_score"
    formula: "COUNT(accurate_data_points) / COUNT(total_data_points)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Assurance Lead"
    data_source: "validation_vault_db"
    evidence_generated: "Signed Attestation Validation Certificate."
  - metric_name: "evidence_traceability_metadata_assurance_effectiveness_score"
    formula: "COUNT(detected_errors) / COUNT(total_existing_errors)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.85"
    measurement_frequency: "DAILY"
    owner: "Assurance Lead"
    data_source: "validation_vault_db"
    evidence_generated: "Daily Assurance Evaluation Reports."
  - metric_name: "evidence_traceability_metadata_audit_readiness_score"
    formula: "MIN(assurance_checks_status)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "MONTHLY"
    owner: "Audit Director"
    data_source: "assurance_vault_db"
    evidence_generated: "Quarterly Audit Readiness Reports."
  - metric_name: "evidence_traceability_metadata_chain_of_custody_integrity_score"
    formula: "COUNT(aligned_handoffs) / COUNT(total_handoffs)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "QUARTERLY"
    owner: "Evidence Steward"
    data_source: "custody_ledger_db"
    evidence_generated: "Monthly Custody Audit reports."
  - metric_name: "evidence_traceability_metadata_regulatory_defensibility_score"
    formula: "COUNT(compliant_records) / COUNT(total_records)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "CONTINUOUS"
    owner: "Assurance Lead"
    data_source: "completeness_validation_logs"
