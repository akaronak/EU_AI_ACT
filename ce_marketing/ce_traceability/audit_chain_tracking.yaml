purpose:
  >
    Executable CE Marking skill for Audit Chain Tracking within ce_marketing/ce_traceability.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    traceability, evidence lineage, documentation lineage, conformity lineage. Functions as
    governance, conformity, certification, compliance, evidence, assessment, regulatory, market-
    access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Audit Chain
    Tracking.
objectives:
  - Operationalize Audit Chain Tracking as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Audit Chain Tracking
  - Maintain market-access-ready evidence for Audit Chain Tracking
  - Integrate Audit Chain Tracking with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Audit Chain Tracking
definitions:
  audit_chain_tracking_conformity_assertion:
    Formal conformity statement for Audit Chain Tracking supported by indexed evidence.
  audit_chain_tracking_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  audit_chain_tracking_market_access_record:
    Record demonstrating market authorization readiness for Audit Chain Tracking.
taxonomy:
