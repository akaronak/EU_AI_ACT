purpose:
  >
    Executable CE Marking skill for Decision Traceability within ce_marketing/ce_traceability.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    traceability, evidence lineage, documentation lineage, conformity lineage. Functions as
    governance, conformity, certification, compliance, evidence, assessment, regulatory, market-
    access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Decision
    Traceability.
objectives:
  - Operationalize Decision Traceability as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Decision Traceability
  - Maintain market-access-ready evidence for Decision Traceability
  - Integrate Decision Traceability with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Decision Traceability
definitions:
  decision_traceability_conformity_assertion:
    Formal conformity statement for Decision Traceability supported by indexed evidence.
  decision_traceability_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  decision_traceability_market_access_record:
    Record demonstrating market authorization readiness for Decision Traceability.
