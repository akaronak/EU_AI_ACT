workflows:
  - workflow_id: WF-CE-DECISION_TRACEABILIT
    workflow_name: decision_traceability_conformity_workflow
    workflow_owner: decision_traceability_workflow_owner
    trigger: decision_traceability_conformity_event
    inputs:
      - decision_traceability_conformity_context
      - decision_traceability_evidence_index
    activities:
      - decision_traceability_intake
      - decision_traceability_validation
      - decision_traceability_evidence_review
      - decision_traceability_approval
      - decision_traceability_attestation
      - decision_traceability_closure
    decision_points:
      - decision_traceability_conformity_decision
      - decision_traceability_escalation_decision
    approvals:
      - decision_traceability_conformity_officer_approval
    outputs:
      - decision_traceability_conformity_record
    evidence_generated:
      - decision_traceability_workflow_log
      - decision_traceability_attestation
    success_criteria:
      - decision_traceability_conformity_validated
      - decision_traceability_evidence_complete
    failure_conditions:
      - decision_traceability_critical_gap_unresolved
      - decision_traceability_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: decision_traceability_ce_marking_preparation_workflow
    linked: true
    trigger: decision_traceability_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: decision_traceability_conformity_assessment_workflow
    linked: true
    trigger: decision_traceability_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: decision_traceability_notified_body_engagement_workflow
    linked: true
    trigger: decision_traceability_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: decision_traceability_declaration_of_conformity_workflow
    linked: true
    trigger: decision_traceability_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: decision_traceability_market_authorization_workflow
    linked: true
    trigger: decision_traceability_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: decision_traceability_post_certification_monitoring_workflow
    linked: true
    trigger: decision_traceability_post_certification_monitoring_initiated
  - workflow_id: WF-CE-RECERTIFICAT
    workflow_name: decision_traceability_recertification_workflow
    linked: true
    trigger: decision_traceability_recertification_initiated
decision_logic:
  decision_traceability_conformity_gate:
    condition: decision_traceability_readiness_score >= 0.95 AND decision_traceability_evidence_complete == true
    action: authorize_decision_traceability_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Decision Traceability EU AI Act conformity dimensions
  assessment_methodology: decision_traceability_iso_19011_conformity_method
  assessment_criteria: decision_traceability_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - decision_traceability_technical_file
    - decision_traceability_risk_assessment
    - decision_traceability_validation_records
  acceptance_thresholds: decision_traceability_readiness_score >= 0.95
  rejection_thresholds: decision_traceability_critical_gap == true
metrics:
  - metric_name: traceability_completeness_rate
    metric_category: conformity
    formula: computed_traceability_completeness_rate_from_decision_traceability_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: decision_traceability_metrics_owner
    data_source: decision_traceability_conformity_warehouse
    evidence_generated: traceability_completeness_rate_measurement_record
  - metric_name: evidence_lineage_integrity_score
    metric_category: conformity
    formula: computed_evidence_lineage_integrity_score_from_decision_traceability_telemetry
