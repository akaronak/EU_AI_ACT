purpose:
  >
    Executable CE Marking skill for Governance Responsibility Mapping within
    ce_marketing/ce_governance. Delivers conformity-assessment-ready, notified-body-ready, market-
    access-ready operations for governance controls, accountability, provider obligations,
    conformity ownership. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Governance
    Responsibility Mapping.
objectives:
  - Operationalize Governance Responsibility Mapping as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Governance Responsibility Mapping
  - Maintain market-access-ready evidence for Governance Responsibility Mapping
  - Integrate Governance Responsibility Mapping with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Governance Responsibility Mapping
definitions:
  governance_responsibility_mapping_conformity_assertion:
    Formal conformity statement for Governance Responsibility Mapping supported by indexed evidence.
  governance_responsibility_mapping_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  governance_responsibility_mapping_market_access_record:
    Record demonstrating market authorization readiness for Governance Responsibility Mapping.
taxonomy:
  root: governance_responsibility_mapping_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  governance_responsibility_mapping_status:
    - draft
    - validated
    - approved
    - published
    - suspended
governance:
