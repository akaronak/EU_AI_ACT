workflows:
  - workflow_id: WF-CE-GOVERNANCE_RESPONSIB
    workflow_name: governance_responsibility_mapping_conformity_workflow
    workflow_owner: governance_responsibility_mapping_workflow_owner
    trigger: governance_responsibility_mapping_conformity_event
    inputs:
      - governance_responsibility_mapping_conformity_context
      - governance_responsibility_mapping_evidence_index
    activities:
      - governance_responsibility_mapping_intake
      - governance_responsibility_mapping_validation
      - governance_responsibility_mapping_evidence_review
      - governance_responsibility_mapping_approval
      - governance_responsibility_mapping_attestation
      - governance_responsibility_mapping_closure
    decision_points:
      - governance_responsibility_mapping_conformity_decision
      - governance_responsibility_mapping_escalation_decision
    approvals:
      - governance_responsibility_mapping_conformity_officer_approval
    outputs:
      - governance_responsibility_mapping_conformity_record
    evidence_generated:
      - governance_responsibility_mapping_workflow_log
      - governance_responsibility_mapping_attestation
    success_criteria:
      - governance_responsibility_mapping_conformity_validated
      - governance_responsibility_mapping_evidence_complete
    failure_conditions:
      - governance_responsibility_mapping_critical_gap_unresolved
      - governance_responsibility_mapping_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: governance_responsibility_mapping_ce_marking_preparation_workflow
    linked: true
    trigger: governance_responsibility_mapping_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: governance_responsibility_mapping_conformity_assessment_workflow
    linked: true
    trigger: governance_responsibility_mapping_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: governance_responsibility_mapping_notified_body_engagement_workflow
    linked: true
    trigger: governance_responsibility_mapping_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: governance_responsibility_mapping_declaration_of_conformity_workflow
