purpose:
  >
    Executable CE Marking skill for Governance Escalation Workflow within
    ce_marketing/ce_governance. Delivers conformity-assessment-ready, notified-body-ready, market-
    access-ready operations for governance controls, accountability, provider obligations,
    conformity ownership. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Governance
    Escalation Workflow.
objectives:
  - Operationalize Governance Escalation Workflow as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Governance Escalation Workflow
  - Maintain market-access-ready evidence for Governance Escalation Workflow
  - Integrate Governance Escalation Workflow with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Governance Escalation Workflow
definitions:
  governance_escalation_workflow_conformity_assertion:
    Formal conformity statement for Governance Escalation Workflow supported by indexed evidence.
  governance_escalation_workflow_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  governance_escalation_workflow_market_access_record:
    Record demonstrating market authorization readiness for Governance Escalation Workflow.
taxonomy:
  root: governance_escalation_workflow_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  governance_escalation_workflow_status:
    - draft
    - validated
    - approved
    - published
    - suspended
governance:
