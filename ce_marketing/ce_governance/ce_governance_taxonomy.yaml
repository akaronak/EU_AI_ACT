purpose:
  >
    Executable CE Marking skill for Ce Governance Taxonomy within ce_marketing/ce_governance.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    governance controls, accountability, provider obligations, conformity ownership. Functions as
    governance, conformity, certification, compliance, evidence, assessment, regulatory, market-
    access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Ce Governance
    Taxonomy.
objectives:
  - Operationalize Ce Governance Taxonomy as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Ce Governance Taxonomy
  - Maintain market-access-ready evidence for Ce Governance Taxonomy
  - Integrate Ce Governance Taxonomy with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Ce Governance Taxonomy
definitions:
  ce_governance_taxonomy_conformity_assertion:
    Formal conformity statement for Ce Governance Taxonomy supported by indexed evidence.
  ce_governance_taxonomy_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  ce_governance_taxonomy_market_access_record:
    Record demonstrating market authorization readiness for Ce Governance Taxonomy.
taxonomy:
