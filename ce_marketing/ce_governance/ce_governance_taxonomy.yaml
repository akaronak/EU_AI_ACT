workflows:
  - workflow_id: WF-CE-CE_GOVERNANCE_TAXONO
    workflow_name: ce_governance_taxonomy_conformity_workflow
    workflow_owner: ce_governance_taxonomy_workflow_owner
    trigger: ce_governance_taxonomy_conformity_event
    inputs:
      - ce_governance_taxonomy_conformity_context
      - ce_governance_taxonomy_evidence_index
    activities:
      - ce_governance_taxonomy_intake
      - ce_governance_taxonomy_validation
      - ce_governance_taxonomy_evidence_review
      - ce_governance_taxonomy_approval
      - ce_governance_taxonomy_attestation
      - ce_governance_taxonomy_closure
    decision_points:
      - ce_governance_taxonomy_conformity_decision
      - ce_governance_taxonomy_escalation_decision
    approvals:
      - ce_governance_taxonomy_conformity_officer_approval
    outputs:
      - ce_governance_taxonomy_conformity_record
    evidence_generated:
      - ce_governance_taxonomy_workflow_log
      - ce_governance_taxonomy_attestation
    success_criteria:
      - ce_governance_taxonomy_conformity_validated
      - ce_governance_taxonomy_evidence_complete
    failure_conditions:
      - ce_governance_taxonomy_critical_gap_unresolved
      - ce_governance_taxonomy_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: ce_governance_taxonomy_ce_marking_preparation_workflow
    linked: true
    trigger: ce_governance_taxonomy_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: ce_governance_taxonomy_conformity_assessment_workflow
    linked: true
