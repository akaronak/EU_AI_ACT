purpose:
  >
    Executable CE Marking skill for Ce Orchestration Taxonomy within ce_marketing/orchestration.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    certification lifecycle orchestration, cross-domain coordination, regulatory event routing.
    Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Ce Orchestration
    Taxonomy.
objectives:
  - Operationalize Ce Orchestration Taxonomy as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Ce Orchestration Taxonomy
  - Maintain market-access-ready evidence for Ce Orchestration Taxonomy
  - Integrate Ce Orchestration Taxonomy with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Ce Orchestration Taxonomy
definitions:
  ce_orchestration_taxonomy_conformity_assertion:
    Formal conformity statement for Ce Orchestration Taxonomy supported by indexed evidence.
  ce_orchestration_taxonomy_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  ce_orchestration_taxonomy_market_access_record:
    Record demonstrating market authorization readiness for Ce Orchestration Taxonomy.
taxonomy:
  root: ce_orchestration_taxonomy_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  ce_orchestration_taxonomy_status:
