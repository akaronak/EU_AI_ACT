workflows:
  - workflow_id: WF-CE-CE_ORCHESTRATION_TAX
    workflow_name: ce_orchestration_taxonomy_conformity_workflow
    workflow_owner: ce_orchestration_taxonomy_workflow_owner
    trigger: ce_orchestration_taxonomy_conformity_event
    inputs:
      - ce_orchestration_taxonomy_conformity_context
      - ce_orchestration_taxonomy_evidence_index
    activities:
      - ce_orchestration_taxonomy_intake
      - ce_orchestration_taxonomy_validation
      - ce_orchestration_taxonomy_evidence_review
      - ce_orchestration_taxonomy_approval
      - ce_orchestration_taxonomy_attestation
      - ce_orchestration_taxonomy_closure
    decision_points:
      - ce_orchestration_taxonomy_conformity_decision
      - ce_orchestration_taxonomy_escalation_decision
    approvals:
      - ce_orchestration_taxonomy_conformity_officer_approval
    outputs:
      - ce_orchestration_taxonomy_conformity_record
    evidence_generated:
      - ce_orchestration_taxonomy_workflow_log
      - ce_orchestration_taxonomy_attestation
    success_criteria:
      - ce_orchestration_taxonomy_conformity_validated
      - ce_orchestration_taxonomy_evidence_complete
    failure_conditions:
      - ce_orchestration_taxonomy_critical_gap_unresolved
      - ce_orchestration_taxonomy_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: ce_orchestration_taxonomy_ce_marking_preparation_workflow
    linked: true
    trigger: ce_orchestration_taxonomy_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: ce_orchestration_taxonomy_conformity_assessment_workflow
    linked: true
    trigger: ce_orchestration_taxonomy_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
