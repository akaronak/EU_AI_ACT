purpose:
  >
    Executable CE Marking skill for Certification Lifecycle Orchestration within
    ce_marketing/orchestration. Delivers conformity-assessment-ready, notified-body-ready, market-
    access-ready operations for certification lifecycle orchestration, cross-domain coordination,
    regulatory event routing. Functions as governance, conformity, certification, compliance,
    evidence, assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Certification
    Lifecycle Orchestration.
objectives:
  - Operationalize Certification Lifecycle Orchestration as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Certification Lifecycle Orchestration
  - Maintain market-access-ready evidence for Certification Lifecycle Orchestration
  - Integrate Certification Lifecycle Orchestration with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Certification Lifecycle Orchestration
definitions:
  certification_lifecycle_orchestration_conformity_assertion:
    >
      Formal conformity statement for Certification Lifecycle Orchestration supported by indexed
      evidence.
  certification_lifecycle_orchestration_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  certification_lifecycle_orchestration_market_access_record:
    Record demonstrating market authorization readiness for Certification Lifecycle Orchestration.
taxonomy:
