workflows:
  - workflow_id: WF-CE-CERTIFICATION_LIFECY
    workflow_name: certification_lifecycle_orchestration_conformity_workflow
    workflow_owner: certification_lifecycle_orchestration_workflow_owner
    trigger: certification_lifecycle_orchestration_conformity_event
    inputs:
      - certification_lifecycle_orchestration_conformity_context
      - certification_lifecycle_orchestration_evidence_index
    activities:
      - certification_lifecycle_orchestration_intake
      - certification_lifecycle_orchestration_validation
      - certification_lifecycle_orchestration_evidence_review
      - certification_lifecycle_orchestration_approval
      - certification_lifecycle_orchestration_attestation
      - certification_lifecycle_orchestration_closure
    decision_points:
      - certification_lifecycle_orchestration_conformity_decision
      - certification_lifecycle_orchestration_escalation_decision
    approvals:
      - certification_lifecycle_orchestration_conformity_officer_approval
    outputs:
      - certification_lifecycle_orchestration_conformity_record
    evidence_generated:
      - certification_lifecycle_orchestration_workflow_log
      - certification_lifecycle_orchestration_attestation
    success_criteria:
      - certification_lifecycle_orchestration_conformity_validated
      - certification_lifecycle_orchestration_evidence_complete
    failure_conditions:
      - certification_lifecycle_orchestration_critical_gap_unresolved
      - certification_lifecycle_orchestration_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: certification_lifecycle_orchestration_ce_marking_preparation_workflow
    linked: true
    trigger: certification_lifecycle_orchestration_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: certification_lifecycle_orchestration_conformity_assessment_workflow
    linked: true
    trigger: certification_lifecycle_orchestration_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: certification_lifecycle_orchestration_notified_body_engagement_workflow
