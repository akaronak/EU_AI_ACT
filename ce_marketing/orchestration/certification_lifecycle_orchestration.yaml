    linked: true
    trigger: certification_lifecycle_orchestration_recertification_initiated
decision_logic:
  certification_lifecycle_orchestration_conformity_gate:
    condition: certification_lifecycle_orchestration_readiness_score >= 0.95 AND certification_lifecycle_orchestration_evidence_complete == true
    action: authorize_certification_lifecycle_orchestration_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Certification Lifecycle Orchestration EU AI Act conformity dimensions
  assessment_methodology: certification_lifecycle_orchestration_iso_19011_conformity_method
  assessment_criteria: certification_lifecycle_orchestration_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - certification_lifecycle_orchestration_technical_file
    - certification_lifecycle_orchestration_risk_assessment
    - certification_lifecycle_orchestration_validation_records
  acceptance_thresholds: certification_lifecycle_orchestration_readiness_score >= 0.95
  rejection_thresholds: certification_lifecycle_orchestration_critical_gap == true
metrics:
  - metric_name: certification_lifecycle_orchestration_conformity_score
    metric_category: conformity
    formula: computed_certification_lifecycle_orchestration_conformity_score_from_certification_lifecycle_orchestration_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: certification_lifecycle_orchestration_metrics_owner
    data_source: certification_lifecycle_orchestration_conformity_warehouse
    evidence_generated: certification_lifecycle_orchestration_conformity_score_measurement_record
