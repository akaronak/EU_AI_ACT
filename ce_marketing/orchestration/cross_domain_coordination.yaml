workflows:
  - workflow_id: WF-CE-CROSS_DOMAIN_COORDIN
    workflow_name: cross_domain_coordination_conformity_workflow
    workflow_owner: cross_domain_coordination_workflow_owner
    trigger: cross_domain_coordination_conformity_event
    inputs:
      - cross_domain_coordination_conformity_context
      - cross_domain_coordination_evidence_index
    activities:
      - cross_domain_coordination_intake
      - cross_domain_coordination_validation
      - cross_domain_coordination_evidence_review
      - cross_domain_coordination_approval
      - cross_domain_coordination_attestation
      - cross_domain_coordination_closure
    decision_points:
      - cross_domain_coordination_conformity_decision
      - cross_domain_coordination_escalation_decision
    approvals:
      - cross_domain_coordination_conformity_officer_approval
    outputs:
      - cross_domain_coordination_conformity_record
    evidence_generated:
      - cross_domain_coordination_workflow_log
      - cross_domain_coordination_attestation
    success_criteria:
      - cross_domain_coordination_conformity_validated
      - cross_domain_coordination_evidence_complete
    failure_conditions:
      - cross_domain_coordination_critical_gap_unresolved
      - cross_domain_coordination_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: cross_domain_coordination_ce_marking_preparation_workflow
    linked: true
    trigger: cross_domain_coordination_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: cross_domain_coordination_conformity_assessment_workflow
    linked: true
    trigger: cross_domain_coordination_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: cross_domain_coordination_notified_body_engagement_workflow
    linked: true
    trigger: cross_domain_coordination_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: cross_domain_coordination_declaration_of_conformity_workflow
    linked: true
    trigger: cross_domain_coordination_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: cross_domain_coordination_market_authorization_workflow
    linked: true
    trigger: cross_domain_coordination_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: cross_domain_coordination_post_certification_monitoring_workflow
    linked: true
    trigger: cross_domain_coordination_post_certification_monitoring_initiated
  - workflow_id: WF-CE-RECERTIFICAT
