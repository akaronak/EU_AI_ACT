purpose:
  >
    Executable CE Marking skill for Deployment Validation within ce_marketing/ce_validation.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    conformity validation, evidence validation, technical validation, assessment validation.
    Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Deployment
    Validation.
objectives:
  - Operationalize Deployment Validation as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Deployment Validation
  - Maintain market-access-ready evidence for Deployment Validation
  - Integrate Deployment Validation with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Deployment Validation
definitions:
  deployment_validation_conformity_assertion:
    Formal conformity statement for Deployment Validation supported by indexed evidence.
  deployment_validation_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  deployment_validation_market_access_record:
    Record demonstrating market authorization readiness for Deployment Validation.
taxonomy:
  root: deployment_validation_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  deployment_validation_status:
