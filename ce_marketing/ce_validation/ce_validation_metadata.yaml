workflows:
  - workflow_id: WF-CE-CE_VALIDATION_METADA
    workflow_name: ce_validation_metadata_conformity_workflow
    workflow_owner: ce_validation_metadata_workflow_owner
    trigger: ce_validation_metadata_conformity_event
    inputs:
      - ce_validation_metadata_conformity_context
      - ce_validation_metadata_evidence_index
    activities:
      - ce_validation_metadata_intake
      - ce_validation_metadata_validation
      - ce_validation_metadata_evidence_review
      - ce_validation_metadata_approval
      - ce_validation_metadata_attestation
      - ce_validation_metadata_closure
    decision_points:
