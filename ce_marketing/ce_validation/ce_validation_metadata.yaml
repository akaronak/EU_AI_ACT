      - ce_validation_metadata_escalation_decision
    approvals:
      - ce_validation_metadata_conformity_officer_approval
    outputs:
      - ce_validation_metadata_conformity_record
    evidence_generated:
      - ce_validation_metadata_workflow_log
      - ce_validation_metadata_attestation
    success_criteria:
      - ce_validation_metadata_conformity_validated
      - ce_validation_metadata_evidence_complete
    failure_conditions:
      - ce_validation_metadata_critical_gap_unresolved
      - ce_validation_metadata_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: ce_validation_metadata_ce_marking_preparation_workflow
    linked: true
    trigger: ce_validation_metadata_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: ce_validation_metadata_conformity_assessment_workflow
    linked: true
    trigger: ce_validation_metadata_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
