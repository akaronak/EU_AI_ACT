purpose:
  >
    Executable CE Marking skill for Ce Validation Metadata within ce_marketing/ce_validation.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    conformity validation, evidence validation, technical validation, assessment validation.
    Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Ce Validation
    Metadata.
objectives:
  - Operationalize Ce Validation Metadata as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Ce Validation Metadata
  - Maintain market-access-ready evidence for Ce Validation Metadata
  - Integrate Ce Validation Metadata with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Ce Validation Metadata
definitions:
  ce_validation_metadata_conformity_assertion:
    Formal conformity statement for Ce Validation Metadata supported by indexed evidence.
  ce_validation_metadata_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  ce_validation_metadata_market_access_record:
    Record demonstrating market authorization readiness for Ce Validation Metadata.
taxonomy:
  root: ce_validation_metadata_taxonomy
