purpose:
  >
    Executable CE Marking skill for Iso42001 Ce Crosswalk within ce_marketing/crosswalks. Delivers
    conformity-assessment-ready, notified-body-ready, market-access-ready operations for regulatory
    mapping, standard mapping, obligation mapping, conformity mapping. Functions as governance,
    conformity, certification, compliance, evidence, assessment, regulatory, market-access,
    monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Iso42001 Ce
    Crosswalk.
objectives:
  - Operationalize Iso42001 Ce Crosswalk as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Iso42001 Ce Crosswalk
  - Maintain market-access-ready evidence for Iso42001 Ce Crosswalk
  - Integrate Iso42001 Ce Crosswalk with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Iso42001 Ce Crosswalk
definitions:
  iso42001_ce_crosswalk_conformity_assertion:
    Formal conformity statement for Iso42001 Ce Crosswalk supported by indexed evidence.
  iso42001_ce_crosswalk_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  iso42001_ce_crosswalk_market_access_record:
    Record demonstrating market authorization readiness for Iso42001 Ce Crosswalk.
