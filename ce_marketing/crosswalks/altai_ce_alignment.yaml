purpose:
  >
    Executable CE Marking skill for Altai Ce Alignment within ce_marketing/crosswalks. Delivers
    conformity-assessment-ready, notified-body-ready, market-access-ready operations for regulatory
    mapping, standard mapping, obligation mapping, conformity mapping. Functions as governance,
    conformity, certification, compliance, evidence, assessment, regulatory, market-access,
    monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Altai Ce Alignment.
objectives:
  - Operationalize Altai Ce Alignment as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Altai Ce Alignment
  - Maintain market-access-ready evidence for Altai Ce Alignment
  - Integrate Altai Ce Alignment with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Altai Ce Alignment
definitions:
  altai_ce_alignment_conformity_assertion:
    Formal conformity statement for Altai Ce Alignment supported by indexed evidence.
  altai_ce_alignment_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  altai_ce_alignment_market_access_record:
    Record demonstrating market authorization readiness for Altai Ce Alignment.
