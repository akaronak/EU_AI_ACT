workflows:
  - workflow_id: WF-CE-ALTAI_CE_ALIGNMENT
    workflow_name: altai_ce_alignment_conformity_workflow
    workflow_owner: altai_ce_alignment_workflow_owner
    trigger: altai_ce_alignment_conformity_event
    inputs:
      - altai_ce_alignment_conformity_context
      - altai_ce_alignment_evidence_index
    activities:
      - altai_ce_alignment_intake
      - altai_ce_alignment_validation
      - altai_ce_alignment_evidence_review
      - altai_ce_alignment_approval
      - altai_ce_alignment_attestation
      - altai_ce_alignment_closure
    decision_points:
      - altai_ce_alignment_conformity_decision
      - altai_ce_alignment_escalation_decision
    approvals:
      - altai_ce_alignment_conformity_officer_approval
    outputs:
      - altai_ce_alignment_conformity_record
    evidence_generated:
      - altai_ce_alignment_workflow_log
      - altai_ce_alignment_attestation
    success_criteria:
      - altai_ce_alignment_conformity_validated
      - altai_ce_alignment_evidence_complete
    failure_conditions:
      - altai_ce_alignment_critical_gap_unresolved
      - altai_ce_alignment_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: altai_ce_alignment_ce_marking_preparation_workflow
    linked: true
    trigger: altai_ce_alignment_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: altai_ce_alignment_conformity_assessment_workflow
    linked: true
    trigger: altai_ce_alignment_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: altai_ce_alignment_notified_body_engagement_workflow
    linked: true
    trigger: altai_ce_alignment_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: altai_ce_alignment_declaration_of_conformity_workflow
    linked: true
    trigger: altai_ce_alignment_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: altai_ce_alignment_market_authorization_workflow
    linked: true
    trigger: altai_ce_alignment_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: altai_ce_alignment_post_certification_monitoring_workflow
