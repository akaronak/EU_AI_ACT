decision_logic:
  post_market_surveillance_conformity_gate:
    condition: post_market_surveillance_readiness_score >= 0.95 AND post_market_surveillance_evidence_complete == true
    action: authorize_post_market_surveillance_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Post Market Surveillance EU AI Act conformity dimensions
  assessment_methodology: post_market_surveillance_iso_19011_conformity_method
  assessment_criteria: post_market_surveillance_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - post_market_surveillance_technical_file
    - post_market_surveillance_risk_assessment
    - post_market_surveillance_validation_records
  acceptance_thresholds: post_market_surveillance_readiness_score >= 0.95
  rejection_thresholds: post_market_surveillance_critical_gap == true
metrics:
  - metric_name: conformity_readiness_score
    metric_category: conformity
    formula: computed_conformity_readiness_score_from_post_market_surveillance_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: post_market_surveillance_metrics_owner
    data_source: post_market_surveillance_conformity_warehouse
    evidence_generated: conformity_readiness_score_measurement_record
  - metric_name: technical_documentation_completeness
    metric_category: conformity
    formula: computed_technical_documentation_completeness_from_post_market_surveillance_telemetry
    target: defined_by_conformity_board
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: post_market_surveillance_metrics_owner
    data_source: post_market_surveillance_conformity_warehouse
