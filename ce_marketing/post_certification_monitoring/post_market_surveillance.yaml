workflows:
  - workflow_id: WF-CE-POST_MARKET_SURVEILL
    workflow_name: post_market_surveillance_conformity_workflow
    workflow_owner: post_market_surveillance_workflow_owner
    trigger: post_market_surveillance_conformity_event
    inputs:
      - post_market_surveillance_conformity_context
      - post_market_surveillance_evidence_index
    activities:
      - post_market_surveillance_intake
      - post_market_surveillance_validation
      - post_market_surveillance_evidence_review
      - post_market_surveillance_approval
      - post_market_surveillance_attestation
      - post_market_surveillance_closure
    decision_points:
      - post_market_surveillance_conformity_decision
      - post_market_surveillance_escalation_decision
    approvals:
      - post_market_surveillance_conformity_officer_approval
    outputs:
      - post_market_surveillance_conformity_record
    evidence_generated:
      - post_market_surveillance_workflow_log
      - post_market_surveillance_attestation
    success_criteria:
      - post_market_surveillance_conformity_validated
      - post_market_surveillance_evidence_complete
    failure_conditions:
      - post_market_surveillance_critical_gap_unresolved
      - post_market_surveillance_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: post_market_surveillance_ce_marking_preparation_workflow
    linked: true
    trigger: post_market_surveillance_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: post_market_surveillance_conformity_assessment_workflow
    linked: true
    trigger: post_market_surveillance_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: post_market_surveillance_notified_body_engagement_workflow
    linked: true
    trigger: post_market_surveillance_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: post_market_surveillance_declaration_of_conformity_workflow
    linked: true
    trigger: post_market_surveillance_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
