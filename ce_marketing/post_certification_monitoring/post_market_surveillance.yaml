purpose:
  >
    Executable CE Marking skill for Post Market Surveillance within
    ce_marketing/post_certification_monitoring. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for post-market monitoring, certification maintenance,
    surveillance readiness, recertification. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Post Market
    Surveillance.
objectives:
  - Operationalize Post Market Surveillance as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Post Market Surveillance
  - Maintain market-access-ready evidence for Post Market Surveillance
  - Integrate Post Market Surveillance with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Post Market Surveillance
definitions:
  post_market_surveillance_conformity_assertion:
    Formal conformity statement for Post Market Surveillance supported by indexed evidence.
  post_market_surveillance_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  post_market_surveillance_market_access_record:
    Record demonstrating market authorization readiness for Post Market Surveillance.
taxonomy:
  root: post_market_surveillance_taxonomy
  conformity_phase:
