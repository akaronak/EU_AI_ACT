workflows:
  - workflow_id: WF-CE-CERTIFICATION_DRIFT_
    workflow_name: certification_drift_detection_conformity_workflow
    workflow_owner: certification_drift_detection_workflow_owner
    trigger: certification_drift_detection_conformity_event
    inputs:
      - certification_drift_detection_conformity_context
      - certification_drift_detection_evidence_index
    activities:
      - certification_drift_detection_intake
      - certification_drift_detection_validation
      - certification_drift_detection_evidence_review
      - certification_drift_detection_approval
      - certification_drift_detection_attestation
      - certification_drift_detection_closure
    decision_points:
      - certification_drift_detection_conformity_decision
      - certification_drift_detection_escalation_decision
    approvals:
      - certification_drift_detection_conformity_officer_approval
    outputs:
      - certification_drift_detection_conformity_record
    evidence_generated:
      - certification_drift_detection_workflow_log
      - certification_drift_detection_attestation
    success_criteria:
      - certification_drift_detection_conformity_validated
      - certification_drift_detection_evidence_complete
    failure_conditions:
      - certification_drift_detection_critical_gap_unresolved
      - certification_drift_detection_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: certification_drift_detection_ce_marking_preparation_workflow
    linked: true
    trigger: certification_drift_detection_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: certification_drift_detection_conformity_assessment_workflow
    linked: true
    trigger: certification_drift_detection_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: certification_drift_detection_notified_body_engagement_workflow
    linked: true
    trigger: certification_drift_detection_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: certification_drift_detection_declaration_of_conformity_workflow
    linked: true
    trigger: certification_drift_detection_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: certification_drift_detection_market_authorization_workflow
    linked: true
    trigger: certification_drift_detection_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: certification_drift_detection_post_certification_monitoring_workflow
    linked: true
    trigger: certification_drift_detection_post_certification_monitoring_initiated
  - workflow_id: WF-CE-RECERTIFICAT
