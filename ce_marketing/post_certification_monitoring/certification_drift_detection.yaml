purpose:
  >
    Executable CE Marking skill for Certification Drift Detection within
    ce_marketing/post_certification_monitoring. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for post-market monitoring, certification maintenance,
    surveillance readiness, recertification. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Certification Drift
    Detection.
objectives:
  - Operationalize Certification Drift Detection as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Certification Drift Detection
  - Maintain market-access-ready evidence for Certification Drift Detection
  - Integrate Certification Drift Detection with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Certification Drift Detection
definitions:
  certification_drift_detection_conformity_assertion:
    Formal conformity statement for Certification Drift Detection supported by indexed evidence.
  certification_drift_detection_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  certification_drift_detection_market_access_record:
    Record demonstrating market authorization readiness for Certification Drift Detection.
