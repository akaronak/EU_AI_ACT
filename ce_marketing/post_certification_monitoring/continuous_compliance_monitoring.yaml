purpose:
  >
    Executable CE Marking skill for Continuous Compliance Monitoring within
    ce_marketing/post_certification_monitoring. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for post-market monitoring, certification maintenance,
    surveillance readiness, recertification. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Continuous
    Compliance Monitoring.
objectives:
  - Operationalize Continuous Compliance Monitoring as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Continuous Compliance Monitoring
  - Maintain market-access-ready evidence for Continuous Compliance Monitoring
  - Integrate Continuous Compliance Monitoring with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Continuous Compliance Monitoring
definitions:
  continuous_compliance_monitoring_conformity_assertion:
    Formal conformity statement for Continuous Compliance Monitoring supported by indexed evidence.
  continuous_compliance_monitoring_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  continuous_compliance_monitoring_market_access_record:
    Record demonstrating market authorization readiness for Continuous Compliance Monitoring.
taxonomy:
  root: continuous_compliance_monitoring_taxonomy
  conformity_phase:
