purpose:
  >
    Executable CE Marking skill for Incident Triggered Reassessment within
    ce_marketing/post_certification_monitoring. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for post-market monitoring, certification maintenance,
    surveillance readiness, recertification. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Incident Triggered
    Reassessment.
objectives:
  - Operationalize Incident Triggered Reassessment as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Incident Triggered Reassessment
  - Maintain market-access-ready evidence for Incident Triggered Reassessment
  - Integrate Incident Triggered Reassessment with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Incident Triggered Reassessment
definitions:
  incident_triggered_reassessment_conformity_assertion:
    Formal conformity statement for Incident Triggered Reassessment supported by indexed evidence.
  incident_triggered_reassessment_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  incident_triggered_reassessment_market_access_record:
    Record demonstrating market authorization readiness for Incident Triggered Reassessment.
taxonomy:
  root: incident_triggered_reassessment_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  incident_triggered_reassessment_status:
