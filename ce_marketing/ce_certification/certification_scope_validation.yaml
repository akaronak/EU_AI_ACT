workflows:
  - workflow_id: WF-CE-CERTIFICATION_SCOPE_
    workflow_name: certification_scope_validation_conformity_workflow
    workflow_owner: certification_scope_validation_workflow_owner
    trigger: certification_scope_validation_conformity_event
    inputs:
      - certification_scope_validation_conformity_context
      - certification_scope_validation_evidence_index
    activities:
      - certification_scope_validation_intake
      - certification_scope_validation_validation
      - certification_scope_validation_evidence_review
      - certification_scope_validation_approval
      - certification_scope_validation_attestation
      - certification_scope_validation_closure
    decision_points:
      - certification_scope_validation_conformity_decision
      - certification_scope_validation_escalation_decision
    approvals:
      - certification_scope_validation_conformity_officer_approval
    outputs:
      - certification_scope_validation_conformity_record
    evidence_generated:
      - certification_scope_validation_workflow_log
      - certification_scope_validation_attestation
    success_criteria:
      - certification_scope_validation_conformity_validated
      - certification_scope_validation_evidence_complete
    failure_conditions:
      - certification_scope_validation_critical_gap_unresolved
      - certification_scope_validation_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: certification_scope_validation_ce_marking_preparation_workflow
    linked: true
    trigger: certification_scope_validation_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: certification_scope_validation_conformity_assessment_workflow
    linked: true
    trigger: certification_scope_validation_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: certification_scope_validation_notified_body_engagement_workflow
    linked: true
    trigger: certification_scope_validation_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: certification_scope_validation_declaration_of_conformity_workflow
