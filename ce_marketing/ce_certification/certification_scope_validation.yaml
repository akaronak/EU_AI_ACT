purpose:
  >
    Executable CE Marking skill for Certification Scope Validation within
    ce_marketing/ce_certification. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for certification readiness, lifecycle, validation, governance,
    assurance. Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Certification Scope
    Validation.
objectives:
  - Operationalize Certification Scope Validation as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Certification Scope Validation
  - Maintain market-access-ready evidence for Certification Scope Validation
  - Integrate Certification Scope Validation with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Certification Scope Validation
definitions:
  certification_scope_validation_conformity_assertion:
    Formal conformity statement for Certification Scope Validation supported by indexed evidence.
  certification_scope_validation_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  certification_scope_validation_market_access_record:
    Record demonstrating market authorization readiness for Certification Scope Validation.
taxonomy:
  root: certification_scope_validation_taxonomy
  conformity_phase:
