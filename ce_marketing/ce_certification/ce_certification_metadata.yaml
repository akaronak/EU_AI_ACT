workflows:
  - workflow_id: WF-CE-CE_CERTIFICATION_MET
    workflow_name: ce_certification_metadata_conformity_workflow
    workflow_owner: ce_certification_metadata_workflow_owner
    trigger: ce_certification_metadata_conformity_event
    inputs:
      - ce_certification_metadata_conformity_context
      - ce_certification_metadata_evidence_index
    activities:
      - ce_certification_metadata_intake
      - ce_certification_metadata_validation
      - ce_certification_metadata_evidence_review
      - ce_certification_metadata_approval
      - ce_certification_metadata_attestation
      - ce_certification_metadata_closure
    decision_points:
      - ce_certification_metadata_conformity_decision
      - ce_certification_metadata_escalation_decision
    approvals:
      - ce_certification_metadata_conformity_officer_approval
    outputs:
      - ce_certification_metadata_conformity_record
    evidence_generated:
      - ce_certification_metadata_workflow_log
      - ce_certification_metadata_attestation
    success_criteria:
      - ce_certification_metadata_conformity_validated
      - ce_certification_metadata_evidence_complete
    failure_conditions:
      - ce_certification_metadata_critical_gap_unresolved
      - ce_certification_metadata_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: ce_certification_metadata_ce_marking_preparation_workflow
    linked: true
    trigger: ce_certification_metadata_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: ce_certification_metadata_conformity_assessment_workflow
    linked: true
    trigger: ce_certification_metadata_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: ce_certification_metadata_notified_body_engagement_workflow
    linked: true
    trigger: ce_certification_metadata_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: ce_certification_metadata_declaration_of_conformity_workflow
    linked: true
    trigger: ce_certification_metadata_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: ce_certification_metadata_market_authorization_workflow
    linked: true
    trigger: ce_certification_metadata_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
