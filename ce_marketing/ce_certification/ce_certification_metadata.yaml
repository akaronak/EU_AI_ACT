purpose:
  >
    Executable CE Marking skill for Ce Certification Metadata within ce_marketing/ce_certification.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    certification readiness, lifecycle, validation, governance, assurance. Functions as governance,
    conformity, certification, compliance, evidence, assessment, regulatory, market-access,
    monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Ce Certification
    Metadata.
objectives:
  - Operationalize Ce Certification Metadata as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Ce Certification Metadata
  - Maintain market-access-ready evidence for Ce Certification Metadata
  - Integrate Ce Certification Metadata with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Ce Certification Metadata
definitions:
  ce_certification_metadata_conformity_assertion:
    Formal conformity statement for Ce Certification Metadata supported by indexed evidence.
  ce_certification_metadata_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  ce_certification_metadata_market_access_record:
    Record demonstrating market authorization readiness for Ce Certification Metadata.
