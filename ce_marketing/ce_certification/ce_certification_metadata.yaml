  - workflow_id: WF-CE-RECERTIFICAT
    workflow_name: ce_certification_metadata_recertification_workflow
    linked: true
    trigger: ce_certification_metadata_recertification_initiated
decision_logic:
  ce_certification_metadata_conformity_gate:
    condition: ce_certification_metadata_readiness_score >= 0.95 AND ce_certification_metadata_evidence_complete == true
    action: authorize_ce_certification_metadata_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Ce Certification Metadata EU AI Act conformity dimensions
  assessment_methodology: ce_certification_metadata_iso_19011_conformity_method
  assessment_criteria: ce_certification_metadata_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - ce_certification_metadata_technical_file
    - ce_certification_metadata_risk_assessment
    - ce_certification_metadata_validation_records
  acceptance_thresholds: ce_certification_metadata_readiness_score >= 0.95
  rejection_thresholds: ce_certification_metadata_critical_gap == true
metrics:
  - metric_name: conformity_readiness_score
    metric_category: conformity
    formula: computed_conformity_readiness_score_from_ce_certification_metadata_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: ce_certification_metadata_metrics_owner
    data_source: ce_certification_metadata_conformity_warehouse
    evidence_generated: conformity_readiness_score_measurement_record
  - metric_name: technical_documentation_completeness
    metric_category: conformity
    formula: computed_technical_documentation_completeness_from_ce_certification_metadata_telemetry
    target: defined_by_conformity_board
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
