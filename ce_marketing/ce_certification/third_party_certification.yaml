purpose:
  >
    Executable CE Marking skill for Third Party Certification within ce_marketing/ce_certification.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    certification readiness, lifecycle, validation, governance, assurance. Functions as governance,
    conformity, certification, compliance, evidence, assessment, regulatory, market-access,
    monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Third Party
    Certification.
objectives:
  - Operationalize Third Party Certification as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Third Party Certification
  - Maintain market-access-ready evidence for Third Party Certification
  - Integrate Third Party Certification with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Third Party Certification
definitions:
  third_party_certification_conformity_assertion:
    Formal conformity statement for Third Party Certification supported by indexed evidence.
  third_party_certification_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  third_party_certification_market_access_record:
    Record demonstrating market authorization readiness for Third Party Certification.
taxonomy:
  root: third_party_certification_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  third_party_certification_status:
    - draft
    - validated
    - approved
    - published
    - suspended
governance:
