    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: third_party_certification_metrics_owner
    data_source: third_party_certification_conformity_warehouse
    evidence_generated: ce_marking_readiness_score_measurement_record
  - metric_name: notified_body_acceptance_rate
    metric_category: conformity
    formula: computed_notified_body_acceptance_rate_from_third_party_certification_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: third_party_certification_metrics_owner
    data_source: third_party_certification_conformity_warehouse
    evidence_generated: notified_body_acceptance_rate_measurement_record
  - metric_name: certification_gap_count
    metric_category: conformity
