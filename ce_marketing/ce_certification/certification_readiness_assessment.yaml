    control_name: conformity_readiness_score_computation
    control_category: detective
    control_objective: Compute conformity readiness score across all assessment dimensions
    regulatory_rationale: conformity_readiness_score_computation implements EU AI Act conformity obligations for Certification Readiness Assessment under ce_certification.
    implementation_guidance: Deploy conformity_readiness_score_computation in certification_readiness_assessment workflow; integrate with conformity register; block non-compliant transitions.
    monitoring_method: conformity_readiness_score_computation_telemetry_stream
    validation_method: conformity_readiness_score_computation_conformity_test
    testing_method: conformity_readiness_score_computation_sampling_audit
    control_owner: certification_readiness_assessment_conformity_owner
    evidence_generated: conformity_readiness_score_computation_execution_record
    audit_considerations: Notified body may sample conformity_readiness_score_computation during conformity assessment.
