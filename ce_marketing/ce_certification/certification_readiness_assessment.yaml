purpose:
  >
    Executable CE Marking skill for Certification Readiness Assessment within
    ce_marketing/ce_certification. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for certification readiness, lifecycle, validation, governance,
    assurance. Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Certification
    Readiness Assessment.
objectives:
  - Operationalize Certification Readiness Assessment as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Certification Readiness Assessment
  - Maintain market-access-ready evidence for Certification Readiness Assessment
  - Integrate Certification Readiness Assessment with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Certification Readiness Assessment
definitions:
  certification_readiness_assessment_conformity_assertion:
    >
      Formal conformity statement for Certification Readiness Assessment supported by indexed
      evidence.
  certification_readiness_assessment_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  certification_readiness_assessment_market_access_record:
    Record demonstrating market authorization readiness for Certification Readiness Assessment.
taxonomy:
  root: certification_readiness_assessment_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  certification_readiness_assessment_status:
    - draft
    - validated
    - approved
    - published
    - suspended
governance:
  policy_owner: Certification Readiness Assessment Conformity Lead
  oversight_body: CE Marking Governance Committee
  domain: ce_certification
roles_and_responsibilities:
