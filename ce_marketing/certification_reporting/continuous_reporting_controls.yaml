purpose:
  >
    Executable CE Marking skill for Continuous Reporting Controls within
    ce_marketing/certification_reporting. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for certification reporting, board reporting, regulator
    reporting, notified body reporting. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Continuous Reporting
    Controls.
objectives:
  - Operationalize Continuous Reporting Controls as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Continuous Reporting Controls
  - Maintain market-access-ready evidence for Continuous Reporting Controls
  - Integrate Continuous Reporting Controls with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Continuous Reporting Controls
definitions:
  continuous_reporting_controls_conformity_assertion:
    Formal conformity statement for Continuous Reporting Controls supported by indexed evidence.
  continuous_reporting_controls_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  continuous_reporting_controls_market_access_record:
    Record demonstrating market authorization readiness for Continuous Reporting Controls.
taxonomy:
  root: continuous_reporting_controls_taxonomy
  conformity_phase:
