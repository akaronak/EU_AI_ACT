    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: audit_reporting_metrics_owner
    data_source: audit_reporting_conformity_warehouse
    evidence_generated: evidence_validation_success_rate_measurement_record
  - metric_name: ce_marking_readiness_score
    metric_category: conformity
    formula: computed_ce_marking_readiness_score_from_audit_reporting_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: audit_reporting_metrics_owner
    data_source: audit_reporting_conformity_warehouse
    evidence_generated: ce_marking_readiness_score_measurement_record
  - metric_name: notified_body_acceptance_rate
    metric_category: conformity
    formula: computed_notified_body_acceptance_rate_from_audit_reporting_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: audit_reporting_metrics_owner
    data_source: audit_reporting_conformity_warehouse
    evidence_generated: notified_body_acceptance_rate_measurement_record
  - metric_name: certification_gap_count
    metric_category: conformity
    formula: computed_certification_gap_count_from_audit_reporting_telemetry
