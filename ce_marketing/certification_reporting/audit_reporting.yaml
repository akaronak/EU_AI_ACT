purpose:
  >
    Executable CE Marking skill for Audit Reporting within ce_marketing/certification_reporting.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    certification reporting, board reporting, regulator reporting, notified body reporting.
    Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Audit Reporting.
objectives:
  - Operationalize Audit Reporting as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Audit Reporting
  - Maintain market-access-ready evidence for Audit Reporting
  - Integrate Audit Reporting with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Audit Reporting
definitions:
  audit_reporting_conformity_assertion:
    Formal conformity statement for Audit Reporting supported by indexed evidence.
  audit_reporting_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  audit_reporting_market_access_record:
    Record demonstrating market authorization readiness for Audit Reporting.
taxonomy:
  root: audit_reporting_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  audit_reporting_status:
