    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: authorized_deployment_controls_metrics_owner
    data_source: authorized_deployment_controls_conformity_warehouse
    evidence_generated: authorized_deployment_controls_conformity_score_measurement_record
