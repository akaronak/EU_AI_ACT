purpose:
  >
    Executable CE Marking skill for Authorized Deployment Controls within
    ce_marketing/market_authorization. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for market entry, authorization readiness, regulatory acceptance,
    conformity approval. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Authorized
    Deployment Controls.
objectives:
  - Operationalize Authorized Deployment Controls as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Authorized Deployment Controls
  - Maintain market-access-ready evidence for Authorized Deployment Controls
  - Integrate Authorized Deployment Controls with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Authorized Deployment Controls
definitions:
  authorized_deployment_controls_conformity_assertion:
    Formal conformity statement for Authorized Deployment Controls supported by indexed evidence.
  authorized_deployment_controls_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  authorized_deployment_controls_market_access_record:
    Record demonstrating market authorization readiness for Authorized Deployment Controls.
taxonomy:
