      - authorized_deployment_controls_evidence_complete
    failure_conditions:
      - authorized_deployment_controls_critical_gap_unresolved
      - authorized_deployment_controls_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: authorized_deployment_controls_ce_marking_preparation_workflow
    linked: true
    trigger: authorized_deployment_controls_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
