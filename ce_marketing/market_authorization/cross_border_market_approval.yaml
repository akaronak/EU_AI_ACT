purpose:
  >
    Executable CE Marking skill for Cross Border Market Approval within
    ce_marketing/market_authorization. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for market entry, authorization readiness, regulatory acceptance,
    conformity approval. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Cross Border Market
    Approval.
objectives:
  - Operationalize Cross Border Market Approval as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Cross Border Market Approval
  - Maintain market-access-ready evidence for Cross Border Market Approval
  - Integrate Cross Border Market Approval with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Cross Border Market Approval
definitions:
  cross_border_market_approval_conformity_assertion:
    Formal conformity statement for Cross Border Market Approval supported by indexed evidence.
  cross_border_market_approval_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  cross_border_market_approval_market_access_record:
    Record demonstrating market authorization readiness for Cross Border Market Approval.
taxonomy:
  root: cross_border_market_approval_taxonomy
  conformity_phase:
