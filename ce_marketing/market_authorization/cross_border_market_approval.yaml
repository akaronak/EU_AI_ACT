    workflow_name: cross_border_market_approval_conformity_workflow
    workflow_owner: cross_border_market_approval_workflow_owner
    trigger: cross_border_market_approval_conformity_event
    inputs:
      - cross_border_market_approval_conformity_context
      - cross_border_market_approval_evidence_index
    activities:
      - cross_border_market_approval_intake
      - cross_border_market_approval_validation
      - cross_border_market_approval_evidence_review
      - cross_border_market_approval_approval
      - cross_border_market_approval_attestation
      - cross_border_market_approval_closure
    decision_points:
      - cross_border_market_approval_conformity_decision
      - cross_border_market_approval_escalation_decision
    approvals:
      - cross_border_market_approval_conformity_officer_approval
    outputs:
      - cross_border_market_approval_conformity_record
    evidence_generated:
      - cross_border_market_approval_workflow_log
      - cross_border_market_approval_attestation
    success_criteria:
      - cross_border_market_approval_conformity_validated
      - cross_border_market_approval_evidence_complete
    failure_conditions:
      - cross_border_market_approval_critical_gap_unresolved
      - cross_border_market_approval_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: cross_border_market_approval_ce_marking_preparation_workflow
    linked: true
    trigger: cross_border_market_approval_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: cross_border_market_approval_conformity_assessment_workflow
