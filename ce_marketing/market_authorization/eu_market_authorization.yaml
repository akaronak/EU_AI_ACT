workflows:
  - workflow_id: WF-CE-EU_MARKET_AUTHORIZAT
    workflow_name: market_authorization_workflow
    workflow_owner: eu_market_authorization_workflow_owner
    trigger: conformity_and_declaration_complete
    inputs:
      - eu_market_authorization_conformity_context
      - eu_market_authorization_evidence_index
    activities:
      - authorization_readiness_check
      - database_registration
      - member_state_notification
      - ce_marking_authorization
      - market_placement
      - surveillance_handoff
    decision_points:
      - eu_market_authorization_conformity_decision
      - eu_market_authorization_escalation_decision
    approvals:
      - eu_market_authorization_conformity_officer_approval
    outputs:
      - eu_market_authorization_conformity_record
    evidence_generated:
      - eu_market_authorization_workflow_log
      - eu_market_authorization_attestation
    success_criteria:
      - eu_market_authorization_conformity_validated
      - eu_market_authorization_evidence_complete
    failure_conditions:
      - eu_market_authorization_critical_gap_unresolved
      - eu_market_authorization_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: eu_market_authorization_ce_marking_preparation_workflow
    linked: true
    trigger: eu_market_authorization_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: eu_market_authorization_conformity_assessment_workflow
    linked: true
    trigger: eu_market_authorization_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: eu_market_authorization_notified_body_engagement_workflow
    linked: true
    trigger: eu_market_authorization_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: eu_market_authorization_declaration_of_conformity_workflow
    linked: true
    trigger: eu_market_authorization_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: eu_market_authorization_market_authorization_workflow
    linked: true
    trigger: eu_market_authorization_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: eu_market_authorization_post_certification_monitoring_workflow
