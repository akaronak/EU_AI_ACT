    linked: true
    trigger: eu_market_authorization_recertification_initiated
decision_logic:
  eu_market_authorization_conformity_gate:
    condition: eu_market_authorization_readiness_score >= 0.95 AND eu_market_authorization_evidence_complete == true
    action: authorize_eu_market_authorization_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Eu Market Authorization EU AI Act conformity dimensions
  assessment_methodology: eu_market_authorization_iso_19011_conformity_method
  assessment_criteria: eu_market_authorization_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - eu_market_authorization_technical_file
    - eu_market_authorization_risk_assessment
    - eu_market_authorization_validation_records
  acceptance_thresholds: eu_market_authorization_readiness_score >= 0.95
  rejection_thresholds: eu_market_authorization_critical_gap == true
metrics:
  - metric_name: market_authorization_readiness_score
    metric_category: conformity
    formula: computed_market_authorization_readiness_score_from_eu_market_authorization_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: eu_market_authorization_metrics_owner
    data_source: eu_market_authorization_conformity_warehouse
    evidence_generated: market_authorization_readiness_score_measurement_record
  - metric_name: eu_database_registration_completeness
    metric_category: conformity
    formula: computed_eu_database_registration_completeness_from_eu_market_authorization_telemetry
