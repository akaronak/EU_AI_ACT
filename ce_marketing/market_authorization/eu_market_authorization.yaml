purpose:
  >
    Executable CE Marking skill for Eu Market Authorization within
    ce_marketing/market_authorization. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for market entry, authorization readiness, regulatory acceptance,
    conformity approval. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Eu Market
    Authorization.
objectives:
  - Operationalize Eu Market Authorization as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Eu Market Authorization
  - Maintain market-access-ready evidence for Eu Market Authorization
  - Integrate Eu Market Authorization with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Eu Market Authorization
definitions:
  eu_market_authorization_conformity_assertion:
    Formal conformity statement for Eu Market Authorization supported by indexed evidence.
  eu_market_authorization_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  eu_market_authorization_market_access_record:
    Record demonstrating market authorization readiness for Eu Market Authorization.
taxonomy:
  root: eu_market_authorization_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  eu_market_authorization_status:
