purpose:
  >
    Executable CE Marking skill for Market Authorization Metadata within
    ce_marketing/market_authorization. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for market entry, authorization readiness, regulatory acceptance,
    conformity approval. Functions as governance, conformity, certification, compliance, evidence,
    assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Market Authorization
    Metadata.
objectives:
  - Operationalize Market Authorization Metadata as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Market Authorization Metadata
  - Maintain market-access-ready evidence for Market Authorization Metadata
  - Integrate Market Authorization Metadata with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Market Authorization Metadata
definitions:
  market_authorization_metadata_conformity_assertion:
    Formal conformity statement for Market Authorization Metadata supported by indexed evidence.
  market_authorization_metadata_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  market_authorization_metadata_market_access_record:
    Record demonstrating market authorization readiness for Market Authorization Metadata.
taxonomy:
