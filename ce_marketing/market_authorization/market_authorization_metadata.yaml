workflows:
  - workflow_id: WF-CE-MARKET_AUTHORIZATION
    workflow_name: market_authorization_metadata_conformity_workflow
    workflow_owner: market_authorization_metadata_workflow_owner
    trigger: market_authorization_metadata_conformity_event
    inputs:
      - market_authorization_metadata_conformity_context
      - market_authorization_metadata_evidence_index
    activities:
      - market_authorization_metadata_intake
      - market_authorization_metadata_validation
      - market_authorization_metadata_evidence_review
      - market_authorization_metadata_approval
      - market_authorization_metadata_attestation
      - market_authorization_metadata_closure
    decision_points:
      - market_authorization_metadata_conformity_decision
      - market_authorization_metadata_escalation_decision
    approvals:
      - market_authorization_metadata_conformity_officer_approval
    outputs:
      - market_authorization_metadata_conformity_record
    evidence_generated:
      - market_authorization_metadata_workflow_log
      - market_authorization_metadata_attestation
    success_criteria:
      - market_authorization_metadata_conformity_validated
      - market_authorization_metadata_evidence_complete
    failure_conditions:
      - market_authorization_metadata_critical_gap_unresolved
      - market_authorization_metadata_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: market_authorization_metadata_ce_marking_preparation_workflow
    linked: true
    trigger: market_authorization_metadata_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: market_authorization_metadata_conformity_assessment_workflow
    linked: true
    trigger: market_authorization_metadata_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: market_authorization_metadata_notified_body_engagement_workflow
    linked: true
    trigger: market_authorization_metadata_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: market_authorization_metadata_declaration_of_conformity_workflow
    linked: true
    trigger: market_authorization_metadata_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: market_authorization_metadata_market_authorization_workflow
    linked: true
    trigger: market_authorization_metadata_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: market_authorization_metadata_post_certification_monitoring_workflow
    linked: true
    trigger: market_authorization_metadata_post_certification_monitoring_initiated
  - workflow_id: WF-CE-RECERTIFICAT
    workflow_name: market_authorization_metadata_recertification_workflow
    linked: true
    trigger: market_authorization_metadata_recertification_initiated
decision_logic:
  market_authorization_metadata_conformity_gate:
    condition: market_authorization_metadata_readiness_score >= 0.95 AND market_authorization_metadata_evidence_complete == true
    action: authorize_market_authorization_metadata_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Market Authorization Metadata EU AI Act conformity dimensions
  assessment_methodology: market_authorization_metadata_iso_19011_conformity_method
  assessment_criteria: market_authorization_metadata_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - market_authorization_metadata_technical_file
    - market_authorization_metadata_risk_assessment
    - market_authorization_metadata_validation_records
  acceptance_thresholds: market_authorization_metadata_readiness_score >= 0.95
  rejection_thresholds: market_authorization_metadata_critical_gap == true
metrics:
  - metric_name: market_authorization_readiness_score
    metric_category: conformity
    formula: computed_market_authorization_readiness_score_from_market_authorization_metadata_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: market_authorization_metadata_metrics_owner
    data_source: market_authorization_metadata_conformity_warehouse
    evidence_generated: market_authorization_readiness_score_measurement_record
  - metric_name: eu_database_registration_completeness
