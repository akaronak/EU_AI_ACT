purpose:
  >
    Executable CE Marking skill for Label Integrity Controls within
    ce_marketing/labeling_requirements. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for labeling controls, disclosure validation, transparency
    labeling, synthetic media labeling. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Label Integrity
    Controls.
objectives:
  - Operationalize Label Integrity Controls as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Label Integrity Controls
  - Maintain market-access-ready evidence for Label Integrity Controls
  - Integrate Label Integrity Controls with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Label Integrity Controls
definitions:
  label_integrity_controls_conformity_assertion:
    Formal conformity statement for Label Integrity Controls supported by indexed evidence.
  label_integrity_controls_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  label_integrity_controls_market_access_record:
    Record demonstrating market authorization readiness for Label Integrity Controls.
taxonomy:
  root: label_integrity_controls_taxonomy
  conformity_phase:
