workflows:
  - workflow_id: WF-CE-LABEL_INTEGRITY_CONT
    workflow_name: label_integrity_controls_conformity_workflow
    workflow_owner: label_integrity_controls_workflow_owner
    trigger: label_integrity_controls_conformity_event
    inputs:
      - label_integrity_controls_conformity_context
      - label_integrity_controls_evidence_index
    activities:
      - label_integrity_controls_intake
      - label_integrity_controls_validation
      - label_integrity_controls_evidence_review
      - label_integrity_controls_approval
      - label_integrity_controls_attestation
      - label_integrity_controls_closure
    decision_points:
      - label_integrity_controls_conformity_decision
      - label_integrity_controls_escalation_decision
    approvals:
      - label_integrity_controls_conformity_officer_approval
    outputs:
      - label_integrity_controls_conformity_record
    evidence_generated:
      - label_integrity_controls_workflow_log
      - label_integrity_controls_attestation
    success_criteria:
      - label_integrity_controls_conformity_validated
      - label_integrity_controls_evidence_complete
    failure_conditions:
      - label_integrity_controls_critical_gap_unresolved
      - label_integrity_controls_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: label_integrity_controls_ce_marking_preparation_workflow
    linked: true
    trigger: label_integrity_controls_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: label_integrity_controls_conformity_assessment_workflow
    linked: true
    trigger: label_integrity_controls_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: label_integrity_controls_notified_body_engagement_workflow
    linked: true
    trigger: label_integrity_controls_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: label_integrity_controls_declaration_of_conformity_workflow
    linked: true
    trigger: label_integrity_controls_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: label_integrity_controls_market_authorization_workflow
    linked: true
    trigger: label_integrity_controls_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
    workflow_name: label_integrity_controls_post_certification_monitoring_workflow
