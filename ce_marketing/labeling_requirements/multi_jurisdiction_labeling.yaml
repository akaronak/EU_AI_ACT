purpose:
  >
    Executable CE Marking skill for Multi Jurisdiction Labeling within
    ce_marketing/labeling_requirements. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for labeling controls, disclosure validation, transparency
    labeling, synthetic media labeling. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Multi Jurisdiction
    Labeling.
objectives:
  - Operationalize Multi Jurisdiction Labeling as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Multi Jurisdiction Labeling
  - Maintain market-access-ready evidence for Multi Jurisdiction Labeling
  - Integrate Multi Jurisdiction Labeling with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Multi Jurisdiction Labeling
definitions:
  multi_jurisdiction_labeling_conformity_assertion:
    Formal conformity statement for Multi Jurisdiction Labeling supported by indexed evidence.
  multi_jurisdiction_labeling_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  multi_jurisdiction_labeling_market_access_record:
    Record demonstrating market authorization readiness for Multi Jurisdiction Labeling.
