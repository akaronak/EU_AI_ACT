purpose:
  >
    Executable CE Marking skill for Consumer Information Requirements within
    ce_marketing/labeling_requirements. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for labeling controls, disclosure validation, transparency
    labeling, synthetic media labeling. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Consumer Information
    Requirements.
objectives:
  - Operationalize Consumer Information Requirements as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Consumer Information Requirements
  - Maintain market-access-ready evidence for Consumer Information Requirements
  - Integrate Consumer Information Requirements with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Consumer Information Requirements
definitions:
  consumer_information_requirements_conformity_assertion:
    Formal conformity statement for Consumer Information Requirements supported by indexed evidence.
  consumer_information_requirements_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  consumer_information_requirements_market_access_record:
    Record demonstrating market authorization readiness for Consumer Information Requirements.
