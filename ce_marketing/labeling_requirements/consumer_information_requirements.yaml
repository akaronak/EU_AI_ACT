workflows:
  - workflow_id: WF-CE-CONSUMER_INFORMATION
    workflow_name: consumer_information_requirements_conformity_workflow
    workflow_owner: consumer_information_requirements_workflow_owner
    trigger: consumer_information_requirements_conformity_event
    inputs:
      - consumer_information_requirements_conformity_context
      - consumer_information_requirements_evidence_index
    activities:
      - consumer_information_requirements_intake
      - consumer_information_requirements_validation
      - consumer_information_requirements_evidence_review
      - consumer_information_requirements_approval
      - consumer_information_requirements_attestation
      - consumer_information_requirements_closure
    decision_points:
      - consumer_information_requirements_conformity_decision
      - consumer_information_requirements_escalation_decision
    approvals:
      - consumer_information_requirements_conformity_officer_approval
    outputs:
      - consumer_information_requirements_conformity_record
    evidence_generated:
      - consumer_information_requirements_workflow_log
      - consumer_information_requirements_attestation
    success_criteria:
      - consumer_information_requirements_conformity_validated
      - consumer_information_requirements_evidence_complete
    failure_conditions:
      - consumer_information_requirements_critical_gap_unresolved
      - consumer_information_requirements_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: consumer_information_requirements_ce_marking_preparation_workflow
    linked: true
    trigger: consumer_information_requirements_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: consumer_information_requirements_conformity_assessment_workflow
    linked: true
    trigger: consumer_information_requirements_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: consumer_information_requirements_notified_body_engagement_workflow
