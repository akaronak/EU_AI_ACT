purpose:
  >
    Executable CE Marking skill for Labeling Taxonomy within ce_marketing/labeling_requirements.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    labeling controls, disclosure validation, transparency labeling, synthetic media labeling.
    Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Labeling Taxonomy.
objectives:
  - Operationalize Labeling Taxonomy as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Labeling Taxonomy
  - Maintain market-access-ready evidence for Labeling Taxonomy
  - Integrate Labeling Taxonomy with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Labeling Taxonomy
definitions:
  labeling_taxonomy_conformity_assertion:
    Formal conformity statement for Labeling Taxonomy supported by indexed evidence.
  labeling_taxonomy_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  labeling_taxonomy_market_access_record:
    Record demonstrating market authorization readiness for Labeling Taxonomy.
taxonomy:
