    trigger: labeling_taxonomy_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
    workflow_name: labeling_taxonomy_market_authorization_workflow
    linked: true
    trigger: labeling_taxonomy_market_authorization_initiated
  - workflow_id: WF-CE-POST_CERTIFI
