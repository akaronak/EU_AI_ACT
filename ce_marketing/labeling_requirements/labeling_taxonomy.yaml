workflows:
  - workflow_id: WF-CE-LABELING_TAXONOMY
    workflow_name: labeling_taxonomy_conformity_workflow
    workflow_owner: labeling_taxonomy_workflow_owner
    trigger: labeling_taxonomy_conformity_event
    inputs:
      - labeling_taxonomy_conformity_context
      - labeling_taxonomy_evidence_index
    activities:
      - labeling_taxonomy_intake
      - labeling_taxonomy_validation
      - labeling_taxonomy_evidence_review
      - labeling_taxonomy_approval
      - labeling_taxonomy_attestation
      - labeling_taxonomy_closure
    decision_points:
      - labeling_taxonomy_conformity_decision
      - labeling_taxonomy_escalation_decision
    approvals:
      - labeling_taxonomy_conformity_officer_approval
    outputs:
      - labeling_taxonomy_conformity_record
    evidence_generated:
      - labeling_taxonomy_workflow_log
      - labeling_taxonomy_attestation
    success_criteria:
      - labeling_taxonomy_conformity_validated
      - labeling_taxonomy_evidence_complete
    failure_conditions:
      - labeling_taxonomy_critical_gap_unresolved
      - labeling_taxonomy_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: labeling_taxonomy_ce_marking_preparation_workflow
    linked: true
    trigger: labeling_taxonomy_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: labeling_taxonomy_conformity_assessment_workflow
    linked: true
    trigger: labeling_taxonomy_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: labeling_taxonomy_notified_body_engagement_workflow
    linked: true
    trigger: labeling_taxonomy_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: labeling_taxonomy_declaration_of_conformity_workflow
