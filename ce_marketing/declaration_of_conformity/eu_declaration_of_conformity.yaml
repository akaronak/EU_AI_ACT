workflows:
  - workflow_id: WF-CE-EU_DECLARATION_OF_CO
    workflow_name: declaration_of_conformity_workflow
    workflow_owner: eu_declaration_of_conformity_workflow_owner
    trigger: conformity_demonstrated
    inputs:
      - eu_declaration_of_conformity_conformity_context
      - eu_declaration_of_conformity_evidence_index
    activities:
      - draft_declaration
      - content_validation
      - signatory_authorization
      - integrity_sealing
      - publication
      - registry_update
      - maintenance_monitoring
    decision_points:
      - eu_declaration_of_conformity_conformity_decision
      - eu_declaration_of_conformity_escalation_decision
    approvals:
      - eu_declaration_of_conformity_conformity_officer_approval
    outputs:
      - eu_declaration_of_conformity_conformity_record
    evidence_generated:
      - eu_declaration_of_conformity_workflow_log
      - eu_declaration_of_conformity_attestation
    success_criteria:
      - eu_declaration_of_conformity_conformity_validated
      - eu_declaration_of_conformity_evidence_complete
    failure_conditions:
      - eu_declaration_of_conformity_critical_gap_unresolved
      - eu_declaration_of_conformity_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: eu_declaration_of_conformity_ce_marking_preparation_workflow
    linked: true
    trigger: eu_declaration_of_conformity_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
