purpose:
  >
    Executable CE Marking skill for Eu Declaration Of Conformity within
    ce_marketing/declaration_of_conformity. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for declaration lifecycle, governance, approval,
    validation, maintenance. Functions as governance, conformity, certification, compliance,
    evidence, assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Eu Declaration Of
    Conformity.
objectives:
  - Operationalize Eu Declaration Of Conformity as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Eu Declaration Of Conformity
  - Maintain market-access-ready evidence for Eu Declaration Of Conformity
  - Integrate Eu Declaration Of Conformity with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Eu Declaration Of Conformity
definitions:
  eu_declaration_of_conformity_conformity_assertion:
    Formal conformity statement for Eu Declaration Of Conformity supported by indexed evidence.
  eu_declaration_of_conformity_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  eu_declaration_of_conformity_market_access_record:
    Record demonstrating market authorization readiness for Eu Declaration Of Conformity.
taxonomy:
  root: eu_declaration_of_conformity_taxonomy
  conformity_phase:
