purpose:
  >
    Executable CE Marking skill for Declaration Integrity Controls within
    ce_marketing/declaration_of_conformity. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for declaration lifecycle, governance, approval,
    validation, maintenance. Functions as governance, conformity, certification, compliance,
    evidence, assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Declaration
    Integrity Controls.
objectives:
  - Operationalize Declaration Integrity Controls as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Declaration Integrity Controls
  - Maintain market-access-ready evidence for Declaration Integrity Controls
  - Integrate Declaration Integrity Controls with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Declaration Integrity Controls
definitions:
  declaration_integrity_controls_conformity_assertion:
    Formal conformity statement for Declaration Integrity Controls supported by indexed evidence.
  declaration_integrity_controls_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  declaration_integrity_controls_market_access_record:
    Record demonstrating market authorization readiness for Declaration Integrity Controls.
