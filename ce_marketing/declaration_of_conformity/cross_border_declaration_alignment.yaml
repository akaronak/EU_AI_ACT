purpose:
  >
    Executable CE Marking skill for Cross Border Declaration Alignment within
    ce_marketing/declaration_of_conformity. Delivers conformity-assessment-ready, notified-body-
    ready, market-access-ready operations for declaration lifecycle, governance, approval,
    validation, maintenance. Functions as governance, conformity, certification, compliance,
    evidence, assessment, regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Cross Border
    Declaration Alignment.
objectives:
  - Operationalize Cross Border Declaration Alignment as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Cross Border Declaration Alignment
  - Maintain market-access-ready evidence for Cross Border Declaration Alignment
  - Integrate Cross Border Declaration Alignment with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Cross Border Declaration Alignment
definitions:
  cross_border_declaration_alignment_conformity_assertion:
    >
      Formal conformity statement for Cross Border Declaration Alignment supported by indexed
      evidence.
  cross_border_declaration_alignment_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  cross_border_declaration_alignment_market_access_record:
    Record demonstrating market authorization readiness for Cross Border Declaration Alignment.
