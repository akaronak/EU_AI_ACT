workflows:
  - workflow_id: WF-CE-EVIDENCE_COLLECTION
    workflow_name: evidence_collection_conformity_workflow
    workflow_owner: evidence_collection_workflow_owner
    trigger: evidence_collection_conformity_event
    inputs:
      - evidence_collection_conformity_context
      - evidence_collection_evidence_index
    activities:
      - evidence_collection_intake
      - evidence_collection_validation
      - evidence_collection_evidence_review
      - evidence_collection_approval
      - evidence_collection_attestation
      - evidence_collection_closure
    decision_points:
      - evidence_collection_conformity_decision
      - evidence_collection_escalation_decision
    approvals:
      - evidence_collection_conformity_officer_approval
    outputs:
      - evidence_collection_conformity_record
    evidence_generated:
      - evidence_collection_workflow_log
      - evidence_collection_attestation
    success_criteria:
      - evidence_collection_conformity_validated
      - evidence_collection_evidence_complete
    failure_conditions:
      - evidence_collection_critical_gap_unresolved
      - evidence_collection_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: evidence_collection_ce_marking_preparation_workflow
    linked: true
    trigger: evidence_collection_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: evidence_collection_conformity_assessment_workflow
    linked: true
    trigger: evidence_collection_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: evidence_collection_notified_body_engagement_workflow
    linked: true
    trigger: evidence_collection_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: evidence_collection_declaration_of_conformity_workflow
    linked: true
    trigger: evidence_collection_declaration_of_conformity_initiated
  - workflow_id: WF-CE-MARKET_AUTHO
