purpose:
  >
    Executable CE Marking skill for Evidence Collection within ce_marketing/conformity_evidence.
    Delivers conformity-assessment-ready, notified-body-ready, market-access-ready operations for
    evidence generation, validation, integrity, assurance, retention. Functions as governance,
    conformity, certification, compliance, evidence, assessment, regulatory, market-access,
    monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Evidence Collection.
objectives:
  - Operationalize Evidence Collection as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Evidence Collection
  - Maintain market-access-ready evidence for Evidence Collection
  - Integrate Evidence Collection with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Evidence Collection
definitions:
  evidence_collection_conformity_assertion:
    Formal conformity statement for Evidence Collection supported by indexed evidence.
  evidence_collection_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  evidence_collection_market_access_record:
    Record demonstrating market authorization readiness for Evidence Collection.
taxonomy:
  root: evidence_collection_taxonomy
  conformity_phase:
    - preparation
    - assessment
    - declaration
    - market_placement
    - surveillance
  evidence_collection_status:
