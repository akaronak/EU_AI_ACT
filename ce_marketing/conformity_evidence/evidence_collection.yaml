  - workflow_id: WF-CE-RECERTIFICAT
    workflow_name: evidence_collection_recertification_workflow
    linked: true
    trigger: evidence_collection_recertification_initiated
decision_logic:
  evidence_collection_conformity_gate:
    condition: evidence_collection_readiness_score >= 0.95 AND evidence_collection_evidence_complete == true
    action: authorize_evidence_collection_progression
    approval_required: conformity_officer
conformity_assessment:
  assessment_scope: Evidence Collection EU AI Act conformity dimensions
  assessment_methodology: evidence_collection_iso_19011_conformity_method
  assessment_criteria: evidence_collection_annex_iii_and_article_requirements
  conformity_dimensions:
    - technical
    - organizational
    - operational
    - documentation
  evidence_requirements:
    - evidence_collection_technical_file
    - evidence_collection_risk_assessment
    - evidence_collection_validation_records
  acceptance_thresholds: evidence_collection_readiness_score >= 0.95
  rejection_thresholds: evidence_collection_critical_gap == true
metrics:
  - metric_name: evidence_completeness_rate
    metric_category: conformity
    formula: computed_evidence_completeness_rate_from_evidence_collection_telemetry
    target: >= 0.95
    warning_threshold: < 0.90
    critical_threshold: < 0.80
    measurement_frequency: weekly
    owner: evidence_collection_metrics_owner
    data_source: evidence_collection_conformity_warehouse
    evidence_generated: evidence_completeness_rate_measurement_record
  - metric_name: evidence_validation_pass_rate
