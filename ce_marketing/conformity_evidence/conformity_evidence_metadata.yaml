    evidence_generated:
      - conformity_evidence_metadata_workflow_log
      - conformity_evidence_metadata_attestation
    success_criteria:
      - conformity_evidence_metadata_conformity_validated
      - conformity_evidence_metadata_evidence_complete
    failure_conditions:
      - conformity_evidence_metadata_critical_gap_unresolved
      - conformity_evidence_metadata_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: conformity_evidence_metadata_ce_marking_preparation_workflow
    linked: true
    trigger: conformity_evidence_metadata_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: conformity_evidence_metadata_conformity_assessment_workflow
