purpose:
  >
    Executable CE Marking skill for Conformity Evidence Metadata within
    ce_marketing/conformity_evidence. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for evidence generation, validation, integrity, assurance,
    retention. Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Conformity Evidence
    Metadata.
objectives:
  - Operationalize Conformity Evidence Metadata as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Conformity Evidence Metadata
  - Maintain market-access-ready evidence for Conformity Evidence Metadata
  - Integrate Conformity Evidence Metadata with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Conformity Evidence Metadata
definitions:
  conformity_evidence_metadata_conformity_assertion:
    Formal conformity statement for Conformity Evidence Metadata supported by indexed evidence.
  conformity_evidence_metadata_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  conformity_evidence_metadata_market_access_record:
    Record demonstrating market authorization readiness for Conformity Evidence Metadata.
taxonomy:
