workflows:
  - workflow_id: WF-CE-CONFORMITY_EVIDENCE_
    workflow_name: conformity_evidence_metadata_conformity_workflow
    workflow_owner: conformity_evidence_metadata_workflow_owner
    trigger: conformity_evidence_metadata_conformity_event
    inputs:
