      - technical_evidence_mapping_attestation
    success_criteria:
      - technical_evidence_mapping_conformity_validated
      - technical_evidence_mapping_evidence_complete
    failure_conditions:
      - technical_evidence_mapping_critical_gap_unresolved
      - technical_evidence_mapping_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: technical_evidence_mapping_ce_marking_preparation_workflow
    linked: true
    trigger: technical_evidence_mapping_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: technical_evidence_mapping_conformity_assessment_workflow
