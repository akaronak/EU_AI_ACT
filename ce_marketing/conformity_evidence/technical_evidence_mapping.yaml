purpose:
  >
    Executable CE Marking skill for Technical Evidence Mapping within
    ce_marketing/conformity_evidence. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for evidence generation, validation, integrity, assurance,
    retention. Functions as governance, conformity, certification, compliance, evidence, assessment,
    regulatory, market-access, monitoring, and orchestration skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Technical Evidence
    Mapping.
objectives:
  - Operationalize Technical Evidence Mapping as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Technical Evidence Mapping
  - Maintain market-access-ready evidence for Technical Evidence Mapping
  - Integrate Technical Evidence Mapping with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Technical Evidence Mapping
definitions:
  technical_evidence_mapping_conformity_assertion:
    Formal conformity statement for Technical Evidence Mapping supported by indexed evidence.
  technical_evidence_mapping_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  technical_evidence_mapping_market_access_record:
    Record demonstrating market authorization readiness for Technical Evidence Mapping.
taxonomy:
  root: technical_evidence_mapping_taxonomy
