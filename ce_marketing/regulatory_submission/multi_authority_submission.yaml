purpose:
  >
    Executable CE Marking skill for Multi Authority Submission within
    ce_marketing/regulatory_submission. Delivers conformity-assessment-ready, notified-body-ready,
    market-access-ready operations for submission governance, validation, tracking, authority
    interaction, submission evidence. Functions as governance, conformity, certification,
    compliance, evidence, assessment, regulatory, market-access, monitoring, and orchestration
    skill.
scope:
  >
    All AI systems, technical documentation, conformity assessments, declarations of conformity,
    notified body interactions, and market authorization activities governed by Multi Authority
    Submission.
objectives:
  - Operationalize Multi Authority Submission as executable CE marking conformity skill
  - Enable notified-body-ready conformity validation for Multi Authority Submission
  - Maintain market-access-ready evidence for Multi Authority Submission
  - Integrate Multi Authority Submission with declaration and market authorization lifecycle
  - Support post-certification monitoring and recertification for Multi Authority Submission
definitions:
  multi_authority_submission_conformity_assertion:
    Formal conformity statement for Multi Authority Submission supported by indexed evidence.
  multi_authority_submission_notified_body_evidence:
    Evidence package suitable for notified body conformity assessment review.
  multi_authority_submission_market_access_record:
    Record demonstrating market authorization readiness for Multi Authority Submission.
