workflows:
  - workflow_id: WF-CE-MULTI_AUTHORITY_SUBM
    workflow_name: multi_authority_submission_conformity_workflow
    workflow_owner: multi_authority_submission_workflow_owner
    trigger: multi_authority_submission_conformity_event
    inputs:
      - multi_authority_submission_conformity_context
      - multi_authority_submission_evidence_index
    activities:
      - multi_authority_submission_intake
      - multi_authority_submission_validation
      - multi_authority_submission_evidence_review
      - multi_authority_submission_approval
      - multi_authority_submission_attestation
      - multi_authority_submission_closure
    decision_points:
      - multi_authority_submission_conformity_decision
      - multi_authority_submission_escalation_decision
    approvals:
      - multi_authority_submission_conformity_officer_approval
    outputs:
      - multi_authority_submission_conformity_record
    evidence_generated:
      - multi_authority_submission_workflow_log
      - multi_authority_submission_attestation
    success_criteria:
      - multi_authority_submission_conformity_validated
      - multi_authority_submission_evidence_complete
    failure_conditions:
      - multi_authority_submission_critical_gap_unresolved
      - multi_authority_submission_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: multi_authority_submission_ce_marking_preparation_workflow
    linked: true
    trigger: multi_authority_submission_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: multi_authority_submission_conformity_assessment_workflow
    linked: true
    trigger: multi_authority_submission_conformity_assessment_initiated
  - workflow_id: WF-CE-NOTIFIED_BOD
    workflow_name: multi_authority_submission_notified_body_engagement_workflow
    linked: true
    trigger: multi_authority_submission_notified_body_engagement_initiated
  - workflow_id: WF-CE-DECLARATION_
    workflow_name: multi_authority_submission_declaration_of_conformity_workflow
