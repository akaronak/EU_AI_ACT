    evidence_generated:
      - submission_audit_controls_workflow_log
      - submission_audit_controls_attestation
    success_criteria:
      - submission_audit_controls_conformity_validated
      - submission_audit_controls_evidence_complete
    failure_conditions:
      - submission_audit_controls_critical_gap_unresolved
      - submission_audit_controls_evidence_integrity_failure
  - workflow_id: WF-CE-CE_MARKING_P
    workflow_name: submission_audit_controls_ce_marking_preparation_workflow
    linked: true
    trigger: submission_audit_controls_ce_marking_preparation_initiated
  - workflow_id: WF-CE-CONFORMITY_A
    workflow_name: submission_audit_controls_conformity_assessment_workflow
