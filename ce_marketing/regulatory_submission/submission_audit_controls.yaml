workflows:
  - workflow_id: WF-CE-SUBMISSION_AUDIT_CON
    workflow_name: submission_audit_controls_conformity_workflow
    workflow_owner: submission_audit_controls_workflow_owner
    trigger: submission_audit_controls_conformity_event
    inputs:
      - submission_audit_controls_conformity_context
      - submission_audit_controls_evidence_index
    activities:
      - submission_audit_controls_intake
      - submission_audit_controls_validation
      - submission_audit_controls_evidence_review
      - submission_audit_controls_approval
      - submission_audit_controls_attestation
      - submission_audit_controls_closure
    decision_points:
