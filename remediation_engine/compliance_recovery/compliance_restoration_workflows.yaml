non_conformity_management:
  non_conformity_categories:
    - "Control deficiency under Article 20"
    - "Remediation ticket SLA breach"
    - "Causal analysis verification omission"
  severity_levels:
    critical: "Halt system immediately, resolve within 4 hours"
    high: "Isolate affected nodes, resolve within 24 hours"
    normal: "Perform GRC audit, resolve within 5 days"
  prioritization_rules:
    - "Critical severity violations escalated directly to Chief Risk Officer within 5 minutes."
    - "Repeat non-conformities automatically bumped to high priority status."
  remediation_requirements:
    - "Formulate corrective action plan details within 8 hours."
    - "Deploy model patches and security fixes under GRC oversight."
  closure_requirements:
    - "All corrective actions implemented and verified by mock tests."
    - "Remediation completion certificate signed by Lead Auditor."
  validation_requirements:
    - "Verify residual risk scores remain below compliance limits."
    - "Verify task ownership log maps weekly, assert zero unassigned items."
  assurance_requirements:
    - "Register verification reports weekly in compliance attestation vault."
    - "Seal monthly continuous improvement scorecards weekly in safety ledger."
  assessment_findings:
    findings_categories:
      - "Minor observation during QMS audit"
      - "Major non-conformity during post-market review"
    findings_severity:
      major: "Requires formal CAPA initiation within 24 hours"
      minor: "Requires control improvement ticket closure within 30 days"
    remediation_requirements:
      - "Initiate finding assessment workflow pre-flight."
      - "Verify operator remediation credentials pre-closure."
    closure_requirements:
      - "Resolve findings and register verification reports in compliance vault."
      - "Obtain Ethics Steward sign-off on GRC ticket status updates."
