metrics:
  - metric_name: "registration_update_reporting_registration_completeness_score"
    formula: "COUNT(complete_fields) / COUNT(total_fields)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Registration Officer"
    data_source: "completeness_validation_logs"
    evidence_generated: "Completeness Validation Reports."
  - metric_name: "registration_update_reporting_submission_accuracy_score"
    formula: "COUNT(accurate_data_points) / COUNT(total_data_points)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Validation Lead"
    data_source: "validation_vault_db"
    evidence_generated: "Weekly Validation Reports."
  - metric_name: "registration_update_reporting_validation_effectiveness_score"
    formula: "COUNT(detected_errors) / COUNT(total_existing_errors)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.85"
    measurement_frequency: "DAILY"
    owner: "Validation Lead"
    data_source: "validation_vault_db"
    evidence_generated: "Daily discrepancy reports."
  - metric_name: "registration_update_reporting_registration_readiness_score"
    formula: "MIN(readiness_checklist_status)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Registration Officer"
    data_source: "completeness_validation_logs"
    evidence_generated: "Signed High-Risk AI Registration Attestations."
  - metric_name: "registration_update_reporting_registration_traceability_score"
    formula: "COUNT(traceable_records) / COUNT(total_records)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "CONTINUOUS"
    owner: "Regulatory Liason"
    data_source: "traceability_ledger_db"
    evidence_generated: "Weekly modification and lineage trace reports."
  - metric_name: "registration_update_reporting_authority_response_timeliness"
    formula: "COUNT(responses_within_sla) / COUNT(total_requests)"
    target: "1.00"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Regulatory Liason"
    data_source: "authority_interaction_db"
    evidence_generated: "Surveillance response logs."
  - metric_name: "registration_update_reporting_registration_assurance_score"
    formula: "MIN(assurance_checks_status)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "MONTHLY"
    owner: "Validation Lead"
    data_source: "assurance_vault_db"
    evidence_generated: "Registry assurance assessment reports."
  - metric_name: "registration_update_reporting_market_surveillance_alignment_score"
    formula: "COUNT(aligned_controls) / COUNT(total_surveillance_controls)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "QUARTERLY"
    owner: "Regulatory Liason"
    data_source: "assurance_vault_db"
    evidence_generated: "Monthly Surveillance Readiness Reports."
  - metric_name: "registration_update_reporting_registration_compliance_score"
    formula: "COUNT(compliant_records) / COUNT(total_records)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "CONTINUOUS"
    owner: "Registration Officer"
    data_source: "completeness_validation_logs"
    evidence_generated: "Signed registration attestation certificates."
  - metric_name: "registration_update_reporting_registration_maturity_score"
    formula: "current_maturity_level / 6.0"
    target: "0.83"
    warning_threshold: "0.66"
    critical_threshold: "0.50"
    measurement_frequency: "ANNUALLY"
    owner: "Registration Officer"
    data_source: "completeness_validation_logs"
    evidence_generated: "Maturity assessment certificates."
kpis:
  - "registration_update_reporting_registration_completeness_score"
  - "registration_update_reporting_submission_accuracy_score"
kris:
  - "registration_update_reporting_validation_effectiveness_score"
  - "registration_update_reporting_registration_traceability_score"
thresholds:
