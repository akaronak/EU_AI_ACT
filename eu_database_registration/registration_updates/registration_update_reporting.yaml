  registration_initiation: "Assign Registration Officer and log system classification."
  registration_preparation: "Compile technical documentation summary and conformity certs."
  registration_submission: "Post pre-validated payload to official portals."
  registration_validation: "Check accuracy, consistency, and completeness weekly."
  registration_approval: "Record transaction receipt confirmation and registry ID."
