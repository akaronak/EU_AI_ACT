    - "CLEARED"
    - "WARNING_ISSUED"
    - "HOLD_ACTIVE"
    - "CRITICAL_BLOCKED"
  enforcement_levels:
    - "LOG_ONLY"
    - "WARN_OPERATOR"
    - "RESTRICT_CAPABILITY"
    - "SHUTDOWN_NODE"
governance:
