metrics:
  - metric_name: "certification_management_taxonomy_conformity_assessment_readiness_score"
    formula: "COUNT(passed_conformity_checklists) / COUNT(total_conformity_checklists)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Lead Auditor"
    data_source: "conformity_audits_db"
    evidence_generated: "Monthly Conformity Assessment Readiness report."
  - metric_name: "certification_management_taxonomy_certification_readiness_score"
    formula: "COUNT(ready_indicators) / COUNT(total_readiness_indicators)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Certification Officer"
