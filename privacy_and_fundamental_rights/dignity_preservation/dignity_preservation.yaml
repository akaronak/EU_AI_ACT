    evidence_generated: "Weekly Rights Impact Assessment coverage report."
  - metric_name: "dignity_preservation_consent_validity_rate"
    formula: "COUNT(valid_consents) / COUNT(total_processed_records)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "DAILY"
    owner: "Data Protection Officer"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Daily Consent Validity report."
  - metric_name: "dignity_preservation_data_subject_request_timeliness"
    formula: "COUNT(resolved_requests_within_SLA) / COUNT(total_requests)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
