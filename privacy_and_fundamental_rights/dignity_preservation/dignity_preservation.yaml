  - metric_name: "dignity_preservation_privacy_compliance_score"
    formula: "passed_privacy_checks / total_privacy_checks"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Data Protection Officer"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Weekly Privacy Compliance scorecard."
  - metric_name: "dignity_preservation_fundamental_rights_assurance_score"
    formula: "COUNT(signed_assurance_certs) / COUNT(total_requirements)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Ethics Steward"
    data_source: "violation_checks_db"
    evidence_generated: "Weekly Rights Assurance report."
