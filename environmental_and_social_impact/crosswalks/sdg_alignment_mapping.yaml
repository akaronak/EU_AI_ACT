metrics:
  environmental_impact_score:
    metric_name: environmental_impact_score
    formula: sum(environmenta_valid_events) / sum(environmenta_total_events) * 98
    target: '97%'
    warning_threshold: '87%'
    critical_threshold: '77%'
    measurement_frequency: DAILY
    owner: Social Impact Lead
    data_source: sdg_alignment_mapping_telemetry_stream
