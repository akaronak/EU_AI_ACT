    - "Visual CE marking inspections"
    - "Key authorization check gates"
  validation_evidence: "Signed importer verification certificate archived in compliance vault."
  validation_authority: "Importer Steward"
  validation_frequency: "Weekly"
  validation_outcomes:
    - "Pass - allow market placement"
    - "Fail - block shipment and trigger corrective action workflow"
evidence_intelligence:
  evidence_sources:
    - "importer_verif_db"
    - "distributor_checks_db"
    - "trade_ledger_vault"
  evidence_types:
    - "Conformity verification certificates"
    - "CE marking checklists"
    - "Trace mapping reports"
  evidence_integrity: "Cryptographic SHA-256 hashes registered in immutable trade ledger."
  evidence_lineage: "Map evidence documents back to specific shipment manifest records."
  evidence_provenance: "Generated by verified trade validation and checking services."
  evidence_validation: "Check digital signatures against authority key registry daily."
  evidence_confidence: 0.99
  evidence_retention: "10 years in secure trade archive"
telemetry:
  telemetry_sources:
    - "import_gateway_logs"
    - "distributor_check_logs"
    - "regulatory_portal_events"
  collection_frequency: "Continuous"
  telemetry_retention: "90 days active, 10 years compliance archive"
  telemetry_integrity: "Signed telemetry data blocks"
  telemetry_validation: "Daily signature and hash check updates"
economic_operator_telemetry:
  verification_events: "Track provider documentation validation events for Market Surveillance Orchestration."
  conformity_events: "Record declaration of conformity validation checks for Market Surveillance Orchestration."
  placement_events: "Log market placement authorizations and releases for Market Surveillance Orchestration."
  traceability_events: "Record supply chain node transfer checks for Market Surveillance Orchestration."
  surveillance_events: "Track regulatory query and inspection events for Market Surveillance Orchestration."
  corrective_action_events: "Log quarantines, recalls and withdraw events for Market Surveillance Orchestration."
  notification_events: "Track regulatory notification transmission alerts for Market Surveillance Orchestration."
  accountability_events: "Record signature validations and roles assignment checks for Market Surveillance Orchestration."
  governance_alerts: "High priority trade compliance alert notifications sent to CAIO."
  governance_indicators: "Check validation delays and recall execution latency indicators."
metrics:
  - metric_name: "market_surveillance_orchestration_conformity_verification_score"
    formula: "COUNT(verified_conformity_assessments) / COUNT(total_received_assessments)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "BATCH_CHECK"
    owner: "Importer Steward"
    data_source: "importer_verif_db"
    evidence_generated: "Monthly Conformity Verification report."
  - metric_name: "market_surveillance_orchestration_market_placement_readiness_score"
    formula: "COUNT(completed_readiness_checks) / COUNT(total_readiness_requirements)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Importer Steward"
    data_source: "importer_verif_db"
    evidence_generated: "Weekly Placement Readiness report."
  - metric_name: "market_surveillance_orchestration_traceability_effectiveness_score"
    formula: "COUNT(fully_traced_shipments) / COUNT(total_processed_shipments)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "DAILY"
    owner: "Supply Chain Lead"
    data_source: "distributor_checks_db"
    evidence_generated: "Daily Trace Mapping report."
