  decision_owners:
    - "Chief Trade Counsel"
    - "Supply Chain Director"
  decision_authorities:
    - "Enterprise Trade Compliance Board"
  accountability_controls:
    - "CTRL-IO-ORCH-MARKET-04"
  accountability_validation: "Verify roles registry assignments and signatures logs quarterly for Market Surveillance Orchestration."
  accountability_assurance: "Check action logs against authorized roles weekly for Market Surveillance Orchestration."
  accountability_reporting: "Publish monthly accountability reports to trade compliance board."
assurance_framework:
  assurance_objectives:
    - "Align with ISO 42001 trade standards and Article 23/24 compliance validations for Market Surveillance Orchestration."
  assurance_controls:
    - "CTRL-IO-ORCH-MARKET-04"
    - "CTRL-IO-ORCH-MARKET-06"
  assurance_validation: "Audit compliance metrics and verification hashes weekly for Market Surveillance Orchestration."
  assurance_monitoring: "Track trade compliance dashboard scorecards daily under Market Surveillance Orchestration."
  assurance_reviews:
    - "Monthly documentation audits"
    - "Annual operator compliance framework audits"
  assurance_evidence: "Signed verification certificates registered in trade attestation vault"
monitoring_framework:
  monitoring_scope: "Continuous verification of importer and distributor checklists and telemetry metrics."
  alert_thresholds: "Trigger alert if validation score falls below 0.95 or CE marking is unverified."
validation_framework:
