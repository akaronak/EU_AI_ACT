  supply_chain_entities:
    - "Foreign AI Providers"
    - "Enterprise Importers"
    - "Intermediate Distributors"
    - "End Customers"
  supply_chain_dependencies:
    - "Conformity certifications transit paths"
    - "Documentation registry custody lines"
  supply_chain_controls:
    - "CTRL-IO-IVER-TECHNI-03"
    - "CTRL-IO-IVER-TECHNI-05"
  supply_chain_monitoring: "Monitor transit times and document validations status daily."
  supply_chain_validation: "Assert trace mapping continuity scores daily."
  supply_chain_assurance: "Verify transport hash checks and signature registries daily."
  supply_chain_reporting: "Publish supply chain status dashboard updates daily."
traceability_framework:
  operator_traceability: "Log operator identities, actions and signatures in trade compliance registers for Technical Documentation Verification."
  product_traceability: "Track system package versions and baseline deployments under Technical Documentation Verification."
  documentation_traceability: "Trace technical file changes and certificate revisions for Technical Documentation Verification."
  distribution_traceability: "Log intermediary distributor transits and storage check gates under Technical Documentation Verification."
  accountability_traceability: "Assert accountability path mappings and key actions history for Technical Documentation Verification."
  traceability_validation: "Verify trace hashes and trace completeness metrics weekly."
  traceability_assurance: "Certify traceability reports quarterly."
