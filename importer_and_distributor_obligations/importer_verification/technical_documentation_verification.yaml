    - "Supply Chain Director"
  decision_authorities:
    - "Enterprise Trade Compliance Board"
  accountability_controls:
    - "CTRL-IO-IVER-TECHNI-04"
  accountability_validation: "Verify roles registry assignments and signatures logs quarterly for Technical Documentation Verification."
  accountability_assurance: "Check action logs against authorized roles weekly for Technical Documentation Verification."
  accountability_reporting: "Publish monthly accountability reports to trade compliance board."
