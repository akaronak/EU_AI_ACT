    - "CTRL-IO-IVER-TECHNI-06"
  assurance_validation: "Audit compliance metrics and verification hashes weekly for Technical Documentation Verification."
  assurance_monitoring: "Track trade compliance dashboard scorecards daily under Technical Documentation Verification."
  assurance_reviews:
    - "Monthly documentation audits"
    - "Annual operator compliance framework audits"
  assurance_evidence: "Signed verification certificates registered in trade attestation vault"
monitoring_framework:
