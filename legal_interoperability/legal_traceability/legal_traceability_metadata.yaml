purpose: "Govern, operationalize, and validate compliance checks for Legal Traceability Metadata under the Legal Traceability framework. This skill provides machine-readable, executable Legal Interoperability & regulatory harmonization logic specifically tailored to compliance lineage maps, legal obligation tracking databases, regulatory requirement trace logs, evidence traceability maps properties."
scope: "Scope covers all cross-framework alignments, transfer controls, conflict resolution pathways, and jurisdictional mappings governed by the Legal Traceability Metadata framework."
objectives:
  - "Enforce automated jurisdictional mappings and equivalency rules under Legal Traceability Metadata criteria."
  - "Ensure real-time translation audits and traceability log capture for Legal Traceability."
  - "Compile litigation-aware legal assurance reports to verify defensibility under cross-border regimes."
definitions:
  legal_traceability_metadata_interop_policy: "The primary operational legal interoperability policy and rules for Legal Traceability Metadata."
  legal_traceability_metadata_alignment_map: "Cryptographically sealed concept alignment matrix containing regulatory mapping data for Legal Traceability Metadata."
