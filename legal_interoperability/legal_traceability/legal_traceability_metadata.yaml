metrics:
  - metric_name: "legal_traceability_metadata_jurisdiction_alignment_score"
    formula: "COUNT(verified_jurisdiction_mappings) / COUNT(total_jurisdiction_mappings)"
    target: "1.00"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "WEEKLY"
    owner: "Legal Steward"
    data_source: "mapping_verif_db"
    evidence_generated: "Monthly Jurisdiction Alignment report."
  - metric_name: "legal_traceability_metadata_regulatory_harmonization_score"
    formula: "COUNT(harmonized_rules) / COUNT(total_rules_in_scope)"
