  - control_id: "CTRL-CW-DMA-INTERO-05"
    control_name: "cross_framework_validation_control"
    control_type: "PREVENTATIVE"
    control_category: "VALIDATION"
    control_objective: "Validate cross-framework mapping confidence and rules completeness before registry update for Interoperability Obligations Mapping."
    crosswalk_rationale: "Ensures audit-readiness and verification consistency of the mapping matrix for Interoperability Obligations Mapping."
    implementation_guidance: "Verify all mapping matrix metadata fields match verification metrics before release."
    control_owner: "Crosswalk Architect"
    control_frequency: "ON_RELEASE"
    monitoring_method: "Verify metadata checklist validation state."
    validation_method: "Generate mapping matrix with missing fields, confirm release blocking."
    evidence_generated: "Signed Mapping Matrix Attestation certificate."
    mapping_confidence: 0.99
