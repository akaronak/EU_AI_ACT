metadata:
  document_id: AL-ORCH-CM-001
  title: Certification Management
  domain: AI Literacy / Orchestration
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: certification_management
  domain_authority: orchestration
  focus: certification lifecycle, credential issuance, recertification, certificate integrity
  purpose:
    >
      Orchestrate AI literacy certification lifecycle including credential definition, issuance upon
      competency validation, recertification scheduling, certificate revocation, and tamper-evident
      credential integrity management.
  scope:
    >
      All workforce AI literacy activities governed by Certification Management within the orchestration
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic certification_management controls for AI literacy governance
    - Enable automated certification_management verification and scoring
    - Maintain audit-grade traceability for all certification_management activities
    - Support regulatory inspection of certification_management evidence
    - Deliver measurable certification_management outcomes aligned with EU AI Act Article 4

definitions:
  certification_management_domain:
    >
    The Certification Management operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy orchestration.
  certification_management_evidence:
    >
    Machine-readable records demonstrating adherence to Certification Management
    requirements across applicable regulatory frameworks.
  certification_management_artifact:
    >
    Any documented output generated by Certification Management controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Orchestration Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - certification_management_owner
  - certification_management_analyst
  - certification_management_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Certification Management controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 7.2 - Competence"
    requirements:
      >
      Certification Management controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: certification_management_taxonomy
  credential_type:
    - baseline_certificate
    - role_certificate
    - specialist_certification
    - executive_attestation
  certification_state:
    - pending
    - issued
    - active
    - expiring
    - expired
    - revoked
    - reinstated
  recertification_trigger:
    - calendar_expiry
    - regulatory_change
    - role_change
    - incident_finding
  integrity_control:
    - digital_signature
    - blockchain_anchor
    - revocation_registry
    - verification_api

controls:
  preventive:
    - certification_issued_only_upon_validated_competency
    - recertification_reminder_90_30_7_day_schedule
    - certificate_revocation_on_qualification_failure
  detective:
    - certificate_revocation_on_qualification_failure
    - tamper_evident_digital_credential_format
  corrective:
    - tamper_evident_digital_credential_format
    - public_revocation_registry_for_third_party_verification

workflow:
  phases:
    - phase: credential_definition
      steps:
        - define_credential_types_and_requirements
        - establish_validity_periods
        - configure_integrity_controls
    - phase: issuance
      steps:
        - validate_competency_evidence
        - issue_digital_credential
        - register_in_credential_registry
    - phase: lifecycle
      steps:
        - monitor_expiry_and_send_reminders
        - process_recertification
        - revoke_on_disqualification
    - phase: verification
      steps:
        - provide_credential_verification_api
        - maintain_revocation_registry
        - audit_credential_integrity

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: certification_management
    evidence_artifact: credential_definition_record
  iso_42001_competence:
    control_scope: certification_management
    evidence_artifact: revocation_registry_entry

reporting_requirements:
  - certification_registry_report
  - expiry_pipeline_dashboard
  - credential_integrity_audit

evidence_requirements:
  - credential_definition_record
  - issuance_audit_log
  - recertification_completion_record
  - revocation_registry_entry

metrics:
  active_credential_count:
    type: gauge
    domain: certification_management
  recertification_on_time_rate:
    type: gauge
    domain: certification_management
  revocation_count:
    type: gauge
    domain: certification_management
  credential_verification_request_volume:
    type: gauge
    domain: certification_management

artifacts:
  - name: credential_definition_record
    retention_years: 7
    classification: RESTRICTED
  - name: issuance_audit_log
    retention_years: 7
    classification: RESTRICTED
  - name: recertification_completion_record
    retention_years: 7
    classification: RESTRICTED
  - name: revocation_registry_entry
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Active Credential Count
    target: defined_by_governance_committee
  - name: Recertification On Time Rate
    target: defined_by_governance_committee
  - name: Revocation Count
    target: defined_by_governance_committee

governance:
  policy_owner: Certification Management Program Director
  review_cycle: quarterly
  related_domain: orchestration

related_files:
  - literacy_program_management.yaml
  - certification_management.yaml
  - literacy_remediation_workflows.yaml
  - literacy_tracking.yaml

ontology_relationships:
  is_a: "certification_management_governance_infrastructure"
  part_of: "ai_literacy_orchestration_framework"
  governed_by: literacy_governance.yaml
