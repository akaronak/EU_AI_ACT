metadata:
  document_id: AL-ORCH-RBTD-001
  title: Role Based Training Delivery
  domain: AI Literacy / Orchestration
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: role_based_training_delivery
  domain_authority: orchestration
  focus: role-targeted delivery scheduling, cohort management, delivery channel selection, completion orchestration
  purpose:
    >
      Orchestrate role-based training delivery ensuring correct literacy modules reach the right roles
      through appropriate channels, managing cohort schedules, delivery logistics, and completion
      orchestration integrated with HR systems.
  scope:
    >
      All workforce AI literacy activities governed by Role Based Training Delivery within the
      orchestration subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic role_based_training_delivery controls for AI literacy governance
    - Enable automated role_based_training_delivery verification and scoring
    - Maintain audit-grade traceability for all role_based_training_delivery activities
    - Support regulatory inspection of role_based_training_delivery evidence
    - Deliver measurable role_based_training_delivery outcomes aligned with EU AI Act Article 4

definitions:
  role_based_training_delivery_domain:
    >
    The Role Based Training Delivery operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy orchestration.
  role_based_training_delivery_evidence:
    >
    Machine-readable records demonstrating adherence to Role Based Training Delivery
    requirements across applicable regulatory frameworks.
  role_based_training_delivery_artifact:
    >
    Any documented output generated by Role Based Training Delivery controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Orchestration Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - role_based_training_delivery_owner
  - role_based_training_delivery_analyst
  - role_based_training_delivery_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Role Based Training Delivery controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: role_based_training_delivery_taxonomy
  delivery_channel:
    - lms
    - instructor_led
    - virtual_classroom
    - on_site_workshop
    - embedded_workflow
  cohort_type:
    - new_hire
    - role_transition
    - recertification
    - remediation
    - executive
  scheduling_driver:
    - onboarding_date
    - role_effective_date
    - compliance_deadline
    - manager_request
  delivery_status:
    - scheduled
    - in_progress
    - completed
    - overdue
    - exempted

controls:
  preventive:
    - role_to_module_mapping_enforced_at_enrollment
    - delivery_scheduled_within_onboarding_sla
    - overdue_escalation_to_manager_at_7_and_14_days
  detective:
    - overdue_escalation_to_manager_at_7_and_14_days
    - exemption_requires_compliance_officer_approval
  corrective:
    - exemption_requires_compliance_officer_approval
    - delivery_completion_synced_to_hr_within_24_hours

workflow:
  phases:
    - phase: enrollment
      steps:
        - identify_role_based_training_requirements
        - auto_enroll_on_role_assignment
        - schedule_delivery
    - phase: delivery
      steps:
        - execute_delivery_via_assigned_channel
        - track_attendance_and_progress
        - send_reminder_notifications
    - phase: completion
      steps:
        - verify_completion_and_assessment
        - update_literacy_records
        - sync_to_hr
    - phase: escalation
      steps:
        - identify_overdue_learners
        - escalate_to_managers
        - restrict_access_if_past_deadline

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: role_based_training_delivery
    evidence_artifact: enrollment_record
  iso_42001_competence:
    control_scope: role_based_training_delivery
    evidence_artifact: exemption_authorization

reporting_requirements:
  - role_based_delivery_dashboard
  - overdue_escalation_register
  - channel_effectiveness_comparison

evidence_requirements:
  - enrollment_record
  - delivery_attendance_log
  - completion_verification
  - exemption_authorization

metrics:
  role_based_delivery_completion_rate:
    type: gauge
    domain: role_based_training_delivery
  onboarding_sla_compliance:
    type: gauge
    domain: role_based_training_delivery
  overdue_learner_count:
    type: gauge
    domain: role_based_training_delivery
  exemption_rate:
    type: gauge
    domain: role_based_training_delivery

artifacts:
  - name: enrollment_record
    retention_years: 7
    classification: RESTRICTED
  - name: delivery_attendance_log
    retention_years: 7
    classification: RESTRICTED
  - name: completion_verification
    retention_years: 7
    classification: RESTRICTED
  - name: exemption_authorization
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Role Based Delivery Completion Rate
    target: defined_by_governance_committee
  - name: Onboarding Sla Compliance
    target: defined_by_governance_committee
  - name: Overdue Learner Count
    target: defined_by_governance_committee

governance:
  policy_owner: Role Based Training Delivery Program Director
  review_cycle: quarterly
  related_domain: orchestration

related_files:
  - literacy_program_management.yaml
  - certification_management.yaml
  - literacy_remediation_workflows.yaml
  - literacy_tracking.yaml

ontology_relationships:
  is_a: "role_based_training_delivery_governance_infrastructure"
  part_of: "ai_literacy_orchestration_framework"
  governed_by: literacy_governance.yaml
