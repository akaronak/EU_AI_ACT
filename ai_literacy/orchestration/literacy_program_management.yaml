metadata:
  document_id: AL-ORCH-LPM-001
  title: Literacy Program Management
  domain: AI Literacy / Orchestration
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_program_management
  domain_authority: orchestration
  focus: program lifecycle, curriculum governance, resource allocation, stakeholder coordination
  purpose:
    >
      Orchestrate enterprise AI literacy program management including curriculum lifecycle, resource
      allocation, stakeholder coordination, program budgeting, and continuous program improvement
      governance.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Program Management within the
      orchestration subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_program_management controls for AI literacy governance
    - Enable automated literacy_program_management verification and scoring
    - Maintain audit-grade traceability for all literacy_program_management activities
    - Support regulatory inspection of literacy_program_management evidence
    - Deliver measurable literacy_program_management outcomes aligned with EU AI Act Article 4

definitions:
  literacy_program_management_domain:
    >
    The Literacy Program Management operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy orchestration.
  literacy_program_management_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Program Management
    requirements across applicable regulatory frameworks.
  literacy_program_management_artifact:
    >
    Any documented output generated by Literacy Program Management controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Orchestration Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_program_management_owner
  - literacy_program_management_analyst
  - literacy_program_management_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Program Management controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 8 - Operation"
    requirements:
      >
      Literacy Program Management controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: literacy_program_management_taxonomy
  program_element:
    - curriculum
    - delivery_channel
    - assessment_suite
    - certification
    - reporting
  lifecycle_stage:
    - planning
    - design
    - pilot
    - rollout
    - operate
    - optimize
    - sunset
  stakeholder:
    - hr_ld
    - business_units
    - compliance
    - it
    - executive_sponsor
  program_metric:
    - coverage
    - effectiveness
    - cost_per_learner
    - time_to_competency

controls:
  preventive:
    - annual_literacy_program_plan_approved_by_governance_committee
    - curriculum_change_control_workflow
    - program_budget_tracking_and_variance_reporting
  detective:
    - program_budget_tracking_and_variance_reporting
    - stakeholder_raci_matrix_maintained
  corrective:
    - stakeholder_raci_matrix_maintained
    - program_sunset_procedure_for_obsolete_modules

workflow:
  phases:
    - phase: planning
      steps:
        - develop_annual_program_plan
        - allocate_budget_and_resources
        - align_with_regulatory_calendar
    - phase: design_and_pilot
      steps:
        - design_curriculum_updates
        - pilot_with_representative_cohorts
        - certify_for_rollout
    - phase: rollout_and_operate
      steps:
        - execute_rollout_schedule
        - monitor_delivery_and_coverage
        - manage_stakeholder_communications
    - phase: optimize
      steps:
        - analyze_program_effectiveness
        - implement_improvements
        - plan_next_cycle

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_program_management
    evidence_artifact: annual_literacy_program_plan
  iso_42001_competence:
    control_scope: literacy_program_management
    evidence_artifact: stakeholder_raci_matrix

reporting_requirements:
  - literacy_program_status_report
  - program_effectiveness_scorecard
  - annual_program_review_brief

evidence_requirements:
  - annual_literacy_program_plan
  - curriculum_change_record
  - program_budget_report
  - stakeholder_raci_matrix

metrics:
  program_plan_execution_rate:
    type: gauge
    domain: literacy_program_management
  curriculum_update_cycle_time:
    type: gauge
    domain: literacy_program_management
  budget_variance_percent:
    type: gauge
    domain: literacy_program_management
  stakeholder_satisfaction_score:
    type: gauge
    domain: literacy_program_management

artifacts:
  - name: annual_literacy_program_plan
    retention_years: 7
    classification: RESTRICTED
  - name: curriculum_change_record
    retention_years: 7
    classification: RESTRICTED
  - name: program_budget_report
    retention_years: 7
    classification: RESTRICTED
  - name: stakeholder_raci_matrix
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Program Plan Execution Rate
    target: defined_by_governance_committee
  - name: Curriculum Update Cycle Time
    target: defined_by_governance_committee
  - name: Budget Variance Percent
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Program Management Program Director
  review_cycle: quarterly
  related_domain: orchestration

related_files:
  - literacy_program_management.yaml
  - certification_management.yaml
  - literacy_remediation_workflows.yaml
  - literacy_tracking.yaml

ontology_relationships:
  is_a: "literacy_program_management_governance_infrastructure"
  part_of: "ai_literacy_orchestration_framework"
  governed_by: literacy_governance.yaml
