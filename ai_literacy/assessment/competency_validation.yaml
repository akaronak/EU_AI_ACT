metadata:
  document_id: AL-ASSESS-CV-001
  title: Competency Validation
  domain: AI Literacy / Assessment
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: competency_validation
  domain_authority: assessment
  focus: competency verification, proficiency validation, qualification evidence, validation workflows
  purpose:
    >
      Establish enterprise-grade competency validation infrastructure for AI literacy governance. Defines
      machine-evaluable controls for verifying workforce proficiency against role-specific AI literacy
      competencies, qualification attestation, and regulator-defensible validation evidence chains.
  scope:
    >
      All workforce AI literacy activities governed by Competency Validation within the assessment
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic competency_validation controls for AI literacy governance
    - Enable automated competency_validation verification and scoring
    - Maintain audit-grade traceability for all competency_validation activities
    - Support regulatory inspection of competency_validation evidence
    - Deliver measurable competency_validation outcomes aligned with EU AI Act Article 4

definitions:
  competency_validation_domain:
    >
    The Competency Validation operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy assessment.
  competency_validation_evidence:
    >
    Machine-readable records demonstrating adherence to Competency Validation
    requirements across applicable regulatory frameworks.
  competency_validation_artifact:
    >
    Any documented output generated by Competency Validation controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Assessment Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - competency_validation_owner
  - competency_validation_analyst
  - competency_validation_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
      - "Article 14 - Human Oversight"
    requirements:
      >
      Competency Validation controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 7.2 - Competence"
    requirements:
      >
      Competency Validation controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: competency_validation_taxonomy
  competency_domain:
    - technical_ai_literacy
    - ethical_ai_judgment
    - risk_recognition
    - oversight_capability
  validation_method:
    - practical_demonstration
    - scenario_assessment
    - peer_review_validation
    - supervisor_attestation
  proficiency_tier:
    - foundational
    - intermediate
    - advanced
    - expert
  qualification_status:
    - pending_validation
    - provisionally_qualified
    - fully_qualified
    - revalidation_required

controls:
  preventive:
    - role_competency_matrix_enforcement_before_ai_system_access
    - practical_demonstration_required_for_high_risk_roles
    - independent_validator_review_for_expert_tier_qualification
  detective:
    - independent_validator_review_for_expert_tier_qualification
    - competency_evidence_immutability_and_retention_controls
  corrective:
    - competency_evidence_immutability_and_retention_controls
    - automated_revalidation_trigger_on_role_change_or_regulatory_update

workflow:
  phases:
    - phase: competency_intake
      steps:
        - identify_role_competency_requirements
        - map_individual_to_competency_matrix
        - collect_prior_qualification_records
    - phase: validation_execution
      steps:
        - administer_role_specific_validation_assessment
        - conduct_practical_demonstration_if_required
        - record_validation_session_evidence
    - phase: qualification_decision
      steps:
        - score_competency_demonstration_against_rubric
        - apply_independent_review_if_expert_tier
        - issue_qualification_attestation_or_remediation_plan
    - phase: ongoing_assurance
      steps:
        - schedule_revalidation_per_policy
        - monitor_competency_drift_indicators
        - suspend_access_on_qualification_expiry

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: competency_validation
    evidence_artifact: validation_session_record
  iso_42001_competence:
    control_scope: competency_validation
    evidence_artifact: qualification_attestation_certificate

reporting_requirements:
  - competency_validation_status_register
  - role_qualification_coverage_report
  - revalidation_due_register

evidence_requirements:
  - validation_session_record
  - practical_demonstration_artifact
  - competency_rubric_scorecard
  - qualification_attestation_certificate

metrics:
  competency_validation_completion_rate:
    type: gauge
    domain: competency_validation
  first_attempt_pass_rate:
    type: gauge
    domain: competency_validation
  revalidation_overdue_count:
    type: gauge
    domain: competency_validation
  qualification_attestation_integrity_score:
    type: gauge
    domain: competency_validation

artifacts:
  - name: validation_session_record
    retention_years: 7
    classification: RESTRICTED
  - name: practical_demonstration_artifact
    retention_years: 7
    classification: RESTRICTED
  - name: competency_rubric_scorecard
    retention_years: 7
    classification: RESTRICTED
  - name: qualification_attestation_certificate
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Competency Validation Completion Rate
    target: defined_by_governance_committee
  - name: First Attempt Pass Rate
    target: defined_by_governance_committee
  - name: Revalidation Overdue Count
    target: defined_by_governance_committee

governance:
  policy_owner: Competency Validation Program Director
  review_cycle: quarterly
  related_domain: assessment

related_files:
  - competency_validation.yaml
  - literacy_assessment_framework.yaml
  - literacy_gap_analysis.yaml
  - literacy_scoring.yaml

ontology_relationships:
  is_a: "competency_validation_governance_infrastructure"
  part_of: "ai_literacy_assessment_framework"
  governed_by: literacy_governance.yaml
