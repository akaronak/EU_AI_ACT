metadata:
  document_id: AL-ASSESS-LGA-001
  title: Literacy Gap Analysis
  domain: AI Literacy / Assessment
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_gap_analysis
  domain_authority: assessment
  focus: skill deficiencies, capability gaps, remediation planning, maturity scoring, improvement roadmaps
  purpose:
    >
      Provide systematic literacy gap analysis infrastructure identifying workforce skill deficiencies
      against required AI literacy profiles. Enables maturity scoring, prioritized remediation planning,
      and executive improvement roadmaps with machine-evaluable gap closure tracking.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Gap Analysis within the assessment
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_gap_analysis controls for AI literacy governance
    - Enable automated literacy_gap_analysis verification and scoring
    - Maintain audit-grade traceability for all literacy_gap_analysis activities
    - Support regulatory inspection of literacy_gap_analysis evidence
    - Deliver measurable literacy_gap_analysis outcomes aligned with EU AI Act Article 4

definitions:
  literacy_gap_analysis_domain:
    >
    The Literacy Gap Analysis operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy assessment.
  literacy_gap_analysis_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Gap Analysis
    requirements across applicable regulatory frameworks.
  literacy_gap_analysis_artifact:
    >
    Any documented output generated by Literacy Gap Analysis controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Assessment Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_gap_analysis_owner
  - literacy_gap_analysis_analyst
  - literacy_gap_analysis_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Gap Analysis controls must satisfy EU_AI_ACT literacy obligations.
  nist_ai_rmf:
    references:
      - "MAP 1.1 - Context establishment"
    requirements:
      >
      Literacy Gap Analysis controls must satisfy NIST_AI_RMF literacy obligations.

taxonomy:
  root: literacy_gap_analysis_taxonomy
  gap_type:
    - knowledge_deficit
    - skill_deficit
    - behavioral_gap
    - awareness_gap
  gap_severity:
    - critical_blocker
    - high_priority
    - moderate
    - minor
  remediation_path:
    - targeted_microlearning
    - mentored_practice
    - formal_retraining
    - role_reassignment
  maturity_band:
    - nascent
    - developing
    - defined
    - managed
    - optimized

controls:
  preventive:
    - mandatory_gap_analysis_after_every_summative_assessment
    - critical_gap_escalation_to_role_owner_within_24_hours
    - remediation_plan_approval_by_literacy_program_manager
  detective:
    - remediation_plan_approval_by_literacy_program_manager
    - gap_closure_verification_via_follow_up_assessment
  corrective:
    - gap_closure_verification_via_follow_up_assessment
    - organizational_maturity_aggregation_with_anonymization_thresholds

workflow:
  phases:
    - phase: gap_identification
      steps:
        - compare_assessment_results_to_role_profile
        - classify_gap_type_and_severity
        - aggregate_team_and_org_level_gaps
    - phase: remediation_planning
      steps:
        - assign_remediation_path_per_gap
        - estimate_closure_timeline
        - allocate_training_resources
    - phase: roadmap_generation
      steps:
        - prioritize_gaps_by_risk_and_severity
        - build_quarterly_improvement_roadmap
        - publish_executive_gap_summary
    - phase: closure_verification
      steps:
        - deliver_remediation_interventions
        - re_assess_targeted_competencies
        - mark_gap_closed_or_escalate

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_gap_analysis
    evidence_artifact: individual_gap_analysis_report
  iso_42001_competence:
    control_scope: literacy_gap_analysis
    evidence_artifact: gap_closure_verification_record

reporting_requirements:
  - organizational_gap_dashboard
  - critical_gap_escalation_register
  - maturity_improvement_roadmap

evidence_requirements:
  - individual_gap_analysis_report
  - team_gap_heatmap
  - remediation_plan_artifact
  - gap_closure_verification_record

metrics:
  open_gap_count_by_severity:
    type: gauge
    domain: literacy_gap_analysis
  mean_time_to_gap_closure_days:
    type: gauge
    domain: literacy_gap_analysis
  organizational_literacy_maturity_score:
    type: gauge
    domain: literacy_gap_analysis
  remediation_plan_completion_rate:
    type: gauge
    domain: literacy_gap_analysis

artifacts:
  - name: individual_gap_analysis_report
    retention_years: 7
    classification: RESTRICTED
  - name: team_gap_heatmap
    retention_years: 7
    classification: RESTRICTED
  - name: remediation_plan_artifact
    retention_years: 7
    classification: RESTRICTED
  - name: gap_closure_verification_record
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Open Gap Count By Severity
    target: defined_by_governance_committee
  - name: Mean Time To Gap Closure Days
    target: defined_by_governance_committee
  - name: Organizational Literacy Maturity Score
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Gap Analysis Program Director
  review_cycle: quarterly
  related_domain: assessment

related_files:
  - competency_validation.yaml
  - literacy_assessment_framework.yaml
  - literacy_gap_analysis.yaml
  - literacy_scoring.yaml

ontology_relationships:
  is_a: "literacy_gap_analysis_governance_infrastructure"
  part_of: "ai_literacy_assessment_framework"
  governed_by: literacy_governance.yaml
