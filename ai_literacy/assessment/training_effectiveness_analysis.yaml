metadata:
  document_id: AL-ASSESS-TEA-001
  title: Training Effectiveness Analysis
  domain: AI Literacy / Assessment
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: training_effectiveness_analysis
  domain_authority: assessment
  focus: learning outcome measurement, training ROI, Kirkpatrick evaluation, intervention efficacy
  purpose:
    >
      Analyze and measure AI literacy training program effectiveness through structured learning outcome
      evaluation. Applies Kirkpatrick-style analysis, pre-post competency delta measurement, behavioral
      transfer assessment, and training ROI quantification for literacy program optimization.
  scope:
    >
      All workforce AI literacy activities governed by Training Effectiveness Analysis within the
      assessment subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic training_effectiveness_analysis controls for AI literacy governance
    - Enable automated training_effectiveness_analysis verification and scoring
    - Maintain audit-grade traceability for all training_effectiveness_analysis activities
    - Support regulatory inspection of training_effectiveness_analysis evidence
    - Deliver measurable training_effectiveness_analysis outcomes aligned with EU AI Act Article 4

definitions:
  training_effectiveness_analysis_domain:
    >
    The Training Effectiveness Analysis operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy assessment.
  training_effectiveness_analysis_evidence:
    >
    Machine-readable records demonstrating adherence to Training Effectiveness Analysis
    requirements across applicable regulatory frameworks.
  training_effectiveness_analysis_artifact:
    >
    Any documented output generated by Training Effectiveness Analysis controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Assessment Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - training_effectiveness_analysis_owner
  - training_effectiveness_analysis_analyst
  - training_effectiveness_analysis_auditor
  - compliance_officer

regulatory_alignment:
  iso_42001:
    references:
      - "Clause 7.2 - Competence"
      - "Clause 10.2 - Continual Improvement"
    requirements:
      >
      Training Effectiveness Analysis controls must satisfy ISO_42001 literacy obligations.
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Training Effectiveness Analysis controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: training_effectiveness_analysis_taxonomy
  evaluation_level:
    - reaction
    - learning
    - behavior_transfer
    - organizational_impact
  intervention_type:
    - elearning_module
    - instructor_led_workshop
    - simulation_lab
    - on_the_job_coaching
  effectiveness_indicator:
    - competency_delta
    - incident_rate_change
    - assessment_pass_rate_lift
    - time_to_proficiency
  analysis_method:
    - pre_post_comparison
    - control_group_analysis
    - longitudinal_tracking
    - regression_adjusted

controls:
  preventive:
    - mandatory_pre_post_assessment_for_all_certified_interventions
    - control_group_or_baseline_comparison_for_pilot_programs
    - behavior_transfer_observation_for_high_risk_roles
  detective:
    - behavior_transfer_observation_for_high_risk_roles
    - training_effectiveness_report_submission_before_program_renewal
  corrective:
    - training_effectiveness_report_submission_before_program_renewal
    - ineffective_intervention_deprecation_workflow

workflow:
  phases:
    - phase: baseline_capture
      steps:
        - administer_pre_intervention_assessment
        - record_baseline_competency_scores
        - establish_control_cohort_if_applicable
    - phase: intervention_delivery
      steps:
        - deliver_training_intervention
        - capture_participant_reaction_data
        - log_completion_and_engagement_metrics
    - phase: outcome_measurement
      steps:
        - administer_post_intervention_assessment
        - compute_competency_delta
        - observe_behavior_transfer_in_workflow
    - phase: effectiveness_reporting
      steps:
        - quantify_training_roi
        - recommend_program_continuation_or_redesign
        - publish_effectiveness_analysis_to_governance

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: training_effectiveness_analysis
    evidence_artifact: pre_post_assessment_comparison
  iso_42001_competence:
    control_scope: training_effectiveness_analysis
    evidence_artifact: intervention_deprecation_decision

reporting_requirements:
  - training_effectiveness_scorecard
  - intervention_comparison_dashboard
  - program_renewal_recommendation_brief

evidence_requirements:
  - pre_post_assessment_comparison
  - behavior_transfer_observation_record
  - training_effectiveness_analysis_report
  - intervention_deprecation_decision

metrics:
  mean_competency_delta_post_training:
    type: gauge
    domain: training_effectiveness_analysis
  behavior_transfer_rate:
    type: gauge
    domain: training_effectiveness_analysis
  training_roi_ratio:
    type: gauge
    domain: training_effectiveness_analysis
  intervention_completion_rate:
    type: gauge
    domain: training_effectiveness_analysis

artifacts:
  - name: pre_post_assessment_comparison
    retention_years: 7
    classification: RESTRICTED
  - name: behavior_transfer_observation_record
    retention_years: 7
    classification: RESTRICTED
  - name: training_effectiveness_analysis_report
    retention_years: 7
    classification: RESTRICTED
  - name: intervention_deprecation_decision
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Mean Competency Delta Post Training
    target: defined_by_governance_committee
  - name: Behavior Transfer Rate
    target: defined_by_governance_committee
  - name: Training Roi Ratio
    target: defined_by_governance_committee

governance:
  policy_owner: Training Effectiveness Analysis Program Director
  review_cycle: quarterly
  related_domain: assessment

related_files:
  - competency_validation.yaml
  - literacy_assessment_framework.yaml
  - literacy_gap_analysis.yaml
  - literacy_scoring.yaml

ontology_relationships:
  is_a: "training_effectiveness_analysis_governance_infrastructure"
  part_of: "ai_literacy_assessment_framework"
  governed_by: literacy_governance.yaml
