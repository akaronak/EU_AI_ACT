metadata:
  document_id: AL-ASSESS-LS-001
  title: Literacy Scoring
  domain: AI Literacy / Assessment
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_scoring
  domain_authority: assessment
  focus: scoring algorithms, proficiency bands, composite indices, score normalization
  purpose:
    >
      Govern literacy scoring methodology across all AI literacy assessments. Defines deterministic
      scoring algorithms, proficiency band thresholds, composite literacy indices, cross-cohort
      normalization, and score integrity verification for audit-grade literacy measurement.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Scoring within the assessment subdomain of
      enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_scoring controls for AI literacy governance
    - Enable automated literacy_scoring verification and scoring
    - Maintain audit-grade traceability for all literacy_scoring activities
    - Support regulatory inspection of literacy_scoring evidence
    - Deliver measurable literacy_scoring outcomes aligned with EU AI Act Article 4

definitions:
  literacy_scoring_domain:
    >
    The Literacy Scoring operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy assessment.
  literacy_scoring_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Scoring
    requirements across applicable regulatory frameworks.
  literacy_scoring_artifact:
    >
    Any documented output generated by Literacy Scoring controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Assessment Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_scoring_owner
  - literacy_scoring_analyst
  - literacy_scoring_auditor
  - compliance_officer

regulatory_alignment:
  iso_42001:
    references:
      - "Clause 9.1 - Monitoring"
    requirements:
      >
      Literacy Scoring controls must satisfy ISO_42001 literacy obligations.
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Scoring controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: literacy_scoring_taxonomy
  score_component:
    - raw_item_score
    - weighted_dimension_score
    - composite_literacy_index
    - risk_adjusted_score
  proficiency_band:
    - below_minimum
    - minimum_competent
    - proficient
    - advanced
    - expert
  normalization_method:
    - cohort_percentile
    - role_relative
    - absolute_rubric
    - longitudinal_delta
  score_integrity_flag:
    - verified
    - anomaly_detected
    - manual_review_required
    - invalidated

controls:
  preventive:
    - deterministic_scoring_engine_with_versioned_algorithms
    - score_calculation_audit_trail_for_every_assessment
    - anomaly_detection_on_rapid_or_perfect_score_patterns
  detective:
    - anomaly_detection_on_rapid_or_perfect_score_patterns
    - manual_score_override_requires_dual_authorization
  corrective:
    - manual_score_override_requires_dual_authorization
    - proficiency_band_threshold_change_requires_governance_committee_approval

workflow:
  phases:
    - phase: score_computation
      steps:
        - apply_rubric_to_assessment_responses
        - compute_dimension_and_composite_scores
        - assign_proficiency_band
    - phase: normalization
      steps:
        - apply_cohort_or_role_normalization_if_configured
        - compute_longitudinal_improvement_delta
        - flag_statistical_anomalies
    - phase: integrity_verification
      steps:
        - validate_score_against_audit_trail
        - resolve_anomaly_flags
        - seal_final_score_record
    - phase: score_publication
      steps:
        - publish_score_to_individual_literacy_record
        - feed_aggregated_scores_to_reporting
        - trigger_gap_analysis_if_below_threshold

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_scoring
    evidence_artifact: scored_assessment_record
  iso_42001_competence:
    control_scope: literacy_scoring
    evidence_artifact: score_integrity_attestation

reporting_requirements:
  - literacy_score_distribution_report
  - proficiency_band_trend_analysis
  - scoring_anomaly_register

evidence_requirements:
  - scored_assessment_record
  - scoring_algorithm_version_log
  - proficiency_band_assignment
  - score_integrity_attestation

metrics:
  mean_composite_literacy_index:
    type: gauge
    domain: literacy_scoring
  proficiency_band_distribution:
    type: gauge
    domain: literacy_scoring
  score_anomaly_rate:
    type: gauge
    domain: literacy_scoring
  scoring_engine_latency_ms:
    type: gauge
    domain: literacy_scoring

artifacts:
  - name: scored_assessment_record
    retention_years: 7
    classification: RESTRICTED
  - name: scoring_algorithm_version_log
    retention_years: 7
    classification: RESTRICTED
  - name: proficiency_band_assignment
    retention_years: 7
    classification: RESTRICTED
  - name: score_integrity_attestation
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Mean Composite Literacy Index
    target: defined_by_governance_committee
  - name: Proficiency Band Distribution
    target: defined_by_governance_committee
  - name: Score Anomaly Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Scoring Program Director
  review_cycle: quarterly
  related_domain: assessment

related_files:
  - competency_validation.yaml
  - literacy_assessment_framework.yaml
  - literacy_gap_analysis.yaml
  - literacy_scoring.yaml

ontology_relationships:
  is_a: "literacy_scoring_governance_infrastructure"
  part_of: "ai_literacy_assessment_framework"
  governed_by: literacy_governance.yaml
