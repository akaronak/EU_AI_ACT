metadata:
  document_id: AL-ASSESS-RAS-001
  title: Risk Awareness Scoring
  domain: AI Literacy / Assessment
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: risk_awareness_scoring
  domain_authority: assessment
  focus: risk recognition measurement, hazard identification scoring, escalation judgment assessment
  purpose:
    >
      Measure and score workforce risk awareness specific to AI system deployment and use. Evaluates
      hazard identification capability, risk escalation judgment, misuse recognition, and incident
      precursor awareness through specialized risk-awareness scoring instruments.
  scope:
    >
      All workforce AI literacy activities governed by Risk Awareness Scoring within the assessment
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic risk_awareness_scoring controls for AI literacy governance
    - Enable automated risk_awareness_scoring verification and scoring
    - Maintain audit-grade traceability for all risk_awareness_scoring activities
    - Support regulatory inspection of risk_awareness_scoring evidence
    - Deliver measurable risk_awareness_scoring outcomes aligned with EU AI Act Article 4

definitions:
  risk_awareness_scoring_domain:
    >
    The Risk Awareness Scoring operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy assessment.
  risk_awareness_scoring_evidence:
    >
    Machine-readable records demonstrating adherence to Risk Awareness Scoring
    requirements across applicable regulatory frameworks.
  risk_awareness_scoring_artifact:
    >
    Any documented output generated by Risk Awareness Scoring controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Assessment Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - risk_awareness_scoring_owner
  - risk_awareness_scoring_analyst
  - risk_awareness_scoring_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 9 - Risk Management"
      - "Article 4 - AI Literacy"
    requirements:
      >
      Risk Awareness Scoring controls must satisfy EU_AI_ACT literacy obligations.
  iso_23894:
    references:
      - "Risk awareness assessment"
    requirements:
      >
      Risk Awareness Scoring controls must satisfy ISO_23894 literacy obligations.

taxonomy:
  root: risk_awareness_scoring_taxonomy
  risk_awareness_domain:
    - ai_misuse_risk
    - data_privacy_risk
    - bias_and_fairness_risk
    - security_exploit_risk
    - societal_harm_risk
  scoring_scenario:
    - synthetic_incident_vignette
    - live_system_anomaly
    - policy_violation_case
    - escalation_decision_point
  awareness_level:
    - unaware
    - partially_aware
    - risk_literate
    - risk_proficient
  escalation_judgment:
    - fail_to_escalate
    - delayed_escalation
    - appropriate_escalation
    - over_escalation

controls:
  preventive:
    - risk_scenario_bank_rotation_to_prevent_memorization
    - escalation_judgment_scored_by_authoritative_rubric
    - critical_risk_awareness_failure_triggers_access_restriction
  detective:
    - critical_risk_awareness_failure_triggers_access_restriction
    - risk_awareness_score_linked_to_incident_response_authorization
  corrective:
    - risk_awareness_score_linked_to_incident_response_authorization
    - scenario_content_review_by_ai_risk_management_team

workflow:
  phases:
    - phase: scenario_administration
      steps:
        - select_role_appropriate_risk_scenarios
        - deliver_vignette_based_assessment
        - capture_escalation_decisions
    - phase: risk_score_computation
      steps:
        - score_hazard_identification_accuracy
        - evaluate_escalation_appropriateness
        - compute_composite_risk_awareness_index
    - phase: threshold_enforcement
      steps:
        - compare_score_to_role_minimum_risk_awareness
        - restrict_high_risk_access_if_below_threshold
        - assign_targeted_risk_remediation
    - phase: continuous_calibration
      steps:
        - update_scenarios_from_incident_lessons_learned
        - recalibrate_rubric_against_expert_panel
        - publish_risk_awareness_benchmarks

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: risk_awareness_scoring
    evidence_artifact: risk_awareness_assessment_record
  iso_42001_competence:
    control_scope: risk_awareness_scoring
    evidence_artifact: access_restriction_trigger_log

reporting_requirements:
  - risk_awareness_scorecard_by_role
  - escalation_judgment_failure_analysis
  - risk_scenario_effectiveness_report

evidence_requirements:
  - risk_awareness_assessment_record
  - escalation_judgment_rubric_score
  - risk_scenario_response_artifact
  - access_restriction_trigger_log

metrics:
  composite_risk_awareness_index:
    type: gauge
    domain: risk_awareness_scoring
  escalation_judgment_accuracy_rate:
    type: gauge
    domain: risk_awareness_scoring
  critical_risk_failure_count:
    type: gauge
    domain: risk_awareness_scoring
  scenario_discrimination_index:
    type: gauge
    domain: risk_awareness_scoring

artifacts:
  - name: risk_awareness_assessment_record
    retention_years: 7
    classification: RESTRICTED
  - name: escalation_judgment_rubric_score
    retention_years: 7
    classification: RESTRICTED
  - name: risk_scenario_response_artifact
    retention_years: 7
    classification: RESTRICTED
  - name: access_restriction_trigger_log
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Composite Risk Awareness Index
    target: defined_by_governance_committee
  - name: Escalation Judgment Accuracy Rate
    target: defined_by_governance_committee
  - name: Critical Risk Failure Count
    target: defined_by_governance_committee

governance:
  policy_owner: Risk Awareness Scoring Program Director
  review_cycle: quarterly
  related_domain: assessment

related_files:
  - competency_validation.yaml
  - literacy_assessment_framework.yaml
  - literacy_gap_analysis.yaml
  - literacy_scoring.yaml

ontology_relationships:
  is_a: "risk_awareness_scoring_governance_infrastructure"
  part_of: "ai_literacy_assessment_framework"
  governed_by: literacy_governance.yaml
