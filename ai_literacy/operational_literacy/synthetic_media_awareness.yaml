metadata:
  document_id: AL-OPS-SMA-001
  title: Synthetic Media Awareness
  domain: AI Literacy / Operational Literacy
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: synthetic_media_awareness
  domain_authority: operational_literacy
  focus: deepfake recognition, synthetic content disclosure, media authenticity, manipulation detection
  purpose:
    >
      Build workforce awareness of synthetic media risks including deepfake recognition, AI-generated
      content identification, disclosure obligations under Article 52, and organizational policies on
      synthetic media handling.
  scope:
    >
      All workforce AI literacy activities governed by Synthetic Media Awareness within the operational
      literacy subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic synthetic_media_awareness controls for AI literacy governance
    - Enable automated synthetic_media_awareness verification and scoring
    - Maintain audit-grade traceability for all synthetic_media_awareness activities
    - Support regulatory inspection of synthetic_media_awareness evidence
    - Deliver measurable synthetic_media_awareness outcomes aligned with EU AI Act Article 4

definitions:
  synthetic_media_awareness_domain:
    >
    The Synthetic Media Awareness operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy operational_literacy.
  synthetic_media_awareness_evidence:
    >
    Machine-readable records demonstrating adherence to Synthetic Media Awareness
    requirements across applicable regulatory frameworks.
  synthetic_media_awareness_artifact:
    >
    Any documented output generated by Synthetic Media Awareness controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Operational Literacy Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - synthetic_media_awareness_owner
  - synthetic_media_awareness_analyst
  - synthetic_media_awareness_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 52 - Transparency for Synthetic Content"
      - "Article 4 - AI Literacy"
    requirements:
      >
      Synthetic Media Awareness controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: synthetic_media_awareness_taxonomy
  media_type:
    - deepfake_video
    - synthetic_audio
    - ai_generated_image
    - text_hallucination
    - synthetic_document
  awareness_competency:
    - detection_heuristics
    - verification_workflow
    - disclosure_obligation
    - misinformation_response
  organizational_context:
    - internal_communications
    - customer_facing
    - marketing
    - legal_evidence
  awareness_outcome:
    - detection_capable
    - disclosure_compliant
    - verification_proficient

controls:
  preventive:
    - synthetic_media_awareness_for_customer_facing_roles
    - deepfake_recognition_training_for_security_and_comms
    - disclosure_obligation_training_per_article_52
  detective:
    - disclosure_obligation_training_per_article_52
    - verification_workflow_drill_annual
  corrective:
    - verification_workflow_drill_annual
    - synthetic_media_policy_acknowledgment

workflow:
  phases:
    - phase: awareness_building
      steps:
        - educate_on_synthetic_media_threats
        - train_detection_heuristics
        - assess_recognition_competency
    - phase: policy_integration
      steps:
        - communicate_organizational_synthetic_media_policy
        - train_disclosure_obligations
        - establish_verification_workflows
    - phase: operational_drill
      steps:
        - conduct_deepfake_recognition_exercises
        - test_disclosure_compliance
        - simulate_misinformation_scenarios
    - phase: continuous_update
      steps:
        - update_on_new_synthetic_techniques
        - incorporate_incident_case_studies
        - refresh_customer_facing_training

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: synthetic_media_awareness
    evidence_artifact: synthetic_media_awareness_record
  iso_42001_competence:
    control_scope: synthetic_media_awareness
    evidence_artifact: verification_workflow_drill_report

reporting_requirements:
  - synthetic_media_awareness_dashboard
  - detection_exercise_performance
  - disclosure_compliance_status

evidence_requirements:
  - synthetic_media_awareness_record
  - deepfake_recognition_exercise_results
  - disclosure_training_attestation
  - verification_workflow_drill_report

metrics:
  synthetic_media_awareness_completion:
    type: gauge
    domain: synthetic_media_awareness
  deepfake_recognition_accuracy:
    type: gauge
    domain: synthetic_media_awareness
  disclosure_compliance_rate:
    type: gauge
    domain: synthetic_media_awareness
  verification_workflow_adoption:
    type: gauge
    domain: synthetic_media_awareness

artifacts:
  - name: synthetic_media_awareness_record
    retention_years: 7
    classification: RESTRICTED
  - name: deepfake_recognition_exercise_results
    retention_years: 7
    classification: RESTRICTED
  - name: disclosure_training_attestation
    retention_years: 7
    classification: RESTRICTED
  - name: verification_workflow_drill_report
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Synthetic Media Awareness Completion
    target: defined_by_governance_committee
  - name: Deepfake Recognition Accuracy
    target: defined_by_governance_committee
  - name: Disclosure Compliance Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Synthetic Media Awareness Program Director
  review_cycle: quarterly
  related_domain: operational_literacy

related_files:
  - cybersecurity_ai_awareness.yaml
  - human_oversight_training.yaml
  - incident_response_literacy.yaml
  - operational_ai_usage_training.yaml

ontology_relationships:
  is_a: "synthetic_media_awareness_governance_infrastructure"
  part_of: "ai_literacy_operational_literacy_framework"
  governed_by: literacy_governance.yaml
