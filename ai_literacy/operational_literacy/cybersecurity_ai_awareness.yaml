metadata:
  document_id: AL-OPS-CAA-001
  title: Cybersecurity AI Awareness
  domain: AI Literacy / Operational Literacy
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: cybersecurity_ai_awareness
  domain_authority: operational_literacy
  focus: AI-specific cyber threats, adversarial awareness, model security, prompt injection literacy
  purpose:
    >
      Build workforce cybersecurity awareness specific to AI systems covering adversarial attacks, prompt
      injection, model poisoning, data exfiltration via AI interfaces, and secure AI deployment practices
      for operational personnel.
  scope:
    >
      All workforce AI literacy activities governed by Cybersecurity AI Awareness within the operational
      literacy subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic cybersecurity_ai_awareness controls for AI literacy governance
    - Enable automated cybersecurity_ai_awareness verification and scoring
    - Maintain audit-grade traceability for all cybersecurity_ai_awareness activities
    - Support regulatory inspection of cybersecurity_ai_awareness evidence
    - Deliver measurable cybersecurity_ai_awareness outcomes aligned with EU AI Act Article 4

definitions:
  cybersecurity_ai_awareness_domain:
    >
    The Cybersecurity AI Awareness operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy operational_literacy.
  cybersecurity_ai_awareness_evidence:
    >
    Machine-readable records demonstrating adherence to Cybersecurity AI Awareness
    requirements across applicable regulatory frameworks.
  cybersecurity_ai_awareness_artifact:
    >
    Any documented output generated by Cybersecurity AI Awareness controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Operational Literacy Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - cybersecurity_ai_awareness_owner
  - cybersecurity_ai_awareness_analyst
  - cybersecurity_ai_awareness_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 15 - Accuracy and Cybersecurity"
    requirements:
      >
      Cybersecurity AI Awareness controls must satisfy EU_AI_ACT literacy obligations.
  iso_27001:
    references:
      - "A.12 - Operations Security"
    requirements:
      >
      Cybersecurity AI Awareness controls must satisfy ISO_27001 literacy obligations.

taxonomy:
  root: cybersecurity_ai_awareness_taxonomy
  threat_category:
    - prompt_injection
    - model_inversion
    - adversarial_input
    - supply_chain_compromise
    - ai_phishing
  awareness_domain:
    - threat_recognition
    - secure_configuration
    - incident_escalation
    - vendor_security
  role_exposure:
    - developer
    - operator
    - helpdesk
    - security_analyst
  awareness_level:
    - basic
    - operational
    - advanced
    - specialist

controls:
  preventive:
    - cybersecurity_ai_awareness_mandatory_for_ai_system_access
    - prompt_injection_recognition_training_for_all_operators
    - adversarial_input_reporting_channel_publicized
  detective:
    - adversarial_input_reporting_channel_publicized
    - ai_security_awareness_refresh_on_new_threat_advisory
  corrective:
    - ai_security_awareness_refresh_on_new_threat_advisory
    - security_analyst_ai_threat_specialization_certification

workflow:
  phases:
    - phase: threat_profiling
      steps:
        - catalog_ai_specific_cyber_threats
        - map_threats_to_roles
        - develop_awareness_content
    - phase: awareness_delivery
      steps:
        - deliver_role_tiered_awareness_training
        - conduct_phishing_and_injection_simulations
        - assess_threat_recognition
    - phase: operational_integration
      steps:
        - integrate_awareness_into_secure_development
        - embed_in_incident_response_playbooks
        - coordinate_with_ciso_office
    - phase: continuous_update
      steps:
        - monitor_threat_landscape
        - update_content_on_new_advisories
        - measure_awareness_effectiveness

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: cybersecurity_ai_awareness
    evidence_artifact: cybersecurity_ai_awareness_training_record
  iso_42001_competence:
    control_scope: cybersecurity_ai_awareness
    evidence_artifact: security_analyst_specialization_certificate

reporting_requirements:
  - cybersecurity_ai_awareness_dashboard
  - simulation_failure_analysis
  - ai_threat_awareness_coverage_report

evidence_requirements:
  - cybersecurity_ai_awareness_training_record
  - injection_simulation_results
  - threat_recognition_assessment
  - security_analyst_specialization_certificate

metrics:
  cybersecurity_ai_awareness_completion_rate:
    type: gauge
    domain: cybersecurity_ai_awareness
  simulation_recognition_rate:
    type: gauge
    domain: cybersecurity_ai_awareness
  ai_security_incident_escalation_timeliness:
    type: gauge
    domain: cybersecurity_ai_awareness
  threat_advisory_content_update_sla:
    type: gauge
    domain: cybersecurity_ai_awareness

artifacts:
  - name: cybersecurity_ai_awareness_training_record
    retention_years: 7
    classification: RESTRICTED
  - name: injection_simulation_results
    retention_years: 7
    classification: RESTRICTED
  - name: threat_recognition_assessment
    retention_years: 7
    classification: RESTRICTED
  - name: security_analyst_specialization_certificate
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Cybersecurity Ai Awareness Completion Rate
    target: defined_by_governance_committee
  - name: Simulation Recognition Rate
    target: defined_by_governance_committee
  - name: Ai Security Incident Escalation Timeliness
    target: defined_by_governance_committee

governance:
  policy_owner: Cybersecurity AI Awareness Program Director
  review_cycle: quarterly
  related_domain: operational_literacy

related_files:
  - cybersecurity_ai_awareness.yaml
  - human_oversight_training.yaml
  - incident_response_literacy.yaml
  - operational_ai_usage_training.yaml

ontology_relationships:
  is_a: "cybersecurity_ai_awareness_governance_infrastructure"
  part_of: "ai_literacy_operational_literacy_framework"
  governed_by: literacy_governance.yaml
