metadata:
  document_id: AL-OPS-HOT-001
  title: Human Oversight Training
  domain: AI Literacy / Operational Literacy
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: human_oversight_training
  domain_authority: operational_literacy
  focus: Article 14 oversight capability, override procedures, monitoring judgment, intervention literacy
  purpose:
    >
      Train designated human oversight personnel to effectively monitor, understand, and override AI
      system outputs per Article 14 including intervention judgment, anomaly recognition, and documented
      override procedures.
  scope:
    >
      All workforce AI literacy activities governed by Human Oversight Training within the operational
      literacy subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic human_oversight_training controls for AI literacy governance
    - Enable automated human_oversight_training verification and scoring
    - Maintain audit-grade traceability for all human_oversight_training activities
    - Support regulatory inspection of human_oversight_training evidence
    - Deliver measurable human_oversight_training outcomes aligned with EU AI Act Article 4

definitions:
  human_oversight_training_domain:
    >
    The Human Oversight Training operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy operational_literacy.
  human_oversight_training_evidence:
    >
    Machine-readable records demonstrating adherence to Human Oversight Training
    requirements across applicable regulatory frameworks.
  human_oversight_training_artifact:
    >
    Any documented output generated by Human Oversight Training controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Operational Literacy Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - human_oversight_training_owner
  - human_oversight_training_analyst
  - human_oversight_training_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 14 - Human Oversight"
    requirements:
      >
      Human Oversight Training controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: human_oversight_training_taxonomy
  oversight_capability:
    - output_interpretation
    - anomaly_detection
    - override_judgment
    - escalation_decision
  oversight_mode:
    - human_in_the_loop
    - human_on_the_loop
    - human_in_command
  training_scenario:
    - false_positive_override
    - missed_anomaly
    - confidence_miscalibration
    - edge_case_intervention
  competency_outcome:
    - oversight_ready
    - conditional_oversight
    - oversight_not_authorized

controls:
  preventive:
    - human_oversight_training_mandatory_before_oversight_assignment
    - simulation_based_oversight_judgment_assessment
    - override_procedure_drill_semi_annual
  detective:
    - override_procedure_drill_semi_annual
    - oversight_competency_recertification_on_system_update
  corrective:
    - oversight_competency_recertification_on_system_update
    - oversight_failure_triggers_retraining_and_review

workflow:
  phases:
    - phase: oversight_profiling
      steps:
        - identify_oversight_roles_and_modes
        - define_oversight_competency_requirements
        - map_to_ai_system_oversight_plans
    - phase: training_delivery
      steps:
        - deliver_oversight_literacy_modules
        - conduct_simulation_exercises
        - assess_intervention_judgment
    - phase: authorization
      steps:
        - certify_oversight_ready_personnel
        - assign_to_oversight_rotations
        - document_in_oversight_register
    - phase: continuous_competence
      steps:
        - monitor_oversight_decision_quality
        - retrain_on_system_changes
        - incorporate_incident_lessons

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: human_oversight_training
    evidence_artifact: human_oversight_training_record
  iso_42001_competence:
    control_scope: human_oversight_training
    evidence_artifact: override_drill_attendance

reporting_requirements:
  - human_oversight_training_status
  - oversight_competency_register
  - simulation_performance_analysis

evidence_requirements:
  - human_oversight_training_record
  - simulation_exercise_scorecard
  - oversight_authorization_certificate
  - override_drill_attendance

metrics:
  oversight_training_completion_rate:
    type: gauge
    domain: human_oversight_training
  simulation_judgment_accuracy:
    type: gauge
    domain: human_oversight_training
  override_procedure_compliance_rate:
    type: gauge
    domain: human_oversight_training
  oversight_recertification_on_time_rate:
    type: gauge
    domain: human_oversight_training

artifacts:
  - name: human_oversight_training_record
    retention_years: 7
    classification: RESTRICTED
  - name: simulation_exercise_scorecard
    retention_years: 7
    classification: RESTRICTED
  - name: oversight_authorization_certificate
    retention_years: 7
    classification: RESTRICTED
  - name: override_drill_attendance
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Oversight Training Completion Rate
    target: defined_by_governance_committee
  - name: Simulation Judgment Accuracy
    target: defined_by_governance_committee
  - name: Override Procedure Compliance Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Human Oversight Training Program Director
  review_cycle: quarterly
  related_domain: operational_literacy

related_files:
  - cybersecurity_ai_awareness.yaml
  - human_oversight_training.yaml
  - incident_response_literacy.yaml
  - operational_ai_usage_training.yaml

ontology_relationships:
  is_a: "human_oversight_training_governance_infrastructure"
  part_of: "ai_literacy_operational_literacy_framework"
  governed_by: literacy_governance.yaml
