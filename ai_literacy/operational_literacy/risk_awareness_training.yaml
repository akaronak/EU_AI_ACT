metadata:
  document_id: AL-OPS-RAT-001
  title: Risk Awareness Training
  domain: AI Literacy / Operational Literacy
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: risk_awareness_training
  domain_authority: operational_literacy
  focus: risk literacy programs, risk training controls, risk escalation awareness, hazard identification
  purpose:
    >
      Deliver structured risk awareness training programs building workforce capability to identify AI-
      related hazards, understand risk classification, execute escalation protocols, and participate in
      risk management lifecycle activities.
  scope:
    >
      All workforce AI literacy activities governed by Risk Awareness Training within the operational
      literacy subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic risk_awareness_training controls for AI literacy governance
    - Enable automated risk_awareness_training verification and scoring
    - Maintain audit-grade traceability for all risk_awareness_training activities
    - Support regulatory inspection of risk_awareness_training evidence
    - Deliver measurable risk_awareness_training outcomes aligned with EU AI Act Article 4

definitions:
  risk_awareness_training_domain:
    >
    The Risk Awareness Training operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy operational_literacy.
  risk_awareness_training_evidence:
    >
    Machine-readable records demonstrating adherence to Risk Awareness Training
    requirements across applicable regulatory frameworks.
  risk_awareness_training_artifact:
    >
    Any documented output generated by Risk Awareness Training controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Operational Literacy Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - risk_awareness_training_owner
  - risk_awareness_training_analyst
  - risk_awareness_training_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 9 - Risk Management"
      - "Article 4 - AI Literacy"
    requirements:
      >
      Risk Awareness Training controls must satisfy EU_AI_ACT literacy obligations.
  iso_23894:
    references:
      - "Risk awareness"
    requirements:
      >
      Risk Awareness Training controls must satisfy ISO_23894 literacy obligations.

taxonomy:
  root: risk_awareness_training_taxonomy
  risk_category:
    - safety
    - fundamental_rights
    - discrimination
    - security
    - reputational
  training_module:
    - hazard_identification
    - risk_classification
    - escalation_protocols
    - risk_acceptance_awareness
  training_delivery:
    - elearning
    - workshop
    - risk_simulation
    - case_study
  competency_outcome:
    - risk_aware
    - risk_literate
    - risk_responder_certified

controls:
  preventive:
    - risk_awareness_training_mandatory_for_ai_exposed_roles
    - escalation_protocol_drill_semi_annual
    - risk_simulation_for_high_risk_system_personnel
  detective:
    - risk_simulation_for_high_risk_system_personnel
    - risk_training_content_aligned_with_enterprise_risk_register
  corrective:
    - risk_training_content_aligned_with_enterprise_risk_register
    - risk_responder_certification_for_incident_roles

workflow:
  phases:
    - phase: program_design
      steps:
        - align_training_with_risk_register
        - develop_category_specific_modules
        - design_escalation_drills
    - phase: delivery
      steps:
        - deliver_tiered_risk_awareness
        - conduct_risk_simulations
        - assess_escalation_competency
    - phase: integration
      steps:
        - link_to_incident_response
        - embed_in_project_risk_assessments
        - coordinate_with_risk_management
    - phase: improvement
      steps:
        - update_from_incident_lessons
        - refresh_on_risk_register_changes
        - measure_training_effectiveness

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: risk_awareness_training
    evidence_artifact: risk_awareness_training_record
  iso_42001_competence:
    control_scope: risk_awareness_training
    evidence_artifact: risk_responder_certificate

reporting_requirements:
  - risk_awareness_training_dashboard
  - escalation_drill_trend_analysis
  - risk_literacy_coverage_by_category

evidence_requirements:
  - risk_awareness_training_record
  - escalation_drill_report
  - risk_simulation_scorecard
  - risk_responder_certificate

metrics:
  risk_awareness_training_completion:
    type: gauge
    domain: risk_awareness_training
  escalation_drill_performance:
    type: gauge
    domain: risk_awareness_training
  risk_simulation_pass_rate:
    type: gauge
    domain: risk_awareness_training
  risk_training_to_incident_response_correlation:
    type: gauge
    domain: risk_awareness_training

artifacts:
  - name: risk_awareness_training_record
    retention_years: 7
    classification: RESTRICTED
  - name: escalation_drill_report
    retention_years: 7
    classification: RESTRICTED
  - name: risk_simulation_scorecard
    retention_years: 7
    classification: RESTRICTED
  - name: risk_responder_certificate
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Risk Awareness Training Completion
    target: defined_by_governance_committee
  - name: Escalation Drill Performance
    target: defined_by_governance_committee
  - name: Risk Simulation Pass Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Risk Awareness Training Program Director
  review_cycle: quarterly
  related_domain: operational_literacy

related_files:
  - cybersecurity_ai_awareness.yaml
  - human_oversight_training.yaml
  - incident_response_literacy.yaml
  - operational_ai_usage_training.yaml

ontology_relationships:
  is_a: "risk_awareness_training_governance_infrastructure"
  part_of: "ai_literacy_operational_literacy_framework"
  governed_by: literacy_governance.yaml
