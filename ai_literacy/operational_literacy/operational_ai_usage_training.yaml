metadata:
  document_id: AL-OPS-OAUT-001
  title: Operational AI Usage Training
  domain: AI Literacy / Operational Literacy
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: operational_ai_usage_training
  domain_authority: operational_literacy
  focus: day-to-day AI tool usage, acceptable use, workflow integration, productivity literacy
  purpose:
    >
      Train operational workforce on safe and effective day-to-day AI tool usage including acceptable use
      policies, workflow integration best practices, output verification habits, and productivity-
      enhancing responsible use patterns.
  scope:
    >
      All workforce AI literacy activities governed by Operational AI Usage Training within the
      operational literacy subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic operational_ai_usage_training controls for AI literacy governance
    - Enable automated operational_ai_usage_training verification and scoring
    - Maintain audit-grade traceability for all operational_ai_usage_training activities
    - Support regulatory inspection of operational_ai_usage_training evidence
    - Deliver measurable operational_ai_usage_training outcomes aligned with EU AI Act Article 4

definitions:
  operational_ai_usage_training_domain:
    >
    The Operational AI Usage Training operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy operational_literacy.
  operational_ai_usage_training_evidence:
    >
    Machine-readable records demonstrating adherence to Operational AI Usage Training
    requirements across applicable regulatory frameworks.
  operational_ai_usage_training_artifact:
    >
    Any documented output generated by Operational AI Usage Training controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Operational Literacy Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - operational_ai_usage_training_owner
  - operational_ai_usage_training_analyst
  - operational_ai_usage_training_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
      - "Article 52 - Transparency for Certain AI"
    requirements:
      >
      Operational AI Usage Training controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: operational_ai_usage_training_taxonomy
  usage_context:
    - productivity_assistant
    - decision_support
    - content_generation
    - data_analysis
    - customer_interaction
  usage_competency:
    - prompt_craftsmanship
    - output_verification
    - data_handling
    - escalation_awareness
  policy_element:
    - acceptable_use
    - prohibited_use
    - data_classification
    - intellectual_property
  training_format:
    - hands_on_lab
    - workflow_embedding
    - peer_coaching
    - microlearning

controls:
  preventive:
    - operational_usage_training_before_ai_tool_provisioning
    - acceptable_use_policy_acknowledgment_required
    - hands_on_lab_completion_for_high_usage_roles
  detective:
    - hands_on_lab_completion_for_high_usage_roles
    - usage_training_refresh_on_tool_upgrade
  corrective:
    - usage_training_refresh_on_tool_upgrade
    - prohibited_use_awareness_verification

workflow:
  phases:
    - phase: onboarding
      steps:
        - provision_ai_tools_after_training
        - deliver_acceptable_use_briefing
        - conduct_hands_on_lab
    - phase: workflow_embedding
      steps:
        - integrate_training_into_daily_workflows
        - provide_role_specific_usage_guides
        - establish_peer_coaching_network
    - phase: assurance
      steps:
        - assess_usage_competency
        - monitor_policy_violations
        - remediate_misuse_patterns
    - phase: evolution
      steps:
        - update_training_on_new_tools
        - incorporate_usage_analytics_insights
        - refresh_on_policy_change

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: operational_ai_usage_training
    evidence_artifact: operational_usage_training_record
  iso_42001_competence:
    control_scope: operational_ai_usage_training
    evidence_artifact: usage_competency_assessment

reporting_requirements:
  - operational_ai_usage_training_dashboard
  - policy_violation_trend_analysis
  - tool_adoption_literacy_correlation

evidence_requirements:
  - operational_usage_training_record
  - acceptable_use_acknowledgment
  - hands_on_lab_completion_certificate
  - usage_competency_assessment

metrics:
  operational_usage_training_completion:
    type: gauge
    domain: operational_ai_usage_training
  acceptable_use_violation_rate:
    type: gauge
    domain: operational_ai_usage_training
  output_verification_habit_adoption:
    type: gauge
    domain: operational_ai_usage_training
  tool_provisioning_training_gate_pass_rate:
    type: gauge
    domain: operational_ai_usage_training

artifacts:
  - name: operational_usage_training_record
    retention_years: 7
    classification: RESTRICTED
  - name: acceptable_use_acknowledgment
    retention_years: 7
    classification: RESTRICTED
  - name: hands_on_lab_completion_certificate
    retention_years: 7
    classification: RESTRICTED
  - name: usage_competency_assessment
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Operational Usage Training Completion
    target: defined_by_governance_committee
  - name: Acceptable Use Violation Rate
    target: defined_by_governance_committee
  - name: Output Verification Habit Adoption
    target: defined_by_governance_committee

governance:
  policy_owner: Operational AI Usage Training Program Director
  review_cycle: quarterly
  related_domain: operational_literacy

related_files:
  - cybersecurity_ai_awareness.yaml
  - human_oversight_training.yaml
  - incident_response_literacy.yaml
  - operational_ai_usage_training.yaml

ontology_relationships:
  is_a: "operational_ai_usage_training_governance_infrastructure"
  part_of: "ai_literacy_operational_literacy_framework"
  governed_by: literacy_governance.yaml
