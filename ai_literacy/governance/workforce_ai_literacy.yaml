metadata:
  document_id: AL-GOV-WAL-001
  title: Workforce AI Literacy
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: workforce_ai_literacy
  domain_authority: governance
  focus: enterprise workforce literacy policy, universal baseline, workforce coverage, inclusion
  purpose:
    >
      Govern enterprise-wide workforce AI literacy policy establishing universal baseline literacy
      requirements, workforce coverage targets, inclusion of contractors and temporary workers, and
      organizational literacy culture expectations.
  scope:
    >
      All workforce AI literacy activities governed by Workforce AI Literacy within the governance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic workforce_ai_literacy controls for AI literacy governance
    - Enable automated workforce_ai_literacy verification and scoring
    - Maintain audit-grade traceability for all workforce_ai_literacy activities
    - Support regulatory inspection of workforce_ai_literacy evidence
    - Deliver measurable workforce_ai_literacy outcomes aligned with EU AI Act Article 4

definitions:
  workforce_ai_literacy_domain:
    >
    The Workforce AI Literacy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  workforce_ai_literacy_evidence:
    >
    Machine-readable records demonstrating adherence to Workforce AI Literacy
    requirements across applicable regulatory frameworks.
  workforce_ai_literacy_artifact:
    >
    Any documented output generated by Workforce AI Literacy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - workforce_ai_literacy_owner
  - workforce_ai_literacy_analyst
  - workforce_ai_literacy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Workforce AI Literacy controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: workforce_ai_literacy_taxonomy
  workforce_segment:
    - permanent_employee
    - contractor
    - temporary_worker
    - intern
    - partner_personnel
  baseline_requirement:
    - ai_awareness_fundamentals
    - responsible_use_policy
    - escalation_basics
    - data_handling_basics
  coverage_metric:
    - headcount_coverage
    - role_coverage
    - geography_coverage
    - segment_coverage
  culture_indicator:
    - voluntary_engagement
    - peer_advocacy
    - incident_reporting_culture
    - continuous_learning_adoption

controls:
  preventive:
    - universal_baseline_literacy_mandatory_for_all_ai_exposed_workers
    - contractor_literacy_verification_before_access
    - workforce_coverage_target_minimum_95_percent
  detective:
    - workforce_coverage_target_minimum_95_percent
    - annual_workforce_literacy_census
  corrective:
    - annual_workforce_literacy_census
    - inclusion_of_all_workforce_segments_in_policy

workflow:
  phases:
    - phase: policy_establishment
      steps:
        - define_universal_baseline_requirements
        - set_coverage_targets_by_segment
        - communicate_workforce_literacy_policy
    - phase: coverage_execution
      steps:
        - identify_ai_exposed_workforce_population
        - deliver_baseline_literacy_at_scale
        - track_coverage_by_segment_and_geography
    - phase: culture_building
      steps:
        - promote_continuous_learning_culture
        - recognize_literacy_champions
        - integrate_literacy_into_onboarding
    - phase: assurance
      steps:
        - conduct_workforce_literacy_census
        - report_coverage_gaps
        - remediate_uncovered_populations

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: workforce_ai_literacy
    evidence_artifact: workforce_literacy_policy
  iso_42001_competence:
    control_scope: workforce_ai_literacy
    evidence_artifact: contractor_literacy_verification

reporting_requirements:
  - workforce_literacy_coverage_dashboard
  - segment_gap_analysis
  - organizational_literacy_culture_index

evidence_requirements:
  - workforce_literacy_policy
  - coverage_census_report
  - segment_completion_records
  - contractor_literacy_verification

metrics:
  workforce_literacy_coverage_rate:
    type: gauge
    domain: workforce_ai_literacy
  baseline_completion_by_segment:
    type: gauge
    domain: workforce_ai_literacy
  time_to_baseline_onboarding_days:
    type: gauge
    domain: workforce_ai_literacy
  voluntary_advanced_literacy_uptake:
    type: gauge
    domain: workforce_ai_literacy

artifacts:
  - name: workforce_literacy_policy
    retention_years: 7
    classification: RESTRICTED
  - name: coverage_census_report
    retention_years: 7
    classification: RESTRICTED
  - name: segment_completion_records
    retention_years: 7
    classification: RESTRICTED
  - name: contractor_literacy_verification
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Workforce Literacy Coverage Rate
    target: defined_by_governance_committee
  - name: Baseline Completion By Segment
    target: defined_by_governance_committee
  - name: Time To Baseline Onboarding Days
    target: defined_by_governance_committee

governance:
  policy_owner: Workforce AI Literacy Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "workforce_ai_literacy_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
