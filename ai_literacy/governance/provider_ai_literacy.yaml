metadata:
  document_id: AL-GOV-PAL-001
  title: Provider AI Literacy
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: provider_ai_literacy
  domain_authority: governance
  focus: provider obligations, provider workforce literacy, provider accountability, design and development literacy
  purpose:
    >
      Govern provider-specific AI literacy obligations ensuring provider workforce demonstrates competence
      in AI system design, development, testing, documentation, and quality management aligned with EU AI
      Act provider responsibilities under Articles 16 and 17.
  scope:
    >
      All workforce AI literacy activities governed by Provider AI Literacy within the governance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic provider_ai_literacy controls for AI literacy governance
    - Enable automated provider_ai_literacy verification and scoring
    - Maintain audit-grade traceability for all provider_ai_literacy activities
    - Support regulatory inspection of provider_ai_literacy evidence
    - Deliver measurable provider_ai_literacy outcomes aligned with EU AI Act Article 4

definitions:
  provider_ai_literacy_domain:
    >
    The Provider AI Literacy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  provider_ai_literacy_evidence:
    >
    Machine-readable records demonstrating adherence to Provider AI Literacy
    requirements across applicable regulatory frameworks.
  provider_ai_literacy_artifact:
    >
    Any documented output generated by Provider AI Literacy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - provider_ai_literacy_owner
  - provider_ai_literacy_analyst
  - provider_ai_literacy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 16 - Provider Obligations"
      - "Article 17 - Quality Management"
      - "Article 4 - AI Literacy"
    requirements:
      >
      Provider AI Literacy controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: provider_ai_literacy_taxonomy
  provider_role:
    - ai_developer
    - model_trainer
    - qa_engineer
    - technical_documentation_author
    - conformity_assessor
  provider_competency:
    - system_design_literacy
    - data_governance_literacy
    - testing_and_validation_literacy
    - documentation_literacy
    - qms_literacy
  provider_obligation:
    - technical_documentation
    - quality_management
    - post_market_monitoring
    - serious_incident_reporting
  accountability_level:
    - individual_contributor
    - team_lead
    - provider_management
    - authorized_representative

controls:
  preventive:
    - provider_role_literacy_mandatory_before_system_development_access
    - technical_documentation_author_certification_required
    - qms_literacy_for_quality_management_personnel
  detective:
    - qms_literacy_for_quality_management_personnel
    - provider_literacy_evidence_in_conformity_assessment_file
  corrective:
    - provider_literacy_evidence_in_conformity_assessment_file
    - provider_workforce_literacy_annual_attestation

workflow:
  phases:
    - phase: provider_profiling
      steps:
        - identify_provider_roles_and_obligations
        - map_competencies_to_eu_ai_act_provider_duties
        - define_provider_literacy_requirements
    - phase: provider_training
      steps:
        - deliver_provider_specific_literacy_modules
        - assess_provider_competency
        - certify_provider_personnel
    - phase: accountability
      steps:
        - assign_provider_accountability_chain
        - maintain_provider_literacy_register
        - include_in_conformity_evidence
    - phase: assurance
      steps:
        - audit_provider_literacy_compliance
        - remediate_gaps_before_product_release
        - report_to_provider_management

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: provider_ai_literacy
    evidence_artifact: provider_literacy_requirement_matrix
  iso_42001_competence:
    control_scope: provider_ai_literacy
    evidence_artifact: conformity_assessment_literacy_annex

reporting_requirements:
  - provider_ai_literacy_compliance_report
  - provider_role_coverage_matrix
  - provider_management_accountability_brief

evidence_requirements:
  - provider_literacy_requirement_matrix
  - provider_competency_assessment_record
  - provider_workforce_attestation
  - conformity_assessment_literacy_annex

metrics:
  provider_literacy_completion_rate:
    type: gauge
    domain: provider_ai_literacy
  provider_certification_coverage:
    type: gauge
    domain: provider_ai_literacy
  provider_literacy_audit_finding_count:
    type: gauge
    domain: provider_ai_literacy
  conformity_file_literacy_evidence_completeness:
    type: gauge
    domain: provider_ai_literacy

artifacts:
  - name: provider_literacy_requirement_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: provider_competency_assessment_record
    retention_years: 7
    classification: RESTRICTED
  - name: provider_workforce_attestation
    retention_years: 7
    classification: RESTRICTED
  - name: conformity_assessment_literacy_annex
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Provider Literacy Completion Rate
    target: defined_by_governance_committee
  - name: Provider Certification Coverage
    target: defined_by_governance_committee
  - name: Provider Literacy Audit Finding Count
    target: defined_by_governance_committee

governance:
  policy_owner: Provider AI Literacy Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "provider_ai_literacy_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
