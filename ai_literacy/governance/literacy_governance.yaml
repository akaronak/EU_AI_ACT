metadata:
  document_id: AL-GOV-LG-001
  title: Literacy Governance
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_governance
  domain_authority: governance
  focus: governance framework, oversight structures, policy enforcement, accountability chains
  purpose:
    >
      Define enterprise AI literacy governance framework establishing oversight structures, policy
      enforcement mechanisms, accountability chains, governance committee charter, and literacy program
      decision authority.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Governance within the governance subdomain
      of enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_governance controls for AI literacy governance
    - Enable automated literacy_governance verification and scoring
    - Maintain audit-grade traceability for all literacy_governance activities
    - Support regulatory inspection of literacy_governance evidence
    - Deliver measurable literacy_governance outcomes aligned with EU AI Act Article 4

definitions:
  literacy_governance_domain:
    >
    The Literacy Governance operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  literacy_governance_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Governance
    requirements across applicable regulatory frameworks.
  literacy_governance_artifact:
    >
    Any documented output generated by Literacy Governance controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_governance_owner
  - literacy_governance_analyst
  - literacy_governance_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Governance controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 5 - Leadership"
    requirements:
      >
      Literacy Governance controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: literacy_governance_taxonomy
  governance_body:
    - literacy_governance_committee
    - program_steering_group
    - role_owners
    - compliance_liaison
  decision_authority:
    - policy_approval
    - budget_allocation
    - framework_change
    - exception_grant
  oversight_mechanism:
    - quarterly_review
    - audit
    - executive_briefing
    - regulator_coordination
  accountability_chain:
    - board
    - cao
    - program_director
    - role_owner
    - individual

controls:
  preventive:
    - literacy_governance_committee_quarterly_meeting_mandatory
    - policy_change_dual_approval_cao_and_cco
    - exception_register_publication_to_committee
  detective:
    - exception_register_publication_to_committee
    - accountability_chain_documented_and_communicated
  corrective:
    - accountability_chain_documented_and_communicated
    - governance_decision_audit_trail_immutable

workflow:
  phases:
    - phase: governance_establishment
      steps:
        - charter_literacy_governance_committee
        - define_decision_authority_matrix
        - appoint_role_owners
    - phase: policy_governance
      steps:
        - propose_policy_changes
        - committee_review_and_approval
        - communicate_and_enforce_policies
    - phase: oversight_execution
      steps:
        - conduct_quarterly_oversight_reviews
        - review_exceptions_and_risks
        - brief_executive_leadership
    - phase: accountability
      steps:
        - track_accountability_chain_compliance
        - escalate_governance_failures
        - publish_governance_effectiveness_report

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_governance
    evidence_artifact: governance_committee_charter
  iso_42001_competence:
    control_scope: literacy_governance
    evidence_artifact: policy_approval_record

reporting_requirements:
  - literacy_governance_effectiveness_report
  - exception_register
  - executive_governance_briefing

evidence_requirements:
  - governance_committee_charter
  - decision_authority_matrix
  - governance_meeting_minutes
  - policy_approval_record

metrics:
  governance_committee_attendance_rate:
    type: gauge
    domain: literacy_governance
  policy_approval_cycle_days:
    type: gauge
    domain: literacy_governance
  open_exception_count:
    type: gauge
    domain: literacy_governance
  accountability_chain_completeness:
    type: gauge
    domain: literacy_governance

artifacts:
  - name: governance_committee_charter
    retention_years: 7
    classification: RESTRICTED
  - name: decision_authority_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: governance_meeting_minutes
    retention_years: 7
    classification: RESTRICTED
  - name: policy_approval_record
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Governance Committee Attendance Rate
    target: defined_by_governance_committee
  - name: Policy Approval Cycle Days
    target: defined_by_governance_committee
  - name: Open Exception Count
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Governance Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "literacy_governance_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
