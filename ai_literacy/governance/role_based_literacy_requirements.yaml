metadata:
  document_id: AL-GOV-RBLR-001
  title: Role Based Literacy Requirements
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: role_based_literacy_requirements
  domain_authority: governance
  focus: role-specific literacy mandates, job family mapping, requirement matrices, HR integration
  purpose:
    >
      Define role-based AI literacy requirements mapping job families and individual roles to specific
      literacy competencies, training mandates, assessment thresholds, and recertification cycles
      integrated with HR role management.
  scope:
    >
      All workforce AI literacy activities governed by Role Based Literacy Requirements within the
      governance subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic role_based_literacy_requirements controls for AI literacy governance
    - Enable automated role_based_literacy_requirements verification and scoring
    - Maintain audit-grade traceability for all role_based_literacy_requirements activities
    - Support regulatory inspection of role_based_literacy_requirements evidence
    - Deliver measurable role_based_literacy_requirements outcomes aligned with EU AI Act Article 4

definitions:
  role_based_literacy_requirements_domain:
    >
    The Role Based Literacy Requirements operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  role_based_literacy_requirements_evidence:
    >
    Machine-readable records demonstrating adherence to Role Based Literacy Requirements
    requirements across applicable regulatory frameworks.
  role_based_literacy_requirements_artifact:
    >
    Any documented output generated by Role Based Literacy Requirements controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - role_based_literacy_requirements_owner
  - role_based_literacy_requirements_analyst
  - role_based_literacy_requirements_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Role Based Literacy Requirements controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 7.2 - Competence"
    requirements:
      >
      Role Based Literacy Requirements controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: role_based_literacy_requirements_taxonomy
  job_family:
    - engineering
    - product
    - legal_compliance
    - hr
    - operations
    - executive
  requirement_type:
    - mandatory_baseline
    - role_specific
    - elective_advanced
    - conditional_triggered
  requirement_element:
    - training_module
    - assessment_threshold
    - certification
    - recertification_cycle
  hr_integration:
    - job_description
    - onboarding_checklist
    - performance_review
    - promotion_gate

controls:
  preventive:
    - role_literacy_requirement_matrix_authoritative_in_hr_system
    - new_role_literacy_requirements_defined_before_posting
    - promotion_gate_literacy_verification
  detective:
    - promotion_gate_literacy_verification
    - requirement_change_impact_assessment_on_incumbent_workforce
  corrective:
    - requirement_change_impact_assessment_on_incumbent_workforce
    - annual_role_requirement_review_with_hr

workflow:
  phases:
    - phase: role_mapping
      steps:
        - catalog_job_families_and_roles
        - map_competencies_to_each_role
        - define_requirement_elements_per_role
    - phase: hr_integration
      steps:
        - embed_requirements_in_job_descriptions
        - configure_onboarding_checklists
        - wire_promotion_gates
    - phase: requirement_maintenance
      steps:
        - review_requirements_on_role_change
        - update_on_regulatory_change
        - communicate_changes_to_affected_workforce
    - phase: compliance_tracking
      steps:
        - track_role_requirement_completion
        - report_gaps_by_role
        - escalate_non_compliance_to_managers

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: role_based_literacy_requirements
    evidence_artifact: role_literacy_requirement_matrix
  iso_42001_competence:
    control_scope: role_based_literacy_requirements
    evidence_artifact: requirement_change_impact_assessment

reporting_requirements:
  - role_based_literacy_compliance_matrix
  - job_family_gap_heatmap
  - hr_integration_status_report

evidence_requirements:
  - role_literacy_requirement_matrix
  - hr_integration_configuration
  - role_compliance_status_record
  - requirement_change_impact_assessment

metrics:
  role_requirement_coverage_completeness:
    type: gauge
    domain: role_based_literacy_requirements
  role_compliance_rate_by_family:
    type: gauge
    domain: role_based_literacy_requirements
  promotion_gate_literacy_pass_rate:
    type: gauge
    domain: role_based_literacy_requirements
  requirement_update_communication_sla:
    type: gauge
    domain: role_based_literacy_requirements

artifacts:
  - name: role_literacy_requirement_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: hr_integration_configuration
    retention_years: 7
    classification: RESTRICTED
  - name: role_compliance_status_record
    retention_years: 7
    classification: RESTRICTED
  - name: requirement_change_impact_assessment
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Role Requirement Coverage Completeness
    target: defined_by_governance_committee
  - name: Role Compliance Rate By Family
    target: defined_by_governance_committee
  - name: Promotion Gate Literacy Pass Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Role Based Literacy Requirements Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "role_based_literacy_requirements_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
