metadata:
  document_id: AL-GOV-DAL-001
  title: Deployer AI Literacy
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: deployer_ai_literacy
  domain_authority: governance
  focus: deployer obligations, operational deployment literacy, human oversight, monitoring awareness
  purpose:
    >
      Govern deployer-specific AI literacy ensuring personnel deploying and operating AI systems
      understand deployer obligations under Article 26 including human oversight, input data quality,
      monitoring, and incident reporting literacy.
  scope:
    >
      All workforce AI literacy activities governed by Deployer AI Literacy within the governance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic deployer_ai_literacy controls for AI literacy governance
    - Enable automated deployer_ai_literacy verification and scoring
    - Maintain audit-grade traceability for all deployer_ai_literacy activities
    - Support regulatory inspection of deployer_ai_literacy evidence
    - Deliver measurable deployer_ai_literacy outcomes aligned with EU AI Act Article 4

definitions:
  deployer_ai_literacy_domain:
    >
    The Deployer AI Literacy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  deployer_ai_literacy_evidence:
    >
    Machine-readable records demonstrating adherence to Deployer AI Literacy
    requirements across applicable regulatory frameworks.
  deployer_ai_literacy_artifact:
    >
    Any documented output generated by Deployer AI Literacy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - deployer_ai_literacy_owner
  - deployer_ai_literacy_analyst
  - deployer_ai_literacy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 26 - Deployer Obligations"
      - "Article 14 - Human Oversight"
      - "Article 4 - AI Literacy"
    requirements:
      >
      Deployer AI Literacy controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: deployer_ai_literacy_taxonomy
  deployer_role:
    - system_operator
    - oversight_officer
    - monitoring_analyst
    - incident_reporter
    - business_process_owner
  deployer_competency:
    - operational_oversight_literacy
    - input_data_quality_awareness
    - monitoring_and_logging_literacy
    - incident_recognition_literacy
    - fundamental_rights_impact_awareness
  deployer_obligation:
    - human_oversight
    - input_data_relevance
    - monitoring_obligations
    - serious_incident_reporting
    - worker_information
  deployment_context:
    - high_risk
    - limited_risk
    - general_purpose
    - internal_use

controls:
  preventive:
    - deployer_literacy_before_production_deployment_authorization
    - human_oversight_officer_certification_mandatory
    - monitoring_literacy_for_all_system_operators
  detective:
    - monitoring_literacy_for_all_system_operators
    - incident_reporting_literacy_verification
  corrective:
    - incident_reporting_literacy_verification
    - deployer_literacy_refresh_on_system_change

workflow:
  phases:
    - phase: deployer_requirements
      steps:
        - map_deployer_obligations_to_roles
        - define_context_specific_literacy
        - publish_deployer_literacy_playbook
    - phase: pre_deployment
      steps:
        - verify_deployer_literacy_before_go_live
        - certify_oversight_officers
        - document_literacy_in_deployment_record
    - phase: operational_assurance
      steps:
        - monitor_deployer_literacy_currency
        - retrain_on_obligation_change
        - audit_deployer_compliance
    - phase: incident_linkage
      steps:
        - verify_incident_reporter_literacy_at_event
        - include_literacy_in_post_incident_review
        - remediate_literacy_gaps_from_incidents

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: deployer_ai_literacy
    evidence_artifact: deployer_literacy_requirement_matrix
  iso_42001_competence:
    control_scope: deployer_ai_literacy
    evidence_artifact: deployer_obligation_acknowledgment

reporting_requirements:
  - deployer_ai_literacy_status_report
  - deployment_literacy_gate_register
  - deployer_obligation_compliance_dashboard

evidence_requirements:
  - deployer_literacy_requirement_matrix
  - pre_deployment_literacy_verification
  - oversight_officer_certificate
  - deployer_obligation_acknowledgment

metrics:
  deployer_literacy_verification_rate:
    type: gauge
    domain: deployer_ai_literacy
  oversight_officer_certification_coverage:
    type: gauge
    domain: deployer_ai_literacy
  deployer_incident_reporting_literacy_score:
    type: gauge
    domain: deployer_ai_literacy
  pre_deployment_literacy_gate_pass_rate:
    type: gauge
    domain: deployer_ai_literacy

artifacts:
  - name: deployer_literacy_requirement_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: pre_deployment_literacy_verification
    retention_years: 7
    classification: RESTRICTED
  - name: oversight_officer_certificate
    retention_years: 7
    classification: RESTRICTED
  - name: deployer_obligation_acknowledgment
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Deployer Literacy Verification Rate
    target: defined_by_governance_committee
  - name: Oversight Officer Certification Coverage
    target: defined_by_governance_committee
  - name: Deployer Incident Reporting Literacy Score
    target: defined_by_governance_committee

governance:
  policy_owner: Deployer AI Literacy Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "deployer_ai_literacy_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
