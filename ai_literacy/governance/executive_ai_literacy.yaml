metadata:
  document_id: AL-GOV-EAL-001
  title: Executive AI Literacy
  domain: AI Literacy / Governance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: executive_ai_literacy
  domain_authority: governance
  focus: board and C-suite literacy, strategic AI governance, accountability at leadership level
  purpose:
    >
      Define executive and board-level AI literacy requirements ensuring leadership demonstrates strategic
      AI governance understanding, risk oversight capability, and accountability for organizational AI
      literacy program outcomes.
  scope:
    >
      All workforce AI literacy activities governed by Executive AI Literacy within the governance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic executive_ai_literacy controls for AI literacy governance
    - Enable automated executive_ai_literacy verification and scoring
    - Maintain audit-grade traceability for all executive_ai_literacy activities
    - Support regulatory inspection of executive_ai_literacy evidence
    - Deliver measurable executive_ai_literacy outcomes aligned with EU AI Act Article 4

definitions:
  executive_ai_literacy_domain:
    >
    The Executive AI Literacy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy governance.
  executive_ai_literacy_evidence:
    >
    Machine-readable records demonstrating adherence to Executive AI Literacy
    requirements across applicable regulatory frameworks.
  executive_ai_literacy_artifact:
    >
    Any documented output generated by Executive AI Literacy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Governance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - executive_ai_literacy_owner
  - executive_ai_literacy_analyst
  - executive_ai_literacy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Executive AI Literacy controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 5.1 - Leadership Commitment"
    requirements:
      >
      Executive AI Literacy controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: executive_ai_literacy_taxonomy
  executive_role:
    - board_director
    - ceo
    - cao
    - cro
    - general_counsel
  executive_competency:
    - strategic_ai_risk_oversight
    - regulatory_landscape_awareness
    - ai_governance_accountability
    - investment_and_resource_decisions
    - crisis_and_incident_oversight
  governance_participation:
    - literacy_program_sponsor
    - committee_chair
    - budget_approver
    - policy_signatory
  literacy_format:
    - executive_briefing
    - board_workshop
    - strategic_simulation
    - regulatory_update_session

controls:
  preventive:
    - board_ai_literacy_briefing_minimum_annual
    - cao_literacy_certification_before_appointment
    - executive_literacy_attestation_in_annual_report
  detective:
    - executive_literacy_attestation_in_annual_report
    - board_oversight_of_literacy_program_quarterly
  corrective:
    - board_oversight_of_literacy_program_quarterly
    - executive_literacy_independent_of_operational_training

workflow:
  phases:
    - phase: executive_profiling
      steps:
        - define_executive_competency_expectations
        - assess_current_executive_literacy_baseline
        - identify_board_and_c_suite_gaps
    - phase: executive_development
      steps:
        - deliver_executive_briefings_and_workshops
        - conduct_strategic_ai_governance_simulations
        - provide_regulatory_update_sessions
    - phase: accountability
      steps:
        - executive_attestation_of_literacy_program_oversight
        - board_review_of_literacy_program_effectiveness
        - document_executive_governance_participation
    - phase: assurance
      steps:
        - independent_assessment_of_executive_literacy
        - report_to_audit_committee
        - remediate_critical_executive_gaps

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: executive_ai_literacy
    evidence_artifact: executive_literacy_briefing_record
  iso_42001_competence:
    control_scope: executive_ai_literacy
    evidence_artifact: strategic_oversight_simulation_results

reporting_requirements:
  - executive_ai_literacy_status_report
  - board_oversight_summary
  - executive_accountability_attestation_register

evidence_requirements:
  - executive_literacy_briefing_record
  - board_workshop_attendance
  - executive_attestation_statement
  - strategic_oversight_simulation_results

metrics:
  executive_literacy_completion_rate:
    type: gauge
    domain: executive_ai_literacy
  board_briefing_attendance:
    type: gauge
    domain: executive_ai_literacy
  executive_attestation_compliance:
    type: gauge
    domain: executive_ai_literacy
  strategic_oversight_simulation_score:
    type: gauge
    domain: executive_ai_literacy

artifacts:
  - name: executive_literacy_briefing_record
    retention_years: 7
    classification: RESTRICTED
  - name: board_workshop_attendance
    retention_years: 7
    classification: RESTRICTED
  - name: executive_attestation_statement
    retention_years: 7
    classification: RESTRICTED
  - name: strategic_oversight_simulation_results
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Executive Literacy Completion Rate
    target: defined_by_governance_committee
  - name: Board Briefing Attendance
    target: defined_by_governance_committee
  - name: Executive Attestation Compliance
    target: defined_by_governance_committee

governance:
  policy_owner: Executive AI Literacy Program Director
  review_cycle: quarterly
  related_domain: governance

related_files:
  - literacy_governance.yaml
  - provider_ai_literacy.yaml
  - deployer_ai_literacy.yaml
  - executive_ai_literacy.yaml

ontology_relationships:
  is_a: "executive_ai_literacy_governance_infrastructure"
  part_of: "ai_literacy_governance_framework"
  governed_by: literacy_governance.yaml
