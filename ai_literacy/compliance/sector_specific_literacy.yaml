metadata:
  document_id: AL-COMP-SSL-001
  title: Sector Specific Literacy
  domain: AI Literacy / Compliance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: sector_specific_literacy
  domain_authority: compliance
  focus: vertical sector overlays, healthcare finance transport literacy, sector regulator alignment
  purpose:
    >
      Define sector-specific AI literacy overlays for regulated verticals including healthcare, financial
      services, transport, and public sector ensuring workforce literacy addresses sector regulator
      expectations beyond baseline EU AI Act requirements.
  scope:
    >
      All workforce AI literacy activities governed by Sector Specific Literacy within the compliance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic sector_specific_literacy controls for AI literacy governance
    - Enable automated sector_specific_literacy verification and scoring
    - Maintain audit-grade traceability for all sector_specific_literacy activities
    - Support regulatory inspection of sector_specific_literacy evidence
    - Deliver measurable sector_specific_literacy outcomes aligned with EU AI Act Article 4

definitions:
  sector_specific_literacy_domain:
    >
    The Sector Specific Literacy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy compliance.
  sector_specific_literacy_evidence:
    >
    Machine-readable records demonstrating adherence to Sector Specific Literacy
    requirements across applicable regulatory frameworks.
  sector_specific_literacy_artifact:
    >
    Any documented output generated by Sector Specific Literacy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Compliance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - sector_specific_literacy_owner
  - sector_specific_literacy_analyst
  - sector_specific_literacy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Annex III - High-Risk Systems"
    requirements:
      >
      Sector Specific Literacy controls must satisfy EU_AI_ACT literacy obligations.
  sector_specific:
    references:
      - "MDR, EBA, EASA sector guidance"
    requirements:
      >
      Sector Specific Literacy controls must satisfy SECTOR_SPECIFIC literacy obligations.

taxonomy:
  root: sector_specific_literacy_taxonomy
  sector:
    - healthcare
    - financial_services
    - transport
    - public_sector
    - education
    - energy
  sector_regulator:
    - mdr_ivdr
    - eba_esma
    - easa
    - national_dpa
    - sector_authority
  overlay_type:
    - mandatory_supplement
    - recommended_enhancement
    - role_specific_deep_dive
  sector_competency:
    - clinical_ai_oversight
    - algorithmic_trading_awareness
    - autonomous_system_safety
    - public_administration_fairness

controls:
  preventive:
    - sector_overlay_mandatory_for_regulated_vertical_roles
    - sector_regulator_content_review_before_deployment
    - sector_specific_assessment_instruments_certified
  detective:
    - sector_specific_assessment_instruments_certified
    - sector_literacy_evidence_for_sector_audit
  corrective:
    - sector_literacy_evidence_for_sector_audit
    - sector_overlay_update_on_regulator_guidance_change

workflow:
  phases:
    - phase: sector_profiling
      steps:
        - identify_sector_regulator_literacy_expectations
        - define_sector_competency_overlays
        - map_to_baseline_literacy_framework
    - phase: overlay_development
      steps:
        - author_sector_specific_literacy_modules
        - obtain_regulator_or_sme_review
        - certify_sector_assessment_instruments
    - phase: delivery
      steps:
        - assign_sector_overlay_to_eligible_roles
        - deliver_and_assess_sector_literacy
        - record_sector_compliance_evidence
    - phase: sector_reporting
      steps:
        - report_sector_literacy_compliance_to_regulator
        - update_overlay_on_guidance_change
        - benchmark_against_sector_peers

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: sector_specific_literacy
    evidence_artifact: sector_literacy_overlay_specification
  iso_42001_competence:
    control_scope: sector_specific_literacy
    evidence_artifact: sector_compliance_evidence_pack

reporting_requirements:
  - sector_literacy_compliance_report
  - sector_overlay_coverage_matrix
  - regulator_sector_submission_package

evidence_requirements:
  - sector_literacy_overlay_specification
  - sector_regulator_review_attestation
  - sector_assessment_completion_record
  - sector_compliance_evidence_pack

metrics:
  sector_overlay_completion_rate:
    type: gauge
    domain: sector_specific_literacy
  sector_regulator_audit_readiness_score:
    type: gauge
    domain: sector_specific_literacy
  sector_specific_assessment_pass_rate:
    type: gauge
    domain: sector_specific_literacy
  sector_overlay_currency_index:
    type: gauge
    domain: sector_specific_literacy

artifacts:
  - name: sector_literacy_overlay_specification
    retention_years: 7
    classification: RESTRICTED
  - name: sector_regulator_review_attestation
    retention_years: 7
    classification: RESTRICTED
  - name: sector_assessment_completion_record
    retention_years: 7
    classification: RESTRICTED
  - name: sector_compliance_evidence_pack
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Sector Overlay Completion Rate
    target: defined_by_governance_committee
  - name: Sector Regulator Audit Readiness Score
    target: defined_by_governance_committee
  - name: Sector Specific Assessment Pass Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Sector Specific Literacy Program Director
  review_cycle: quarterly
  related_domain: compliance

related_files:
  - eu_ai_act_literacy_alignment.yaml
  - gdpr_literacy_alignment.yaml
  - iso42001_literacy_alignment.yaml
  - nist_ai_rmf_literacy_alignment.yaml

ontology_relationships:
  is_a: "sector_specific_literacy_governance_infrastructure"
  part_of: "ai_literacy_compliance_framework"
  governed_by: literacy_governance.yaml
