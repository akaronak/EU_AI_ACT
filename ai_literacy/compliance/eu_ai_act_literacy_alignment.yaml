metadata:
  document_id: AL-COMP-EUAA-001
  title: EU AI Act Literacy Alignment
  domain: AI Literacy / Compliance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: eu_ai_act_literacy_alignment
  domain_authority: compliance
  focus: Article 4 conformity, provider and deployer literacy obligations, regulatory mapping
  purpose:
    >
      Map enterprise AI literacy program controls to EU AI Act Article 4 obligations ensuring provider and
      deployer workforce literacy requirements are demonstrably met with audit-grade conformity evidence.
  scope:
    >
      All workforce AI literacy activities governed by EU AI Act Literacy Alignment within the compliance
      subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic eu_ai_act_literacy_alignment controls for AI literacy governance
    - Enable automated eu_ai_act_literacy_alignment verification and scoring
    - Maintain audit-grade traceability for all eu_ai_act_literacy_alignment activities
    - Support regulatory inspection of eu_ai_act_literacy_alignment evidence
    - Deliver measurable eu_ai_act_literacy_alignment outcomes aligned with EU AI Act Article 4

definitions:
  eu_ai_act_literacy_alignment_domain:
    >
    The EU AI Act Literacy Alignment operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy compliance.
  eu_ai_act_literacy_alignment_evidence:
    >
    Machine-readable records demonstrating adherence to EU AI Act Literacy Alignment
    requirements across applicable regulatory frameworks.
  eu_ai_act_literacy_alignment_artifact:
    >
    Any documented output generated by EU AI Act Literacy Alignment controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Compliance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - eu_ai_act_literacy_alignment_owner
  - eu_ai_act_literacy_alignment_analyst
  - eu_ai_act_literacy_alignment_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
      - "Article 16 - Provider Obligations"
      - "Article 26 - Deployer Obligations"
    requirements:
      >
      EU AI Act Literacy Alignment controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: eu_ai_act_literacy_alignment_taxonomy
  obligation_type:
    - provider_literacy
    - deployer_literacy
    - importer_awareness
    - distributor_awareness
  conformity_element:
    - competence_evidence
    - training_records
    - role_coverage
    - ongoing_assurance
  alignment_status:
    - fully_aligned
    - partially_aligned
    - gap_identified
    - remediation_in_progress
  article_reference:
    - article_4
    - article_14
    - article_26

controls:
  preventive:
    - article_4_obligation_register_maintained
    - role_to_obligation_mapping_verified_quarterly
    - conformity_gap_escalation_to_legal_within_48_hours
  detective:
    - conformity_gap_escalation_to_legal_within_48_hours
    - literacy_evidence_pack_for_notified_body_inspection
  corrective:
    - literacy_evidence_pack_for_notified_body_inspection
    - regulatory_change_impact_assessment_on_literacy_program

workflow:
  phases:
    - phase: obligation_mapping
      steps:
        - catalog_article_4_sub_obligations
        - map_literacy_controls_to_obligations
        - identify_coverage_gaps
    - phase: conformity_assessment
      steps:
        - evaluate_evidence_against_obligation_criteria
        - score_alignment_per_obligation
        - document_conformity_gaps
    - phase: remediation
      steps:
        - assign_gap_remediation_owners
        - implement_additional_controls
        - re_assess_conformity
    - phase: attestation
      steps:
        - generate_eu_ai_act_literacy_conformity_statement
        - submit_to_compliance_committee
        - archive_for_regulatory_inspection

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: eu_ai_act_literacy_alignment
    evidence_artifact: article_4_obligation_mapping_matrix
  iso_42001_competence:
    control_scope: eu_ai_act_literacy_alignment
    evidence_artifact: regulatory_inspection_evidence_pack

reporting_requirements:
  - eu_ai_act_literacy_conformity_report
  - obligation_gap_register
  - regulatory_alignment_dashboard

evidence_requirements:
  - article_4_obligation_mapping_matrix
  - conformity_assessment_record
  - literacy_conformity_attestation
  - regulatory_inspection_evidence_pack

metrics:
  article_4_conformity_score:
    type: gauge
    domain: eu_ai_act_literacy_alignment
  obligation_coverage_rate:
    type: gauge
    domain: eu_ai_act_literacy_alignment
  open_conformity_gap_count:
    type: gauge
    domain: eu_ai_act_literacy_alignment
  regulatory_change_impact_resolution_days:
    type: gauge
    domain: eu_ai_act_literacy_alignment

artifacts:
  - name: article_4_obligation_mapping_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: conformity_assessment_record
    retention_years: 7
    classification: RESTRICTED
  - name: literacy_conformity_attestation
    retention_years: 7
    classification: RESTRICTED
  - name: regulatory_inspection_evidence_pack
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Article 4 Conformity Score
    target: defined_by_governance_committee
  - name: Obligation Coverage Rate
    target: defined_by_governance_committee
  - name: Open Conformity Gap Count
    target: defined_by_governance_committee

governance:
  policy_owner: EU AI Act Literacy Alignment Program Director
  review_cycle: quarterly
  related_domain: compliance

related_files:
  - eu_ai_act_literacy_alignment.yaml
  - gdpr_literacy_alignment.yaml
  - iso42001_literacy_alignment.yaml
  - nist_ai_rmf_literacy_alignment.yaml

ontology_relationships:
  is_a: "eu_ai_act_literacy_alignment_governance_infrastructure"
  part_of: "ai_literacy_compliance_framework"
  governed_by: literacy_governance.yaml
