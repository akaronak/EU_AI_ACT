metadata:
  document_id: AL-COMP-NIST-001
  title: NIST AI RMF Literacy Alignment
  domain: AI Literacy / Compliance
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: nist_ai_rmf_literacy_alignment
  domain_authority: compliance
  focus: GOVERN function literacy, MAP/MEASURE/MANAGE workforce capability, RMF crosswalk
  purpose:
    >
      Map AI literacy program to NIST AI Risk Management Framework GOVERN, MAP, MEASURE, and MANAGE
      functions ensuring workforce literacy supports organizational AI risk management maturity.
  scope:
    >
      All workforce AI literacy activities governed by NIST AI RMF Literacy Alignment within the
      compliance subdomain of enterprise AI literacy operations.
  objectives:
    - Establish deterministic nist_ai_rmf_literacy_alignment controls for AI literacy governance
    - Enable automated nist_ai_rmf_literacy_alignment verification and scoring
    - Maintain audit-grade traceability for all nist_ai_rmf_literacy_alignment activities
    - Support regulatory inspection of nist_ai_rmf_literacy_alignment evidence
    - Deliver measurable nist_ai_rmf_literacy_alignment outcomes aligned with EU AI Act Article 4

definitions:
  nist_ai_rmf_literacy_alignment_domain:
    >
    The NIST AI RMF Literacy Alignment operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy compliance.
  nist_ai_rmf_literacy_alignment_evidence:
    >
    Machine-readable records demonstrating adherence to NIST AI RMF Literacy Alignment
    requirements across applicable regulatory frameworks.
  nist_ai_rmf_literacy_alignment_artifact:
    >
    Any documented output generated by NIST AI RMF Literacy Alignment controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Compliance Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - nist_ai_rmf_literacy_alignment_owner
  - nist_ai_rmf_literacy_alignment_analyst
  - nist_ai_rmf_literacy_alignment_auditor
  - compliance_officer

regulatory_alignment:
  nist_ai_rmf:
    references:
      - "GOVERN 1.1"
      - "MAP 1.1"
      - "MEASURE 2.1"
      - "MANAGE 3.1"
    requirements:
      >
      NIST AI RMF Literacy Alignment controls must satisfy NIST_AI_RMF literacy obligations.

taxonomy:
  root: nist_ai_rmf_literacy_alignment_taxonomy
  rmf_function:
    - govern
    - map
    - measure
    - manage
  literacy_outcome:
    - risk_awareness
    - governance_participation
    - measurement_literacy
    - incident_response_readiness
  maturity_subcategory:
    - govern_1
    - map_1
    - measure_2
    - manage_3
  alignment_evidence:
    - training_completion
    - competency_demonstration
    - governance_participation_record

controls:
  preventive:
    - rmf_function_to_literacy_module_crosswalk
    - govern_function_literacy_mandatory_for_leadership
    - map_function_literacy_for_risk_identifiers
  detective:
    - map_function_literacy_for_risk_identifiers
    - measure_function_literacy_for_evaluators
  corrective:
    - measure_function_literacy_for_evaluators
    - manage_function_literacy_for_incident_responders

workflow:
  phases:
    - phase: rmf_crosswalk
      steps:
        - map_nist_subcategories_to_literacy_modules
        - define_competency_per_rmf_function
        - publish_rmf_literacy_playbook
    - phase: capability_building
      steps:
        - deliver_function_specific_literacy
        - assess_rmf_competency
        - track_maturity_contribution
    - phase: alignment_verification
      steps:
        - score_literacy_contribution_to_rmf_maturity
        - identify_rmf_literacy_gaps
        - prioritize_remediation_by_risk
    - phase: reporting
      steps:
        - publish_rmf_literacy_maturity_report
        - feed_into_enterprise_ai_rmf_assessment
        - update_crosswalk_on_rmf_revision

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: nist_ai_rmf_literacy_alignment
    evidence_artifact: nist_rmf_literacy_crosswalk
  iso_42001_competence:
    control_scope: nist_ai_rmf_literacy_alignment
    evidence_artifact: govern_function_leadership_attestation

reporting_requirements:
  - nist_rmf_literacy_alignment_report
  - function_coverage_heatmap
  - rmf_maturity_literacy_dashboard

evidence_requirements:
  - nist_rmf_literacy_crosswalk
  - function_specific_competency_record
  - rmf_maturity_literacy_assessment
  - govern_function_leadership_attestation

metrics:
  rmf_function_literacy_coverage:
    type: gauge
    domain: nist_ai_rmf_literacy_alignment
  govern_literacy_leadership_completion:
    type: gauge
    domain: nist_ai_rmf_literacy_alignment
  rmf_maturity_literacy_contribution_score:
    type: gauge
    domain: nist_ai_rmf_literacy_alignment
  rmf_literacy_gap_severity_index:
    type: gauge
    domain: nist_ai_rmf_literacy_alignment

artifacts:
  - name: nist_rmf_literacy_crosswalk
    retention_years: 7
    classification: RESTRICTED
  - name: function_specific_competency_record
    retention_years: 7
    classification: RESTRICTED
  - name: rmf_maturity_literacy_assessment
    retention_years: 7
    classification: RESTRICTED
  - name: govern_function_leadership_attestation
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Rmf Function Literacy Coverage
    target: defined_by_governance_committee
  - name: Govern Literacy Leadership Completion
    target: defined_by_governance_committee
  - name: Rmf Maturity Literacy Contribution Score
    target: defined_by_governance_committee

governance:
  policy_owner: NIST AI RMF Literacy Alignment Program Director
  review_cycle: quarterly
  related_domain: compliance

related_files:
  - eu_ai_act_literacy_alignment.yaml
  - gdpr_literacy_alignment.yaml
  - iso42001_literacy_alignment.yaml
  - nist_ai_rmf_literacy_alignment.yaml

ontology_relationships:
  is_a: "nist_ai_rmf_literacy_alignment_governance_infrastructure"
  part_of: "ai_literacy_compliance_framework"
  governed_by: literacy_governance.yaml
