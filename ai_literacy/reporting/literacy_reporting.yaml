metadata:
  document_id: AL-REP-LR-001
  title: Literacy Reporting
  domain: AI Literacy / Reporting
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_reporting
  domain_authority: reporting
  focus: operational literacy reports, completion analytics, trend reporting, data exports
  purpose:
    >
      Define operational literacy reporting infrastructure producing completion analytics, trend reports,
      role coverage summaries, and standardized data exports for downstream assurance and compliance
      reporting.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Reporting within the reporting subdomain
      of enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_reporting controls for AI literacy governance
    - Enable automated literacy_reporting verification and scoring
    - Maintain audit-grade traceability for all literacy_reporting activities
    - Support regulatory inspection of literacy_reporting evidence
    - Deliver measurable literacy_reporting outcomes aligned with EU AI Act Article 4

definitions:
  literacy_reporting_domain:
    >
    The Literacy Reporting operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy reporting.
  literacy_reporting_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Reporting
    requirements across applicable regulatory frameworks.
  literacy_reporting_artifact:
    >
    Any documented output generated by Literacy Reporting controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Reporting Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_reporting_owner
  - literacy_reporting_analyst
  - literacy_reporting_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Reporting controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 9.1 - Monitoring"
    requirements:
      >
      Literacy Reporting controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: literacy_reporting_taxonomy
  report_type:
    - completion_summary
    - coverage_analysis
    - trend_report
    - exception_report
    - data_export
  report_audience:
    - program_manager
    - hr
    - compliance
    - business_unit_lead
  report_frequency:
    - daily
    - weekly
    - monthly
    - quarterly
    - on_demand
  report_format:
    - dashboard
    - pdf
    - csv_export
    - api_feed

controls:
  preventive:
    - report_data_sourced_from_authoritative_tracking_system
    - report_generation_schedule_automated
    - data_anonymization_for_aggregate_reports
  detective:
    - data_anonymization_for_aggregate_reports
    - report_version_control_and_distribution_log
  corrective:
    - report_version_control_and_distribution_log
    - report_accuracy_validation_before_executive_distribution

workflow:
  phases:
    - phase: report_definition
      steps:
        - define_report_catalog_and_audiences
        - configure_data_sources
        - establish_generation_schedules
    - phase: generation
      steps:
        - execute_scheduled_report_generation
        - apply_anonymization_rules
        - validate_data_accuracy
    - phase: distribution
      steps:
        - deliver_to_subscribed_audiences
        - log_distribution
        - archive_report_artifacts
    - phase: feedback
      steps:
        - collect_report_consumer_feedback
        - refine_report_definitions
        - add_new_reports_on_demand

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_reporting
    evidence_artifact: report_definition_catalog
  iso_42001_competence:
    control_scope: literacy_reporting
    evidence_artifact: accuracy_validation_record

reporting_requirements:
  - literacy_reporting_catalog
  - report_generation_health_dashboard
  - distribution_compliance_register

evidence_requirements:
  - report_definition_catalog
  - generated_report_artifact
  - distribution_log
  - accuracy_validation_record

metrics:
  report_generation_success_rate:
    type: gauge
    domain: literacy_reporting
  report_delivery_sla_compliance:
    type: gauge
    domain: literacy_reporting
  report_consumer_satisfaction:
    type: gauge
    domain: literacy_reporting
  data_accuracy_validation_pass_rate:
    type: gauge
    domain: literacy_reporting

artifacts:
  - name: report_definition_catalog
    retention_years: 7
    classification: RESTRICTED
  - name: generated_report_artifact
    retention_years: 7
    classification: RESTRICTED
  - name: distribution_log
    retention_years: 7
    classification: RESTRICTED
  - name: accuracy_validation_record
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Report Generation Success Rate
    target: defined_by_governance_committee
  - name: Report Delivery Sla Compliance
    target: defined_by_governance_committee
  - name: Report Consumer Satisfaction
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Reporting Program Director
  review_cycle: quarterly
  related_domain: reporting

related_files:
  - literacy_reporting.yaml
  - executive_literacy_dashboard.yaml
  - compliance_attestation_reporting.yaml
  - regulator_literacy_reporting.yaml

ontology_relationships:
  is_a: "literacy_reporting_governance_infrastructure"
  part_of: "ai_literacy_reporting_framework"
  governed_by: literacy_governance.yaml
