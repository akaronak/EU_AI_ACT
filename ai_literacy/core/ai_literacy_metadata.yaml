metadata:
  document_id: AL-CORE-META-001
  title: AI Literacy Metadata
  domain: AI Literacy / Core
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: ai_literacy_metadata
  domain_authority: core
  focus: metadata schema, document registry, versioning, classification, provenance
  purpose:
    >
      Define canonical metadata schema for all AI literacy governance artifacts establishing document
      registry, versioning conventions, classification labels, provenance tracking, and machine-readable
      literacy artifact identification.
  scope:
    >
      All workforce AI literacy activities governed by AI Literacy Metadata within the core subdomain of
      enterprise AI literacy operations.
  objectives:
    - Establish deterministic ai_literacy_metadata controls for AI literacy governance
    - Enable automated ai_literacy_metadata verification and scoring
    - Maintain audit-grade traceability for all ai_literacy_metadata activities
    - Support regulatory inspection of ai_literacy_metadata evidence
    - Deliver measurable ai_literacy_metadata outcomes aligned with EU AI Act Article 4

definitions:
  ai_literacy_metadata_domain:
    >
    The AI Literacy Metadata operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy core.
  ai_literacy_metadata_evidence:
    >
    Machine-readable records demonstrating adherence to AI Literacy Metadata
    requirements across applicable regulatory frameworks.
  ai_literacy_metadata_artifact:
    >
    Any documented output generated by AI Literacy Metadata controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Core Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - ai_literacy_metadata_owner
  - ai_literacy_metadata_analyst
  - ai_literacy_metadata_auditor
  - compliance_officer

regulatory_alignment:
  iso_42001:
    references:
      - "Clause 7.5 - Documented Information"
    requirements:
      >
      AI Literacy Metadata controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: ai_literacy_metadata_taxonomy
  metadata_element:
    - document_id
    - version
    - classification
    - owner
    - jurisdiction
  artifact_type:
    - policy
    - framework
    - assessment
    - report
    - evidence
    - attestation
  lifecycle_state:
    - draft
    - review
    - approved
    - published
    - deprecated
    - archived
  provenance_field:
    - author
    - approver
    - change_reason
    - supersedes
    - effective_date

controls:
  preventive:
    - mandatory_metadata_schema_validation_on_artifact_publish
    - document_id_uniqueness_enforcement
    - version_semantic_numbering_compliance
  detective:
    - version_semantic_numbering_compliance
    - classification_label_mandatory_for_all_artifacts
  corrective:
    - classification_label_mandatory_for_all_artifacts
    - provenance_chain_immutability_for_published_artifacts

workflow:
  phases:
    - phase: schema_definition
      steps:
        - define_metadata_schema_elements
        - publish_schema_registry
        - configure_validation_rules
    - phase: artifact_registration
      steps:
        - assign_document_id_and_version
        - apply_classification_and_owner
        - record_provenance_at_creation
    - phase: publication_governance
      steps:
        - validate_metadata_completeness
        - obtain_approval_for_publication
        - register_in_literacy_artifact_catalog
    - phase: lifecycle_management
      steps:
        - track_version_and_deprecation
        - maintain_supersedes_chain
        - archive_with_retention_metadata

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: ai_literacy_metadata
    evidence_artifact: metadata_schema_specification
  iso_42001_competence:
    control_scope: ai_literacy_metadata
    evidence_artifact: publication_approval_attestation

reporting_requirements:
  - literacy_artifact_catalog
  - metadata_compliance_dashboard
  - version_deprecation_register

evidence_requirements:
  - metadata_schema_specification
  - artifact_registry_entry
  - provenance_chain_record
  - publication_approval_attestation

metrics:
  metadata_completeness_score:
    type: gauge
    domain: ai_literacy_metadata
  schema_validation_pass_rate:
    type: gauge
    domain: ai_literacy_metadata
  artifact_registry_count:
    type: gauge
    domain: ai_literacy_metadata
  deprecated_artifact_archival_rate:
    type: gauge
    domain: ai_literacy_metadata

artifacts:
  - name: metadata_schema_specification
    retention_years: 7
    classification: RESTRICTED
  - name: artifact_registry_entry
    retention_years: 7
    classification: RESTRICTED
  - name: provenance_chain_record
    retention_years: 7
    classification: RESTRICTED
  - name: publication_approval_attestation
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Metadata Completeness Score
    target: defined_by_governance_committee
  - name: Schema Validation Pass Rate
    target: defined_by_governance_committee
  - name: Artifact Registry Count
    target: defined_by_governance_committee

governance:
  policy_owner: AI Literacy Metadata Program Director
  review_cycle: quarterly
  related_domain: core

related_files:
  - ai_literacy_metadata.yaml
  - ai_literacy_taxonomy.yaml
  - competency_model.yaml
  - literacy_classification.yaml

ontology_relationships:
  is_a: "ai_literacy_metadata_governance_infrastructure"
  part_of: "ai_literacy_core_framework"
  governed_by: literacy_governance.yaml
