metadata:
  document_id: AL-CORE-LC-001
  title: Literacy Classification
  domain: AI Literacy / Core
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_classification
  domain_authority: core
  focus: literacy level classification, role tiering, access gating, classification rules
  purpose:
    >
      Govern literacy level classification rules determining workforce literacy tiers, role-based access
      gating thresholds, and classification upgrade/downgrade criteria for AI system interaction
      authorization.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Classification within the core subdomain
      of enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_classification controls for AI literacy governance
    - Enable automated literacy_classification verification and scoring
    - Maintain audit-grade traceability for all literacy_classification activities
    - Support regulatory inspection of literacy_classification evidence
    - Deliver measurable literacy_classification outcomes aligned with EU AI Act Article 4

definitions:
  literacy_classification_domain:
    >
    The Literacy Classification operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy core.
  literacy_classification_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Classification
    requirements across applicable regulatory frameworks.
  literacy_classification_artifact:
    >
    Any documented output generated by Literacy Classification controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Core Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_classification_owner
  - literacy_classification_analyst
  - literacy_classification_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
      - "Article 14 - Human Oversight"
    requirements:
      >
      Literacy Classification controls must satisfy EU_AI_ACT literacy obligations.

taxonomy:
  root: literacy_classification_taxonomy
  classification_tier:
    - unclassified
    - literacy_required
    - literacy_verified
    - literacy_advanced
    - literacy_restricted
  classification_driver:
    - role_assignment
    - assessment_outcome
    - certification_status
    - incident_history
  access_gate:
    - ai_system_read
    - ai_system_configure
    - ai_system_deploy
    - high_risk_oversight
  classification_action:
    - upgrade
    - maintain
    - downgrade
    - suspend

controls:
  preventive:
    - classification_computed_from_authoritative_assessment_records
    - access_gate_enforcement_at_ai_system_boundary
    - classification_downgrade_on_qualification_expiry
  detective:
    - classification_downgrade_on_qualification_expiry
    - incident_triggered_classification_review
  corrective:
    - incident_triggered_classification_review
    - classification_override_requires_executive_approval

workflow:
  phases:
    - phase: classification_computation
      steps:
        - ingest_assessment_and_certification_records
        - apply_classification_rules
        - assign_literacy_tier
    - phase: access_gating
      steps:
        - enforce_tier_at_system_access_points
        - deny_access_below_required_tier
        - log_access_decisions
    - phase: tier_management
      steps:
        - process_upgrade_on_qualification
        - schedule_downgrade_on_expiry
        - review_on_incident_or_role_change
    - phase: reporting
      steps:
        - publish_classification_distribution
        - report_access_denial_patterns
        - alert_on_mass_downgrade_events

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_classification
    evidence_artifact: individual_classification_record
  iso_42001_competence:
    control_scope: literacy_classification
    evidence_artifact: override_authorization_record

reporting_requirements:
  - literacy_classification_register
  - access_gating_compliance_report
  - classification_change_audit

evidence_requirements:
  - individual_classification_record
  - access_gate_decision_log
  - classification_change_audit_trail
  - override_authorization_record

metrics:
  classification_tier_distribution:
    type: gauge
    domain: literacy_classification
  access_gate_denial_rate:
    type: gauge
    domain: literacy_classification
  classification_upgrade_rate:
    type: gauge
    domain: literacy_classification
  downgrade_on_expiry_count:
    type: gauge
    domain: literacy_classification

artifacts:
  - name: individual_classification_record
    retention_years: 7
    classification: RESTRICTED
  - name: access_gate_decision_log
    retention_years: 7
    classification: RESTRICTED
  - name: classification_change_audit_trail
    retention_years: 7
    classification: RESTRICTED
  - name: override_authorization_record
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Classification Tier Distribution
    target: defined_by_governance_committee
  - name: Access Gate Denial Rate
    target: defined_by_governance_committee
  - name: Classification Upgrade Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Classification Program Director
  review_cycle: quarterly
  related_domain: core

related_files:
  - ai_literacy_metadata.yaml
  - ai_literacy_taxonomy.yaml
  - competency_model.yaml
  - literacy_classification.yaml

ontology_relationships:
  is_a: "literacy_classification_governance_infrastructure"
  part_of: "ai_literacy_core_framework"
  governed_by: literacy_governance.yaml
