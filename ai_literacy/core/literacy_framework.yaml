metadata:
  document_id: AL-CORE-LF-001
  title: Literacy Framework
  domain: AI Literacy / Core
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: literacy_framework
  domain_authority: core
  focus: foundational literacy architecture, program structure, domain integration, principles
  purpose:
    >
      Establish the foundational AI literacy framework architecture integrating competency model,
      taxonomy, classification, assessment, governance, and compliance domains into a coherent enterprise
      literacy program structure with defined principles and integration points.
  scope:
    >
      All workforce AI literacy activities governed by Literacy Framework within the core subdomain of
      enterprise AI literacy operations.
  objectives:
    - Establish deterministic literacy_framework controls for AI literacy governance
    - Enable automated literacy_framework verification and scoring
    - Maintain audit-grade traceability for all literacy_framework activities
    - Support regulatory inspection of literacy_framework evidence
    - Deliver measurable literacy_framework outcomes aligned with EU AI Act Article 4

definitions:
  literacy_framework_domain:
    >
    The Literacy Framework operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy core.
  literacy_framework_evidence:
    >
    Machine-readable records demonstrating adherence to Literacy Framework
    requirements across applicable regulatory frameworks.
  literacy_framework_artifact:
    >
    Any documented output generated by Literacy Framework controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Core Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - literacy_framework_owner
  - literacy_framework_analyst
  - literacy_framework_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Literacy Framework controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Full AIMS alignment"
    requirements:
      >
      Literacy Framework controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: literacy_framework_taxonomy
  framework_pillar:
    - competency
    - assessment
    - governance
    - compliance
    - operations
    - reporting
  integration_point:
    - competency_to_assessment
    - assessment_to_classification
    - governance_to_compliance
    - operations_to_reporting
  framework_principle:
    - risk_proportionality
    - role_specificity
    - continuous_improvement
    - regulatory_alignment
    - evidence_based
  program_maturity:
    - initial
    - managed
    - defined
    - quantified
    - optimizing

controls:
  preventive:
    - framework_pillar_integration_verified_quarterly
    - principle_compliance_self_assessment_annual
    - framework_version_governance_committee_approval
  detective:
    - framework_version_governance_committee_approval
    - cross_pillar_dependency_integrity_checks
  corrective:
    - cross_pillar_dependency_integrity_checks
    - framework_maturity_assessment_biennial

workflow:
  phases:
    - phase: architecture
      steps:
        - define_framework_pillars_and_integration
        - establish_governing_principles
        - publish_framework_reference_architecture
    - phase: integration
      steps:
        - wire_pillar_dependencies
        - validate_end_to_end_literacy_lifecycle
        - certify_framework_integrity
    - phase: operationalization
      steps:
        - deploy_framework_across_business_units
        - train_literacy_stewards
        - establish_framework_governance
    - phase: maturity
      steps:
        - assess_framework_maturity_biennially
        - identify_improvement_opportunities
        - evolve_framework_architecture

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: literacy_framework
    evidence_artifact: literacy_framework_architecture_document
  iso_42001_competence:
    control_scope: literacy_framework
    evidence_artifact: governance_committee_approval

reporting_requirements:
  - literacy_framework_status_report
  - pillar_integration_dashboard
  - framework_maturity_scorecard

evidence_requirements:
  - literacy_framework_architecture_document
  - pillar_integration_verification_record
  - framework_maturity_assessment
  - governance_committee_approval

metrics:
  framework_pillar_integration_score:
    type: gauge
    domain: literacy_framework
  program_maturity_level:
    type: gauge
    domain: literacy_framework
  principle_compliance_rate:
    type: gauge
    domain: literacy_framework
  cross_pillar_workflow_success_rate:
    type: gauge
    domain: literacy_framework

artifacts:
  - name: literacy_framework_architecture_document
    retention_years: 7
    classification: RESTRICTED
  - name: pillar_integration_verification_record
    retention_years: 7
    classification: RESTRICTED
  - name: framework_maturity_assessment
    retention_years: 7
    classification: RESTRICTED
  - name: governance_committee_approval
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Framework Pillar Integration Score
    target: defined_by_governance_committee
  - name: Program Maturity Level
    target: defined_by_governance_committee
  - name: Principle Compliance Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Literacy Framework Program Director
  review_cycle: quarterly
  related_domain: core

related_files:
  - ai_literacy_metadata.yaml
  - ai_literacy_taxonomy.yaml
  - competency_model.yaml
  - literacy_classification.yaml

ontology_relationships:
  is_a: "literacy_framework_governance_infrastructure"
  part_of: "ai_literacy_core_framework"
  governed_by: literacy_governance.yaml
