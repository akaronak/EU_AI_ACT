metadata:
  document_id: AL-CORE-TAX-001
  title: AI Literacy Taxonomy
  domain: AI Literacy / Core
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: ai_literacy_taxonomy
  domain_authority: core
  focus: master taxonomy, concept hierarchy, term definitions, ontology relationships
  purpose:
    >
      Establish the master AI literacy taxonomy providing hierarchical concept classification, controlled
      vocabulary, term definitions, and ontology relationships used across all literacy domains for
      consistent governance language and machine interoperability.
  scope:
    >
      All workforce AI literacy activities governed by AI Literacy Taxonomy within the core subdomain of
      enterprise AI literacy operations.
  objectives:
    - Establish deterministic ai_literacy_taxonomy controls for AI literacy governance
    - Enable automated ai_literacy_taxonomy verification and scoring
    - Maintain audit-grade traceability for all ai_literacy_taxonomy activities
    - Support regulatory inspection of ai_literacy_taxonomy evidence
    - Deliver measurable ai_literacy_taxonomy outcomes aligned with EU AI Act Article 4

definitions:
  ai_literacy_taxonomy_domain:
    >
    The AI Literacy Taxonomy operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy core.
  ai_literacy_taxonomy_evidence:
    >
    Machine-readable records demonstrating adherence to AI Literacy Taxonomy
    requirements across applicable regulatory frameworks.
  ai_literacy_taxonomy_artifact:
    >
    Any documented output generated by AI Literacy Taxonomy controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Core Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - ai_literacy_taxonomy_owner
  - ai_literacy_taxonomy_analyst
  - ai_literacy_taxonomy_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 3 - Definitions"
    requirements:
      >
      AI Literacy Taxonomy controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Terminology alignment"
    requirements:
      >
      AI Literacy Taxonomy controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: ai_literacy_master_taxonomy
  literacy_domain:
    - technical
    - ethical
    - legal
    - operational
    - governance
  competency_category:
    - knowledge
    - skill
    - behavior
    - awareness
  role_tier:
    - executive
    - manager
    - practitioner
    - specialist
    - general_workforce
  maturity_level:
    - aware
    - competent
    - proficient
    - expert

controls:
  preventive:
    - controlled_vocabulary_enforcement_across_all_literacy_artifacts
    - taxonomy_change_board_approval_required
    - term_definition_version_control
  detective:
    - term_definition_version_control
    - cross_domain_taxonomy_consistency_validation
  corrective:
    - cross_domain_taxonomy_consistency_validation
    - ontology_relationship_integrity_checks

workflow:
  phases:
    - phase: taxonomy_design
      steps:
        - define_top_level_literacy_domains
        - establish_competency_categories
        - author_controlled_vocabulary
    - phase: term_governance
      steps:
        - define_and_publish_term_definitions
        - manage_synonym_and_alias_registry
        - resolve_term_conflicts
    - phase: integration
      steps:
        - map_domain_taxonomies_to_master
        - validate_cross_references
        - publish_taxonomy_api
    - phase: evolution
      steps:
        - review_taxonomy_quarterly
        - incorporate_regulatory_terminology_updates
        - deprecate_obsolete_terms_with_migration

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: ai_literacy_taxonomy
    evidence_artifact: master_taxonomy_specification
  iso_42001_competence:
    control_scope: ai_literacy_taxonomy
    evidence_artifact: taxonomy_change_approval_record

reporting_requirements:
  - literacy_taxonomy_catalog
  - term_usage_compliance_report
  - taxonomy_evolution_changelog

evidence_requirements:
  - master_taxonomy_specification
  - term_definition_registry
  - ontology_relationship_map
  - taxonomy_change_approval_record

metrics:
  taxonomy_term_count:
    type: gauge
    domain: ai_literacy_taxonomy
  cross_domain_mapping_completeness:
    type: gauge
    domain: ai_literacy_taxonomy
  term_usage_consistency_score:
    type: gauge
    domain: ai_literacy_taxonomy
  taxonomy_change_cycle_time:
    type: gauge
    domain: ai_literacy_taxonomy

artifacts:
  - name: master_taxonomy_specification
    retention_years: 7
    classification: RESTRICTED
  - name: term_definition_registry
    retention_years: 7
    classification: RESTRICTED
  - name: ontology_relationship_map
    retention_years: 7
    classification: RESTRICTED
  - name: taxonomy_change_approval_record
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Taxonomy Term Count
    target: defined_by_governance_committee
  - name: Cross Domain Mapping Completeness
    target: defined_by_governance_committee
  - name: Term Usage Consistency Score
    target: defined_by_governance_committee

governance:
  policy_owner: AI Literacy Taxonomy Program Director
  review_cycle: quarterly
  related_domain: core

related_files:
  - ai_literacy_metadata.yaml
  - ai_literacy_taxonomy.yaml
  - competency_model.yaml
  - literacy_classification.yaml

ontology_relationships:
  is_a: "ai_literacy_taxonomy_governance_infrastructure"
  part_of: "ai_literacy_core_framework"
  governed_by: literacy_governance.yaml
