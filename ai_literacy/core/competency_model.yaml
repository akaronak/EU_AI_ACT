metadata:
  document_id: AL-CORE-CM-001
  title: Competency Model
  domain: AI Literacy / Core
  version: "1.0.0"
  classification: RESTRICTED
  file_authority: competency_model
  domain_authority: core
  focus: competency architecture, proficiency levels, behavioral indicators, role mapping
  purpose:
    >
      Define the enterprise AI literacy competency model specifying competency domains, proficiency level
      descriptors, behavioral indicators, and role-to-competency mapping matrix serving as foundation for
      all assessment and validation activities.
  scope:
    >
      All workforce AI literacy activities governed by Competency Model within the core subdomain of
      enterprise AI literacy operations.
  objectives:
    - Establish deterministic competency_model controls for AI literacy governance
    - Enable automated competency_model verification and scoring
    - Maintain audit-grade traceability for all competency_model activities
    - Support regulatory inspection of competency_model evidence
    - Deliver measurable competency_model outcomes aligned with EU AI Act Article 4

definitions:
  competency_model_domain:
    >
    The Competency Model operational area encompassing controlled processes,
    artifacts, and accountability structures within AI Literacy core.
  competency_model_evidence:
    >
    Machine-readable records demonstrating adherence to Competency Model
    requirements across applicable regulatory frameworks.
  competency_model_artifact:
    >
    Any documented output generated by Competency Model controls for audit purposes.

stakeholders:
  primary:
    - Chief AI Officer
    - AI Literacy Program Director
    - Core Lead
  secondary:
    - HR Learning and Development
    - AI Risk Management
    - Regulatory Affairs

applicable_roles:
  - competency_model_owner
  - competency_model_analyst
  - competency_model_auditor
  - compliance_officer

regulatory_alignment:
  eu_ai_act:
    references:
      - "Article 4 - AI Literacy"
    requirements:
      >
      Competency Model controls must satisfy EU_AI_ACT literacy obligations.
  iso_42001:
    references:
      - "Clause 7.2 - Competence"
    requirements:
      >
      Competency Model controls must satisfy ISO_42001 literacy obligations.

taxonomy:
  root: competency_model_taxonomy
  competency_domain:
    - ai_fundamentals
    - risk_and_safety
    - ethics_and_fairness
    - legal_compliance
    - technical_operations
  proficiency_descriptor:
    - awareness
    - application
    - analysis
    - evaluation
    - creation
  behavioral_indicator:
    - identifies_risk
    - escalates_appropriately
    - documents_decisions
    - challenges_assumptions
  role_competency_tier:
    - baseline
    - role_specific
    - leadership
    - specialist

controls:
  preventive:
    - competency_model_version_control_and_governance_approval
    - behavioral_indicator_observability_requirements
    - role_competency_matrix_authoritative_source
  detective:
    - role_competency_matrix_authoritative_source
    - competency_prerequisite_chain_enforcement
  corrective:
    - competency_prerequisite_chain_enforcement
    - model_update_impact_assessment_on_assessments

workflow:
  phases:
    - phase: model_design
      steps:
        - define_competency_domains_and_levels
        - author_behavioral_indicators
        - build_role_competency_matrix
    - phase: validation
      steps:
        - validate_model_with_sme_panel
        - pilot_with_representative_roles
        - certify_competency_model
    - phase: deployment
      steps:
        - publish_model_to_assessment_systems
        - map_existing_assessments_to_model
        - train_assessors_on_model
    - phase: maintenance
      steps:
        - review_model_annually
        - update_for_regulatory_and_technology_change
        - version_and_communicate_changes

compliance_mappings:
  eu_ai_act_article_4:
    control_scope: competency_model
    evidence_artifact: competency_model_specification
  iso_42001_competence:
    control_scope: competency_model
    evidence_artifact: model_certification_attestation

reporting_requirements:
  - competency_model_inventory
  - role_competency_coverage_report
  - model_version_change_impact_assessment

evidence_requirements:
  - competency_model_specification
  - role_competency_matrix
  - sme_validation_record
  - model_certification_attestation

metrics:
  competency_model_coverage_by_role:
    type: gauge
    domain: competency_model
  behavioral_indicator_assessment_reliability:
    type: gauge
    domain: competency_model
  model_version_adoption_rate:
    type: gauge
    domain: competency_model
  role_matrix_completeness_score:
    type: gauge
    domain: competency_model

artifacts:
  - name: competency_model_specification
    retention_years: 7
    classification: RESTRICTED
  - name: role_competency_matrix
    retention_years: 7
    classification: RESTRICTED
  - name: sme_validation_record
    retention_years: 7
    classification: RESTRICTED
  - name: model_certification_attestation
    retention_years: 7
    classification: RESTRICTED

kpis:
  - name: Competency Model Coverage By Role
    target: defined_by_governance_committee
  - name: Behavioral Indicator Assessment Reliability
    target: defined_by_governance_committee
  - name: Model Version Adoption Rate
    target: defined_by_governance_committee

governance:
  policy_owner: Competency Model Program Director
  review_cycle: quarterly
  related_domain: core

related_files:
  - ai_literacy_metadata.yaml
  - ai_literacy_taxonomy.yaml
  - competency_model.yaml
  - literacy_classification.yaml

ontology_relationships:
  is_a: "competency_model_governance_infrastructure"
  part_of: "ai_literacy_core_framework"
  governed_by: literacy_governance.yaml
