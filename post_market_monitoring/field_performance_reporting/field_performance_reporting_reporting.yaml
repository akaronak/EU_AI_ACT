compliance_mapping:
  - article: "Article 72"
    obligation: "Peer notified body coordination and European AI Board notifications for Field Performance Reporting Reporting."
    implementation_method: "Triage notices and upload certification metadata to GRC registries monthly."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-04"
    required_evidence: "Notified body coordination transaction receipts and communication logs."
    validation_method: "Verify GRC upload status and schema correctness daily."
    assurance_method: "Audit coordination connection logs monthly."
  - article: "Article 73"
    obligation: "Provide information and access to national market surveillance authorities under Field Performance Reporting Reporting."
    implementation_method: "Maintain secure data export APIs and grant access keys to certified authority officers."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-04"
    required_evidence: "Authority access logs and exported records bundles."
    validation_method: "Audit access tokens validation and API rate limits daily."
    assurance_method: "Verify digital signature key registration weekly."
  - article: "Article 74"
    obligation: "Comply with market surveillance corrective action requests under Field Performance Reporting Reporting."
    implementation_method: "Deploy automated containment and recall workflows when directive is received."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-03"
    required_evidence: "Signed corrective actions logs and system deactivation certificates."
    validation_method: "Confirm recall workflow deactivates models in sandbox tests."
    assurance_method: "Review corrective action compliance histories quarterly."
  - article: "Article 75"
    obligation: "Mutual assistance and coordination with European AI Board under Field Performance Reporting Reporting."
    implementation_method: "Upload joint validation logs and conformity records monthly to Board database."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-04"
    required_evidence: "Transaction receipts from European AI Board database."
    validation_method: "Check upload status codes and data hashes weekly."
    assurance_method: "Audit cooperation agreement documentation annually."
  - article: "Article 61"
    obligation: "Post-Market Monitoring System planning and execution rules for Field Performance Reporting Reporting."
    implementation_method: "Establish continuous telemetry gathering, drift tracking, and customer feedback logs loops."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-01"
    required_evidence: "Signed monthly post-market compliance files and telemetry reports."
    validation_method: "Verify telemetry metrics completeness daily."
    assurance_method: "Audit Post-Market Monitoring System design annually."
  - article: "High-Risk AI Obligations"
    obligation: "Human oversight and quality management requirements tracking for Field Performance Reporting Reporting."
    implementation_method: "Enforce manual intervention checkpoints and override validation weekly."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-03"
    required_evidence: "Intervention checklists and override logs."
    validation_method: "Assert supervisor latency is below SLA targets."
    assurance_method: "Audit QMS indicators monthly."
  - article: "Provider Obligations"
    obligation: "Verify provider registration and compliance status for Field Performance Reporting Reporting."
    implementation_method: "Assert presence of required adequacy certificates and CE markings pre-market."
    monitoring_control: "CTRL-PMM-FPR-FIELD_-04"
    required_evidence: "Signed provider validation attestations and registration certificates."
    validation_method: "Check EU database registration status daily."
    assurance_method: "Audit provider registry connections monthly."
