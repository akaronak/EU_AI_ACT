metrics:
  - metric_name: "field_performance_reporting_reporting_continuous_monitoring_coverage"
    formula: "COUNT(monitored_nodes) / COUNT(total_nodes)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "DAILY"
    owner: "Monitoring Steward"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Daily Monitoring Coverage report."
  - metric_name: "field_performance_reporting_reporting_drift_detection_accuracy"
    formula: "COUNT(true_drift_alerts) / COUNT(total_drift_alerts)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.85"
    measurement_frequency: "WEEKLY"
    owner: "Monitoring Steward"
    data_source: "violation_checks_db"
    evidence_generated: "Weekly Drift Accuracy scorecard."
  - metric_name: "field_performance_reporting_reporting_performance_assurance_score"
    formula: "COUNT(passed_performance_checks) / COUNT(total_performance_checks)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "HOURLY"
    owner: "Monitoring Steward"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Hourly Performance Assurance logs."
  - metric_name: "field_performance_reporting_reporting_market_surveillance_readiness_score"
    formula: "COUNT(ready_evidence_artifacts) / COUNT(required_evidence_artifacts)"
    target: "1.00"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "MONTHLY"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_vault"
    evidence_generated: "Monthly Surveillance Readiness certificate."
  - metric_name: "field_performance_reporting_reporting_incident_detection_effectiveness"
    formula: "COUNT(detected_incidents) / COUNT(total_incidents)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "DAILY"
    owner: "Incident Commander"
    data_source: "violation_checks_db"
    evidence_generated: "Daily Incident Detection metrics."
  - metric_name: "field_performance_reporting_reporting_corrective_action_closure_rate"
    formula: "COUNT(closed_actions_within_SLA) / COUNT(total_actions)"
    target: "0.98"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "WEEKLY"
    owner: "Incident Commander"
    data_source: "violation_checks_db"
    evidence_generated: "Weekly Corrective Action scorecard."
  - metric_name: "field_performance_reporting_reporting_feedback_resolution_rate"
    formula: "COUNT(resolved_complaints_within_SLA) / COUNT(total_complaints)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.85"
    measurement_frequency: "WEEKLY"
    owner: "Incident Commander"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Weekly Feedback Resolution logs."
  - metric_name: "field_performance_reporting_reporting_operational_stability_score"
    formula: "passed_stability_ticks / total_stability_ticks"
    target: "0.99"
    warning_threshold: "0.97"
    critical_threshold: "0.95"
    measurement_frequency: "DAILY"
    owner: "Monitoring Steward"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Daily Operational Stability report."
  - metric_name: "field_performance_reporting_reporting_post_market_compliance_score"
    formula: "passed_compliance_checks / total_compliance_checks"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_vault"
    evidence_generated: "Weekly Post-Market Compliance scorecard."
  - metric_name: "field_performance_reporting_reporting_post_market_maturity_score"
    formula: "current_maturity_level / 7.0"
    target: "0.85"
    warning_threshold: "0.71"
    critical_threshold: "0.57"
    measurement_frequency: "ANNUALLY"
    owner: "Compliance Steward"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Annual Maturity Assessment certificate."
