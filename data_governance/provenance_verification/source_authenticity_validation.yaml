  collection_frequency: "Continuous"
  telemetry_retention: "30 days in data vault"
  telemetry_integrity: "Cryptographic sealing of log records"
  telemetry_validation: "Hash verification checks"
data_telemetry:
  data_access_events: "Record all read queries and access token hashes."
  data_modification_events: "Track insertions, updates, and deletions with signer keys."
  data_transfer_events: "Log data replication streams across regions."
  lineage_events: "Log metadata extraction at process pipeline checkpoints."
  provenance_events: "Log data custody handoffs and signature check status."
  validation_events: "Log batch check outcomes and threshold exceptions."
  quality_events: "Track completeness rates and format error frequencies."
  retention_events: "Log archive transfers and record erasure completions."
  disposal_events: "Record permanent file deletion completions."
  governance_alerts: "High priority SIEM alerts sent to data steward."
  governance_indicators: "Check validation timeouts and schema anomalies."
metrics:
  - metric_name: "source_authenticity_validation_data_quality_score"
    formula: "COUNT(valid_records) / COUNT(total_records)"
    target: ">= 0.99"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_data_quality_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_lineage_completeness_score"
    formula: "COUNT(logged_lineage_steps) / COUNT(total_lineage_steps)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_lineage_completeness_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_provenance_integrity_score"
    formula: "COUNT(verified_provenance_records) / COUNT(total_records)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_provenance_integrity_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_dataset_assurance_score"
    formula: "MIN(dataset_assurance_checks_status)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_dataset_assurance_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_metadata_quality_score"
    formula: "COUNT(complete_metadata_records) / COUNT(total_records)"
    target: ">= 0.98"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_metadata_quality_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_data_governance_maturity_score"
    formula: "data_governance_maturity_level / 6.0"
    target: ">= 0.66"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_data_governance_maturity_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_training_data_quality_score"
    formula: "COUNT(scrubbed_training_records) / COUNT(total_training_records)"
    target: ">= 0.99"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_training_data_quality_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_data_sovereignty_compliance_score"
    formula: "COUNT(compliant_residency_records) / COUNT(total_records)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_data_sovereignty_compliance_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_retention_compliance_score"
    formula: "1 - (expired_unpurged_records / total_records)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_retention_compliance_score_metric_trend_log"
  - metric_name: "source_authenticity_validation_data_traceability_score"
    formula: "COUNT(traceable_data_points) / COUNT(total_data_points)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Data Steward"
    data_source: "central_data_telemetry_db"
    evidence_generated: "source_authenticity_validation_data_traceability_score_metric_trend_log"
kpis:
