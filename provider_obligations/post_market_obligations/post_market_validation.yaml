metadata:
  document_id: "PRV-PMM-POST_MARKET_-001"
  title: "Post Market Validation"
  domain: "Post Market Obligations"
  version: "1.0.0"
  classification: "CONFIDENTIAL_REGULATORY"
purpose: "Govern, operationalize, and validate provider obligations and lifecycle accountability compliance workflows for Post Market Validation under the Post Market Obligations framework. This skill provides machine-readable, executable provider governance & conformity assurance AI coordination rules specifically tailored to post-market monitoring program, performance tracking controls, feedback loops, degradation monitoring properties."
scope: "Scope covers all technical documentation reviews, conformity assessments, post-market monitoring tracking, and incident reporting controls governed by the Post Market Validation framework."
objectives:
  - "Govern and audit provider obligations and accountability rules under Post Market Validation criteria."
  - "Ensure real-time compliance monitoring and conformity validations for Post Market Obligations."
  - "Compile technical documentation files and conformity reports to verify compliance under EU AI Act Articles 8-21."
definitions:
  post_market_validation_provider_policy: "The primary operational provider governance and compliance rules for Post Market Validation."
  post_market_validation_compliance_register: "Cryptographically sealed conformity assessment and technical documentation database containing validation logs for Post Market Validation."
taxonomy:
  obligation_classes:
    - "QUALITY_MANAGEMENT"
    - "TECHNICAL_DOCUMENTATION"
    - "CONFORMITY_ASSESSMENT"
    - "POST_MARKET_MONITORING"
  compliance_modes:
    - "PRE_MARKET_VALIDATION"
    - "MARKET_PLACEMENT_GATE"
    - "POST_MARKET_AUDIT"
governance:
  governance_model: "PROVIDER_ACCOUNTABILITY_GOVERNANCE_MODEL"
  governance_structure: "Enterprise Provider Governance Board - Post Market Obligations"
  roles_and_responsibilities:
    compliance_officer: "Responsible for managing EU AI Act Articles 16-17 compliance and registries for Post Market Validation."
    technical_lead: "Responsible for compiling technical documentation files and verifying specifications for Post Market Validation."
    quality_manager: "Responsible for quality management systems checks and conformity validations for Post Market Validation."
  stakeholders:
    - "Chief Compliance Officer"
    - "Head of AI Product Development"
    - "Director of Quality Assurance"
governance_model:
  model_type: "PROVIDER_GOVERNANCE_SYSTEM_MODEL"
  model_rationale: "Ensures continuous verification of quality management frameworks, systematic technical specification audits, proactive incident management, and complete audit trace logs across product lifecycle."
governance_structure:
  oversight_board: "Global Provider Governance Committee - Post Market Obligations"
  escalation_contact: "provider_governance@enterprise.ai"
roles_and_responsibilities:
  compliance_officer: "Primary owner of conformity registers and post-market checklists under Post Market Validation."
  technical_lead: "Responsible for scoring documentation completeness, verifying specifications, and signing off technical files."
  quality_manager: "Responsible for quality system audits, incident response verifications, and corrective action implementations."
stakeholders:
  - "Head of AI Compliance & GRC"
  - "Director of Software Engineering"
  - "VP of Enterprise Quality Management"
  - "Post Market Obligations Obligation Subject Matter Owner"
capabilities:
  - "Continuous compliance checkings and quality management audits under Post Market Validation."
  - "Systematic technical documentation compilations and conformity assessments under Post Market Validation."
  - "Post-market monitoring program execution and incident response reporting for Post Market Obligations operations."
requirements:
  - "All software specifications under Post Market Validation must document design parameters."
  - "Conformity assessments scorecards must meet or exceed the 1.00 baseline parameters."
  - "Serious incident notifications must be compiled and sent within 15 days of identification."
controls:
  - control_id: "CTRL-PRV-PMM-POST_M-01"
    control_name: "provider_accountability_control"
    control_type: "PREVENTATIVE"
    control_category: "ACCOUNTABILITY"
    control_objective: "Govern responsibility allocations and verify ownership assignments for Post Market Validation workflows."
    provider_rationale: "Maintains clear ownership chains under EU AI Act rules, preventing accountability gaps."
    implementation_guidance: "Deploy automated roles verifiers checking task ownership records weekly."
    control_owner: "Compliance Officer"
    control_frequency: "WEEKLY"
    monitoring_method: "Monitor ownership logs completeness on GRC central portal."
    validation_method: "Query task registry with missing owner field, verify update block."
    evidence_generated: "Signed weekly responsibility mapping audit log."
    regulatory_mapping: "EU AI Act Article 16"
    audit_considerations: "Check ownership mapping tables and change logs histories."
  - control_id: "CTRL-PRV-PMM-POST_M-02"
    control_name: "risk_management_control"
    control_type: "PREVENTATIVE"
    control_category: "RISK"
    control_objective: "Enforce risk management system rules and verify mitigation thresholds for Post Market Validation."
    provider_rationale: "Reduces model execution and operational risk, ensuring conformity with safety limits."
    implementation_guidance: "Deploy automated risk score calculators checking model parameters daily."
    control_owner: "Quality Manager"
    control_frequency: "DAILY"
    monitoring_method: "Track risk thresholds indicators on compliance dashboard."
    validation_method: "Inject mock risk scores breaching safety levels, assert pipeline block."
    evidence_generated: "Signed daily risk management validation ticket."
    regulatory_mapping: "EU AI Act Article 9"
    audit_considerations: "Verify risk thresholds configuration and active alarm monitors."
  - control_id: "CTRL-PRV-PMM-POST_M-03"
    control_name: "technical_documentation_control"
    control_type: "PREVENTATIVE"
    control_category: "DOCUMENTATION"
    control_objective: "Audit technical documentation completeness and verify system specifications for Post Market Validation."
    provider_rationale: "Maintains regulatory conformity files completeness pre-market placement."
    implementation_guidance: "Scan technical folders weekly for required schemas, architecture maps, and datasheets."
    control_owner: "Technical Lead"
    control_frequency: "WEEKLY"
    monitoring_method: "Verify documentation coverage metrics on GRC dashboard."
    validation_method: "Trigger deployment pipeline with incomplete technical files, verify pipeline halt."
    evidence_generated: "Signed weekly technical documentation validation certificate."
    regulatory_mapping: "EU AI Act Article 11"
    audit_considerations: "Review technical doc inventories and version control logs."
  - control_id: "CTRL-PRV-PMM-POST_M-04"
    control_name: "human_oversight_control"
    control_type: "PREVENTATIVE"
    control_category: "OVERSIGHT"
    control_objective: "Govern manual takeover and human override controls for Post Market Validation."
    provider_rationale: "Ensures operators have required access keys and validation check interfaces for manual review."
    implementation_guidance: "Deploy automated override checkers checking credentials pre-flight."
    control_owner: "Compliance Officer"
    control_frequency: "REAL_TIME"
    monitoring_method: "Track override event logs and operator response latency on GRC portal."
    validation_method: "Request override validation in sandboxed environment, verify override status updates."
    evidence_generated: "Signed human oversight verification receipt."
    regulatory_mapping: "EU AI Act Article 14"
    audit_considerations: "Audit manual override logs database and user access certificates."
  - control_id: "CTRL-PRV-PMM-POST_M-05"
    control_name: "post_market_monitoring_control"
    control_type: "DETECTIVE"
    control_category: "MONITORING"
    control_objective: "Monitor system behaviors and verify performance degradation for Post Market Validation."
    provider_rationale: "Enables early identification of systemic drift or failures, preventing market accidents."
    implementation_guidance: "Deploy continuous monitoring gateway scanning operational telemetry hourly."
    control_owner: "Quality Manager"
    control_frequency: "HOURLY"
    monitoring_method: "Track performance score metrics on central GRC scorecard."
    validation_method: "Inject mock performance drift data, verify drift notification is sent."
    evidence_generated: "Signed hourly post-market validation certificate."
    regulatory_mapping: "EU AI Act Article 61"
    audit_considerations: "Check post-market logs databases and telemetry collector definitions."
  - control_id: "CTRL-PRV-PMM-POST_M-06"
    control_name: "incident_reporting_control"
    control_type: "DETECTIVE"
    control_category: "REPORTING"
    control_objective: "Identify serious incidents and route regulatory notifications for Post Market Validation."
    provider_rationale: "Meets regulatory notification timeliness mandates, avoiding penalties."
    implementation_guidance: "Deploy automated incident ticket generator checking GRC logs daily."
    control_owner: "Compliance Officer"
    control_frequency: "DAILY"
    monitoring_method: "Track incident reporting SLAs indicators on GRC dashboard."
    validation_method: "Create test critical incident ticket, assert authority alert routes in GRC within 5 seconds."
    evidence_generated: "Signed incident reporting validation token."
    regulatory_mapping: "EU AI Act Article 72"
    audit_considerations: "Review incident logs history and authority communication records."
decision_logic:
  escalation_trigger: "If provider_compliance_score or provider_assurance_score drops below 1.00, halt the market placement gate for Post Market Validation and notify Compliance Officer."
  incident_classification: "Classify failures as CRITICAL if they involve technical documentation missing fields, CE marking errors, or failure to report serious incidents."
processes:
  conformity_reviews: "SOP for verification checklists review and conformity assessment coordination for Post Market Validation."
  incident_escalation: "Procedural steps to triage incidents, isolate execution nodes, and notify regulators within SLA."
workflows:
  - workflow_id: "provider_compliance_workflow"
    workflow_owner: "Compliance Officer"
    workflow_objective: "Audit quality management systems and evaluate compliance obligations for Post Market Validation."
    trigger: "Scheduled weekly compliance audit tick."
    inputs:
      - "quality_management_files"
      - "compliance_obligations_register"
      - "audit_checklists"
    activities:
      - "Scan quality management system configurations."
      - "Enforce obligation checklist validations."
      - "Issue compliance status tracking receipt."
    decision_points:
      - "Obligations validation pass"
      - "Quality check pass"
    approvals:
      - "Compliance Officer sign-off"
    outputs:
      - "Compliance status receipt"
      - "GRC portal updates"
    generated_evidence: "Signed compliance status receipt archived in compliance ledger."
    provider_outputs:
      audit_status: "COMPLIANT"
      non_conformities_count: 0
    success_criteria: "Audit completed and receipt archived within 2 hours of trigger."
    failure_conditions: "Quality files unavailable or checklist validation identifies open issues."
  - workflow_id: "risk_management_workflow"
    workflow_owner: "Quality Manager"
    workflow_objective: "Evaluate operational risks and verify risk thresholds for Post Market Validation."
    trigger: "Pipeline activation or major operational modification."
    inputs:
      - "risk_assessment_files"
      - "risk_thresholds_manifest"
      - "operational_telemetry"
    activities:
      - "Calculate operational risk score parameters."
      - "Check risk threshold indicators against guidelines."
      - "Issue signed risk management validation ticket."
    decision_points:
      - "Risk score below thresholds"
      - "Mitigation verification pass"
    approvals:
      - "Quality Manager approval"
    outputs:
      - "Risk validation ticket"
      - "Updated risk profiles"
    generated_evidence: "Signed risk validation ticket stored in GRC database."
    provider_outputs:
      risk_rating: "LOW"
      mitigation_status: "VERIFIED"
    success_criteria: "Assessment completed and ticket generated within 3 hours."
    failure_conditions: "Assessment data missing or calculated score breaches safety limits."
  - workflow_id: "conformity_assessment_workflow"
    workflow_owner: "Quality Manager"
    workflow_objective: "Coordinate conformity assessments and verify CE marking criteria under Post Market Validation."
    trigger: "Request for validation of new high-risk system placement."
    inputs:
      - "conformity_verification_files"
      - "ce_marking_checklist"
      - "assessor_credentials"
    activities:
      - "Verify assessor credentials pre-flight."
      - "Enforce CE marking requirements checklists."
      - "Log conformity assessment status in safety portal."
    decision_points:
      - "CE marking validation pass"
      - "Conformity verification pass"
    approvals:
      - "Quality Manager sign-off"
    outputs:
      - "Conformity assessment certificate"
      - "CE marking authorization token"
    generated_evidence: "Signed conformity assessment certificate saved in security vault."
    provider_outputs:
      conformity_status: "CERTIFIED"
      ce_authorization: "APPROVED"
    success_criteria: "Certificate generated and CE marking approved within 5 days."
    failure_conditions: "Assessor credentials invalid or checklists validation fails."
  - workflow_id: "technical_documentation_workflow"
    workflow_owner: "Technical Lead"
    workflow_objective: "Compile technical documentation files and audit specification logs under Post Market Validation."
    trigger: "Scheduled weekly technical review or model parameters change."
    inputs:
      - "system_specification_configs"
      - "technical_documentation_files"
      - "documentation_checklist"
    activities:
      - "Scan folders weekly for required schemas."
      - "Verify E2E trace maps integrity log."
      - "Issue weekly technical validation report."
    decision_points:
      - "Trace logs integrity pass"
      - "Documentation coverage pass"
    approvals:
      - "Technical Lead sign-off"
    outputs:
      - "Weekly technical validation report"
      - "Updated technical documentation index"
    generated_evidence: "Signed technical validation report stored in GRC ledger."
    provider_outputs:
      documentation_completeness_score: 1.0
      validation_verified: True
    success_criteria: "Report completed and documentation folder updated with zero anomalies."
    failure_conditions: "System files unavailable or documentation checklist fails."
  - workflow_id: "market_placement_workflow"
    workflow_owner: "Compliance Officer"
    workflow_objective: "Enforce market placement gates and verify registration status under Post Market Validation."
    trigger: "Request to transition model state to production."
    inputs:
      - "conformity_assessment_certificate"
      - "registration_credentials"
      - "placement_readiness_checklist"
    activities:
      - "Verify conformity assessment certificate status."
      - "Verify registration credentials pre-flight."
      - "Issue signed market placement gate token."
    decision_points:
      - "Certificate verification pass"
      - "Readiness checklist pass"
    approvals:
      - "Chief Compliance Officer approval"
    outputs:
      - "Market placement gate token"
      - "Production deployment status"
    generated_evidence: "Signed market placement gate token stored in compliance database."
    provider_outputs:
      placement_status: "RELEASED"
      registration_id: "REG-104857"
    success_criteria: "Gate token issued and deployment approved within 2 hours of request."
    failure_conditions: "Conformity certificate invalid or readiness checklist identifies gaps."
  - workflow_id: "incident_reporting_workflow"
    workflow_owner: "Compliance Officer"
    workflow_objective: "Triage incident tickets and compile authority notification briefs under Post Market Validation."
    trigger: "Incident ticket registration or serious incident detection."
    inputs:
      - "incident_ticket_file"
      - "authority_notification_template"
      - "escalation_rules_manifest"
    activities:
      - "Triage incident ticket parameters."
      - "Verify demographic targeting indicators."
      - "Issue signed incident reporting validation token."
    decision_points:
      - "Incident classification pass"
      - "Regulator notification required"
    approvals:
      - "Compliance Officer sign-off"
    outputs:
      - "Incident triage report"
      - "Regulator notification brief"
    generated_evidence: "Signed incident triage report stored in compliance vaults."
    provider_outputs:
      incident_severity: "SERIOUS"
      reporting_latency_days: 1
    success_criteria: "Triage report created and alert routed within 15 minutes of trigger."
    failure_conditions: "Incident data corrupted or notification templates missing."
  - workflow_id: "post_market_monitoring_workflow"
    workflow_owner: "Quality Manager"
    workflow_objective: "Analyze post-market performance drift and compile feedback reports under Post Market Validation."
    trigger: "Daily scheduled post-market monitoring tick."
    inputs:
      - "operational_telemetry_history"
      - "drift_analysis_rules"
      - "performance_thresholds"
    activities:
      - "Scan operational telemetry history files weekly."
      - "Calculate performance drift index parameters."
      - "Issue daily post-market validation certificate."
    decision_points:
      - "Performance drift below thresholds"
      - "System integrity checks pass"
    approvals:
      - "Quality Manager sign-off"
    outputs:
      - "Daily post-market validation certificate"
      - "Performance trend scorecard"
    generated_evidence: "Signed post-market validation certificate saved in compliance database."
    provider_outputs:
      drift_rate_detected: 0.005
      performance_score: 0.99
    success_criteria: "Certificate generated and trend scorecards updated with zero alerts."
    failure_conditions: "Telemetry data offline or drift checks thresholds missing."
  - workflow_id: "provider_assurance_workflow"
    workflow_owner: "Compliance Officer"
    workflow_objective: "Verify E2E provider assurance indicators and issue compliance scorecards under Post Market Validation."
    trigger: "Monthly scheduled provider review tick."
    inputs:
      - "compliance_status_receipts"
      - "monthly_audit_reports"
      - "assurance_evidence_logs"
    activities:
      - "Audit E2E trace maps completeness score."
      - "Verify monthly audit reports signatures."
      - "Issue monthly provider assurance score receipt."
    decision_points:
      - "Audits validation pass"
      - "Assurance score meets target"
    approvals:
      - "Lead Auditor sign-off"
    outputs:
      - "Monthly provider compliance report"
      - "Assurance score receipt"
    generated_evidence: "Signed Monthly Provider compliance report archived in compliance database."
    provider_outputs:
      assurance_verified: True
      provider_compliance_score: 1.0
    success_criteria: "Review completed and monthly report sealed with zero exceptions."
    failure_conditions: "Assurance logs corrupted or audit reports unavailable."
