metadata:
  document_id: "SYS-CAT-CATASTROPHIC-001"
  title: "Catastrophic Risk Analysis"
  domain: "Catastrophic Risk Analysis"
  version: "1.0.0"
  classification: "CONFIDENTIAL_SAFETY"
purpose: "Govern, model, and continuously monitor systemic risks for Catastrophic Risk Analysis under the Catastrophic Risk Analysis framework. This skill provides machine-readable, executable systemic risk governance, frontier capability containment boundaries, and cascading failure containment rules specifically tailored to existential risk mitigation, low-probability high-impact events, catastrophic failure simulations, extreme scenario modeling properties."
scope: "Scope covers all systemic concentration audits, cascading dependency mappings, frontier model capacity restrictions, and ecosystem stability threshold validations governed by the Catastrophic Risk Analysis framework."
objectives:
  - "Audit systemic risk indicators and cascading dependencies under Catastrophic Risk Analysis criteria."
  - "Enforce containment controls and runtime restriction policies for Catastrophic Risk Analysis."
  - "Publish risk intelligence reports and systemic assurance dockets to verify compliance under EU AI Act Articles 51-53."
definitions:
  catastrophic_risk_analysis_systemic_policy: "The primary operational systemic risk containment and governance rule definitions for Catastrophic Risk Analysis."
  catastrophic_risk_analysis_resilience_register: "Cryptographically signed risk register containing dependency mapping history logs for Catastrophic Risk Analysis."
taxonomy:
