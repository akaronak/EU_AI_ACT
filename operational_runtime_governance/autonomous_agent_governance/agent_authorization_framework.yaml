  governance_structure: "Enterprise Runtime Governance Board - Autonomous Agent Governance"
  roles_and_responsibilities:
    runtime_steward: "Responsible for managing telemetry checks and risk thresholds for Agent Authorization Framework."
    operations_officer: "Responsible for ensuring containment and recovery protocols are executed for Agent Authorization Framework."
    assurance_auditor: "Responsible for validation reports and record integrity audits for Agent Authorization Framework."
  stakeholders:
