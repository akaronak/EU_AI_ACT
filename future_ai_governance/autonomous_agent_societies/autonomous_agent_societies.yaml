controls:
  - control_id: "CTRL-FAG-SOC-AUTONO-01"
    control_name: "horizon_scanning_assurance_control"
    control_type: "PREVENTATIVE"
    control_category: "FORESIGHT"
    control_objective: "Ensure that early-stage indicators and weak signals for Autonomous Agent Societies are systematically captured."
    future_governance_rationale: "Required to prevent blind-spots in early capability leaps in the context of Autonomous Agent Societies."
    implementation_guidance: "Deploy automated parsers to ingest research publications and patent filings daily."
    control_owner: "Foresight Officer"
    control_frequency: "DAILY"
    monitoring_method: "Track signal database ingestion volumes and verify feed latency."
    validation_method: "Inject mock scientific paper and confirm signal database entry generation."
    evidence_generated: "Horizon scanning log manifest and weak signal alerts archive."
    escalation_conditions: "Ingestion service failure lasting more than 24 hours."
    audit_considerations: "Check parser regex patterns and source credentials registry."
  - control_id: "CTRL-FAG-SOC-AUTONO-02"
    control_name: "emerging_capability_monitoring_control"
    control_type: "DETECTIVE"
    control_category: "CAPABILITY"
    control_objective: "Audit model outputs and behavioral traces to detect emerging, unpredicted capabilities of Autonomous Agent Societies."
    future_governance_rationale: "Maintains system integrity by detecting capability drift or unauthorized self-improvement paths in Autonomous Agent Societies."
    implementation_guidance: "Run automated model evaluation suite weekly and check against baseline capability boundaries."
    control_owner: "Capability Analyst"
    control_frequency: "WEEKLY"
    monitoring_method: "Monitor model evaluation dashboards and verification test reports."
    validation_method: "Simulate model benchmark shift, verify capability drift alert triggers."
    evidence_generated: "Weekly Model Evaluation Attestation and benchmark output graphs."
    escalation_conditions: "Model performance exceeds defined safety boundaries by > 5%."
    audit_considerations: "Review benchmark test datasets and evaluation log signatures."
  - control_id: "CTRL-FAG-SOC-AUTONO-03"
    control_name: "advanced_autonomy_governance_control"
    control_type: "PREVENTATIVE"
    control_category: "AUTONOMY"
    control_objective: "Impose limits and verification checkpoints on agentic decision-making paths for Autonomous Agent Societies."
    future_governance_rationale: "Prevents runaway loops and actions outside authorized domains in agentic configurations of Autonomous Agent Societies."
    implementation_guidance: "Implement automated runtime guardrails that block agent actions when confidence drops below 0.85."
    control_owner: "Risk Director"
    control_frequency: "REAL_TIME"
    monitoring_method: "Track agent decision log streams and verify token signatures."
    validation_method: "Mock agent request violating policy bounds, verify block response."
    evidence_generated: "Signed runtime guardrail logs and block events registers."
    escalation_conditions: "Guardrail override detected or agent connection errors."
    audit_considerations: "Verify guardrail logic configurations and key management system settings."
  - control_id: "CTRL-FAG-SOC-AUTONO-04"
    control_name: "frontier_model_oversight_control"
    control_type: "PREVENTATIVE"
    control_category: "FRONTIER"
    control_objective: "Manage critical pre-launch validation and containment strategies for frontier configurations in Autonomous Agent Societies."
    future_governance_rationale: "Ensures frontier capabilities are validated under extreme risk scenarios prior to production in Autonomous Agent Societies."
    implementation_guidance: "Run simulated red-teaming exercises and security containment checks before build promotion."
    control_owner: "Risk Director"
    control_frequency: "QUARTERLY"
    monitoring_method: "Review red-team reports and container security metrics."
    validation_method: "Verify pre-launch checklist completeness scores before release."
    evidence_generated: "Quarterly Frontier Oversight Attestations and Red-Teaming summary reports."
    escalation_conditions: "Oversight checklist score falls below 1.0."
    audit_considerations: "Review container configurations and evaluator credential keys."
  - control_id: "CTRL-FAG-SOC-AUTONO-05"
    control_name: "adaptive_governance_activation_control"
    control_type: "DETECTIVE"
    control_category: "ADAPTATION"
    control_objective: "Continuously monitor trigger metrics to automatically adjust control strictness for Autonomous Agent Societies."
    future_governance_rationale: "Enables fast-scaling safety interventions as system risk profiles shift dynamically under Autonomous Agent Societies."
    implementation_guidance: "Setup real-time webhook monitors that recalculate readiness levels and trigger policy updates."
    control_owner: "Foresight Officer"
    control_frequency: "CONTINUOUS"
    monitoring_method: "Monitor adaptive rule execution engine and webhook status."
    validation_method: "Inject mock threshold breach signal, check policy adjustment webhook."
    evidence_generated: "Adaptive policy change log records and system event notifications."
    escalation_conditions: "Adaptive policy update fails or triggers loop exceptions."
    audit_considerations: "Check webhook retry configurations and policy template registers."
  - control_id: "CTRL-FAG-SOC-AUTONO-06"
    control_name: "future_risk_assessment_control"
    control_type: "DETECTIVE"
    control_category: "RISK"
    control_objective: "Run weekly probabilistic assessments of civilizational and systemic risk profiles for Autonomous Agent Societies."
    future_governance_rationale: "Provides documented evidence-based risk projections to regulatory bodies for Autonomous Agent Societies."
    implementation_guidance: "Run Monte Carlo simulations of systemic failure paths and log outputs to secure archives."
    control_owner: "Risk Director"
    control_frequency: "WEEKLY"
    monitoring_method: "Verify simulation run completions and audit report creation logs."
    validation_method: "Rerun prior week simulation, check consistency of results."
    evidence_generated: "Weekly Probabilistic Risk Reports and database entry registers."
    escalation_conditions: "Projections cross critical threshold values."
    audit_considerations: "Review simulation modeling assumptions and dataset parameters."
decision_logic:
  escalation_trigger: "If future_governance_maturity_score falls below 0.71, alert the Risk Director immediately."
  incident_classification: "Classify as CRITICAL if emerging_risk_detection_rate drops below 0.90 for two cycles."
processes:
  capability_review: "Detailed process for reviewing and classifying new capability markers in Autonomous Agent Societies."
