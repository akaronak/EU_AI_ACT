metrics:
  - metric_name: "prompt_injection_detection_service_availability_rate"
    formula: "COUNT(up_seconds) / COUNT(total_seconds)"
    target: ">= 0.999"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_service_availability_rate_metric_trend_log"
  - metric_name: "prompt_injection_detection_system_survivability_score"
    formula: "AVG(survived_components_count / total_components_count)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_system_survivability_score_metric_trend_log"
  - metric_name: "prompt_injection_detection_recovery_time_performance"
    formula: "AVG(recovery_latency_seconds)"
    target: "<= 300s"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_recovery_time_performance_metric_trend_log"
  - metric_name: "prompt_injection_detection_recovery_point_performance"
    formula: "AVG(data_loss_duration_seconds)"
    target: "<= 60s"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_recovery_point_performance_metric_trend_log"
  - metric_name: "prompt_injection_detection_failover_success_rate"
    formula: "COUNT(successful_failovers) / COUNT(total_failovers)"
    target: ">= 0.99"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_failover_success_rate_metric_trend_log"
  - metric_name: "prompt_injection_detection_continuity_assurance_score"
    formula: "MIN(control_assurance_checks_status)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_continuity_assurance_score_metric_trend_log"
  - metric_name: "prompt_injection_detection_resilience_maturity_score"
    formula: "resilience_maturity_level / 6.0"
    target: ">= 0.66"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_resilience_maturity_score_metric_trend_log"
  - metric_name: "prompt_injection_detection_service_restoration_rate"
    formula: "COUNT(restored_services) / COUNT(failed_services)"
    target: ">= 1.00"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Lead Resilience Engineer"
    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_service_restoration_rate_metric_trend_log"
  - metric_name: "prompt_injection_detection_resilience_validation_score"
    formula: "AVG(validation_tests_passed / total_validation_tests)"
    target: ">= 0.98"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
