controls:
  - control_id: "CTRL-RES-PROMPT-PROMPT_I-01"
    control_name: "prompt_injection_detection_failover_controls"
    control_type: "PREVENTATIVE"
    control_category: "RESILIENCE"
    control_objective: "Enforce automated failover to redundant nodes when Prompt Injection Detection nodes fail."
    security_rationale: "High-risk AI services must remain continuously available to prevent business disruption and safety hazards."
    implementation_guidance: "Deploy traffic routers that detect process timeouts and switch traffic to warm-standby containers."
    control_owner: "Lead Infrastructure Engineer"
    control_frequency: "TRANSACTION_BASED"
    monitoring_method: "Monitor router heartbeat checks and node connection states."
    validation_method: "Simulate primary node crash and verify failover time <= RTO limit."
    evidence_generated: "Signed failover validation logs stored in the continuity database."
    escalation_conditions: "Primary and secondary nodes fail simultaneously or failover takes > 30s."
    audit_considerations: "Review failover test reports and router route registries."
  - control_id: "CTRL-RES-PROMPT-PROMPT_I-02"
    control_name: "prompt_injection_detection_continuity_monitoring"
    control_type: "DETECTIVE"
    control_category: "MONITORING"
    control_objective: "Detect and flag any degradation in the running performance of Prompt Injection Detection systems."
    security_rationale: "Early detection of latency spikes or error count trends allows proactive remediation before complete outage."
    implementation_guidance: "Implement background monitoring scripts that calculate response times and error rates."
    control_owner: "Lead SRE Engineer"
    control_frequency: "CONTINUOUS"
    monitoring_method: "Compare runtime values with baseline warning and critical thresholds."
    validation_method: "Inject artificial process delays and confirm alerting dashboard changes state."
    evidence_generated: "Signed daily monitoring checks and metric logs."
    escalation_conditions: "Error count exceeds warning threshold for 3 consecutive check windows."
    audit_considerations: "Assess threshold settings and check log retention records."
decision_logic:
  escalation_trigger: "If system_survivability_score drops below thresholds, execute crisis response workflows."
  failover_rule: "If primary node is unreachable for 3 consecutive checks, execute failover."
