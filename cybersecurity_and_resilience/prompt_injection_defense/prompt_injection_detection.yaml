    evidence_generated: "prompt_injection_detection_resilience_validation_score_metric_trend_log"
  - metric_name: "prompt_injection_detection_business_continuity_effectiveness"
    formula: "AVG(bcp_tests_passed)"
    target: ">= 0.95"
    warning_threshold: "target - 0.05"
    critical_threshold: "target - 0.10"
    measurement_frequency: "CONTINUOUS"
