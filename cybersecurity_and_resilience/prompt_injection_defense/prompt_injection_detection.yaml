    data_source: "central_resilience_telemetry_db"
    evidence_generated: "prompt_injection_detection_business_continuity_effectiveness_metric_trend_log"
  - metric_name: "prompt_injection_detection_adaptive_response_effectiveness"
    formula: "AVG(adaptive_response_runs_success)"
