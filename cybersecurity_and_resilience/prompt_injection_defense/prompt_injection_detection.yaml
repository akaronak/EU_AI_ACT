purpose: "Define the resilience governance and continuity orchestration skill for Prompt Injection Detection under the Prompt Injection Defense domain. This framework governs operational survivability and disaster recovery by enforcing operational resilience, business continuity, disaster recovery, service survivability validation parameters."
scope: "Scope covers all enterprise systems, multi-agent frameworks, tool integrations, and operational pipelines governed by Prompt Injection Detection resilience operations."
objectives:
  - "Ensure high availability and fault tolerance of Prompt Injection Detection systems."
  - "Automate disaster recovery, failover, and graceful degradation for Prompt Injection Detection."
  - "Generate verifiable continuity evidence records and audit trails for regulatory compliance."
