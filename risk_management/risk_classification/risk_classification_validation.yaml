metrics:
  - metric_name: "risk_classification_validation_risk_exposure_score"
    formula: "calculated_exposure / maximum_exposure_limit"
    target: "0.01"
    warning_threshold: "0.03"
    critical_threshold: "0.05"
    measurement_frequency: "WEEKLY"
    owner: "Risk Officer"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Weekly Risk Exposure scorecard."
  - metric_name: "risk_classification_validation_residual_risk_score"
    formula: "inherent_risk_score * (1.00 - mitigation_effectiveness)"
    target: "0.01"
    warning_threshold: "0.03"
    critical_threshold: "0.05"
    measurement_frequency: "WEEKLY"
    owner: "Risk Officer"
    data_source: "violation_checks_db"
    evidence_generated: "Weekly Residual Risk scorecard."
  - metric_name: "risk_classification_validation_risk_treatment_effectiveness"
    formula: "COUNT(successful_treatments) / COUNT(risk_treatments)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Risk Officer"
    data_source: "compliance_ledger_vault"
    evidence_generated: "Weekly Treatment Effectiveness report."
  - metric_name: "risk_classification_validation_risk_assessment_coverage"
    formula: "COUNT(assessed_threats) / COUNT(total_identified_threats)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Risk Analyst"
    data_source: "telemetry_gateway_db"
    evidence_generated: "Weekly Assessment Coverage report."
