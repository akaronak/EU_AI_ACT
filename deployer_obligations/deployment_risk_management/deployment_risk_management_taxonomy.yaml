  bias_monitoring: "Audit outputs for demographic parity variations."
  drift_monitoring: "Compare production output embeddings with baseline vector profiles daily."
  incident_monitoring: "SIEM ingestion monitoring for anomaly alerts."
  safety_monitoring: "Continuous tracking of input prompt violations."
  compliance_monitoring: "Evaluate running compliance score against the 0.95 threshold."
  monitoring_assurance: "Regular system test runs simulating out-of-bounds telemetry values."
  monitoring_reporting: "Monthly compliance dashboards and automated board reports."
