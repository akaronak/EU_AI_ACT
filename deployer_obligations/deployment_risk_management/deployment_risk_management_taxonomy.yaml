  governance_indicators: "Check metric threshold crossings and validation delays."
metrics:
  - metric_name: "deployment_risk_management_taxonomy_deployment_compliance_score"
    formula: "COUNT(compliant_deployments) / COUNT(total_deployments)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Deployer Officer"
    data_source: "deployment_gateway_logs"
    evidence_generated: "Signed Deployment Authorization Token database entries."
  - metric_name: "deployment_risk_management_taxonomy_oversight_effectiveness_score"
    formula: "COUNT(reviewed_flagged_outputs) / COUNT(total_flagged_outputs)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.95"
    measurement_frequency: "DAILY"
    owner: "Oversight Lead"
    data_source: "oversight_dashboard_db"
    evidence_generated: "Daily output review compliance records."
  - metric_name: "deployment_risk_management_taxonomy_human_intervention_rate"
    formula: "COUNT(intervention_events) / COUNT(total_transactions)"
    target: "0.01"
    warning_threshold: "0.05"
    critical_threshold: "0.10"
    measurement_frequency: "CONTINUOUS"
    owner: "Oversight Lead"
    data_source: "intervention_log_db"
    evidence_generated: "Signed Intervention Validation Records."
  - metric_name: "deployment_risk_management_taxonomy_incident_reporting_timeliness"
    formula: "COUNT(reports_sent_within_sla) / COUNT(total_incidents)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "TRANSACTION_BASED"
    owner: "Chief Compliance Officer"
    data_source: "compliance_ledger_db"
    evidence_generated: "Incident Resolution Reports and delivery logs."
  - metric_name: "deployment_risk_management_taxonomy_deployment_validation_score"
    formula: "COUNT(successful_validation_checks) / COUNT(total_validation_checks)"
    target: "1.00"
    warning_threshold: "0.99"
    critical_threshold: "0.98"
    measurement_frequency: "WEEKLY"
    owner: "Oversight Lead"
    data_source: "validation_vault_db"
    evidence_generated: "Weekly Validation Reports."
