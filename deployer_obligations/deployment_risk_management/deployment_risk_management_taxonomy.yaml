  usage_restrictions:
    - "Do not share raw user inputs with third parties"
    - "Max tokens per request capped"
  usage_controls:
    - "CTRL-DEP-RISK-DEPLOY-03"
  usage_monitoring: "Continuous token counting and API boundary scanning."
