  evidence_integrity: "SHA-256 hashes stored in an immutable ledger database."
  evidence_lineage: "Map evidence items back to specific pipeline process logs."
  evidence_provenance: "Generated directly by authorized system daemons."
  evidence_validation: "Check digital signatures against key authority databases."
  evidence_confidence: 0.99
  evidence_retention: "5 years in compliant archives"
telemetry:
