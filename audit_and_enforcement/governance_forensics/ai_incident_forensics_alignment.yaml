decision_logic:
  decision_inputs:
    - ai_incident_forensics_alignment_severity_score
    - ai_incident_forensics_alignment_evidence_completeness
    - ai_incident_forensics_alignment_regulatory_context
    - ai_incident_forensics_alignment_risk_exposure_index
  decision_conditions:
    - ai_incident_forensics_alignment_critical_threshold_breach
    - ai_incident_forensics_alignment_evidence_integrity_failure
    - ai_incident_forensics_alignment_regulatory_notification_required
  decision_thresholds:
    critical_severity: ai_incident_forensics_alignment_severity_score >= 90
    high_severity: ai_incident_forensics_alignment_severity_score >= 70
    evidence_complete: ai_incident_forensics_alignment_evidence_completeness >= 0.98
  decision_rules:
    ai_incident_forensics_alignment_high_severity_violation:
      condition: ai_incident_forensics_alignment_severity_score >= 90
      action: initiate_ai_incident_forensics_alignment_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: ai_incident_forensics_alignment_investigation_report
    ai_incident_forensics_alignment_evidence_compromise_detected:
      condition: ai_incident_forensics_alignment_integrity_status == compromised
      action: activate_ai_incident_forensics_alignment_forensic_lockdown
      approval_required: ai_incident_forensics_alignment_forensic_lead
      evidence_required: ai_incident_forensics_alignment_integrity_alert_record
    ai_incident_forensics_alignment_enforcement_authorization:
      condition: ai_incident_forensics_alignment_violation_confirmed == true AND ai_incident_forensics_alignment_evidence_complete == true
      action: issue_ai_incident_forensics_alignment_enforcement_order
      approval_required: ai_incident_forensics_alignment_enforcement_officer
      evidence_required: ai_incident_forensics_alignment_violation_evidence_package
    ai_incident_forensics_alignment_regulator_inquiry_response:
      condition: ai_incident_forensics_alignment_regulator_request_received == true
      action: compile_ai_incident_forensics_alignment_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: ai_incident_forensics_alignment_regulatory_evidence_index
  decision_outputs:
    - ai_incident_forensics_alignment_enforcement_decision
    - ai_incident_forensics_alignment_escalation_notice
    - ai_incident_forensics_alignment_remediation_directive
    - ai_incident_forensics_alignment_audit_disposition
  approval_requirements:
    enforcement_actions: [ai_incident_forensics_alignment_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - ai_incident_forensics_alignment_severity_score >= 90
    - ai_incident_forensics_alignment_evidence_integrity_failure == true
    - ai_incident_forensics_alignment_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_ai_incident_forensics_alignment_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: ai_incident_forensics_alignment_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Ai Incident Forensics Alignment may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
