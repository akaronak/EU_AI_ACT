    condition: required_evidence_governance_violation_analysis < threshold
    action: BLOCK_SUBMISSION
  - rule: governance_violation_analysis_integrity_verified
    condition: integrity_status_governance_violation_analysis != verified
    action: QUARANTINE_AND_ESCALATE
  - rule: governance_violation_analysis_custody_intact
    condition: custody_gap_governance_violation_analysis == true
    action: INITIATE_FORENSIC_REVIEW
risk_considerations:
  regulatory_sanction:
    >
      Risk of regulatory sanction if Governance Violation Analysis controls fail; mitigated through
      preventive/detective controls and escalation.
  evidence_inadmissibility:
    >
      Risk of evidence inadmissibility if Governance Violation Analysis controls fail; mitigated
      through preventive/detective controls and escalation.
  enforcement_failure:
    >
      Risk of enforcement failure if Governance Violation Analysis controls fail; mitigated through
      preventive/detective controls and escalation.
  reputational_harm:
    >
      Risk of reputational harm if Governance Violation Analysis controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Governance Violation Analysis controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - governance_violation_analysis_control_failure
    - governance_violation_analysis_evidence_compromise
    - governance_violation_analysis_regulatory_non_compliance
    - governance_violation_analysis_enforcement_delay
  risk_events:
    - governance_violation_analysis_audit_finding_critical
    - governance_violation_analysis_investigation_escalation
    - governance_violation_analysis_sanction_exposure
    - governance_violation_analysis_market_surveillance_inquiry
  risk_indicators:
    - governance_violation_analysis_control_effectiveness_degradation
    - governance_violation_analysis_evidence_gap_rate
    - governance_violation_analysis_sla_breach_count
    - governance_violation_analysis_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    governance_violation_analysis_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: governance_violation_analysis_forensic_lead
    governance_violation_analysis_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    governance_violation_analysis_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: governance_violation_analysis_enforcement_officer
  risk_tolerance:
    governance_violation_analysis_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: governance_violation_analysis_risk_score >= 60
    critical: governance_violation_analysis_risk_score >= 85
  residual_risk:
    >
      Residual risk after Governance Violation Analysis controls documented in
      governance_violation_analysis_risk_register with quarterly review.
  risk_treatment:
    - governance_violation_analysis_preventive_control_reinforcement
    - governance_violation_analysis_detective_monitoring_enhancement
    - governance_violation_analysis_corrective_remediation_plan
  risk_monitoring:
    telemetry: governance_violation_analysis_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Governance Violation Analysis workflow events with provenance anchor and
      governance_violation_analysis_hash_chain_init
  evidence_collection:
    >
      Structured ingestion via governance_violation_analysis_collection_api with schema validation and
      classification
  evidence_validation:
    >
      Completeness, authenticity, and admissibility checks via
      governance_violation_analysis_validation_engine
  evidence_classification:
    >
      RESTRICTED/CONFIDENTIAL classification per
      governance_violation_analysis_data_classification_policy
  evidence_storage:
    >
      Write-once immutable storage in governance_violation_analysis_evidence_vault with access
      controls
  evidence_retention:
    >
      Retention per governance_violation_analysis_retention_schedule aligned with EU AI Act Article 18
      and legal hold
  evidence_archival:
    Long-term archival with governance_violation_analysis_integrity_verification before migration
  evidence_retrieval:
    Audited retrieval via governance_violation_analysis_retrieval_gateway with purpose logging
  evidence_disposal:
    >
      Authorized disposition with governance_violation_analysis_disposition_certificate and dual
      approval
chain_of_custody:
  custody_events:
    - governance_violation_analysis_capture_event
    - governance_violation_analysis_transfer_event
    - governance_violation_analysis_access_event
    - governance_violation_analysis_disposition_event
  custody_owners:
    primary: governance_violation_analysis_evidence_custodian
    secondary: governance_violation_analysis_forensic_lead
  custody_validation:
    method: governance_violation_analysis_dual_attestation_custody_verification
    frequency: per_transfer
  integrity_controls:
    - governance_violation_analysis_sha256_hash_chain
    - governance_violation_analysis_digital_signature
    - governance_violation_analysis_timestamp_authority
  tamper_detection:
    method: governance_violation_analysis_continuous_hash_verification
    alert_sla_minutes: 15
  evidence_integrity_scoring:
    formula: governance_violation_analysis_integrity_dimensions_weighted_score
    minimum_admissibility: 0.90
