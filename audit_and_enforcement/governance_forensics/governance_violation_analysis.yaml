purpose:
  >
    Establish production-grade Governance Violation Analysis governance within
    audit_and_enforcement/governance_forensics, delivering regulator-ready, audit-ready, and
    enforcement-ready controls for violation typology analysis and severity classification.
    Integrates with the EU AI Act governance ecosystem through machine-evaluable obligations,
    evidence preservation, and conformity-assessment-ready artifacts.
scope:
  >
    All organizational AI systems, governance processes, audit activities, enforcement actions,
    investigations, and evidence artifacts governed by Governance Violation Analysis across
    enterprise and cross-border operations within audit_and_enforcement/governance_forensics.
objectives:
  - Operationalize Governance Violation Analysis with regulator-defensible controls and evidence chains
  - Enable automated validation of Governance Violation Analysis conformance across governance_forensics
  - Preserve audit-grade and forensic-grade records for all Governance Violation Analysis activities
  - Support conformity assessments, notified body reviews, and market surveillance
  - Integrate Governance Violation Analysis with enterprise enforcement, investigation, and remediation workflows
  - Maintain continuous improvement and post-enforcement monitoring for Governance Violation Analysis
definitions:
  governance_violation_analysis_governance_domain:
    >
      The operational jurisdiction of Governance Violation Analysis encompassing controlled audit,
      enforcement, investigation, and evidence processes within governance_forensics.
  governance_violation_analysis_audit_evidence:
    >
      Machine-readable and human-readable records demonstrating Governance Violation Analysis control
      effectiveness, process adherence, and regulatory conformity.
  governance_violation_analysis_enforcement_action:
    >
      A documented restriction, corrective obligation, sanction, or operational intervention
      authorized through Governance Violation Analysis decision logic.
  governance_violation_analysis_forensic_artifact:
    >
      Tamper-evident record suitable for investigation, litigation, or regulatory proceedings produced
      by Governance Violation Analysis processes.
  governance_violation_analysis_traceability_chain:
    >
      Immutable linkage from triggering event through decisions, actions, and outcomes within
      Governance Violation Analysis operations.
  governance_violation_analysis_conformity_assertion:
    >
      Formal statement that Governance Violation Analysis requirements are met, supported by indexed
      evidence and validation attestations.
