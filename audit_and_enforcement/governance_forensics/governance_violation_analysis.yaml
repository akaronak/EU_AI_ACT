decision_logic:
  decision_inputs:
    - governance_violation_analysis_severity_score
    - governance_violation_analysis_evidence_completeness
    - governance_violation_analysis_regulatory_context
    - governance_violation_analysis_risk_exposure_index
  decision_conditions:
    - governance_violation_analysis_critical_threshold_breach
    - governance_violation_analysis_evidence_integrity_failure
    - governance_violation_analysis_regulatory_notification_required
  decision_thresholds:
    critical_severity: governance_violation_analysis_severity_score >= 90
    high_severity: governance_violation_analysis_severity_score >= 70
    evidence_complete: governance_violation_analysis_evidence_completeness >= 0.98
  decision_rules:
    governance_violation_analysis_high_severity_violation:
      condition: governance_violation_analysis_severity_score >= 90
      action: initiate_governance_violation_analysis_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: governance_violation_analysis_investigation_report
    governance_violation_analysis_evidence_compromise_detected:
      condition: governance_violation_analysis_integrity_status == compromised
      action: activate_governance_violation_analysis_forensic_lockdown
      approval_required: governance_violation_analysis_forensic_lead
      evidence_required: governance_violation_analysis_integrity_alert_record
    governance_violation_analysis_enforcement_authorization:
      condition: governance_violation_analysis_violation_confirmed == true AND governance_violation_analysis_evidence_complete == true
      action: issue_governance_violation_analysis_enforcement_order
      approval_required: governance_violation_analysis_enforcement_officer
      evidence_required: governance_violation_analysis_violation_evidence_package
    governance_violation_analysis_regulator_inquiry_response:
      condition: governance_violation_analysis_regulator_request_received == true
      action: compile_governance_violation_analysis_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: governance_violation_analysis_regulatory_evidence_index
  decision_outputs:
    - governance_violation_analysis_enforcement_decision
    - governance_violation_analysis_escalation_notice
    - governance_violation_analysis_remediation_directive
    - governance_violation_analysis_audit_disposition
  approval_requirements:
    enforcement_actions: [governance_violation_analysis_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - governance_violation_analysis_severity_score >= 90
    - governance_violation_analysis_evidence_integrity_failure == true
    - governance_violation_analysis_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_governance_violation_analysis_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: governance_violation_analysis_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Governance Violation Analysis may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
