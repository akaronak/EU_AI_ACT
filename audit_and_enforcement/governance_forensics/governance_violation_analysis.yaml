maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Governance Violation Analysis activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Governance Violation Analysis procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - governance_violation_analysis_procedure_checklist
    required_evidence:
      - governance_violation_analysis_process_log
    required_metrics:
      - governance_violation_analysis_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Governance Violation Analysis enterprise-wide.
    required_capabilities:
      - governance_violation_analysis_standard_control_set
    required_controls:
      - governance_violation_analysis_control_register
    required_evidence:
      - governance_violation_analysis_audit_evidence
    required_metrics:
      - governance_violation_analysis_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Governance Violation Analysis with KPI optimization.
    required_capabilities:
      - governance_violation_analysis_automated_controls
    required_controls:
      - governance_violation_analysis_telemetry_controls
    required_evidence:
      - governance_violation_analysis_assurance_package
    required_metrics:
      - governance_violation_analysis_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Governance Violation Analysis with predictive analytics.
    required_capabilities:
      - governance_violation_analysis_autonomous_governance
    required_controls:
      - governance_violation_analysis_adaptive_controls
    required_evidence:
      - governance_violation_analysis_regulator_ready_portfolio
    required_metrics:
      - governance_violation_analysis_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - governance_violation_analysis_report
  - governance_violation_analysis_evidence_package
  - governance_violation_analysis_attestation
  - governance_violation_analysis_enforcement_record
artifacts:
  - name: governance_violation_analysis_policy
    retention_years: 10
    classification: RESTRICTED
  - name: governance_violation_analysis_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: governance_violation_analysis_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: governance_violation_analysis_template
    retention_years: 10
    classification: RESTRICTED
records:
  - governance_violation_analysis_case_record
  - governance_violation_analysis_audit_record
  - governance_violation_analysis_enforcement_record
  - governance_violation_analysis_remediation_record
monitoring:
  continuous:
    - governance_violation_analysis_control_telemetry
    - governance_violation_analysis_evidence_integrity_feed
    - governance_violation_analysis_escalation_queue
  periodic:
    - governance_violation_analysis_quarterly_assurance_review
continuous_improvement:
  >
    Quarterly review of Governance Violation Analysis effectiveness, regulatory change impact
    assessment, and control optimization based on audit findings and enforcement outcomes.
exceptions:
  - exception_type: regulatory_override
    authority: Chief Compliance Officer with Legal Counsel concurrence
    documentation: mandatory_exception_register_entry
escalation:
  level_1:
    trigger: moderate_finding
    sla_minutes: 240
    authority: governance_violation_analysis_owner
  level_2:
    trigger: high_finding
    sla_minutes: 120
    authority: governance_violation_analysis_owner
  level_3:
    trigger: critical_finding
    sla_minutes: 60
    authority: governance_violation_analysis_owner
  level_4:
    trigger: regulatory_notification_required
    sla_minutes: 30
    authority: governance_violation_analysis_owner
versioning:
  current: 1.0.0
  changelog:
    - version: 1.0.0
      date: 2026-06-11
      changes: Initial production release for Governance Violation Analysis
