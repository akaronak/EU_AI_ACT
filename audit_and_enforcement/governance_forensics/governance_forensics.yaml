  decision_inputs:
    - governance_forensics_severity_score
    - governance_forensics_evidence_completeness
    - governance_forensics_regulatory_context
    - governance_forensics_risk_exposure_index
  decision_conditions:
    - governance_forensics_critical_threshold_breach
    - governance_forensics_evidence_integrity_failure
    - governance_forensics_regulatory_notification_required
  decision_thresholds:
    critical_severity: governance_forensics_severity_score >= 90
    high_severity: governance_forensics_severity_score >= 70
    evidence_complete: governance_forensics_evidence_completeness >= 0.98
  decision_rules:
    governance_forensics_high_severity_violation:
      condition: governance_forensics_severity_score >= 90
      action: initiate_governance_forensics_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: governance_forensics_investigation_report
    governance_forensics_evidence_compromise_detected:
      condition: governance_forensics_integrity_status == compromised
      action: activate_governance_forensics_forensic_lockdown
      approval_required: governance_forensics_forensic_lead
      evidence_required: governance_forensics_integrity_alert_record
    governance_forensics_enforcement_authorization:
      condition: governance_forensics_violation_confirmed == true AND governance_forensics_evidence_complete == true
      action: issue_governance_forensics_enforcement_order
      approval_required: governance_forensics_enforcement_officer
      evidence_required: governance_forensics_violation_evidence_package
    governance_forensics_regulator_inquiry_response:
      condition: governance_forensics_regulator_request_received == true
      action: compile_governance_forensics_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: governance_forensics_regulatory_evidence_index
  decision_outputs:
    - governance_forensics_enforcement_decision
    - governance_forensics_escalation_notice
    - governance_forensics_remediation_directive
    - governance_forensics_audit_disposition
  approval_requirements:
    enforcement_actions: [governance_forensics_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - governance_forensics_severity_score >= 90
    - governance_forensics_evidence_integrity_failure == true
    - governance_forensics_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_governance_forensics_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: governance_forensics_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Governance Forensics may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
