  forensic_governance_framework_operator:
    responsibilities:
      - Executes Forensic Governance Framework workflows and maintains operational records
  forensic_governance_framework_auditor:
    responsibilities:
      - Independently validates Forensic Governance Framework control effectiveness and evidence sufficiency
  forensic_governance_framework_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for Forensic Governance Framework investigations
  forensic_governance_framework_enforcement_officer:
    responsibilities:
