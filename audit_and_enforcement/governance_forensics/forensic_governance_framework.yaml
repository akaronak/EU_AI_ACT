  - rule: forensic_governance_framework_integrity_verified
    condition: integrity_status_forensic_governance_framework != verified
    action: QUARANTINE_AND_ESCALATE
  - rule: forensic_governance_framework_custody_intact
    condition: custody_gap_forensic_governance_framework == true
    action: INITIATE_FORENSIC_REVIEW
