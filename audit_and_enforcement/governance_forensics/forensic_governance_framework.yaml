decision_logic:
  decision_inputs:
    - forensic_governance_framework_severity_score
    - forensic_governance_framework_evidence_completeness
    - forensic_governance_framework_regulatory_context
    - forensic_governance_framework_risk_exposure_index
  decision_conditions:
    - forensic_governance_framework_critical_threshold_breach
    - forensic_governance_framework_evidence_integrity_failure
    - forensic_governance_framework_regulatory_notification_required
  decision_thresholds:
    critical_severity: forensic_governance_framework_severity_score >= 90
    high_severity: forensic_governance_framework_severity_score >= 70
    evidence_complete: forensic_governance_framework_evidence_completeness >= 0.98
  decision_rules:
    forensic_governance_framework_high_severity_violation:
      condition: forensic_governance_framework_severity_score >= 90
      action: initiate_forensic_governance_framework_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: forensic_governance_framework_investigation_report
    forensic_governance_framework_evidence_compromise_detected:
      condition: forensic_governance_framework_integrity_status == compromised
      action: activate_forensic_governance_framework_forensic_lockdown
      approval_required: forensic_governance_framework_forensic_lead
      evidence_required: forensic_governance_framework_integrity_alert_record
    forensic_governance_framework_enforcement_authorization:
      condition: forensic_governance_framework_violation_confirmed == true AND forensic_governance_framework_evidence_complete == true
      action: issue_forensic_governance_framework_enforcement_order
      approval_required: forensic_governance_framework_enforcement_officer
      evidence_required: forensic_governance_framework_violation_evidence_package
    forensic_governance_framework_regulator_inquiry_response:
      condition: forensic_governance_framework_regulator_request_received == true
      action: compile_forensic_governance_framework_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: forensic_governance_framework_regulatory_evidence_index
  decision_outputs:
    - forensic_governance_framework_enforcement_decision
    - forensic_governance_framework_escalation_notice
    - forensic_governance_framework_remediation_directive
    - forensic_governance_framework_audit_disposition
  approval_requirements:
    enforcement_actions: [forensic_governance_framework_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - forensic_governance_framework_severity_score >= 90
    - forensic_governance_framework_evidence_integrity_failure == true
    - forensic_governance_framework_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_forensic_governance_framework_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: forensic_governance_framework_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Forensic Governance Framework may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
