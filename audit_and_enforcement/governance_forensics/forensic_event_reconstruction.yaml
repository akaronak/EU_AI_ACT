decision_logic:
  decision_inputs:
    - forensic_event_reconstruction_severity_score
    - forensic_event_reconstruction_evidence_completeness
    - forensic_event_reconstruction_regulatory_context
    - forensic_event_reconstruction_risk_exposure_index
  decision_conditions:
    - forensic_event_reconstruction_critical_threshold_breach
    - forensic_event_reconstruction_evidence_integrity_failure
    - forensic_event_reconstruction_regulatory_notification_required
  decision_thresholds:
    critical_severity: forensic_event_reconstruction_severity_score >= 90
    high_severity: forensic_event_reconstruction_severity_score >= 70
    evidence_complete: forensic_event_reconstruction_evidence_completeness >= 0.98
  decision_rules:
    forensic_event_reconstruction_high_severity_violation:
      condition: forensic_event_reconstruction_severity_score >= 90
      action: initiate_forensic_event_reconstruction_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: forensic_event_reconstruction_investigation_report
    forensic_event_reconstruction_evidence_compromise_detected:
      condition: forensic_event_reconstruction_integrity_status == compromised
      action: activate_forensic_event_reconstruction_forensic_lockdown
      approval_required: forensic_event_reconstruction_forensic_lead
      evidence_required: forensic_event_reconstruction_integrity_alert_record
    forensic_event_reconstruction_enforcement_authorization:
      condition: forensic_event_reconstruction_violation_confirmed == true AND forensic_event_reconstruction_evidence_complete == true
      action: issue_forensic_event_reconstruction_enforcement_order
      approval_required: forensic_event_reconstruction_enforcement_officer
      evidence_required: forensic_event_reconstruction_violation_evidence_package
    forensic_event_reconstruction_regulator_inquiry_response:
      condition: forensic_event_reconstruction_regulator_request_received == true
      action: compile_forensic_event_reconstruction_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: forensic_event_reconstruction_regulatory_evidence_index
  decision_outputs:
    - forensic_event_reconstruction_enforcement_decision
    - forensic_event_reconstruction_escalation_notice
    - forensic_event_reconstruction_remediation_directive
    - forensic_event_reconstruction_audit_disposition
  approval_requirements:
    enforcement_actions: [forensic_event_reconstruction_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - forensic_event_reconstruction_severity_score >= 90
    - forensic_event_reconstruction_evidence_integrity_failure == true
    - forensic_event_reconstruction_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_forensic_event_reconstruction_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: forensic_event_reconstruction_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Forensic Event Reconstruction may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
