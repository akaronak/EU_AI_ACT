maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Forensic Chain Of Custody activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Forensic Chain Of Custody procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - forensic_chain_of_custody_procedure_checklist
    required_evidence:
      - forensic_chain_of_custody_process_log
    required_metrics:
      - forensic_chain_of_custody_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Forensic Chain Of Custody enterprise-wide.
    required_capabilities:
      - forensic_chain_of_custody_standard_control_set
    required_controls:
      - forensic_chain_of_custody_control_register
    required_evidence:
      - forensic_chain_of_custody_audit_evidence
    required_metrics:
      - forensic_chain_of_custody_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Forensic Chain Of Custody with KPI optimization.
    required_capabilities:
      - forensic_chain_of_custody_automated_controls
    required_controls:
      - forensic_chain_of_custody_telemetry_controls
    required_evidence:
      - forensic_chain_of_custody_assurance_package
    required_metrics:
      - forensic_chain_of_custody_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Forensic Chain Of Custody with predictive analytics.
    required_capabilities:
      - forensic_chain_of_custody_autonomous_governance
    required_controls:
      - forensic_chain_of_custody_adaptive_controls
    required_evidence:
      - forensic_chain_of_custody_regulator_ready_portfolio
    required_metrics:
      - forensic_chain_of_custody_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - forensic_chain_of_custody_report
  - forensic_chain_of_custody_evidence_package
  - forensic_chain_of_custody_attestation
  - forensic_chain_of_custody_enforcement_record
artifacts:
  - name: forensic_chain_of_custody_policy
    retention_years: 10
    classification: RESTRICTED
  - name: forensic_chain_of_custody_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: forensic_chain_of_custody_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: forensic_chain_of_custody_template
    retention_years: 10
    classification: RESTRICTED
records:
