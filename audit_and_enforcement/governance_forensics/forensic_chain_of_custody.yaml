decision_logic:
  decision_inputs:
    - forensic_chain_of_custody_severity_score
    - forensic_chain_of_custody_evidence_completeness
    - forensic_chain_of_custody_regulatory_context
    - forensic_chain_of_custody_risk_exposure_index
  decision_conditions:
    - forensic_chain_of_custody_critical_threshold_breach
    - forensic_chain_of_custody_evidence_integrity_failure
    - forensic_chain_of_custody_regulatory_notification_required
  decision_thresholds:
    critical_severity: forensic_chain_of_custody_severity_score >= 90
    high_severity: forensic_chain_of_custody_severity_score >= 70
    evidence_complete: forensic_chain_of_custody_evidence_completeness >= 0.98
  decision_rules:
    forensic_chain_of_custody_high_severity_violation:
      condition: forensic_chain_of_custody_severity_score >= 90
      action: initiate_forensic_chain_of_custody_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: forensic_chain_of_custody_investigation_report
    forensic_chain_of_custody_evidence_compromise_detected:
      condition: forensic_chain_of_custody_integrity_status == compromised
      action: activate_forensic_chain_of_custody_forensic_lockdown
      approval_required: forensic_chain_of_custody_forensic_lead
      evidence_required: forensic_chain_of_custody_integrity_alert_record
    forensic_chain_of_custody_enforcement_authorization:
      condition: forensic_chain_of_custody_violation_confirmed == true AND forensic_chain_of_custody_evidence_complete == true
      action: issue_forensic_chain_of_custody_enforcement_order
      approval_required: forensic_chain_of_custody_enforcement_officer
      evidence_required: forensic_chain_of_custody_violation_evidence_package
    forensic_chain_of_custody_regulator_inquiry_response:
      condition: forensic_chain_of_custody_regulator_request_received == true
      action: compile_forensic_chain_of_custody_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: forensic_chain_of_custody_regulatory_evidence_index
  decision_outputs:
    - forensic_chain_of_custody_enforcement_decision
    - forensic_chain_of_custody_escalation_notice
    - forensic_chain_of_custody_remediation_directive
    - forensic_chain_of_custody_audit_disposition
  approval_requirements:
    enforcement_actions: [forensic_chain_of_custody_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - forensic_chain_of_custody_severity_score >= 90
    - forensic_chain_of_custody_evidence_integrity_failure == true
    - forensic_chain_of_custody_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_forensic_chain_of_custody_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: forensic_chain_of_custody_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Forensic Chain Of Custody may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
