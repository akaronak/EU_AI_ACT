decision_logic:
  decision_inputs:
    - forensic_integrity_validation_severity_score
    - forensic_integrity_validation_evidence_completeness
    - forensic_integrity_validation_regulatory_context
    - forensic_integrity_validation_risk_exposure_index
  decision_conditions:
    - forensic_integrity_validation_critical_threshold_breach
    - forensic_integrity_validation_evidence_integrity_failure
    - forensic_integrity_validation_regulatory_notification_required
  decision_thresholds:
    critical_severity: forensic_integrity_validation_severity_score >= 90
    high_severity: forensic_integrity_validation_severity_score >= 70
    evidence_complete: forensic_integrity_validation_evidence_completeness >= 0.98
  decision_rules:
    forensic_integrity_validation_high_severity_violation:
      condition: forensic_integrity_validation_severity_score >= 90
      action: initiate_forensic_integrity_validation_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: forensic_integrity_validation_investigation_report
    forensic_integrity_validation_evidence_compromise_detected:
      condition: forensic_integrity_validation_integrity_status == compromised
      action: activate_forensic_integrity_validation_forensic_lockdown
      approval_required: forensic_integrity_validation_forensic_lead
      evidence_required: forensic_integrity_validation_integrity_alert_record
    forensic_integrity_validation_enforcement_authorization:
      condition: forensic_integrity_validation_violation_confirmed == true AND forensic_integrity_validation_evidence_complete == true
      action: issue_forensic_integrity_validation_enforcement_order
      approval_required: forensic_integrity_validation_enforcement_officer
      evidence_required: forensic_integrity_validation_violation_evidence_package
    forensic_integrity_validation_regulator_inquiry_response:
      condition: forensic_integrity_validation_regulator_request_received == true
      action: compile_forensic_integrity_validation_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: forensic_integrity_validation_regulatory_evidence_index
  decision_outputs:
    - forensic_integrity_validation_enforcement_decision
    - forensic_integrity_validation_escalation_notice
    - forensic_integrity_validation_remediation_directive
    - forensic_integrity_validation_audit_disposition
  approval_requirements:
    enforcement_actions: [forensic_integrity_validation_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - forensic_integrity_validation_severity_score >= 90
    - forensic_integrity_validation_evidence_integrity_failure == true
    - forensic_integrity_validation_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_forensic_integrity_validation_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: forensic_integrity_validation_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Forensic Integrity Validation may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
