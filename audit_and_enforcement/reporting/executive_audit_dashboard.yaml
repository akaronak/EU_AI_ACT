decision_logic:
  decision_inputs:
    - executive_audit_dashboard_severity_score
    - executive_audit_dashboard_evidence_completeness
    - executive_audit_dashboard_regulatory_context
    - executive_audit_dashboard_risk_exposure_index
  decision_conditions:
    - executive_audit_dashboard_critical_threshold_breach
    - executive_audit_dashboard_evidence_integrity_failure
    - executive_audit_dashboard_regulatory_notification_required
  decision_thresholds:
    critical_severity: executive_audit_dashboard_severity_score >= 90
    high_severity: executive_audit_dashboard_severity_score >= 70
    evidence_complete: executive_audit_dashboard_evidence_completeness >= 0.98
  decision_rules:
    executive_audit_dashboard_high_severity_violation:
      condition: executive_audit_dashboard_severity_score >= 90
      action: initiate_executive_audit_dashboard_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: executive_audit_dashboard_investigation_report
    executive_audit_dashboard_evidence_compromise_detected:
      condition: executive_audit_dashboard_integrity_status == compromised
      action: activate_executive_audit_dashboard_forensic_lockdown
      approval_required: executive_audit_dashboard_forensic_lead
      evidence_required: executive_audit_dashboard_integrity_alert_record
    executive_audit_dashboard_enforcement_authorization:
      condition: executive_audit_dashboard_violation_confirmed == true AND executive_audit_dashboard_evidence_complete == true
      action: issue_executive_audit_dashboard_enforcement_order
      approval_required: executive_audit_dashboard_enforcement_officer
      evidence_required: executive_audit_dashboard_violation_evidence_package
    executive_audit_dashboard_regulator_inquiry_response:
      condition: executive_audit_dashboard_regulator_request_received == true
      action: compile_executive_audit_dashboard_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: executive_audit_dashboard_regulatory_evidence_index
  decision_outputs:
    - executive_audit_dashboard_enforcement_decision
    - executive_audit_dashboard_escalation_notice
    - executive_audit_dashboard_remediation_directive
    - executive_audit_dashboard_audit_disposition
  approval_requirements:
    enforcement_actions: [executive_audit_dashboard_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - executive_audit_dashboard_severity_score >= 90
    - executive_audit_dashboard_evidence_integrity_failure == true
    - executive_audit_dashboard_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_executive_audit_dashboard_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: executive_audit_dashboard_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Executive Audit Dashboard may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
