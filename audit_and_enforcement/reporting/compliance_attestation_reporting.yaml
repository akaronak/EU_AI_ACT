risk_model:
  risk_sources:
    - compliance_attestation_reporting_control_failure
    - compliance_attestation_reporting_evidence_compromise
    - compliance_attestation_reporting_regulatory_non_compliance
    - compliance_attestation_reporting_enforcement_delay
  risk_events:
    - compliance_attestation_reporting_audit_finding_critical
    - compliance_attestation_reporting_investigation_escalation
    - compliance_attestation_reporting_sanction_exposure
    - compliance_attestation_reporting_market_surveillance_inquiry
  risk_indicators:
    - compliance_attestation_reporting_control_effectiveness_degradation
    - compliance_attestation_reporting_evidence_gap_rate
    - compliance_attestation_reporting_sla_breach_count
    - compliance_attestation_reporting_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    compliance_attestation_reporting_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: compliance_attestation_reporting_forensic_lead
    compliance_attestation_reporting_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    compliance_attestation_reporting_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: compliance_attestation_reporting_enforcement_officer
  risk_tolerance:
    compliance_attestation_reporting_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: compliance_attestation_reporting_risk_score >= 60
    critical: compliance_attestation_reporting_risk_score >= 85
  residual_risk:
    >
      Residual risk after Compliance Attestation Reporting controls documented in
      compliance_attestation_reporting_risk_register with quarterly review.
  risk_treatment:
    - compliance_attestation_reporting_preventive_control_reinforcement
    - compliance_attestation_reporting_detective_monitoring_enhancement
    - compliance_attestation_reporting_corrective_remediation_plan
  risk_monitoring:
    telemetry: compliance_attestation_reporting_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
