risk_model:
  risk_sources:
    - enforcement_assurance_reporting_control_failure
    - enforcement_assurance_reporting_evidence_compromise
    - enforcement_assurance_reporting_regulatory_non_compliance
    - enforcement_assurance_reporting_enforcement_delay
  risk_events:
    - enforcement_assurance_reporting_audit_finding_critical
    - enforcement_assurance_reporting_investigation_escalation
    - enforcement_assurance_reporting_sanction_exposure
    - enforcement_assurance_reporting_market_surveillance_inquiry
  risk_indicators:
    - enforcement_assurance_reporting_control_effectiveness_degradation
    - enforcement_assurance_reporting_evidence_gap_rate
    - enforcement_assurance_reporting_sla_breach_count
    - enforcement_assurance_reporting_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    enforcement_assurance_reporting_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: enforcement_assurance_reporting_forensic_lead
    enforcement_assurance_reporting_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    enforcement_assurance_reporting_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: enforcement_assurance_reporting_enforcement_officer
  risk_tolerance:
    enforcement_assurance_reporting_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: enforcement_assurance_reporting_risk_score >= 60
    critical: enforcement_assurance_reporting_risk_score >= 85
  residual_risk:
    >
      Residual risk after Enforcement Assurance Reporting controls documented in
      enforcement_assurance_reporting_risk_register with quarterly review.
  risk_treatment:
    - enforcement_assurance_reporting_preventive_control_reinforcement
    - enforcement_assurance_reporting_detective_monitoring_enhancement
    - enforcement_assurance_reporting_corrective_remediation_plan
  risk_monitoring:
    telemetry: enforcement_assurance_reporting_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
