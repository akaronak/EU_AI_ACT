  reporting_framework:
    >
      Structured reporting for Regulator Reporting covering executive, board, regulatory, audit,
      forensic, and attestation consumers.
  report_types:
    - regulator_reporting_status_report
    - regulator_reporting_compliance_report
    - regulator_reporting_enforcement_report
    - regulator_reporting_executive_summary
  reporting_frequency:
    operational: weekly
    compliance: monthly
    executive: quarterly
    regulatory: on_demand
  reporting_owners: [regulator_reporting_owner, regulatory_liaison]
  reporting_consumers: [board_audit_committee, regulators, internal_audit, executive_leadership]
