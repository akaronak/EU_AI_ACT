decision_logic:
  decision_inputs:
    - regulator_reporting_severity_score
    - regulator_reporting_evidence_completeness
    - regulator_reporting_regulatory_context
    - regulator_reporting_risk_exposure_index
  decision_conditions:
    - regulator_reporting_critical_threshold_breach
    - regulator_reporting_evidence_integrity_failure
    - regulator_reporting_regulatory_notification_required
  decision_thresholds:
    critical_severity: regulator_reporting_severity_score >= 90
    high_severity: regulator_reporting_severity_score >= 70
    evidence_complete: regulator_reporting_evidence_completeness >= 0.98
  decision_rules:
    regulator_reporting_high_severity_violation:
      condition: regulator_reporting_severity_score >= 90
      action: initiate_regulator_reporting_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: regulator_reporting_investigation_report
    regulator_reporting_evidence_compromise_detected:
      condition: regulator_reporting_integrity_status == compromised
      action: activate_regulator_reporting_forensic_lockdown
      approval_required: regulator_reporting_forensic_lead
      evidence_required: regulator_reporting_integrity_alert_record
    regulator_reporting_enforcement_authorization:
      condition: regulator_reporting_violation_confirmed == true AND regulator_reporting_evidence_complete == true
      action: issue_regulator_reporting_enforcement_order
      approval_required: regulator_reporting_enforcement_officer
      evidence_required: regulator_reporting_violation_evidence_package
    regulator_reporting_regulator_inquiry_response:
      condition: regulator_reporting_regulator_request_received == true
      action: compile_regulator_reporting_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: regulator_reporting_regulatory_evidence_index
  decision_outputs:
    - regulator_reporting_enforcement_decision
    - regulator_reporting_escalation_notice
    - regulator_reporting_remediation_directive
    - regulator_reporting_audit_disposition
  approval_requirements:
    enforcement_actions: [regulator_reporting_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - regulator_reporting_severity_score >= 90
    - regulator_reporting_evidence_integrity_failure == true
    - regulator_reporting_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_regulator_reporting_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: regulator_reporting_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Regulator Reporting may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
