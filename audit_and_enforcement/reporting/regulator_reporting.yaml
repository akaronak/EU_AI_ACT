controls:
  - control_id: AAE-REP-REGULATOR_-REGULATOREX
    control_name: regulator_executive_dashboard_data_validator
    control_category: detective
    control_objective:
      >
        Operational control ensuring executive dashboard data validator for Regulator Reporting across
        reporting.
    governance_rationale:
      >
        regulator_executive_dashboard_data_validator is required to govern Regulator Reporting risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected reporting
        failures.
    implementation_guidance:
      >
        Implement regulator_executive_dashboard_data_validator as automated policy in
        regulator_reporting orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: regulator_executive_dashboard_data_validator_continuous_telemetry_dashboard
    validation_method:
      regulator_executive_dashboard_data_validator_quarterly_design_and_operating_effectiveness_test
    testing_method:
      regulator_executive_dashboard_data_validator_statistical_sampling_with_exception_tracking
    control_owner: regulator_reporting_control_owner
    evidence_generated: regulator_executive_dashboard_data_validator_control_execution_log
    audit_considerations:
      >
        Auditors verify regulator_executive_dashboard_data_validator design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
