controls:
  - control_id: AAE-AUD-DECISION_T-DECISIONTRA
    control_name: decision_trace_link_integrity_validator
    control_category: detective
    control_objective:
      >
        Operational control ensuring trace link integrity validator for Decision Traceability across
        audit_traceability.
    governance_rationale:
      >
        decision_trace_link_integrity_validator is required to govern Decision Traceability risks under
        EU AI Act and enterprise audit-enforcement policy; failure enables undetected audit traceability
        failures.
    implementation_guidance:
      >
        Implement decision_trace_link_integrity_validator as automated policy in decision_traceability
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: decision_trace_link_integrity_validator_continuous_telemetry_dashboard
    validation_method:
      decision_trace_link_integrity_validator_quarterly_design_and_operating_effectiveness_test
    testing_method:
      decision_trace_link_integrity_validator_statistical_sampling_with_exception_tracking
    control_owner: decision_traceability_control_owner
    evidence_generated: decision_trace_link_integrity_validator_control_execution_log
    audit_considerations:
      >
        Auditors verify decision_trace_link_integrity_validator design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        decision_trace_link_integrity_validator outputs may trigger enforcement under
        decision_traceability escalation rules.
