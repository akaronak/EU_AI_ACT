maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Decision Traceability activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Decision Traceability procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - decision_traceability_procedure_checklist
    required_evidence:
      - decision_traceability_process_log
    required_metrics:
      - decision_traceability_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Decision Traceability enterprise-wide.
    required_capabilities:
      - decision_traceability_standard_control_set
    required_controls:
      - decision_traceability_control_register
    required_evidence:
      - decision_traceability_audit_evidence
    required_metrics:
      - decision_traceability_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Decision Traceability with KPI optimization.
    required_capabilities:
      - decision_traceability_automated_controls
    required_controls:
      - decision_traceability_telemetry_controls
    required_evidence:
      - decision_traceability_assurance_package
    required_metrics:
      - decision_traceability_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Decision Traceability with predictive analytics.
    required_capabilities:
      - decision_traceability_autonomous_governance
    required_controls:
      - decision_traceability_adaptive_controls
