decision_logic:
  decision_inputs:
    - decision_traceability_severity_score
    - decision_traceability_evidence_completeness
    - decision_traceability_regulatory_context
    - decision_traceability_risk_exposure_index
  decision_conditions:
    - decision_traceability_critical_threshold_breach
    - decision_traceability_evidence_integrity_failure
    - decision_traceability_regulatory_notification_required
  decision_thresholds:
    critical_severity: decision_traceability_severity_score >= 90
    high_severity: decision_traceability_severity_score >= 70
    evidence_complete: decision_traceability_evidence_completeness >= 0.98
  decision_rules:
    decision_traceability_high_severity_violation:
      condition: decision_traceability_severity_score >= 90
      action: initiate_decision_traceability_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: decision_traceability_investigation_report
    decision_traceability_evidence_compromise_detected:
      condition: decision_traceability_integrity_status == compromised
      action: activate_decision_traceability_forensic_lockdown
      approval_required: decision_traceability_forensic_lead
      evidence_required: decision_traceability_integrity_alert_record
    decision_traceability_enforcement_authorization:
      condition: decision_traceability_violation_confirmed == true AND decision_traceability_evidence_complete == true
      action: issue_decision_traceability_enforcement_order
      approval_required: decision_traceability_enforcement_officer
      evidence_required: decision_traceability_violation_evidence_package
    decision_traceability_regulator_inquiry_response:
      condition: decision_traceability_regulator_request_received == true
      action: compile_decision_traceability_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: decision_traceability_regulatory_evidence_index
  decision_outputs:
    - decision_traceability_enforcement_decision
    - decision_traceability_escalation_notice
    - decision_traceability_remediation_directive
    - decision_traceability_audit_disposition
  approval_requirements:
    enforcement_actions: [decision_traceability_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - decision_traceability_severity_score >= 90
    - decision_traceability_evidence_integrity_failure == true
    - decision_traceability_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_decision_traceability_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: decision_traceability_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Decision Traceability may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
