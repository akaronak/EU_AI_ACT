    - model_activity_logging_evidence_integrity_failure
    - model_activity_logging_regulatory_notification_required
  decision_thresholds:
    critical_severity: model_activity_logging_severity_score >= 90
    high_severity: model_activity_logging_severity_score >= 70
    evidence_complete: model_activity_logging_evidence_completeness >= 0.98
  decision_rules:
    model_activity_logging_high_severity_violation:
      condition: model_activity_logging_severity_score >= 90
      action: initiate_model_activity_logging_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: model_activity_logging_investigation_report
    model_activity_logging_evidence_compromise_detected:
      condition: model_activity_logging_integrity_status == compromised
      action: activate_model_activity_logging_forensic_lockdown
      approval_required: model_activity_logging_forensic_lead
      evidence_required: model_activity_logging_integrity_alert_record
    model_activity_logging_enforcement_authorization:
      condition: model_activity_logging_violation_confirmed == true AND model_activity_logging_evidence_complete == true
      action: issue_model_activity_logging_enforcement_order
      approval_required: model_activity_logging_enforcement_officer
      evidence_required: model_activity_logging_violation_evidence_package
    model_activity_logging_regulator_inquiry_response:
      condition: model_activity_logging_regulator_request_received == true
      action: compile_model_activity_logging_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: model_activity_logging_regulatory_evidence_index
  decision_outputs:
    - model_activity_logging_enforcement_decision
    - model_activity_logging_escalation_notice
    - model_activity_logging_remediation_directive
    - model_activity_logging_audit_disposition
  approval_requirements:
    enforcement_actions: [model_activity_logging_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - model_activity_logging_severity_score >= 90
    - model_activity_logging_evidence_integrity_failure == true
    - model_activity_logging_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_model_activity_logging_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: model_activity_logging_override_register_entry
    dual_approval: true
  regulatory_implications:
