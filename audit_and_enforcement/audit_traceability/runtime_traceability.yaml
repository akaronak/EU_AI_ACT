requirements:
  legal:
    >
      Runtime Traceability must satisfy legal requirements for end-to-end trace linkage across
      systems, decisions, and runtime events including documented procedures, accountable roles,
      measurable SLAs, and evidence retention aligned with EU AI Act and ISO 19011.
