      evidence_required: runtime_traceability_investigation_report
    runtime_traceability_evidence_compromise_detected:
      condition: runtime_traceability_integrity_status == compromised
      action: activate_runtime_traceability_forensic_lockdown
      approval_required: runtime_traceability_forensic_lead
      evidence_required: runtime_traceability_integrity_alert_record
    runtime_traceability_enforcement_authorization:
      condition: runtime_traceability_violation_confirmed == true AND runtime_traceability_evidence_complete == true
      action: issue_runtime_traceability_enforcement_order
      approval_required: runtime_traceability_enforcement_officer
      evidence_required: runtime_traceability_violation_evidence_package
    runtime_traceability_regulator_inquiry_response:
