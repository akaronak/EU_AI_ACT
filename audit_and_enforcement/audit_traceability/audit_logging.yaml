    >
      Structured reporting for Audit Logging covering executive, board, regulatory, audit, forensic,
      and attestation consumers.
  report_types:
    - audit_logging_status_report
    - audit_logging_compliance_report
    - audit_logging_enforcement_report
    - audit_logging_executive_summary
  reporting_frequency:
    operational: weekly
    compliance: monthly
    executive: quarterly
    regulatory: on_demand
