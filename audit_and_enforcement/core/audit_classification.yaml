reporting_requirements:
  reporting_framework:
    >
      Structured reporting for Audit Classification covering executive, board, regulatory, audit,
      forensic, and attestation consumers.
  report_types:
    - audit_classification_status_report
    - audit_classification_compliance_report
    - audit_classification_enforcement_report
    - audit_classification_executive_summary
  reporting_frequency:
    operational: weekly
    compliance: monthly
    executive: quarterly
    regulatory: on_demand
  reporting_owners: [audit_classification_owner, regulatory_liaison]
  reporting_consumers: [board_audit_committee, regulators, internal_audit, executive_leadership]
