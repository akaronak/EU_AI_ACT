decision_logic:
  decision_inputs:
    - audit_classification_severity_score
    - audit_classification_evidence_completeness
    - audit_classification_regulatory_context
    - audit_classification_risk_exposure_index
  decision_conditions:
    - audit_classification_critical_threshold_breach
    - audit_classification_evidence_integrity_failure
    - audit_classification_regulatory_notification_required
  decision_thresholds:
    critical_severity: audit_classification_severity_score >= 90
    high_severity: audit_classification_severity_score >= 70
    evidence_complete: audit_classification_evidence_completeness >= 0.98
  decision_rules:
    audit_classification_high_severity_violation:
      condition: audit_classification_severity_score >= 90
      action: initiate_audit_classification_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: audit_classification_investigation_report
    audit_classification_evidence_compromise_detected:
      condition: audit_classification_integrity_status == compromised
      action: activate_audit_classification_forensic_lockdown
      approval_required: audit_classification_forensic_lead
      evidence_required: audit_classification_integrity_alert_record
    audit_classification_enforcement_authorization:
      condition: audit_classification_violation_confirmed == true AND audit_classification_evidence_complete == true
      action: issue_audit_classification_enforcement_order
      approval_required: audit_classification_enforcement_officer
      evidence_required: audit_classification_violation_evidence_package
    audit_classification_regulator_inquiry_response:
      condition: audit_classification_regulator_request_received == true
      action: compile_audit_classification_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: audit_classification_regulatory_evidence_index
  decision_outputs:
    - audit_classification_enforcement_decision
    - audit_classification_escalation_notice
    - audit_classification_remediation_directive
    - audit_classification_audit_disposition
  approval_requirements:
    enforcement_actions: [audit_classification_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - audit_classification_severity_score >= 90
    - audit_classification_evidence_integrity_failure == true
    - audit_classification_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_audit_classification_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: audit_classification_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Audit Classification may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
