requirements:
  legal:
    >
      Audit Classification must satisfy legal requirements for structured audit execution and evidence
      sufficiency validation, violation and audit finding taxonomy with severity mapping including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  regulatory:
    >
      Audit Classification must satisfy regulatory requirements for structured audit execution and
      evidence sufficiency validation, violation and audit finding taxonomy with severity mapping
      including documented procedures, accountable roles, measurable SLAs, and evidence retention
      aligned with EU AI Act and ISO 19011.
