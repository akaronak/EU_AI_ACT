decision_logic:
  decision_inputs:
    - enforcement_scope_severity_score
    - enforcement_scope_evidence_completeness
    - enforcement_scope_regulatory_context
    - enforcement_scope_risk_exposure_index
  decision_conditions:
    - enforcement_scope_critical_threshold_breach
    - enforcement_scope_evidence_integrity_failure
    - enforcement_scope_regulatory_notification_required
  decision_thresholds:
    critical_severity: enforcement_scope_severity_score >= 90
    high_severity: enforcement_scope_severity_score >= 70
    evidence_complete: enforcement_scope_evidence_completeness >= 0.98
  decision_rules:
    enforcement_scope_high_severity_violation:
      condition: enforcement_scope_severity_score >= 90
      action: initiate_enforcement_scope_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: enforcement_scope_investigation_report
    enforcement_scope_evidence_compromise_detected:
      condition: enforcement_scope_integrity_status == compromised
      action: activate_enforcement_scope_forensic_lockdown
      approval_required: enforcement_scope_forensic_lead
      evidence_required: enforcement_scope_integrity_alert_record
    enforcement_scope_enforcement_authorization:
      condition: enforcement_scope_violation_confirmed == true AND enforcement_scope_evidence_complete == true
      action: issue_enforcement_scope_enforcement_order
      approval_required: enforcement_scope_enforcement_officer
      evidence_required: enforcement_scope_violation_evidence_package
    enforcement_scope_regulator_inquiry_response:
      condition: enforcement_scope_regulator_request_received == true
      action: compile_enforcement_scope_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: enforcement_scope_regulatory_evidence_index
  decision_outputs:
    - enforcement_scope_enforcement_decision
    - enforcement_scope_escalation_notice
    - enforcement_scope_remediation_directive
    - enforcement_scope_audit_disposition
  approval_requirements:
    enforcement_actions: [enforcement_scope_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - enforcement_scope_severity_score >= 90
    - enforcement_scope_evidence_integrity_failure == true
    - enforcement_scope_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_enforcement_scope_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: enforcement_scope_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Enforcement Scope may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
