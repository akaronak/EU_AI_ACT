requirements:
  legal:
    >
      Enforcement Scope must satisfy legal requirements for enforceable restriction, prohibition, and
      corrective action execution, jurisdictional and organizational boundary definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  regulatory:
    >
      Enforcement Scope must satisfy regulatory requirements for enforceable restriction, prohibition,
      and corrective action execution, jurisdictional and organizational boundary definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  technical:
    >
      Enforcement Scope must satisfy technical requirements for enforceable restriction, prohibition,
      and corrective action execution, jurisdictional and organizational boundary definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  operational:
    >
      Enforcement Scope must satisfy operational requirements for enforceable restriction,
      prohibition, and corrective action execution, jurisdictional and organizational boundary
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  audit:
    >
      Enforcement Scope must satisfy audit requirements for enforceable restriction, prohibition, and
      corrective action execution, jurisdictional and organizational boundary definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  forensic:
    >
      Enforcement Scope must satisfy forensic requirements for enforceable restriction, prohibition,
      and corrective action execution, jurisdictional and organizational boundary definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  enforcement:
    >
      Enforcement Scope must satisfy enforcement requirements for enforceable restriction,
      prohibition, and corrective action execution, jurisdictional and organizational boundary
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
