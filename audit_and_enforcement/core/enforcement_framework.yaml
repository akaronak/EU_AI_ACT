requirements:
  legal:
    >
      Enforcement Framework must satisfy legal requirements for enforceable restriction, prohibition,
      and corrective action execution, reference architecture and operating model definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  regulatory:
    >
      Enforcement Framework must satisfy regulatory requirements for enforceable restriction,
      prohibition, and corrective action execution, reference architecture and operating model
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  technical:
    >
      Enforcement Framework must satisfy technical requirements for enforceable restriction,
      prohibition, and corrective action execution, reference architecture and operating model
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  operational:
    >
      Enforcement Framework must satisfy operational requirements for enforceable restriction,
      prohibition, and corrective action execution, reference architecture and operating model
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  audit:
    >
      Enforcement Framework must satisfy audit requirements for enforceable restriction, prohibition,
      and corrective action execution, reference architecture and operating model definition including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  forensic:
    >
      Enforcement Framework must satisfy forensic requirements for enforceable restriction,
      prohibition, and corrective action execution, reference architecture and operating model
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  enforcement:
    >
      Enforcement Framework must satisfy enforcement requirements for enforceable restriction,
      prohibition, and corrective action execution, reference architecture and operating model
      definition including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
