requirements:
  legal:
    >
      Cryptographic Evidence Integrity must satisfy legal requirements for evidence lifecycle
      preservation with chain-of-custody defensibility, hash anchoring, signature validation, and
      authenticity proofs, tamper detection and cryptographic verification protocols including
      documented procedures, accountable roles, measurable SLAs, and evidence retention aligned with
      EU AI Act and ISO 19011.
  regulatory:
