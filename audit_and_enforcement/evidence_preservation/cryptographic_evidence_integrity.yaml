decision_logic:
  decision_inputs:
    - cryptographic_evidence_integrity_severity_score
    - cryptographic_evidence_integrity_evidence_completeness
    - cryptographic_evidence_integrity_regulatory_context
    - cryptographic_evidence_integrity_risk_exposure_index
  decision_conditions:
    - cryptographic_evidence_integrity_critical_threshold_breach
    - cryptographic_evidence_integrity_evidence_integrity_failure
    - cryptographic_evidence_integrity_regulatory_notification_required
  decision_thresholds:
    critical_severity: cryptographic_evidence_integrity_severity_score >= 90
    high_severity: cryptographic_evidence_integrity_severity_score >= 70
    evidence_complete: cryptographic_evidence_integrity_evidence_completeness >= 0.98
  decision_rules:
    cryptographic_evidence_integrity_high_severity_violation:
      condition: cryptographic_evidence_integrity_severity_score >= 90
      action: initiate_cryptographic_evidence_integrity_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: cryptographic_evidence_integrity_investigation_report
    cryptographic_evidence_integrity_evidence_compromise_detected:
      condition: cryptographic_evidence_integrity_integrity_status == compromised
      action: activate_cryptographic_evidence_integrity_forensic_lockdown
      approval_required: cryptographic_evidence_integrity_forensic_lead
      evidence_required: cryptographic_evidence_integrity_integrity_alert_record
    cryptographic_evidence_integrity_enforcement_authorization:
      condition: cryptographic_evidence_integrity_violation_confirmed == true AND cryptographic_evidence_integrity_evidence_complete == true
      action: issue_cryptographic_evidence_integrity_enforcement_order
      approval_required: cryptographic_evidence_integrity_enforcement_officer
      evidence_required: cryptographic_evidence_integrity_violation_evidence_package
    cryptographic_evidence_integrity_regulator_inquiry_response:
      condition: cryptographic_evidence_integrity_regulator_request_received == true
      action: compile_cryptographic_evidence_integrity_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: cryptographic_evidence_integrity_regulatory_evidence_index
  decision_outputs:
    - cryptographic_evidence_integrity_enforcement_decision
    - cryptographic_evidence_integrity_escalation_notice
    - cryptographic_evidence_integrity_remediation_directive
    - cryptographic_evidence_integrity_audit_disposition
  approval_requirements:
    enforcement_actions: [cryptographic_evidence_integrity_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - cryptographic_evidence_integrity_severity_score >= 90
    - cryptographic_evidence_integrity_evidence_integrity_failure == true
    - cryptographic_evidence_integrity_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_cryptographic_evidence_integrity_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: cryptographic_evidence_integrity_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Cryptographic Evidence Integrity may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
