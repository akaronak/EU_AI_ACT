maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Cryptographic Evidence Integrity activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Cryptographic Evidence Integrity procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - cryptographic_evidence_integrity_procedure_checklist
    required_evidence:
      - cryptographic_evidence_integrity_process_log
    required_metrics:
      - cryptographic_evidence_integrity_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Cryptographic Evidence Integrity enterprise-wide.
    required_capabilities:
      - cryptographic_evidence_integrity_standard_control_set
    required_controls:
      - cryptographic_evidence_integrity_control_register
    required_evidence:
      - cryptographic_evidence_integrity_audit_evidence
    required_metrics:
      - cryptographic_evidence_integrity_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Cryptographic Evidence Integrity with KPI optimization.
    required_capabilities:
      - cryptographic_evidence_integrity_automated_controls
    required_controls:
      - cryptographic_evidence_integrity_telemetry_controls
    required_evidence:
      - cryptographic_evidence_integrity_assurance_package
    required_metrics:
      - cryptographic_evidence_integrity_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Cryptographic Evidence Integrity with predictive analytics.
    required_capabilities:
      - cryptographic_evidence_integrity_autonomous_governance
    required_controls:
      - cryptographic_evidence_integrity_adaptive_controls
    required_evidence:
      - cryptographic_evidence_integrity_regulator_ready_portfolio
    required_metrics:
      - cryptographic_evidence_integrity_predictive_risk_index
