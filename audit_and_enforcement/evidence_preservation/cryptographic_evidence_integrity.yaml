controls:
  - control_id: AAE-EVI-CRYPTOGRAP-HASHCHAINI
    control_name: hash_chain_integrity_anchoring
    control_category: preventive
    control_objective: Anchor evidence artifacts with SHA-256 hash chains at point of capture
    governance_rationale:
      >
        hash_chain_integrity_anchoring is required to govern Cryptographic Evidence Integrity risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected evidence
        preservation failures.
    implementation_guidance:
      >
        Implement hash_chain_integrity_anchoring as automated policy in cryptographic_evidence_integrity
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: hash_chain_integrity_anchoring_continuous_telemetry_dashboard
    validation_method: hash_chain_integrity_anchoring_quarterly_design_and_operating_effectiveness_test
    testing_method: hash_chain_integrity_anchoring_statistical_sampling_with_exception_tracking
    control_owner: cryptographic_evidence_integrity_control_owner
    evidence_generated: hash_chain_integrity_anchoring_control_execution_log
    audit_considerations:
      >
        Auditors verify hash_chain_integrity_anchoring design, operation, and evidence sufficiency per
        ISO 19011.
    enforcement_considerations:
      >
        hash_chain_integrity_anchoring outputs may trigger enforcement under
        cryptographic_evidence_integrity escalation rules.
