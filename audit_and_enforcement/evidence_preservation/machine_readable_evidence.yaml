maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Machine Readable Evidence activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Machine Readable Evidence procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - machine_readable_evidence_procedure_checklist
    required_evidence:
      - machine_readable_evidence_process_log
    required_metrics:
      - machine_readable_evidence_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Machine Readable Evidence enterprise-wide.
    required_capabilities:
      - machine_readable_evidence_standard_control_set
    required_controls:
      - machine_readable_evidence_control_register
    required_evidence:
      - machine_readable_evidence_audit_evidence
    required_metrics:
      - machine_readable_evidence_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Machine Readable Evidence with KPI optimization.
    required_capabilities:
      - machine_readable_evidence_automated_controls
    required_controls:
      - machine_readable_evidence_telemetry_controls
    required_evidence:
      - machine_readable_evidence_assurance_package
    required_metrics:
      - machine_readable_evidence_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Machine Readable Evidence with predictive analytics.
    required_capabilities:
      - machine_readable_evidence_autonomous_governance
    required_controls:
      - machine_readable_evidence_adaptive_controls
    required_evidence:
      - machine_readable_evidence_regulator_ready_portfolio
    required_metrics:
      - machine_readable_evidence_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - machine_readable_evidence_report
  - machine_readable_evidence_evidence_package
  - machine_readable_evidence_attestation
  - machine_readable_evidence_enforcement_record
artifacts:
  - name: machine_readable_evidence_policy
    retention_years: 10
    classification: RESTRICTED
  - name: machine_readable_evidence_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: machine_readable_evidence_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: machine_readable_evidence_template
    retention_years: 10
    classification: RESTRICTED
records:
