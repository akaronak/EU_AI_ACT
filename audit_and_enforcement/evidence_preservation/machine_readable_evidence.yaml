controls:
  - control_id: AAE-EVI-MACHINE_RE-MACHINECHAI
    control_name: machine_chain_of_custody_transfer_attestation
    control_category: preventive
    control_objective:
      >
        Operational control ensuring chain of custody transfer attestation for Machine Readable Evidence
        across evidence_preservation.
    governance_rationale:
      >
        machine_chain_of_custody_transfer_attestation is required to govern Machine Readable Evidence
        risks under EU AI Act and enterprise audit-enforcement policy; failure enables undetected
        evidence preservation failures.
    implementation_guidance:
      >
        Implement machine_chain_of_custody_transfer_attestation as automated policy in
        machine_readable_evidence orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: machine_chain_of_custody_transfer_attestation_continuous_telemetry_dashboard
    validation_method:
      machine_chain_of_custody_transfer_attestation_quarterly_design_and_operating_effectiveness_test
    testing_method:
      machine_chain_of_custody_transfer_attestation_statistical_sampling_with_exception_tracking
    control_owner: machine_readable_evidence_control_owner
    evidence_generated: machine_chain_of_custody_transfer_attestation_control_execution_log
    audit_considerations:
      >
        Auditors verify machine_chain_of_custody_transfer_attestation design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        machine_chain_of_custody_transfer_attestation outputs may trigger enforcement under
        machine_readable_evidence escalation rules.
