  decision_inputs:
    - machine_readable_evidence_severity_score
    - machine_readable_evidence_evidence_completeness
    - machine_readable_evidence_regulatory_context
    - machine_readable_evidence_risk_exposure_index
  decision_conditions:
    - machine_readable_evidence_critical_threshold_breach
    - machine_readable_evidence_evidence_integrity_failure
    - machine_readable_evidence_regulatory_notification_required
  decision_thresholds:
    critical_severity: machine_readable_evidence_severity_score >= 90
    high_severity: machine_readable_evidence_severity_score >= 70
    evidence_complete: machine_readable_evidence_evidence_completeness >= 0.98
  decision_rules:
    machine_readable_evidence_high_severity_violation:
      condition: machine_readable_evidence_severity_score >= 90
      action: initiate_machine_readable_evidence_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: machine_readable_evidence_investigation_report
    machine_readable_evidence_evidence_compromise_detected:
      condition: machine_readable_evidence_integrity_status == compromised
      action: activate_machine_readable_evidence_forensic_lockdown
      approval_required: machine_readable_evidence_forensic_lead
      evidence_required: machine_readable_evidence_integrity_alert_record
    machine_readable_evidence_enforcement_authorization:
      condition: machine_readable_evidence_violation_confirmed == true AND machine_readable_evidence_evidence_complete == true
      action: issue_machine_readable_evidence_enforcement_order
      approval_required: machine_readable_evidence_enforcement_officer
      evidence_required: machine_readable_evidence_violation_evidence_package
    machine_readable_evidence_regulator_inquiry_response:
      condition: machine_readable_evidence_regulator_request_received == true
      action: compile_machine_readable_evidence_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: machine_readable_evidence_regulatory_evidence_index
  decision_outputs:
    - machine_readable_evidence_enforcement_decision
    - machine_readable_evidence_escalation_notice
    - machine_readable_evidence_remediation_directive
    - machine_readable_evidence_audit_disposition
  approval_requirements:
    enforcement_actions: [machine_readable_evidence_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - machine_readable_evidence_severity_score >= 90
    - machine_readable_evidence_evidence_integrity_failure == true
    - machine_readable_evidence_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_machine_readable_evidence_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: machine_readable_evidence_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Machine Readable Evidence may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
