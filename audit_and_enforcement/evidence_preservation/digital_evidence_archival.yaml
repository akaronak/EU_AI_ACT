      Risk of reputational harm if Digital Evidence Archival controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Digital Evidence Archival controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - digital_evidence_archival_control_failure
    - digital_evidence_archival_evidence_compromise
    - digital_evidence_archival_regulatory_non_compliance
    - digital_evidence_archival_enforcement_delay
  risk_events:
    - digital_evidence_archival_audit_finding_critical
    - digital_evidence_archival_investigation_escalation
    - digital_evidence_archival_sanction_exposure
    - digital_evidence_archival_market_surveillance_inquiry
  risk_indicators:
    - digital_evidence_archival_control_effectiveness_degradation
    - digital_evidence_archival_evidence_gap_rate
    - digital_evidence_archival_sla_breach_count
    - digital_evidence_archival_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    digital_evidence_archival_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: digital_evidence_archival_forensic_lead
    digital_evidence_archival_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    digital_evidence_archival_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: digital_evidence_archival_enforcement_officer
  risk_tolerance:
    digital_evidence_archival_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: digital_evidence_archival_risk_score >= 60
    critical: digital_evidence_archival_risk_score >= 85
  residual_risk:
    >
      Residual risk after Digital Evidence Archival controls documented in
      digital_evidence_archival_risk_register with quarterly review.
  risk_treatment:
    - digital_evidence_archival_preventive_control_reinforcement
    - digital_evidence_archival_detective_monitoring_enhancement
    - digital_evidence_archival_corrective_remediation_plan
  risk_monitoring:
    telemetry: digital_evidence_archival_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Digital Evidence Archival workflow events with provenance anchor and
      digital_evidence_archival_hash_chain_init
  evidence_collection:
    >
      Structured ingestion via digital_evidence_archival_collection_api with schema validation and
      classification
  evidence_validation:
    >
      Completeness, authenticity, and admissibility checks via
      digital_evidence_archival_validation_engine
  evidence_classification:
    RESTRICTED/CONFIDENTIAL classification per digital_evidence_archival_data_classification_policy
  evidence_storage:
    Write-once immutable storage in digital_evidence_archival_evidence_vault with access controls
  evidence_retention:
    >
      Retention per digital_evidence_archival_retention_schedule aligned with EU AI Act Article 18 and
      legal hold
  evidence_archival:
    Long-term archival with digital_evidence_archival_integrity_verification before migration
  evidence_retrieval:
    Audited retrieval via digital_evidence_archival_retrieval_gateway with purpose logging
  evidence_disposal:
    Authorized disposition with digital_evidence_archival_disposition_certificate and dual approval
chain_of_custody:
  custody_events:
    - digital_evidence_archival_capture_event
    - digital_evidence_archival_transfer_event
    - digital_evidence_archival_access_event
    - digital_evidence_archival_disposition_event
