decision_logic:
  decision_inputs:
    - digital_evidence_archival_severity_score
    - digital_evidence_archival_evidence_completeness
    - digital_evidence_archival_regulatory_context
    - digital_evidence_archival_risk_exposure_index
  decision_conditions:
    - digital_evidence_archival_critical_threshold_breach
    - digital_evidence_archival_evidence_integrity_failure
    - digital_evidence_archival_regulatory_notification_required
  decision_thresholds:
    critical_severity: digital_evidence_archival_severity_score >= 90
    high_severity: digital_evidence_archival_severity_score >= 70
    evidence_complete: digital_evidence_archival_evidence_completeness >= 0.98
  decision_rules:
    digital_evidence_archival_high_severity_violation:
      condition: digital_evidence_archival_severity_score >= 90
      action: initiate_digital_evidence_archival_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: digital_evidence_archival_investigation_report
    digital_evidence_archival_evidence_compromise_detected:
      condition: digital_evidence_archival_integrity_status == compromised
      action: activate_digital_evidence_archival_forensic_lockdown
      approval_required: digital_evidence_archival_forensic_lead
      evidence_required: digital_evidence_archival_integrity_alert_record
    digital_evidence_archival_enforcement_authorization:
      condition: digital_evidence_archival_violation_confirmed == true AND digital_evidence_archival_evidence_complete == true
      action: issue_digital_evidence_archival_enforcement_order
      approval_required: digital_evidence_archival_enforcement_officer
      evidence_required: digital_evidence_archival_violation_evidence_package
    digital_evidence_archival_regulator_inquiry_response:
      condition: digital_evidence_archival_regulator_request_received == true
      action: compile_digital_evidence_archival_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: digital_evidence_archival_regulatory_evidence_index
  decision_outputs:
    - digital_evidence_archival_enforcement_decision
    - digital_evidence_archival_escalation_notice
    - digital_evidence_archival_remediation_directive
    - digital_evidence_archival_audit_disposition
  approval_requirements:
    enforcement_actions: [digital_evidence_archival_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - digital_evidence_archival_severity_score >= 90
    - digital_evidence_archival_evidence_integrity_failure == true
    - digital_evidence_archival_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_digital_evidence_archival_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: digital_evidence_archival_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Digital Evidence Archival may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
