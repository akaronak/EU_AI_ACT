controls:
  - control_id: AAE-EVI-DIGITAL_EV-DIGITALCHAI
    control_name: digital_chain_of_custody_transfer_attestation
    control_category: preventive
    control_objective:
      >
        Operational control ensuring chain of custody transfer attestation for Digital Evidence Archival
        across evidence_preservation.
    governance_rationale:
      >
        digital_chain_of_custody_transfer_attestation is required to govern Digital Evidence Archival
        risks under EU AI Act and enterprise audit-enforcement policy; failure enables undetected
        evidence preservation failures.
    implementation_guidance:
      >
        Implement digital_chain_of_custody_transfer_attestation as automated policy in
        digital_evidence_archival orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: digital_chain_of_custody_transfer_attestation_continuous_telemetry_dashboard
    validation_method:
      digital_chain_of_custody_transfer_attestation_quarterly_design_and_operating_effectiveness_test
    testing_method:
      digital_chain_of_custody_transfer_attestation_statistical_sampling_with_exception_tracking
    control_owner: digital_evidence_archival_control_owner
    evidence_generated: digital_chain_of_custody_transfer_attestation_control_execution_log
    audit_considerations:
      >
        Auditors verify digital_chain_of_custody_transfer_attestation design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        digital_chain_of_custody_transfer_attestation outputs may trigger enforcement under
        digital_evidence_archival escalation rules.
