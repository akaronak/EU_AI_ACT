      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: evidence_preservation_enforcement_officer
  risk_tolerance:
    evidence_preservation_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: evidence_preservation_risk_score >= 60
    critical: evidence_preservation_risk_score >= 85
