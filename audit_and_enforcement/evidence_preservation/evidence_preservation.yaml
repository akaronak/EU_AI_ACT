decision_logic:
  decision_inputs:
    - evidence_preservation_severity_score
    - evidence_preservation_evidence_completeness
    - evidence_preservation_regulatory_context
    - evidence_preservation_risk_exposure_index
  decision_conditions:
    - evidence_preservation_critical_threshold_breach
    - evidence_preservation_evidence_integrity_failure
    - evidence_preservation_regulatory_notification_required
  decision_thresholds:
    critical_severity: evidence_preservation_severity_score >= 90
    high_severity: evidence_preservation_severity_score >= 70
    evidence_complete: evidence_preservation_evidence_completeness >= 0.98
  decision_rules:
    evidence_preservation_high_severity_violation:
      condition: evidence_preservation_severity_score >= 90
      action: initiate_evidence_preservation_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: evidence_preservation_investigation_report
    evidence_preservation_evidence_compromise_detected:
      condition: evidence_preservation_integrity_status == compromised
      action: activate_evidence_preservation_forensic_lockdown
      approval_required: evidence_preservation_forensic_lead
      evidence_required: evidence_preservation_integrity_alert_record
    evidence_preservation_enforcement_authorization:
      condition: evidence_preservation_violation_confirmed == true AND evidence_preservation_evidence_complete == true
      action: issue_evidence_preservation_enforcement_order
      approval_required: evidence_preservation_enforcement_officer
      evidence_required: evidence_preservation_violation_evidence_package
    evidence_preservation_regulator_inquiry_response:
      condition: evidence_preservation_regulator_request_received == true
      action: compile_evidence_preservation_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: evidence_preservation_regulatory_evidence_index
  decision_outputs:
    - evidence_preservation_enforcement_decision
    - evidence_preservation_escalation_notice
    - evidence_preservation_remediation_directive
    - evidence_preservation_audit_disposition
  approval_requirements:
    enforcement_actions: [evidence_preservation_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - evidence_preservation_severity_score >= 90
    - evidence_preservation_evidence_integrity_failure == true
    - evidence_preservation_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_evidence_preservation_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: evidence_preservation_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Evidence Preservation may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
