maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Evidence Preservation activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Evidence Preservation procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - evidence_preservation_procedure_checklist
    required_evidence:
      - evidence_preservation_process_log
    required_metrics:
      - evidence_preservation_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Evidence Preservation enterprise-wide.
    required_capabilities:
      - evidence_preservation_standard_control_set
    required_controls:
      - evidence_preservation_control_register
    required_evidence:
      - evidence_preservation_audit_evidence
    required_metrics:
      - evidence_preservation_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Evidence Preservation with KPI optimization.
    required_capabilities:
      - evidence_preservation_automated_controls
    required_controls:
      - evidence_preservation_telemetry_controls
    required_evidence:
      - evidence_preservation_assurance_package
    required_metrics:
      - evidence_preservation_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Evidence Preservation with predictive analytics.
    required_capabilities:
      - evidence_preservation_autonomous_governance
    required_controls:
      - evidence_preservation_adaptive_controls
