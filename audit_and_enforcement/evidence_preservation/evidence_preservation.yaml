controls:
  - control_id: AAE-EVI-EVIDENCE_P-EVIDENCECHA
    control_name: evidence_chain_of_custody_transfer_attestation
    control_category: preventive
    control_objective:
      >
        Operational control ensuring chain of custody transfer attestation for Evidence Preservation
        across evidence_preservation.
    governance_rationale:
      >
        evidence_chain_of_custody_transfer_attestation is required to govern Evidence Preservation risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected evidence
        preservation failures.
    implementation_guidance:
      >
        Implement evidence_chain_of_custody_transfer_attestation as automated policy in
        evidence_preservation orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: evidence_chain_of_custody_transfer_attestation_continuous_telemetry_dashboard
    validation_method:
      evidence_chain_of_custody_transfer_attestation_quarterly_design_and_operating_effectiveness_test
    testing_method:
      evidence_chain_of_custody_transfer_attestation_statistical_sampling_with_exception_tracking
    control_owner: evidence_preservation_control_owner
    evidence_generated: evidence_chain_of_custody_transfer_attestation_control_execution_log
    audit_considerations:
      >
        Auditors verify evidence_chain_of_custody_transfer_attestation design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        evidence_chain_of_custody_transfer_attestation outputs may trigger enforcement under
        evidence_preservation escalation rules.
