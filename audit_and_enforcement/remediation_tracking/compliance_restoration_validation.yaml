    - compliance_restoration_validation_regulatory_context
    - compliance_restoration_validation_risk_exposure_index
  decision_conditions:
    - compliance_restoration_validation_critical_threshold_breach
    - compliance_restoration_validation_evidence_integrity_failure
    - compliance_restoration_validation_regulatory_notification_required
  decision_thresholds:
    critical_severity: compliance_restoration_validation_severity_score >= 90
    high_severity: compliance_restoration_validation_severity_score >= 70
    evidence_complete: compliance_restoration_validation_evidence_completeness >= 0.98
  decision_rules:
    compliance_restoration_validation_high_severity_violation:
      condition: compliance_restoration_validation_severity_score >= 90
      action: initiate_compliance_restoration_validation_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: compliance_restoration_validation_investigation_report
    compliance_restoration_validation_evidence_compromise_detected:
      condition: compliance_restoration_validation_integrity_status == compromised
      action: activate_compliance_restoration_validation_forensic_lockdown
      approval_required: compliance_restoration_validation_forensic_lead
      evidence_required: compliance_restoration_validation_integrity_alert_record
    compliance_restoration_validation_enforcement_authorization:
      condition: compliance_restoration_validation_violation_confirmed == true AND compliance_restoration_validation_evidence_complete == true
      action: issue_compliance_restoration_validation_enforcement_order
      approval_required: compliance_restoration_validation_enforcement_officer
      evidence_required: compliance_restoration_validation_violation_evidence_package
    compliance_restoration_validation_regulator_inquiry_response:
      condition: compliance_restoration_validation_regulator_request_received == true
      action: compile_compliance_restoration_validation_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: compliance_restoration_validation_regulatory_evidence_index
  decision_outputs:
    - compliance_restoration_validation_enforcement_decision
    - compliance_restoration_validation_escalation_notice
    - compliance_restoration_validation_remediation_directive
    - compliance_restoration_validation_audit_disposition
  approval_requirements:
    enforcement_actions: [compliance_restoration_validation_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - compliance_restoration_validation_severity_score >= 90
    - compliance_restoration_validation_evidence_integrity_failure == true
    - compliance_restoration_validation_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_compliance_restoration_validation_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: compliance_restoration_validation_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Compliance Restoration Validation may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
