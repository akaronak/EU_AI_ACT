      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: compliance_restoration_validation_forensic_lead
    compliance_restoration_validation_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    compliance_restoration_validation_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: compliance_restoration_validation_enforcement_officer
  risk_tolerance:
    compliance_restoration_validation_residual_risk_ceiling: 0.25
  risk_thresholds:
