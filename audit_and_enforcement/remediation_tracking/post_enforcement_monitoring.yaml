controls:
  - control_id: AAE-REM-POST_ENFOR-POSTREMEDIA
    control_name: post_remediation_plan_authorization
    control_category: preventive
    control_objective:
      >
        Operational control ensuring remediation plan authorization for Post Enforcement Monitoring
        across remediation_tracking.
    governance_rationale:
      >
        post_remediation_plan_authorization is required to govern Post Enforcement Monitoring risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected remediation
        tracking failures.
    implementation_guidance:
      >
        Implement post_remediation_plan_authorization as automated policy in post_enforcement_monitoring
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: post_remediation_plan_authorization_continuous_telemetry_dashboard
    validation_method:
      post_remediation_plan_authorization_quarterly_design_and_operating_effectiveness_test
    testing_method: post_remediation_plan_authorization_statistical_sampling_with_exception_tracking
    control_owner: post_enforcement_monitoring_control_owner
    evidence_generated: post_remediation_plan_authorization_control_execution_log
    audit_considerations:
      >
        Auditors verify post_remediation_plan_authorization design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        post_remediation_plan_authorization outputs may trigger enforcement under
