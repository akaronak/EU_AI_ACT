decision_logic:
  decision_inputs:
    - post_enforcement_monitoring_severity_score
    - post_enforcement_monitoring_evidence_completeness
    - post_enforcement_monitoring_regulatory_context
    - post_enforcement_monitoring_risk_exposure_index
  decision_conditions:
    - post_enforcement_monitoring_critical_threshold_breach
    - post_enforcement_monitoring_evidence_integrity_failure
    - post_enforcement_monitoring_regulatory_notification_required
  decision_thresholds:
    critical_severity: post_enforcement_monitoring_severity_score >= 90
    high_severity: post_enforcement_monitoring_severity_score >= 70
    evidence_complete: post_enforcement_monitoring_evidence_completeness >= 0.98
  decision_rules:
    post_enforcement_monitoring_high_severity_violation:
      condition: post_enforcement_monitoring_severity_score >= 90
      action: initiate_post_enforcement_monitoring_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: post_enforcement_monitoring_investigation_report
    post_enforcement_monitoring_evidence_compromise_detected:
      condition: post_enforcement_monitoring_integrity_status == compromised
      action: activate_post_enforcement_monitoring_forensic_lockdown
      approval_required: post_enforcement_monitoring_forensic_lead
      evidence_required: post_enforcement_monitoring_integrity_alert_record
    post_enforcement_monitoring_enforcement_authorization:
      condition: post_enforcement_monitoring_violation_confirmed == true AND post_enforcement_monitoring_evidence_complete == true
      action: issue_post_enforcement_monitoring_enforcement_order
      approval_required: post_enforcement_monitoring_enforcement_officer
      evidence_required: post_enforcement_monitoring_violation_evidence_package
    post_enforcement_monitoring_regulator_inquiry_response:
      condition: post_enforcement_monitoring_regulator_request_received == true
      action: compile_post_enforcement_monitoring_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: post_enforcement_monitoring_regulatory_evidence_index
  decision_outputs:
    - post_enforcement_monitoring_enforcement_decision
    - post_enforcement_monitoring_escalation_notice
    - post_enforcement_monitoring_remediation_directive
    - post_enforcement_monitoring_audit_disposition
  approval_requirements:
    enforcement_actions: [post_enforcement_monitoring_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - post_enforcement_monitoring_severity_score >= 90
    - post_enforcement_monitoring_evidence_integrity_failure == true
    - post_enforcement_monitoring_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_post_enforcement_monitoring_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: post_enforcement_monitoring_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Post Enforcement Monitoring may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
