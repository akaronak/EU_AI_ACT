  risk_scenarios:
  risk_scores:
    remediation_effectiveness_analysis_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: remediation_effectiveness_analysis_forensic_lead
    remediation_effectiveness_analysis_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    remediation_effectiveness_analysis_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: remediation_effectiveness_analysis_enforcement_officer
  risk_tolerance:
    remediation_effectiveness_analysis_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: remediation_effectiveness_analysis_risk_score >= 60
    critical: remediation_effectiveness_analysis_risk_score >= 85
  residual_risk:
    >
      Residual risk after Remediation Effectiveness Analysis controls documented in
      remediation_effectiveness_analysis_risk_register with quarterly review.
  risk_treatment:
    - remediation_effectiveness_analysis_preventive_control_reinforcement
    - remediation_effectiveness_analysis_detective_monitoring_enhancement
    - remediation_effectiveness_analysis_corrective_remediation_plan
  risk_monitoring:
    telemetry: remediation_effectiveness_analysis_risk_dashboard
    review_frequency: monthly
