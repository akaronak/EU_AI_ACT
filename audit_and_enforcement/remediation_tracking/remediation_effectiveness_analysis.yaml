controls:
  - control_id: AAE-REM-REMEDIATIO-REMEDIATION
    control_name: remediation_remediation_plan_authorization
    control_category: preventive
    control_objective:
      >
        Operational control ensuring remediation plan authorization for Remediation Effectiveness
        Analysis across remediation_tracking.
    governance_rationale:
      >
        remediation_remediation_plan_authorization is required to govern Remediation Effectiveness
        Analysis risks under EU AI Act and enterprise audit-enforcement policy; failure enables
        undetected remediation tracking failures.
    implementation_guidance:
      >
        Implement remediation_remediation_plan_authorization as automated policy in
        remediation_effectiveness_analysis orchestration layer; wire to telemetry bus; block non-
        compliant state transitions; log evidence to immutable store.
    monitoring_method: remediation_remediation_plan_authorization_continuous_telemetry_dashboard
    validation_method:
      remediation_remediation_plan_authorization_quarterly_design_and_operating_effectiveness_test
    testing_method:
      remediation_remediation_plan_authorization_statistical_sampling_with_exception_tracking
    control_owner: remediation_effectiveness_analysis_control_owner
    evidence_generated: remediation_remediation_plan_authorization_control_execution_log
    audit_considerations:
      >
        Auditors verify remediation_remediation_plan_authorization design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        remediation_remediation_plan_authorization outputs may trigger enforcement under
