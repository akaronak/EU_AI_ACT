controls:
  - control_id: AAE-REM-CORRECTIVE-CORRECTIVER
    control_name: corrective_remediation_plan_authorization
    control_category: preventive
    control_objective:
      >
        Operational control ensuring remediation plan authorization for Corrective Remediation Tracking
        across remediation_tracking.
    governance_rationale:
      >
        corrective_remediation_plan_authorization is required to govern Corrective Remediation Tracking
        risks under EU AI Act and enterprise audit-enforcement policy; failure enables undetected
        remediation tracking failures.
    implementation_guidance:
      >
        Implement corrective_remediation_plan_authorization as automated policy in
        corrective_remediation_tracking orchestration layer; wire to telemetry bus; block non-compliant
        state transitions; log evidence to immutable store.
    monitoring_method: corrective_remediation_plan_authorization_continuous_telemetry_dashboard
    validation_method:
      corrective_remediation_plan_authorization_quarterly_design_and_operating_effectiveness_test
    testing_method:
      corrective_remediation_plan_authorization_statistical_sampling_with_exception_tracking
    control_owner: corrective_remediation_tracking_control_owner
    evidence_generated: corrective_remediation_plan_authorization_control_execution_log
    audit_considerations:
      >
        Auditors verify corrective_remediation_plan_authorization design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        corrective_remediation_plan_authorization outputs may trigger enforcement under
        corrective_remediation_tracking escalation rules.
