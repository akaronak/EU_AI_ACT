  - rule: financial_penalty_tracking_integrity_verified
    condition: integrity_status_financial_penalty_tracking != verified
    action: QUARANTINE_AND_ESCALATE
  - rule: financial_penalty_tracking_custody_intact
    condition: custody_gap_financial_penalty_tracking == true
    action: INITIATE_FORENSIC_REVIEW
