decision_logic:
  decision_inputs:
    - financial_penalty_tracking_severity_score
    - financial_penalty_tracking_evidence_completeness
    - financial_penalty_tracking_regulatory_context
    - financial_penalty_tracking_risk_exposure_index
  decision_conditions:
    - financial_penalty_tracking_critical_threshold_breach
    - financial_penalty_tracking_evidence_integrity_failure
    - financial_penalty_tracking_regulatory_notification_required
  decision_thresholds:
    critical_severity: financial_penalty_tracking_severity_score >= 90
    high_severity: financial_penalty_tracking_severity_score >= 70
    evidence_complete: financial_penalty_tracking_evidence_completeness >= 0.98
  decision_rules:
    financial_penalty_tracking_high_severity_violation:
      condition: financial_penalty_tracking_severity_score >= 90
      action: initiate_financial_penalty_tracking_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: financial_penalty_tracking_investigation_report
    financial_penalty_tracking_evidence_compromise_detected:
      condition: financial_penalty_tracking_integrity_status == compromised
      action: activate_financial_penalty_tracking_forensic_lockdown
      approval_required: financial_penalty_tracking_forensic_lead
      evidence_required: financial_penalty_tracking_integrity_alert_record
    financial_penalty_tracking_enforcement_authorization:
      condition: financial_penalty_tracking_violation_confirmed == true AND financial_penalty_tracking_evidence_complete == true
      action: issue_financial_penalty_tracking_enforcement_order
      approval_required: financial_penalty_tracking_enforcement_officer
      evidence_required: financial_penalty_tracking_violation_evidence_package
    financial_penalty_tracking_regulator_inquiry_response:
      condition: financial_penalty_tracking_regulator_request_received == true
      action: compile_financial_penalty_tracking_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: financial_penalty_tracking_regulatory_evidence_index
  decision_outputs:
    - financial_penalty_tracking_enforcement_decision
    - financial_penalty_tracking_escalation_notice
    - financial_penalty_tracking_remediation_directive
    - financial_penalty_tracking_audit_disposition
  approval_requirements:
    enforcement_actions: [financial_penalty_tracking_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - financial_penalty_tracking_severity_score >= 90
    - financial_penalty_tracking_evidence_integrity_failure == true
    - financial_penalty_tracking_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_financial_penalty_tracking_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: financial_penalty_tracking_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Financial Penalty Tracking may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
