controls:
  - control_id: AAE-PEN-REGULATORY-REGULATORYL
    control_name: regulatory_liability_chain_mapper
    control_category: detective
    control_objective:
      >
        Operational control ensuring liability chain mapper for Regulatory Penalty Alignment across
        penalty_management.
    governance_rationale:
      >
        regulatory_liability_chain_mapper is required to govern Regulatory Penalty Alignment risks under
        EU AI Act and enterprise audit-enforcement policy; failure enables undetected penalty management
        failures.
    implementation_guidance:
      >
        Implement regulatory_liability_chain_mapper as automated policy in regulatory_penalty_alignment
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: regulatory_liability_chain_mapper_continuous_telemetry_dashboard
    validation_method:
      regulatory_liability_chain_mapper_quarterly_design_and_operating_effectiveness_test
    testing_method: regulatory_liability_chain_mapper_statistical_sampling_with_exception_tracking
    control_owner: regulatory_penalty_alignment_control_owner
    evidence_generated: regulatory_liability_chain_mapper_control_execution_log
    audit_considerations:
      >
        Auditors verify regulatory_liability_chain_mapper design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        regulatory_liability_chain_mapper outputs may trigger enforcement under
