decision_logic:
  decision_inputs:
    - regulatory_penalty_alignment_severity_score
    - regulatory_penalty_alignment_evidence_completeness
    - regulatory_penalty_alignment_regulatory_context
    - regulatory_penalty_alignment_risk_exposure_index
  decision_conditions:
    - regulatory_penalty_alignment_critical_threshold_breach
    - regulatory_penalty_alignment_evidence_integrity_failure
    - regulatory_penalty_alignment_regulatory_notification_required
  decision_thresholds:
    critical_severity: regulatory_penalty_alignment_severity_score >= 90
    high_severity: regulatory_penalty_alignment_severity_score >= 70
    evidence_complete: regulatory_penalty_alignment_evidence_completeness >= 0.98
  decision_rules:
    regulatory_penalty_alignment_high_severity_violation:
      condition: regulatory_penalty_alignment_severity_score >= 90
      action: initiate_regulatory_penalty_alignment_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: regulatory_penalty_alignment_investigation_report
    regulatory_penalty_alignment_evidence_compromise_detected:
      condition: regulatory_penalty_alignment_integrity_status == compromised
      action: activate_regulatory_penalty_alignment_forensic_lockdown
      approval_required: regulatory_penalty_alignment_forensic_lead
      evidence_required: regulatory_penalty_alignment_integrity_alert_record
    regulatory_penalty_alignment_enforcement_authorization:
      condition: regulatory_penalty_alignment_violation_confirmed == true AND regulatory_penalty_alignment_evidence_complete == true
      action: issue_regulatory_penalty_alignment_enforcement_order
      approval_required: regulatory_penalty_alignment_enforcement_officer
      evidence_required: regulatory_penalty_alignment_violation_evidence_package
    regulatory_penalty_alignment_regulator_inquiry_response:
      condition: regulatory_penalty_alignment_regulator_request_received == true
      action: compile_regulatory_penalty_alignment_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: regulatory_penalty_alignment_regulatory_evidence_index
  decision_outputs:
    - regulatory_penalty_alignment_enforcement_decision
    - regulatory_penalty_alignment_escalation_notice
    - regulatory_penalty_alignment_remediation_directive
    - regulatory_penalty_alignment_audit_disposition
  approval_requirements:
    enforcement_actions: [regulatory_penalty_alignment_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - regulatory_penalty_alignment_severity_score >= 90
    - regulatory_penalty_alignment_evidence_integrity_failure == true
    - regulatory_penalty_alignment_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_regulatory_penalty_alignment_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: regulatory_penalty_alignment_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Regulatory Penalty Alignment may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
