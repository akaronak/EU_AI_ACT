controls:
  - control_id: AAE-PEN-REPEAT_VIO-REPEATLIABI
    control_name: repeat_liability_chain_mapper
    control_category: detective
    control_objective:
      >
        Operational control ensuring liability chain mapper for Repeat Violation Scoring across
        penalty_management.
    governance_rationale:
      >
        repeat_liability_chain_mapper is required to govern Repeat Violation Scoring risks under EU AI
        Act and enterprise audit-enforcement policy; failure enables undetected penalty management
        failures.
    implementation_guidance:
      >
        Implement repeat_liability_chain_mapper as automated policy in repeat_violation_scoring
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: repeat_liability_chain_mapper_continuous_telemetry_dashboard
    validation_method: repeat_liability_chain_mapper_quarterly_design_and_operating_effectiveness_test
    testing_method: repeat_liability_chain_mapper_statistical_sampling_with_exception_tracking
    control_owner: repeat_violation_scoring_control_owner
    evidence_generated: repeat_liability_chain_mapper_control_execution_log
    audit_considerations:
      >
        Auditors verify repeat_liability_chain_mapper design, operation, and evidence sufficiency per
        ISO 19011.
    enforcement_considerations:
      >
        repeat_liability_chain_mapper outputs may trigger enforcement under repeat_violation_scoring
