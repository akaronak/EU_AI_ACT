    - repeat_violation_scoring_risk_exposure_index
  decision_conditions:
    - repeat_violation_scoring_critical_threshold_breach
    - repeat_violation_scoring_evidence_integrity_failure
    - repeat_violation_scoring_regulatory_notification_required
  decision_thresholds:
    critical_severity: repeat_violation_scoring_severity_score >= 90
    high_severity: repeat_violation_scoring_severity_score >= 70
    evidence_complete: repeat_violation_scoring_evidence_completeness >= 0.98
  decision_rules:
    repeat_violation_scoring_high_severity_violation:
      condition: repeat_violation_scoring_severity_score >= 90
      action: initiate_repeat_violation_scoring_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: repeat_violation_scoring_investigation_report
    repeat_violation_scoring_evidence_compromise_detected:
      condition: repeat_violation_scoring_integrity_status == compromised
      action: activate_repeat_violation_scoring_forensic_lockdown
      approval_required: repeat_violation_scoring_forensic_lead
      evidence_required: repeat_violation_scoring_integrity_alert_record
    repeat_violation_scoring_enforcement_authorization:
      condition: repeat_violation_scoring_violation_confirmed == true AND repeat_violation_scoring_evidence_complete == true
      action: issue_repeat_violation_scoring_enforcement_order
      approval_required: repeat_violation_scoring_enforcement_officer
      evidence_required: repeat_violation_scoring_violation_evidence_package
    repeat_violation_scoring_regulator_inquiry_response:
      condition: repeat_violation_scoring_regulator_request_received == true
      action: compile_repeat_violation_scoring_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: repeat_violation_scoring_regulatory_evidence_index
  decision_outputs:
    - repeat_violation_scoring_enforcement_decision
    - repeat_violation_scoring_escalation_notice
    - repeat_violation_scoring_remediation_directive
    - repeat_violation_scoring_audit_disposition
  approval_requirements:
    enforcement_actions: [repeat_violation_scoring_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - repeat_violation_scoring_severity_score >= 90
    - repeat_violation_scoring_evidence_integrity_failure == true
    - repeat_violation_scoring_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_repeat_violation_scoring_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: repeat_violation_scoring_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Repeat Violation Scoring may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
