  reporting_framework:
    >
      Structured reporting for Enforcement Liability Mapping covering executive, board, regulatory,
      audit, forensic, and attestation consumers.
  report_types:
    - enforcement_liability_mapping_status_report
    - enforcement_liability_mapping_compliance_report
    - enforcement_liability_mapping_enforcement_report
