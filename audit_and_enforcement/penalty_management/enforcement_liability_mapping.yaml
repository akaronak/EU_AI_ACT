    operational: weekly
    compliance: monthly
    executive: quarterly
    regulatory: on_demand
  reporting_owners: [enforcement_liability_mapping_owner, regulatory_liaison]
  reporting_consumers: [board_audit_committee, regulators, internal_audit, executive_leadership]
