maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Penalty Management activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Penalty Management procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - penalty_management_procedure_checklist
    required_evidence:
      - penalty_management_process_log
    required_metrics:
      - penalty_management_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Penalty Management enterprise-wide.
    required_capabilities:
      - penalty_management_standard_control_set
    required_controls:
      - penalty_management_control_register
    required_evidence:
      - penalty_management_audit_evidence
    required_metrics:
      - penalty_management_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Penalty Management with KPI optimization.
    required_capabilities:
      - penalty_management_automated_controls
    required_controls:
      - penalty_management_telemetry_controls
    required_evidence:
      - penalty_management_assurance_package
    required_metrics:
      - penalty_management_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Penalty Management with predictive analytics.
    required_capabilities:
      - penalty_management_autonomous_governance
    required_controls:
      - penalty_management_adaptive_controls
    required_evidence:
      - penalty_management_regulator_ready_portfolio
    required_metrics:
      - penalty_management_predictive_risk_index
