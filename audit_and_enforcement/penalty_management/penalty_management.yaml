requirements:
  legal:
    >
      Penalty Management must satisfy legal requirements for penalty determination, sanction
      administration, and liability mapping including documented procedures, accountable roles,
      measurable SLAs, and evidence retention aligned with EU AI Act and ISO 19011.
  regulatory:
    >
      Penalty Management must satisfy regulatory requirements for penalty determination, sanction
      administration, and liability mapping including documented procedures, accountable roles,
      measurable SLAs, and evidence retention aligned with EU AI Act and ISO 19011.
  technical:
    >
      Penalty Management must satisfy technical requirements for penalty determination, sanction
      administration, and liability mapping including documented procedures, accountable roles,
      measurable SLAs, and evidence retention aligned with EU AI Act and ISO 19011.
  operational:
    >
      Penalty Management must satisfy operational requirements for penalty determination, sanction
      administration, and liability mapping including documented procedures, accountable roles,
      measurable SLAs, and evidence retention aligned with EU AI Act and ISO 19011.
  audit:
    >
