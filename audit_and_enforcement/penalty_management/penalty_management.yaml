risk_considerations:
  regulatory_sanction:
    >
      Risk of regulatory sanction if Penalty Management controls fail; mitigated through
      preventive/detective controls and escalation.
  evidence_inadmissibility:
    >
      Risk of evidence inadmissibility if Penalty Management controls fail; mitigated through
      preventive/detective controls and escalation.
  enforcement_failure:
    >
      Risk of enforcement failure if Penalty Management controls fail; mitigated through
      preventive/detective controls and escalation.
  reputational_harm:
    >
      Risk of reputational harm if Penalty Management controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Penalty Management controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - penalty_management_control_failure
    - penalty_management_evidence_compromise
    - penalty_management_regulatory_non_compliance
    - penalty_management_enforcement_delay
  risk_events:
    - penalty_management_audit_finding_critical
    - penalty_management_investigation_escalation
    - penalty_management_sanction_exposure
    - penalty_management_market_surveillance_inquiry
  risk_indicators:
