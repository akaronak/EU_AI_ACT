    - penalty_management_evidence_gap_rate
    - penalty_management_sla_breach_count
    - penalty_management_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    penalty_management_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: penalty_management_forensic_lead
    penalty_management_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    penalty_management_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: penalty_management_enforcement_officer
  risk_tolerance:
    penalty_management_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: penalty_management_risk_score >= 60
    critical: penalty_management_risk_score >= 85
  residual_risk:
    >
      Residual risk after Penalty Management controls documented in penalty_management_risk_register
      with quarterly review.
  risk_treatment:
    - penalty_management_preventive_control_reinforcement
    - penalty_management_detective_monitoring_enhancement
    - penalty_management_corrective_remediation_plan
  risk_monitoring:
    telemetry: penalty_management_risk_dashboard
    review_frequency: monthly
