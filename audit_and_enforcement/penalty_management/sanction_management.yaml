decision_logic:
  decision_inputs:
    - sanction_management_severity_score
    - sanction_management_evidence_completeness
    - sanction_management_regulatory_context
    - sanction_management_risk_exposure_index
  decision_conditions:
    - sanction_management_critical_threshold_breach
    - sanction_management_evidence_integrity_failure
    - sanction_management_regulatory_notification_required
  decision_thresholds:
    critical_severity: sanction_management_severity_score >= 90
    high_severity: sanction_management_severity_score >= 70
    evidence_complete: sanction_management_evidence_completeness >= 0.98
  decision_rules:
    sanction_management_high_severity_violation:
      condition: sanction_management_severity_score >= 90
      action: initiate_sanction_management_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: sanction_management_investigation_report
    sanction_management_evidence_compromise_detected:
      condition: sanction_management_integrity_status == compromised
      action: activate_sanction_management_forensic_lockdown
      approval_required: sanction_management_forensic_lead
      evidence_required: sanction_management_integrity_alert_record
    sanction_management_enforcement_authorization:
      condition: sanction_management_violation_confirmed == true AND sanction_management_evidence_complete == true
      action: issue_sanction_management_enforcement_order
      approval_required: sanction_management_enforcement_officer
      evidence_required: sanction_management_violation_evidence_package
    sanction_management_regulator_inquiry_response:
      condition: sanction_management_regulator_request_received == true
      action: compile_sanction_management_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: sanction_management_regulatory_evidence_index
  decision_outputs:
    - sanction_management_enforcement_decision
    - sanction_management_escalation_notice
    - sanction_management_remediation_directive
    - sanction_management_audit_disposition
  approval_requirements:
    enforcement_actions: [sanction_management_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - sanction_management_severity_score >= 90
    - sanction_management_evidence_integrity_failure == true
    - sanction_management_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_sanction_management_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: sanction_management_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Sanction Management may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
