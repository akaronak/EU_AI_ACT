controls:
  - control_id: AAE-PEN-SANCTION_M-SANCTIONELI
    control_name: sanction_eligibility_determination
    control_category: preventive
    control_objective:
      Determine sanction eligibility based on violation classification and liability mapping
    governance_rationale:
      >
        sanction_eligibility_determination is required to govern Sanction Management risks under EU AI
        Act and enterprise audit-enforcement policy; failure enables undetected penalty management
        failures.
    implementation_guidance:
      >
        Implement sanction_eligibility_determination as automated policy in sanction_management
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: sanction_eligibility_determination_continuous_telemetry_dashboard
    validation_method:
      sanction_eligibility_determination_quarterly_design_and_operating_effectiveness_test
    testing_method: sanction_eligibility_determination_statistical_sampling_with_exception_tracking
    control_owner: sanction_management_control_owner
    evidence_generated: sanction_eligibility_determination_control_execution_log
    audit_considerations:
      >
        Auditors verify sanction_eligibility_determination design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        sanction_eligibility_determination outputs may trigger enforcement under sanction_management
        escalation rules.
