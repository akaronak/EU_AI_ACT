maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Sanction Management activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Sanction Management procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - sanction_management_procedure_checklist
    required_evidence:
      - sanction_management_process_log
    required_metrics:
      - sanction_management_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Sanction Management enterprise-wide.
    required_capabilities:
      - sanction_management_standard_control_set
    required_controls:
      - sanction_management_control_register
    required_evidence:
      - sanction_management_audit_evidence
    required_metrics:
      - sanction_management_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Sanction Management with KPI optimization.
    required_capabilities:
      - sanction_management_automated_controls
    required_controls:
      - sanction_management_telemetry_controls
    required_evidence:
      - sanction_management_assurance_package
    required_metrics:
      - sanction_management_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Sanction Management with predictive analytics.
    required_capabilities:
      - sanction_management_autonomous_governance
    required_controls:
      - sanction_management_adaptive_controls
    required_evidence:
      - sanction_management_regulator_ready_portfolio
    required_metrics:
      - sanction_management_predictive_risk_index
