controls:
  - control_id: AAE-PEN-CORRECTIVE-CORRECTIVEL
    control_name: corrective_liability_chain_mapper
    control_category: detective
    control_objective:
      >
        Operational control ensuring liability chain mapper for Corrective Obligation Tracking across
        penalty_management.
    governance_rationale:
      >
        corrective_liability_chain_mapper is required to govern Corrective Obligation Tracking risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected penalty
        management failures.
    implementation_guidance:
      >
        Implement corrective_liability_chain_mapper as automated policy in
        corrective_obligation_tracking orchestration layer; wire to telemetry bus; block non-compliant
        state transitions; log evidence to immutable store.
    monitoring_method: corrective_liability_chain_mapper_continuous_telemetry_dashboard
    validation_method:
      corrective_liability_chain_mapper_quarterly_design_and_operating_effectiveness_test
    testing_method: corrective_liability_chain_mapper_statistical_sampling_with_exception_tracking
    control_owner: corrective_obligation_tracking_control_owner
    evidence_generated: corrective_liability_chain_mapper_control_execution_log
    audit_considerations:
      >
        Auditors verify corrective_liability_chain_mapper design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        corrective_liability_chain_mapper outputs may trigger enforcement under
        corrective_obligation_tracking escalation rules.
