decision_logic:
  decision_inputs:
    - cognitive_auditability_severity_score
    - cognitive_auditability_evidence_completeness
    - cognitive_auditability_regulatory_context
    - cognitive_auditability_risk_exposure_index
  decision_conditions:
    - cognitive_auditability_critical_threshold_breach
    - cognitive_auditability_evidence_integrity_failure
    - cognitive_auditability_regulatory_notification_required
  decision_thresholds:
    critical_severity: cognitive_auditability_severity_score >= 90
    high_severity: cognitive_auditability_severity_score >= 70
    evidence_complete: cognitive_auditability_evidence_completeness >= 0.98
  decision_rules:
    cognitive_auditability_high_severity_violation:
      condition: cognitive_auditability_severity_score >= 90
      action: initiate_cognitive_auditability_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: cognitive_auditability_investigation_report
    cognitive_auditability_evidence_compromise_detected:
      condition: cognitive_auditability_integrity_status == compromised
      action: activate_cognitive_auditability_forensic_lockdown
      approval_required: cognitive_auditability_forensic_lead
      evidence_required: cognitive_auditability_integrity_alert_record
    cognitive_auditability_enforcement_authorization:
      condition: cognitive_auditability_violation_confirmed == true AND cognitive_auditability_evidence_complete == true
      action: issue_cognitive_auditability_enforcement_order
      approval_required: cognitive_auditability_enforcement_officer
      evidence_required: cognitive_auditability_violation_evidence_package
    cognitive_auditability_regulator_inquiry_response:
      condition: cognitive_auditability_regulator_request_received == true
      action: compile_cognitive_auditability_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: cognitive_auditability_regulatory_evidence_index
  decision_outputs:
    - cognitive_auditability_enforcement_decision
    - cognitive_auditability_escalation_notice
    - cognitive_auditability_remediation_directive
    - cognitive_auditability_audit_disposition
  approval_requirements:
    enforcement_actions: [cognitive_auditability_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - cognitive_auditability_severity_score >= 90
    - cognitive_auditability_evidence_integrity_failure == true
    - cognitive_auditability_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_cognitive_auditability_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: cognitive_auditability_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Cognitive Auditability may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
