maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Cognitive Auditability activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Cognitive Auditability procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - cognitive_auditability_procedure_checklist
    required_evidence:
      - cognitive_auditability_process_log
    required_metrics:
      - cognitive_auditability_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Cognitive Auditability enterprise-wide.
    required_capabilities:
      - cognitive_auditability_standard_control_set
    required_controls:
      - cognitive_auditability_control_register
    required_evidence:
      - cognitive_auditability_audit_evidence
    required_metrics:
      - cognitive_auditability_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Cognitive Auditability with KPI optimization.
    required_capabilities:
      - cognitive_auditability_automated_controls
    required_controls:
      - cognitive_auditability_telemetry_controls
    required_evidence:
      - cognitive_auditability_assurance_package
    required_metrics:
      - cognitive_auditability_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Cognitive Auditability with predictive analytics.
    required_capabilities:
      - cognitive_auditability_autonomous_governance
    required_controls:
      - cognitive_auditability_adaptive_controls
    required_evidence:
      - cognitive_auditability_regulator_ready_portfolio
    required_metrics:
      - cognitive_auditability_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - cognitive_auditability_report
  - cognitive_auditability_evidence_package
  - cognitive_auditability_attestation
  - cognitive_auditability_enforcement_record
artifacts:
  - name: cognitive_auditability_policy
    retention_years: 10
    classification: RESTRICTED
  - name: cognitive_auditability_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: cognitive_auditability_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: cognitive_auditability_template
    retention_years: 10
    classification: RESTRICTED
records:
