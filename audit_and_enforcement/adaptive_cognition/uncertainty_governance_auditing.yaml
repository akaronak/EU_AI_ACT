maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Uncertainty Governance Auditing activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Uncertainty Governance Auditing procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - uncertainty_governance_auditing_procedure_checklist
    required_evidence:
      - uncertainty_governance_auditing_process_log
    required_metrics:
      - uncertainty_governance_auditing_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Uncertainty Governance Auditing enterprise-wide.
    required_capabilities:
      - uncertainty_governance_auditing_standard_control_set
    required_controls:
      - uncertainty_governance_auditing_control_register
    required_evidence:
      - uncertainty_governance_auditing_audit_evidence
    required_metrics:
      - uncertainty_governance_auditing_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Uncertainty Governance Auditing with KPI optimization.
    required_capabilities:
      - uncertainty_governance_auditing_automated_controls
    required_controls:
      - uncertainty_governance_auditing_telemetry_controls
    required_evidence:
      - uncertainty_governance_auditing_assurance_package
    required_metrics:
      - uncertainty_governance_auditing_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Uncertainty Governance Auditing with predictive analytics.
    required_capabilities:
      - uncertainty_governance_auditing_autonomous_governance
    required_controls:
      - uncertainty_governance_auditing_adaptive_controls
    required_evidence:
      - uncertainty_governance_auditing_regulator_ready_portfolio
    required_metrics:
      - uncertainty_governance_auditing_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - uncertainty_governance_auditing_report
  - uncertainty_governance_auditing_evidence_package
  - uncertainty_governance_auditing_attestation
  - uncertainty_governance_auditing_enforcement_record
artifacts:
  - name: uncertainty_governance_auditing_policy
    retention_years: 10
    classification: RESTRICTED
  - name: uncertainty_governance_auditing_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: uncertainty_governance_auditing_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: uncertainty_governance_auditing_template
    retention_years: 10
    classification: RESTRICTED
records:
  - uncertainty_governance_auditing_case_record
  - uncertainty_governance_auditing_audit_record
  - uncertainty_governance_auditing_enforcement_record
  - uncertainty_governance_auditing_remediation_record
monitoring:
  continuous:
    - uncertainty_governance_auditing_control_telemetry
    - uncertainty_governance_auditing_evidence_integrity_feed
    - uncertainty_governance_auditing_escalation_queue
  periodic:
    - uncertainty_governance_auditing_quarterly_assurance_review
continuous_improvement:
  >
    Quarterly review of Uncertainty Governance Auditing effectiveness, regulatory change impact
    assessment, and control optimization based on audit findings and enforcement outcomes.
exceptions:
  - exception_type: regulatory_override
    authority: Chief Compliance Officer with Legal Counsel concurrence
    documentation: mandatory_exception_register_entry
escalation:
  level_1:
    trigger: moderate_finding
    sla_minutes: 240
    authority: uncertainty_governance_auditing_owner
  level_2:
    trigger: high_finding
    sla_minutes: 120
    authority: uncertainty_governance_auditing_owner
  level_3:
    trigger: critical_finding
    sla_minutes: 60
    authority: uncertainty_governance_auditing_owner
  level_4:
    trigger: regulatory_notification_required
    sla_minutes: 30
    authority: uncertainty_governance_auditing_owner
versioning:
  current: 1.0.0
  changelog:
    - version: 1.0.0
      date: 2026-06-11
      changes: Initial production release for Uncertainty Governance Auditing
