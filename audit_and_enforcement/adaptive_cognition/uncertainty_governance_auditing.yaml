decision_logic:
  decision_inputs:
    - uncertainty_governance_auditing_severity_score
    - uncertainty_governance_auditing_evidence_completeness
    - uncertainty_governance_auditing_regulatory_context
    - uncertainty_governance_auditing_risk_exposure_index
  decision_conditions:
    - uncertainty_governance_auditing_critical_threshold_breach
    - uncertainty_governance_auditing_evidence_integrity_failure
    - uncertainty_governance_auditing_regulatory_notification_required
  decision_thresholds:
    critical_severity: uncertainty_governance_auditing_severity_score >= 90
    high_severity: uncertainty_governance_auditing_severity_score >= 70
    evidence_complete: uncertainty_governance_auditing_evidence_completeness >= 0.98
  decision_rules:
    uncertainty_governance_auditing_high_severity_violation:
      condition: uncertainty_governance_auditing_severity_score >= 90
      action: initiate_uncertainty_governance_auditing_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: uncertainty_governance_auditing_investigation_report
    uncertainty_governance_auditing_evidence_compromise_detected:
      condition: uncertainty_governance_auditing_integrity_status == compromised
      action: activate_uncertainty_governance_auditing_forensic_lockdown
      approval_required: uncertainty_governance_auditing_forensic_lead
      evidence_required: uncertainty_governance_auditing_integrity_alert_record
    uncertainty_governance_auditing_enforcement_authorization:
      condition: uncertainty_governance_auditing_violation_confirmed == true AND uncertainty_governance_auditing_evidence_complete == true
      action: issue_uncertainty_governance_auditing_enforcement_order
      approval_required: uncertainty_governance_auditing_enforcement_officer
      evidence_required: uncertainty_governance_auditing_violation_evidence_package
    uncertainty_governance_auditing_regulator_inquiry_response:
      condition: uncertainty_governance_auditing_regulator_request_received == true
      action: compile_uncertainty_governance_auditing_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: uncertainty_governance_auditing_regulatory_evidence_index
  decision_outputs:
    - uncertainty_governance_auditing_enforcement_decision
    - uncertainty_governance_auditing_escalation_notice
    - uncertainty_governance_auditing_remediation_directive
    - uncertainty_governance_auditing_audit_disposition
  approval_requirements:
    enforcement_actions: [uncertainty_governance_auditing_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - uncertainty_governance_auditing_severity_score >= 90
    - uncertainty_governance_auditing_evidence_integrity_failure == true
    - uncertainty_governance_auditing_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_uncertainty_governance_auditing_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: uncertainty_governance_auditing_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Uncertainty Governance Auditing may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
