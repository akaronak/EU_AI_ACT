maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Alignment Stability Assurance activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Alignment Stability Assurance procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - alignment_stability_assurance_procedure_checklist
    required_evidence:
      - alignment_stability_assurance_process_log
    required_metrics:
      - alignment_stability_assurance_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Alignment Stability Assurance enterprise-wide.
    required_capabilities:
      - alignment_stability_assurance_standard_control_set
    required_controls:
      - alignment_stability_assurance_control_register
    required_evidence:
      - alignment_stability_assurance_audit_evidence
    required_metrics:
      - alignment_stability_assurance_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Alignment Stability Assurance with KPI optimization.
    required_capabilities:
      - alignment_stability_assurance_automated_controls
    required_controls:
      - alignment_stability_assurance_telemetry_controls
    required_evidence:
      - alignment_stability_assurance_assurance_package
    required_metrics:
      - alignment_stability_assurance_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Alignment Stability Assurance with predictive analytics.
    required_capabilities:
      - alignment_stability_assurance_autonomous_governance
    required_controls:
      - alignment_stability_assurance_adaptive_controls
    required_evidence:
      - alignment_stability_assurance_regulator_ready_portfolio
    required_metrics:
      - alignment_stability_assurance_predictive_risk_index
