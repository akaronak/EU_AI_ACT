decision_logic:
  decision_inputs:
    - epistemic_integrity_validation_severity_score
    - epistemic_integrity_validation_evidence_completeness
    - epistemic_integrity_validation_regulatory_context
    - epistemic_integrity_validation_risk_exposure_index
  decision_conditions:
    - epistemic_integrity_validation_critical_threshold_breach
    - epistemic_integrity_validation_evidence_integrity_failure
    - epistemic_integrity_validation_regulatory_notification_required
  decision_thresholds:
    critical_severity: epistemic_integrity_validation_severity_score >= 90
    high_severity: epistemic_integrity_validation_severity_score >= 70
    evidence_complete: epistemic_integrity_validation_evidence_completeness >= 0.98
  decision_rules:
    epistemic_integrity_validation_high_severity_violation:
      condition: epistemic_integrity_validation_severity_score >= 90
      action: initiate_epistemic_integrity_validation_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: epistemic_integrity_validation_investigation_report
    epistemic_integrity_validation_evidence_compromise_detected:
      condition: epistemic_integrity_validation_integrity_status == compromised
      action: activate_epistemic_integrity_validation_forensic_lockdown
      approval_required: epistemic_integrity_validation_forensic_lead
      evidence_required: epistemic_integrity_validation_integrity_alert_record
    epistemic_integrity_validation_enforcement_authorization:
      condition: epistemic_integrity_validation_violation_confirmed == true AND epistemic_integrity_validation_evidence_complete == true
      action: issue_epistemic_integrity_validation_enforcement_order
      approval_required: epistemic_integrity_validation_enforcement_officer
      evidence_required: epistemic_integrity_validation_violation_evidence_package
    epistemic_integrity_validation_regulator_inquiry_response:
      condition: epistemic_integrity_validation_regulator_request_received == true
      action: compile_epistemic_integrity_validation_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: epistemic_integrity_validation_regulatory_evidence_index
  decision_outputs:
    - epistemic_integrity_validation_enforcement_decision
    - epistemic_integrity_validation_escalation_notice
    - epistemic_integrity_validation_remediation_directive
    - epistemic_integrity_validation_audit_disposition
  approval_requirements:
    enforcement_actions: [epistemic_integrity_validation_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - epistemic_integrity_validation_severity_score >= 90
    - epistemic_integrity_validation_evidence_integrity_failure == true
    - epistemic_integrity_validation_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_epistemic_integrity_validation_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: epistemic_integrity_validation_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Epistemic Integrity Validation may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
