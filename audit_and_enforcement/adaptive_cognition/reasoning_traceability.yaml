      systems, decisions, and runtime events, decision rationale reconstruction and explainability
      audit trails including documented procedures, accountable roles, measurable SLAs, and evidence
      retention aligned with EU AI Act and ISO 19011.
  forensic:
    >
      Reasoning Traceability must satisfy forensic requirements for end-to-end trace linkage across
      systems, decisions, and runtime events, decision rationale reconstruction and explainability
      audit trails including documented procedures, accountable roles, measurable SLAs, and evidence
