maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Reasoning Traceability activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Reasoning Traceability procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - reasoning_traceability_procedure_checklist
    required_evidence:
      - reasoning_traceability_process_log
    required_metrics:
      - reasoning_traceability_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Reasoning Traceability enterprise-wide.
    required_capabilities:
      - reasoning_traceability_standard_control_set
    required_controls:
      - reasoning_traceability_control_register
    required_evidence:
      - reasoning_traceability_audit_evidence
    required_metrics:
      - reasoning_traceability_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Reasoning Traceability with KPI optimization.
    required_capabilities:
      - reasoning_traceability_automated_controls
    required_controls:
      - reasoning_traceability_telemetry_controls
    required_evidence:
      - reasoning_traceability_assurance_package
    required_metrics:
      - reasoning_traceability_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Reasoning Traceability with predictive analytics.
    required_capabilities:
      - reasoning_traceability_autonomous_governance
    required_controls:
      - reasoning_traceability_adaptive_controls
    required_evidence:
      - reasoning_traceability_regulator_ready_portfolio
    required_metrics:
      - reasoning_traceability_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
