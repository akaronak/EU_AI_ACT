controls:
  - control_id: AAE-ADA-REASONING_-CHAINOFTHO
    control_name: chain_of_thought_capture_enforcement
    control_category: preventive
    control_objective: Enforce capture of reasoning chains for all high-risk agent decisions
    governance_rationale:
      >
        chain_of_thought_capture_enforcement is required to govern Reasoning Traceability risks under EU
        AI Act and enterprise audit-enforcement policy; failure enables undetected adaptive cognition
        failures.
    implementation_guidance:
      >
        Implement chain_of_thought_capture_enforcement as automated policy in reasoning_traceability
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: chain_of_thought_capture_enforcement_continuous_telemetry_dashboard
    validation_method:
      chain_of_thought_capture_enforcement_quarterly_design_and_operating_effectiveness_test
    testing_method:
      chain_of_thought_capture_enforcement_statistical_sampling_with_exception_tracking
    control_owner: reasoning_traceability_control_owner
    evidence_generated: chain_of_thought_capture_enforcement_control_execution_log
    audit_considerations:
      >
        Auditors verify chain_of_thought_capture_enforcement design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        chain_of_thought_capture_enforcement outputs may trigger enforcement under
