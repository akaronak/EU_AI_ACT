    - reasoning_traceability_evidence_integrity_failure
    - reasoning_traceability_regulatory_notification_required
  decision_thresholds:
    critical_severity: reasoning_traceability_severity_score >= 90
    high_severity: reasoning_traceability_severity_score >= 70
    evidence_complete: reasoning_traceability_evidence_completeness >= 0.98
  decision_rules:
    reasoning_traceability_high_severity_violation:
      condition: reasoning_traceability_severity_score >= 90
      action: initiate_reasoning_traceability_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: reasoning_traceability_investigation_report
    reasoning_traceability_evidence_compromise_detected:
      condition: reasoning_traceability_integrity_status == compromised
      action: activate_reasoning_traceability_forensic_lockdown
      approval_required: reasoning_traceability_forensic_lead
      evidence_required: reasoning_traceability_integrity_alert_record
    reasoning_traceability_enforcement_authorization:
      condition: reasoning_traceability_violation_confirmed == true AND reasoning_traceability_evidence_complete == true
      action: issue_reasoning_traceability_enforcement_order
      approval_required: reasoning_traceability_enforcement_officer
      evidence_required: reasoning_traceability_violation_evidence_package
    reasoning_traceability_regulator_inquiry_response:
      condition: reasoning_traceability_regulator_request_received == true
      action: compile_reasoning_traceability_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: reasoning_traceability_regulatory_evidence_index
