    jurisdictional_enforcement_translation_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    jurisdictional_enforcement_translation_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: jurisdictional_enforcement_translation_enforcement_officer
  risk_tolerance:
    jurisdictional_enforcement_translation_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: jurisdictional_enforcement_translation_risk_score >= 60
    critical: jurisdictional_enforcement_translation_risk_score >= 85
