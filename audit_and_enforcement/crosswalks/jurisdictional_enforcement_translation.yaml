    - jurisdictional_enforcement_translation_regulatory_context
    - jurisdictional_enforcement_translation_risk_exposure_index
  decision_conditions:
    - jurisdictional_enforcement_translation_critical_threshold_breach
    - jurisdictional_enforcement_translation_evidence_integrity_failure
    - jurisdictional_enforcement_translation_regulatory_notification_required
  decision_thresholds:
    critical_severity: jurisdictional_enforcement_translation_severity_score >= 90
    high_severity: jurisdictional_enforcement_translation_severity_score >= 70
    evidence_complete: jurisdictional_enforcement_translation_evidence_completeness >= 0.98
  decision_rules:
    jurisdictional_enforcement_translation_high_severity_violation:
      condition: jurisdictional_enforcement_translation_severity_score >= 90
      action: initiate_jurisdictional_enforcement_translation_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: jurisdictional_enforcement_translation_investigation_report
    jurisdictional_enforcement_translation_evidence_compromise_detected:
      condition: jurisdictional_enforcement_translation_integrity_status == compromised
      action: activate_jurisdictional_enforcement_translation_forensic_lockdown
      approval_required: jurisdictional_enforcement_translation_forensic_lead
      evidence_required: jurisdictional_enforcement_translation_integrity_alert_record
    jurisdictional_enforcement_translation_enforcement_authorization:
      condition: jurisdictional_enforcement_translation_violation_confirmed == true AND jurisdictional_enforcement_translation_evidence_complete == true
      action: issue_jurisdictional_enforcement_translation_enforcement_order
      approval_required: jurisdictional_enforcement_translation_enforcement_officer
      evidence_required: jurisdictional_enforcement_translation_violation_evidence_package
    jurisdictional_enforcement_translation_regulator_inquiry_response:
      condition: jurisdictional_enforcement_translation_regulator_request_received == true
      action: compile_jurisdictional_enforcement_translation_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: jurisdictional_enforcement_translation_regulatory_evidence_index
  decision_outputs:
    - jurisdictional_enforcement_translation_enforcement_decision
    - jurisdictional_enforcement_translation_escalation_notice
    - jurisdictional_enforcement_translation_remediation_directive
    - jurisdictional_enforcement_translation_audit_disposition
  approval_requirements:
    enforcement_actions: [jurisdictional_enforcement_translation_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - jurisdictional_enforcement_translation_severity_score >= 90
    - jurisdictional_enforcement_translation_evidence_integrity_failure == true
    - jurisdictional_enforcement_translation_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_jurisdictional_enforcement_translation_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: jurisdictional_enforcement_translation_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Jurisdictional Enforcement Translation may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
