maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Eu Ai Act Audit Crosswalk activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Eu Ai Act Audit Crosswalk procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - eu_ai_act_audit_crosswalk_procedure_checklist
    required_evidence:
      - eu_ai_act_audit_crosswalk_process_log
    required_metrics:
      - eu_ai_act_audit_crosswalk_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Eu Ai Act Audit Crosswalk enterprise-wide.
    required_capabilities:
      - eu_ai_act_audit_crosswalk_standard_control_set
    required_controls:
      - eu_ai_act_audit_crosswalk_control_register
    required_evidence:
      - eu_ai_act_audit_crosswalk_audit_evidence
    required_metrics:
      - eu_ai_act_audit_crosswalk_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Eu Ai Act Audit Crosswalk with KPI optimization.
    required_capabilities:
      - eu_ai_act_audit_crosswalk_automated_controls
    required_controls:
      - eu_ai_act_audit_crosswalk_telemetry_controls
    required_evidence:
      - eu_ai_act_audit_crosswalk_assurance_package
    required_metrics:
      - eu_ai_act_audit_crosswalk_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Eu Ai Act Audit Crosswalk with predictive analytics.
    required_capabilities:
      - eu_ai_act_audit_crosswalk_autonomous_governance
    required_controls:
      - eu_ai_act_audit_crosswalk_adaptive_controls
    required_evidence:
      - eu_ai_act_audit_crosswalk_regulator_ready_portfolio
    required_metrics:
      - eu_ai_act_audit_crosswalk_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - eu_ai_act_audit_crosswalk_report
