monitoring:
  continuous:
    - eu_ai_act_audit_crosswalk_control_telemetry
    - eu_ai_act_audit_crosswalk_evidence_integrity_feed
    - eu_ai_act_audit_crosswalk_escalation_queue
  periodic:
