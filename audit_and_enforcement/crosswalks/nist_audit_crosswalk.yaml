validation_rules:
  - rule: nist_audit_crosswalk_evidence_complete
    condition: required_evidence_nist_audit_crosswalk < threshold
    action: BLOCK_SUBMISSION
  - rule: nist_audit_crosswalk_integrity_verified
    condition: integrity_status_nist_audit_crosswalk != verified
    action: QUARANTINE_AND_ESCALATE
  - rule: nist_audit_crosswalk_custody_intact
    condition: custody_gap_nist_audit_crosswalk == true
    action: INITIATE_FORENSIC_REVIEW
risk_considerations:
  regulatory_sanction:
    >
      Risk of regulatory sanction if Nist Audit Crosswalk controls fail; mitigated through
      preventive/detective controls and escalation.
  evidence_inadmissibility:
    >
      Risk of evidence inadmissibility if Nist Audit Crosswalk controls fail; mitigated through
      preventive/detective controls and escalation.
  enforcement_failure:
    >
      Risk of enforcement failure if Nist Audit Crosswalk controls fail; mitigated through
      preventive/detective controls and escalation.
  reputational_harm:
    >
      Risk of reputational harm if Nist Audit Crosswalk controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Nist Audit Crosswalk controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - nist_audit_crosswalk_control_failure
    - nist_audit_crosswalk_evidence_compromise
    - nist_audit_crosswalk_regulatory_non_compliance
    - nist_audit_crosswalk_enforcement_delay
  risk_events:
    - nist_audit_crosswalk_audit_finding_critical
    - nist_audit_crosswalk_investigation_escalation
    - nist_audit_crosswalk_sanction_exposure
    - nist_audit_crosswalk_market_surveillance_inquiry
  risk_indicators:
    - nist_audit_crosswalk_control_effectiveness_degradation
    - nist_audit_crosswalk_evidence_gap_rate
    - nist_audit_crosswalk_sla_breach_count
    - nist_audit_crosswalk_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    nist_audit_crosswalk_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: nist_audit_crosswalk_forensic_lead
    nist_audit_crosswalk_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    nist_audit_crosswalk_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: nist_audit_crosswalk_enforcement_officer
  risk_tolerance:
    nist_audit_crosswalk_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: nist_audit_crosswalk_risk_score >= 60
    critical: nist_audit_crosswalk_risk_score >= 85
  residual_risk:
    >
      Residual risk after Nist Audit Crosswalk controls documented in
      nist_audit_crosswalk_risk_register with quarterly review.
  risk_treatment:
    - nist_audit_crosswalk_preventive_control_reinforcement
    - nist_audit_crosswalk_detective_monitoring_enhancement
    - nist_audit_crosswalk_corrective_remediation_plan
  risk_monitoring:
    telemetry: nist_audit_crosswalk_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Nist Audit Crosswalk workflow events with provenance anchor and
      nist_audit_crosswalk_hash_chain_init
  evidence_collection:
    >
      Structured ingestion via nist_audit_crosswalk_collection_api with schema validation and
      classification
  evidence_validation:
