decision_logic:
  decision_inputs:
    - nist_audit_crosswalk_severity_score
    - nist_audit_crosswalk_evidence_completeness
    - nist_audit_crosswalk_regulatory_context
    - nist_audit_crosswalk_risk_exposure_index
  decision_conditions:
    - nist_audit_crosswalk_critical_threshold_breach
    - nist_audit_crosswalk_evidence_integrity_failure
    - nist_audit_crosswalk_regulatory_notification_required
  decision_thresholds:
    critical_severity: nist_audit_crosswalk_severity_score >= 90
    high_severity: nist_audit_crosswalk_severity_score >= 70
    evidence_complete: nist_audit_crosswalk_evidence_completeness >= 0.98
  decision_rules:
    nist_audit_crosswalk_high_severity_violation:
      condition: nist_audit_crosswalk_severity_score >= 90
      action: initiate_nist_audit_crosswalk_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: nist_audit_crosswalk_investigation_report
    nist_audit_crosswalk_evidence_compromise_detected:
      condition: nist_audit_crosswalk_integrity_status == compromised
      action: activate_nist_audit_crosswalk_forensic_lockdown
      approval_required: nist_audit_crosswalk_forensic_lead
      evidence_required: nist_audit_crosswalk_integrity_alert_record
    nist_audit_crosswalk_enforcement_authorization:
      condition: nist_audit_crosswalk_violation_confirmed == true AND nist_audit_crosswalk_evidence_complete == true
      action: issue_nist_audit_crosswalk_enforcement_order
      approval_required: nist_audit_crosswalk_enforcement_officer
      evidence_required: nist_audit_crosswalk_violation_evidence_package
    nist_audit_crosswalk_regulator_inquiry_response:
      condition: nist_audit_crosswalk_regulator_request_received == true
      action: compile_nist_audit_crosswalk_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: nist_audit_crosswalk_regulatory_evidence_index
  decision_outputs:
    - nist_audit_crosswalk_enforcement_decision
    - nist_audit_crosswalk_escalation_notice
    - nist_audit_crosswalk_remediation_directive
    - nist_audit_crosswalk_audit_disposition
  approval_requirements:
    enforcement_actions: [nist_audit_crosswalk_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - nist_audit_crosswalk_severity_score >= 90
    - nist_audit_crosswalk_evidence_integrity_failure == true
    - nist_audit_crosswalk_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_nist_audit_crosswalk_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: nist_audit_crosswalk_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Nist Audit Crosswalk may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
