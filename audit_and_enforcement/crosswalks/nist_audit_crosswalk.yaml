maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Nist Audit Crosswalk activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Nist Audit Crosswalk procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - nist_audit_crosswalk_procedure_checklist
    required_evidence:
      - nist_audit_crosswalk_process_log
    required_metrics:
      - nist_audit_crosswalk_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Nist Audit Crosswalk enterprise-wide.
    required_capabilities:
      - nist_audit_crosswalk_standard_control_set
    required_controls:
      - nist_audit_crosswalk_control_register
    required_evidence:
      - nist_audit_crosswalk_audit_evidence
    required_metrics:
      - nist_audit_crosswalk_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Nist Audit Crosswalk with KPI optimization.
    required_capabilities:
      - nist_audit_crosswalk_automated_controls
    required_controls:
      - nist_audit_crosswalk_telemetry_controls
    required_evidence:
      - nist_audit_crosswalk_assurance_package
    required_metrics:
      - nist_audit_crosswalk_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Nist Audit Crosswalk with predictive analytics.
    required_capabilities:
      - nist_audit_crosswalk_autonomous_governance
    required_controls:
      - nist_audit_crosswalk_adaptive_controls
    required_evidence:
      - nist_audit_crosswalk_regulator_ready_portfolio
    required_metrics:
      - nist_audit_crosswalk_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - nist_audit_crosswalk_report
  - nist_audit_crosswalk_evidence_package
  - nist_audit_crosswalk_attestation
  - nist_audit_crosswalk_enforcement_record
artifacts:
  - name: nist_audit_crosswalk_policy
    retention_years: 10
    classification: RESTRICTED
  - name: nist_audit_crosswalk_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: nist_audit_crosswalk_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: nist_audit_crosswalk_template
    retention_years: 10
    classification: RESTRICTED
records:
  - nist_audit_crosswalk_case_record
  - nist_audit_crosswalk_audit_record
  - nist_audit_crosswalk_enforcement_record
  - nist_audit_crosswalk_remediation_record
monitoring:
  continuous:
    - nist_audit_crosswalk_control_telemetry
    - nist_audit_crosswalk_evidence_integrity_feed
    - nist_audit_crosswalk_escalation_queue
  periodic:
    - nist_audit_crosswalk_quarterly_assurance_review
continuous_improvement:
  >
    Quarterly review of Nist Audit Crosswalk effectiveness, regulatory change impact assessment, and
    control optimization based on audit findings and enforcement outcomes.
exceptions:
  - exception_type: regulatory_override
    authority: Chief Compliance Officer with Legal Counsel concurrence
    documentation: mandatory_exception_register_entry
escalation:
  level_1:
    trigger: moderate_finding
    sla_minutes: 240
    authority: nist_audit_crosswalk_owner
  level_2:
    trigger: high_finding
    sla_minutes: 120
    authority: nist_audit_crosswalk_owner
  level_3:
    trigger: critical_finding
    sla_minutes: 60
    authority: nist_audit_crosswalk_owner
  level_4:
    trigger: regulatory_notification_required
    sla_minutes: 30
    authority: nist_audit_crosswalk_owner
versioning:
  current: 1.0.0
  changelog:
    - version: 1.0.0
      date: 2026-06-11
      changes: Initial production release for Nist Audit Crosswalk
