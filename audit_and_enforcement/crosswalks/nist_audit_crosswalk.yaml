controls:
  - control_id: AAE-CRO-NIST_AUDIT-NISTCLAUSE
    control_name: nist_clause_mapping_accuracy_validator
    control_category: detective
    control_objective:
      >
        Operational control ensuring clause mapping accuracy validator for Nist Audit Crosswalk across
        crosswalks.
    governance_rationale:
      >
        nist_clause_mapping_accuracy_validator is required to govern Nist Audit Crosswalk risks under EU
        AI Act and enterprise audit-enforcement policy; failure enables undetected crosswalks failures.
    implementation_guidance:
      >
        Implement nist_clause_mapping_accuracy_validator as automated policy in nist_audit_crosswalk
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: nist_clause_mapping_accuracy_validator_continuous_telemetry_dashboard
    validation_method:
      nist_clause_mapping_accuracy_validator_quarterly_design_and_operating_effectiveness_test
    testing_method:
      nist_clause_mapping_accuracy_validator_statistical_sampling_with_exception_tracking
    control_owner: nist_audit_crosswalk_control_owner
    evidence_generated: nist_clause_mapping_accuracy_validator_control_execution_log
    audit_considerations:
      >
        Auditors verify nist_clause_mapping_accuracy_validator design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        nist_clause_mapping_accuracy_validator outputs may trigger enforcement under
        nist_audit_crosswalk escalation rules.
