roles_and_responsibilities:
  nist_audit_crosswalk_owner:
    responsibilities:
      - Accountable for Nist Audit Crosswalk strategy, control design, and regulatory alignment
  nist_audit_crosswalk_operator:
    responsibilities:
      - Executes Nist Audit Crosswalk workflows and maintains operational records
  nist_audit_crosswalk_auditor:
    responsibilities:
      - Independently validates Nist Audit Crosswalk control effectiveness and evidence sufficiency
  nist_audit_crosswalk_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for Nist Audit Crosswalk investigations
  nist_audit_crosswalk_enforcement_officer:
    responsibilities:
      - Authorizes and executes enforcement actions under Nist Audit Crosswalk
  regulatory_liaison:
    responsibilities:
      - Coordinates regulator submissions and inspection responses
