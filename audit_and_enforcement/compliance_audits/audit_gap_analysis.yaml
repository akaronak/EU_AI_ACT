controls:
  - control_id: AAE-COM-AUDIT_GAP_-AUDITAUDIT
    control_name: audit_audit_scope_boundary_enforcer
    control_category: preventive
    control_objective:
      >
        Operational control ensuring audit scope boundary enforcer for Audit Gap Analysis across
        compliance_audits.
    governance_rationale:
      >
        audit_audit_scope_boundary_enforcer is required to govern Audit Gap Analysis risks under EU AI
        Act and enterprise audit-enforcement policy; failure enables undetected compliance audits
        failures.
    implementation_guidance:
      >
        Implement audit_audit_scope_boundary_enforcer as automated policy in audit_gap_analysis
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: audit_audit_scope_boundary_enforcer_continuous_telemetry_dashboard
    validation_method:
      audit_audit_scope_boundary_enforcer_quarterly_design_and_operating_effectiveness_test
    testing_method: audit_audit_scope_boundary_enforcer_statistical_sampling_with_exception_tracking
    control_owner: audit_gap_analysis_control_owner
    evidence_generated: audit_audit_scope_boundary_enforcer_control_execution_log
    audit_considerations:
      >
        Auditors verify audit_audit_scope_boundary_enforcer design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        audit_audit_scope_boundary_enforcer outputs may trigger enforcement under audit_gap_analysis
