maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Audit Gap Analysis activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Audit Gap Analysis procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - audit_gap_analysis_procedure_checklist
    required_evidence:
      - audit_gap_analysis_process_log
    required_metrics:
      - audit_gap_analysis_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Audit Gap Analysis enterprise-wide.
    required_capabilities:
      - audit_gap_analysis_standard_control_set
    required_controls:
      - audit_gap_analysis_control_register
    required_evidence:
      - audit_gap_analysis_audit_evidence
    required_metrics:
      - audit_gap_analysis_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Audit Gap Analysis with KPI optimization.
    required_capabilities:
      - audit_gap_analysis_automated_controls
    required_controls:
      - audit_gap_analysis_telemetry_controls
    required_evidence:
      - audit_gap_analysis_assurance_package
    required_metrics:
      - audit_gap_analysis_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Audit Gap Analysis with predictive analytics.
    required_capabilities:
      - audit_gap_analysis_autonomous_governance
    required_controls:
      - audit_gap_analysis_adaptive_controls
    required_evidence:
      - audit_gap_analysis_regulator_ready_portfolio
    required_metrics:
      - audit_gap_analysis_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - audit_gap_analysis_report
  - audit_gap_analysis_evidence_package
  - audit_gap_analysis_attestation
  - audit_gap_analysis_enforcement_record
artifacts:
  - name: audit_gap_analysis_policy
    retention_years: 10
    classification: RESTRICTED
  - name: audit_gap_analysis_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: audit_gap_analysis_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: audit_gap_analysis_template
    retention_years: 10
    classification: RESTRICTED
records:
  - audit_gap_analysis_case_record
  - audit_gap_analysis_audit_record
  - audit_gap_analysis_enforcement_record
  - audit_gap_analysis_remediation_record
monitoring:
  continuous:
    - audit_gap_analysis_control_telemetry
    - audit_gap_analysis_evidence_integrity_feed
    - audit_gap_analysis_escalation_queue
  periodic:
    - audit_gap_analysis_quarterly_assurance_review
continuous_improvement:
  >
    Quarterly review of Audit Gap Analysis effectiveness, regulatory change impact assessment, and
    control optimization based on audit findings and enforcement outcomes.
exceptions:
  - exception_type: regulatory_override
    authority: Chief Compliance Officer with Legal Counsel concurrence
    documentation: mandatory_exception_register_entry
escalation:
  level_1:
    trigger: moderate_finding
    sla_minutes: 240
    authority: audit_gap_analysis_owner
  level_2:
    trigger: high_finding
    sla_minutes: 120
    authority: audit_gap_analysis_owner
  level_3:
    trigger: critical_finding
    sla_minutes: 60
    authority: audit_gap_analysis_owner
  level_4:
    trigger: regulatory_notification_required
    sla_minutes: 30
    authority: audit_gap_analysis_owner
