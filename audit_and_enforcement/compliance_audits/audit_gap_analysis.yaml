decision_logic:
  decision_inputs:
    - audit_gap_analysis_severity_score
    - audit_gap_analysis_evidence_completeness
    - audit_gap_analysis_regulatory_context
    - audit_gap_analysis_risk_exposure_index
  decision_conditions:
    - audit_gap_analysis_critical_threshold_breach
    - audit_gap_analysis_evidence_integrity_failure
    - audit_gap_analysis_regulatory_notification_required
  decision_thresholds:
    critical_severity: audit_gap_analysis_severity_score >= 90
    high_severity: audit_gap_analysis_severity_score >= 70
    evidence_complete: audit_gap_analysis_evidence_completeness >= 0.98
  decision_rules:
    audit_gap_analysis_high_severity_violation:
      condition: audit_gap_analysis_severity_score >= 90
      action: initiate_audit_gap_analysis_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: audit_gap_analysis_investigation_report
    audit_gap_analysis_evidence_compromise_detected:
      condition: audit_gap_analysis_integrity_status == compromised
      action: activate_audit_gap_analysis_forensic_lockdown
      approval_required: audit_gap_analysis_forensic_lead
      evidence_required: audit_gap_analysis_integrity_alert_record
    audit_gap_analysis_enforcement_authorization:
      condition: audit_gap_analysis_violation_confirmed == true AND audit_gap_analysis_evidence_complete == true
      action: issue_audit_gap_analysis_enforcement_order
      approval_required: audit_gap_analysis_enforcement_officer
      evidence_required: audit_gap_analysis_violation_evidence_package
    audit_gap_analysis_regulator_inquiry_response:
      condition: audit_gap_analysis_regulator_request_received == true
      action: compile_audit_gap_analysis_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: audit_gap_analysis_regulatory_evidence_index
  decision_outputs:
    - audit_gap_analysis_enforcement_decision
    - audit_gap_analysis_escalation_notice
    - audit_gap_analysis_remediation_directive
    - audit_gap_analysis_audit_disposition
  approval_requirements:
    enforcement_actions: [audit_gap_analysis_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - audit_gap_analysis_severity_score >= 90
    - audit_gap_analysis_evidence_integrity_failure == true
    - audit_gap_analysis_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_audit_gap_analysis_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: audit_gap_analysis_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Audit Gap Analysis may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
