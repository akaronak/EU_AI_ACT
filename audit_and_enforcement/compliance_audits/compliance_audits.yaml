  compliance_audits_auditor:
    responsibilities:
      - Independently validates Compliance Audits control effectiveness and evidence sufficiency
  compliance_audits_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for Compliance Audits investigations
  compliance_audits_enforcement_officer:
    responsibilities:
