decision_logic:
  decision_inputs:
    - compliance_audits_severity_score
    - compliance_audits_evidence_completeness
    - compliance_audits_regulatory_context
    - compliance_audits_risk_exposure_index
  decision_conditions:
    - compliance_audits_critical_threshold_breach
    - compliance_audits_evidence_integrity_failure
    - compliance_audits_regulatory_notification_required
  decision_thresholds:
    critical_severity: compliance_audits_severity_score >= 90
    high_severity: compliance_audits_severity_score >= 70
    evidence_complete: compliance_audits_evidence_completeness >= 0.98
  decision_rules:
    compliance_audits_high_severity_violation:
      condition: compliance_audits_severity_score >= 90
      action: initiate_compliance_audits_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: compliance_audits_investigation_report
    compliance_audits_evidence_compromise_detected:
      condition: compliance_audits_integrity_status == compromised
      action: activate_compliance_audits_forensic_lockdown
      approval_required: compliance_audits_forensic_lead
      evidence_required: compliance_audits_integrity_alert_record
    compliance_audits_enforcement_authorization:
      condition: compliance_audits_violation_confirmed == true AND compliance_audits_evidence_complete == true
      action: issue_compliance_audits_enforcement_order
      approval_required: compliance_audits_enforcement_officer
      evidence_required: compliance_audits_violation_evidence_package
    compliance_audits_regulator_inquiry_response:
      condition: compliance_audits_regulator_request_received == true
      action: compile_compliance_audits_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: compliance_audits_regulatory_evidence_index
  decision_outputs:
    - compliance_audits_enforcement_decision
    - compliance_audits_escalation_notice
    - compliance_audits_remediation_directive
    - compliance_audits_audit_disposition
  approval_requirements:
    enforcement_actions: [compliance_audits_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - compliance_audits_severity_score >= 90
    - compliance_audits_evidence_integrity_failure == true
    - compliance_audits_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_compliance_audits_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: compliance_audits_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Compliance Audits may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
