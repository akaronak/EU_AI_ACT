maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Compliance Audits activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Compliance Audits procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - compliance_audits_procedure_checklist
    required_evidence:
      - compliance_audits_process_log
    required_metrics:
      - compliance_audits_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Compliance Audits enterprise-wide.
    required_capabilities:
      - compliance_audits_standard_control_set
    required_controls:
      - compliance_audits_control_register
    required_evidence:
      - compliance_audits_audit_evidence
    required_metrics:
      - compliance_audits_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Compliance Audits with KPI optimization.
    required_capabilities:
      - compliance_audits_automated_controls
    required_controls:
      - compliance_audits_telemetry_controls
    required_evidence:
      - compliance_audits_assurance_package
    required_metrics:
      - compliance_audits_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Compliance Audits with predictive analytics.
    required_capabilities:
      - compliance_audits_autonomous_governance
    required_controls:
      - compliance_audits_adaptive_controls
    required_evidence:
      - compliance_audits_regulator_ready_portfolio
    required_metrics:
      - compliance_audits_predictive_risk_index
dependencies:
  required:
