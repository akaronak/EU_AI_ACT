controls:
  - control_id: AAE-COM-REGULATORY-REGULATORYA
    control_name: regulatory_audit_scope_boundary_enforcer
    control_category: preventive
    control_objective:
      >
        Operational control ensuring audit scope boundary enforcer for Regulatory Audit Alignment across
        compliance_audits.
    governance_rationale:
      >
        regulatory_audit_scope_boundary_enforcer is required to govern Regulatory Audit Alignment risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected compliance
        audits failures.
    implementation_guidance:
      >
        Implement regulatory_audit_scope_boundary_enforcer as automated policy in
        regulatory_audit_alignment orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: regulatory_audit_scope_boundary_enforcer_continuous_telemetry_dashboard
    validation_method:
      regulatory_audit_scope_boundary_enforcer_quarterly_design_and_operating_effectiveness_test
    testing_method:
      regulatory_audit_scope_boundary_enforcer_statistical_sampling_with_exception_tracking
    control_owner: regulatory_audit_alignment_control_owner
    evidence_generated: regulatory_audit_scope_boundary_enforcer_control_execution_log
    audit_considerations:
      >
        Auditors verify regulatory_audit_scope_boundary_enforcer design, operation, and evidence
        sufficiency per ISO 19011.
