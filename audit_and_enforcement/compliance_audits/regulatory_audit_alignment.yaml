    - regulatory_audit_alignment_evidence_gap_rate
    - regulatory_audit_alignment_sla_breach_count
    - regulatory_audit_alignment_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    regulatory_audit_alignment_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: regulatory_audit_alignment_forensic_lead
    regulatory_audit_alignment_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    regulatory_audit_alignment_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: regulatory_audit_alignment_enforcement_officer
  risk_tolerance:
    regulatory_audit_alignment_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: regulatory_audit_alignment_risk_score >= 60
    critical: regulatory_audit_alignment_risk_score >= 85
  residual_risk:
    >
      Residual risk after Regulatory Audit Alignment controls documented in
      regulatory_audit_alignment_risk_register with quarterly review.
  risk_treatment:
    - regulatory_audit_alignment_preventive_control_reinforcement
    - regulatory_audit_alignment_detective_monitoring_enhancement
    - regulatory_audit_alignment_corrective_remediation_plan
  risk_monitoring:
    telemetry: regulatory_audit_alignment_risk_dashboard
    review_frequency: monthly
