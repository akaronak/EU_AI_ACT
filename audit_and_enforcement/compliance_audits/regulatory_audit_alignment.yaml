      Risk of reputational harm if Regulatory Audit Alignment controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Regulatory Audit Alignment controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - regulatory_audit_alignment_control_failure
