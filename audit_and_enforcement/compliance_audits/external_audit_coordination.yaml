roles_and_responsibilities:
  external_audit_coordination_owner:
    responsibilities:
      - Accountable for External Audit Coordination strategy, control design, and regulatory alignment
  external_audit_coordination_operator:
    responsibilities:
      - Executes External Audit Coordination workflows and maintains operational records
  external_audit_coordination_auditor:
    responsibilities:
      - Independently validates External Audit Coordination control effectiveness and evidence sufficiency
  external_audit_coordination_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for External Audit Coordination investigations
  external_audit_coordination_enforcement_officer:
    responsibilities:
      - Authorizes and executes enforcement actions under External Audit Coordination
  regulatory_liaison:
