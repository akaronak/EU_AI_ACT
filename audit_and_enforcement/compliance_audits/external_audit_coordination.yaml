decision_logic:
  decision_inputs:
    - external_audit_coordination_severity_score
    - external_audit_coordination_evidence_completeness
    - external_audit_coordination_regulatory_context
    - external_audit_coordination_risk_exposure_index
  decision_conditions:
    - external_audit_coordination_critical_threshold_breach
    - external_audit_coordination_evidence_integrity_failure
    - external_audit_coordination_regulatory_notification_required
  decision_thresholds:
    critical_severity: external_audit_coordination_severity_score >= 90
    high_severity: external_audit_coordination_severity_score >= 70
    evidence_complete: external_audit_coordination_evidence_completeness >= 0.98
  decision_rules:
    external_audit_coordination_high_severity_violation:
      condition: external_audit_coordination_severity_score >= 90
      action: initiate_external_audit_coordination_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: external_audit_coordination_investigation_report
    external_audit_coordination_evidence_compromise_detected:
      condition: external_audit_coordination_integrity_status == compromised
      action: activate_external_audit_coordination_forensic_lockdown
      approval_required: external_audit_coordination_forensic_lead
      evidence_required: external_audit_coordination_integrity_alert_record
    external_audit_coordination_enforcement_authorization:
      condition: external_audit_coordination_violation_confirmed == true AND external_audit_coordination_evidence_complete == true
      action: issue_external_audit_coordination_enforcement_order
      approval_required: external_audit_coordination_enforcement_officer
      evidence_required: external_audit_coordination_violation_evidence_package
    external_audit_coordination_regulator_inquiry_response:
      condition: external_audit_coordination_regulator_request_received == true
      action: compile_external_audit_coordination_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: external_audit_coordination_regulatory_evidence_index
  decision_outputs:
    - external_audit_coordination_enforcement_decision
    - external_audit_coordination_escalation_notice
    - external_audit_coordination_remediation_directive
    - external_audit_coordination_audit_disposition
  approval_requirements:
    enforcement_actions: [external_audit_coordination_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - external_audit_coordination_severity_score >= 90
    - external_audit_coordination_evidence_integrity_failure == true
    - external_audit_coordination_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_external_audit_coordination_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: external_audit_coordination_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under External Audit Coordination may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
