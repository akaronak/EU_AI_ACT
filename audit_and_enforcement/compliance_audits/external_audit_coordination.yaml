controls:
  - control_id: AAE-COM-EXTERNAL_A-EXTERNALAUD
    control_name: external_audit_scope_boundary_enforcer
    control_category: preventive
    control_objective:
      >
        Operational control ensuring audit scope boundary enforcer for External Audit Coordination
        across compliance_audits.
    governance_rationale:
      >
        external_audit_scope_boundary_enforcer is required to govern External Audit Coordination risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected compliance
        audits failures.
    implementation_guidance:
      >
        Implement external_audit_scope_boundary_enforcer as automated policy in
        external_audit_coordination orchestration layer; wire to telemetry bus; block non-compliant
        state transitions; log evidence to immutable store.
    monitoring_method: external_audit_scope_boundary_enforcer_continuous_telemetry_dashboard
    validation_method:
      external_audit_scope_boundary_enforcer_quarterly_design_and_operating_effectiveness_test
    testing_method:
      external_audit_scope_boundary_enforcer_statistical_sampling_with_exception_tracking
    control_owner: external_audit_coordination_control_owner
    evidence_generated: external_audit_scope_boundary_enforcer_control_execution_log
    audit_considerations:
      >
        Auditors verify external_audit_scope_boundary_enforcer design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
