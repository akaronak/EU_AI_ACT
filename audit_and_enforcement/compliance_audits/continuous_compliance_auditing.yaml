  continuous_compliance_auditing_operator:
    responsibilities:
      - Executes Continuous Compliance Auditing workflows and maintains operational records
  continuous_compliance_auditing_auditor:
    responsibilities:
      - Independently validates Continuous Compliance Auditing control effectiveness and evidence sufficiency
  continuous_compliance_auditing_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for Continuous Compliance Auditing investigations
  continuous_compliance_auditing_enforcement_officer:
