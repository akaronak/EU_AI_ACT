controls:
  - control_id: AAE-COM-CONTINUOUS-CONTINUOUSA
    control_name: continuous_audit_scope_boundary_enforcer
    control_category: preventive
    control_objective:
      >
        Operational control ensuring audit scope boundary enforcer for Continuous Compliance Auditing
        across compliance_audits.
    governance_rationale:
      >
        continuous_audit_scope_boundary_enforcer is required to govern Continuous Compliance Auditing
        risks under EU AI Act and enterprise audit-enforcement policy; failure enables undetected
        compliance audits failures.
    implementation_guidance:
      >
        Implement continuous_audit_scope_boundary_enforcer as automated policy in
        continuous_compliance_auditing orchestration layer; wire to telemetry bus; block non-compliant
        state transitions; log evidence to immutable store.
    monitoring_method: continuous_audit_scope_boundary_enforcer_continuous_telemetry_dashboard
    validation_method:
      continuous_audit_scope_boundary_enforcer_quarterly_design_and_operating_effectiveness_test
    testing_method:
      continuous_audit_scope_boundary_enforcer_statistical_sampling_with_exception_tracking
    control_owner: continuous_compliance_auditing_control_owner
    evidence_generated: continuous_audit_scope_boundary_enforcer_control_execution_log
    audit_considerations:
      >
        Auditors verify continuous_audit_scope_boundary_enforcer design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        continuous_audit_scope_boundary_enforcer outputs may trigger enforcement under
