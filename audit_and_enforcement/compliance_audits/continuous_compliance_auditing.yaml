  regulatory_sanction:
    >
      Risk of regulatory sanction if Continuous Compliance Auditing controls fail; mitigated through
      preventive/detective controls and escalation.
  evidence_inadmissibility:
    >
      Risk of evidence inadmissibility if Continuous Compliance Auditing controls fail; mitigated
      through preventive/detective controls and escalation.
  enforcement_failure:
    >
      Risk of enforcement failure if Continuous Compliance Auditing controls fail; mitigated through
      preventive/detective controls and escalation.
  reputational_harm:
    >
      Risk of reputational harm if Continuous Compliance Auditing controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Continuous Compliance Auditing controls fail; mitigated
      through preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - continuous_compliance_auditing_control_failure
    - continuous_compliance_auditing_evidence_compromise
    - continuous_compliance_auditing_regulatory_non_compliance
    - continuous_compliance_auditing_enforcement_delay
  risk_events:
    - continuous_compliance_auditing_audit_finding_critical
    - continuous_compliance_auditing_investigation_escalation
    - continuous_compliance_auditing_sanction_exposure
    - continuous_compliance_auditing_market_surveillance_inquiry
  risk_indicators:
    - continuous_compliance_auditing_control_effectiveness_degradation
    - continuous_compliance_auditing_evidence_gap_rate
    - continuous_compliance_auditing_sla_breach_count
    - continuous_compliance_auditing_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    continuous_compliance_auditing_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: continuous_compliance_auditing_forensic_lead
    continuous_compliance_auditing_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    continuous_compliance_auditing_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: continuous_compliance_auditing_enforcement_officer
  risk_tolerance:
    continuous_compliance_auditing_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: continuous_compliance_auditing_risk_score >= 60
    critical: continuous_compliance_auditing_risk_score >= 85
  residual_risk:
    >
      Residual risk after Continuous Compliance Auditing controls documented in
      continuous_compliance_auditing_risk_register with quarterly review.
  risk_treatment:
    - continuous_compliance_auditing_preventive_control_reinforcement
    - continuous_compliance_auditing_detective_monitoring_enhancement
    - continuous_compliance_auditing_corrective_remediation_plan
  risk_monitoring:
    telemetry: continuous_compliance_auditing_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Continuous Compliance Auditing workflow events with provenance anchor and
      continuous_compliance_auditing_hash_chain_init
  evidence_collection:
    >
      Structured ingestion via continuous_compliance_auditing_collection_api with schema validation
      and classification
  evidence_validation:
    >
      Completeness, authenticity, and admissibility checks via
      continuous_compliance_auditing_validation_engine
  evidence_classification:
    >
      RESTRICTED/CONFIDENTIAL classification per
      continuous_compliance_auditing_data_classification_policy
  evidence_storage:
    >
      Write-once immutable storage in continuous_compliance_auditing_evidence_vault with access
      controls
  evidence_retention:
    >
      Retention per continuous_compliance_auditing_retention_schedule aligned with EU AI Act Article
      18 and legal hold
  evidence_archival:
    Long-term archival with continuous_compliance_auditing_integrity_verification before migration
  evidence_retrieval:
    Audited retrieval via continuous_compliance_auditing_retrieval_gateway with purpose logging
  evidence_disposal:
    >
      Authorized disposition with continuous_compliance_auditing_disposition_certificate and dual
      approval
