      preventive/detective controls and escalation.
  enforcement_failure:
    >
      Risk of enforcement failure if Compliance Audit Framework controls fail; mitigated through
      preventive/detective controls and escalation.
  reputational_harm:
    >
      Risk of reputational harm if Compliance Audit Framework controls fail; mitigated through
      preventive/detective controls and escalation.
  operational_disruption:
    >
      Risk of operational disruption if Compliance Audit Framework controls fail; mitigated through
      preventive/detective controls and escalation.
risk_model:
  risk_sources:
    - compliance_audit_framework_control_failure
    - compliance_audit_framework_evidence_compromise
    - compliance_audit_framework_regulatory_non_compliance
    - compliance_audit_framework_enforcement_delay
  risk_events:
    - compliance_audit_framework_audit_finding_critical
    - compliance_audit_framework_investigation_escalation
    - compliance_audit_framework_sanction_exposure
    - compliance_audit_framework_market_surveillance_inquiry
  risk_indicators:
    - compliance_audit_framework_control_effectiveness_degradation
    - compliance_audit_framework_evidence_gap_rate
    - compliance_audit_framework_sla_breach_count
    - compliance_audit_framework_repeat_violation_signal
  risk_scenarios:
  risk_scores:
    compliance_audit_framework_evidence_inadmissibility_scenario:
      likelihood: low
      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: compliance_audit_framework_forensic_lead
    compliance_audit_framework_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    compliance_audit_framework_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: compliance_audit_framework_enforcement_officer
  risk_tolerance:
    compliance_audit_framework_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: compliance_audit_framework_risk_score >= 60
    critical: compliance_audit_framework_risk_score >= 85
  residual_risk:
    >
      Residual risk after Compliance Audit Framework controls documented in
      compliance_audit_framework_risk_register with quarterly review.
  risk_treatment:
    - compliance_audit_framework_preventive_control_reinforcement
    - compliance_audit_framework_detective_monitoring_enhancement
    - compliance_audit_framework_corrective_remediation_plan
  risk_monitoring:
    telemetry: compliance_audit_framework_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Compliance Audit Framework workflow events with provenance anchor and
      compliance_audit_framework_hash_chain_init
  evidence_collection:
    >
      Structured ingestion via compliance_audit_framework_collection_api with schema validation and
      classification
  evidence_validation:
    >
      Completeness, authenticity, and admissibility checks via
      compliance_audit_framework_validation_engine
  evidence_classification:
    RESTRICTED/CONFIDENTIAL classification per compliance_audit_framework_data_classification_policy
  evidence_storage:
    Write-once immutable storage in compliance_audit_framework_evidence_vault with access controls
  evidence_retention:
    >
      Retention per compliance_audit_framework_retention_schedule aligned with EU AI Act Article 18
      and legal hold
  evidence_archival:
    Long-term archival with compliance_audit_framework_integrity_verification before migration
  evidence_retrieval:
    Audited retrieval via compliance_audit_framework_retrieval_gateway with purpose logging
  evidence_disposal:
    Authorized disposition with compliance_audit_framework_disposition_certificate and dual approval
