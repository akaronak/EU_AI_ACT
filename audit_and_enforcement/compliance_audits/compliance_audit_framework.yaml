roles_and_responsibilities:
  compliance_audit_framework_owner:
    responsibilities:
      - Accountable for Compliance Audit Framework strategy, control design, and regulatory alignment
  compliance_audit_framework_operator:
    responsibilities:
      - Executes Compliance Audit Framework workflows and maintains operational records
  compliance_audit_framework_auditor:
    responsibilities:
      - Independently validates Compliance Audit Framework control effectiveness and evidence sufficiency
  compliance_audit_framework_forensic_lead:
    responsibilities:
      - Preserves and analyzes forensic artifacts for Compliance Audit Framework investigations
  compliance_audit_framework_enforcement_officer:
    responsibilities:
      - Authorizes and executes enforcement actions under Compliance Audit Framework
  regulatory_liaison:
    responsibilities:
      - Coordinates regulator submissions and inspection responses
