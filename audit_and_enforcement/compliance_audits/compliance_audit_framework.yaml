controls:
  - control_id: AAE-COM-COMPLIANCE-COMPLIANCEA
    control_name: compliance_audit_scope_boundary_enforcer
    control_category: preventive
    control_objective:
      >
        Operational control ensuring audit scope boundary enforcer for Compliance Audit Framework across
        compliance_audits.
    governance_rationale:
      >
        compliance_audit_scope_boundary_enforcer is required to govern Compliance Audit Framework risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected compliance
        audits failures.
    implementation_guidance:
      >
        Implement compliance_audit_scope_boundary_enforcer as automated policy in
        compliance_audit_framework orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: compliance_audit_scope_boundary_enforcer_continuous_telemetry_dashboard
    validation_method:
      compliance_audit_scope_boundary_enforcer_quarterly_design_and_operating_effectiveness_test
    testing_method:
      compliance_audit_scope_boundary_enforcer_statistical_sampling_with_exception_tracking
    control_owner: compliance_audit_framework_control_owner
    evidence_generated: compliance_audit_scope_boundary_enforcer_control_execution_log
    audit_considerations:
      >
        Auditors verify compliance_audit_scope_boundary_enforcer design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        compliance_audit_scope_boundary_enforcer outputs may trigger enforcement under
        compliance_audit_framework escalation rules.
