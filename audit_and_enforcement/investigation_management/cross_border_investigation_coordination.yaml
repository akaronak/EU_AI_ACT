decision_logic:
  decision_inputs:
    - cross_border_investigation_coordination_severity_score
    - cross_border_investigation_coordination_evidence_completeness
    - cross_border_investigation_coordination_regulatory_context
    - cross_border_investigation_coordination_risk_exposure_index
  decision_conditions:
    - cross_border_investigation_coordination_critical_threshold_breach
    - cross_border_investigation_coordination_evidence_integrity_failure
    - cross_border_investigation_coordination_regulatory_notification_required
  decision_thresholds:
    critical_severity: cross_border_investigation_coordination_severity_score >= 90
    high_severity: cross_border_investigation_coordination_severity_score >= 70
    evidence_complete: cross_border_investigation_coordination_evidence_completeness >= 0.98
  decision_rules:
    cross_border_investigation_coordination_high_severity_violation:
      condition: cross_border_investigation_coordination_severity_score >= 90
      action: initiate_cross_border_investigation_coordination_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: cross_border_investigation_coordination_investigation_report
    cross_border_investigation_coordination_evidence_compromise_detected:
      condition: cross_border_investigation_coordination_integrity_status == compromised
      action: activate_cross_border_investigation_coordination_forensic_lockdown
      approval_required: cross_border_investigation_coordination_forensic_lead
      evidence_required: cross_border_investigation_coordination_integrity_alert_record
    cross_border_investigation_coordination_enforcement_authorization:
      condition: cross_border_investigation_coordination_violation_confirmed == true AND cross_border_investigation_coordination_evidence_complete == true
      action: issue_cross_border_investigation_coordination_enforcement_order
      approval_required: cross_border_investigation_coordination_enforcement_officer
      evidence_required: cross_border_investigation_coordination_violation_evidence_package
    cross_border_investigation_coordination_regulator_inquiry_response:
      condition: cross_border_investigation_coordination_regulator_request_received == true
      action: compile_cross_border_investigation_coordination_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: cross_border_investigation_coordination_regulatory_evidence_index
  decision_outputs:
    - cross_border_investigation_coordination_enforcement_decision
    - cross_border_investigation_coordination_escalation_notice
    - cross_border_investigation_coordination_remediation_directive
    - cross_border_investigation_coordination_audit_disposition
  approval_requirements:
    enforcement_actions: [cross_border_investigation_coordination_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - cross_border_investigation_coordination_severity_score >= 90
    - cross_border_investigation_coordination_evidence_integrity_failure == true
    - cross_border_investigation_coordination_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_cross_border_investigation_coordination_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: cross_border_investigation_coordination_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Cross Border Investigation Coordination may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
