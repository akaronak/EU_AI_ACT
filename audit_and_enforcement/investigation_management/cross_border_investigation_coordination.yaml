controls:
  - control_id: AAE-INV-CROSS_BORD-CROSSINVEST
    control_name: cross_investigation_intake_screener
    control_category: preventive
    control_objective:
      >
        Operational control ensuring investigation intake screener for Cross Border Investigation
        Coordination across investigation_management.
    governance_rationale:
      >
        cross_investigation_intake_screener is required to govern Cross Border Investigation
        Coordination risks under EU AI Act and enterprise audit-enforcement policy; failure enables
        undetected investigation management failures.
    implementation_guidance:
      >
        Implement cross_investigation_intake_screener as automated policy in
        cross_border_investigation_coordination orchestration layer; wire to telemetry bus; block non-
        compliant state transitions; log evidence to immutable store.
    monitoring_method: cross_investigation_intake_screener_continuous_telemetry_dashboard
    validation_method:
      cross_investigation_intake_screener_quarterly_design_and_operating_effectiveness_test
    testing_method: cross_investigation_intake_screener_statistical_sampling_with_exception_tracking
    control_owner: cross_border_investigation_coordination_control_owner
    evidence_generated: cross_investigation_intake_screener_control_execution_log
    audit_considerations:
      >
        Auditors verify cross_investigation_intake_screener design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        cross_investigation_intake_screener outputs may trigger enforcement under
        cross_border_investigation_coordination escalation rules.
