    evidence_complete: investigation_decision_tracking_evidence_completeness >= 0.98
  decision_rules:
    investigation_decision_tracking_high_severity_violation:
      condition: investigation_decision_tracking_severity_score >= 90
      action: initiate_investigation_decision_tracking_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: investigation_decision_tracking_investigation_report
    investigation_decision_tracking_evidence_compromise_detected:
      condition: investigation_decision_tracking_integrity_status == compromised
      action: activate_investigation_decision_tracking_forensic_lockdown
      approval_required: investigation_decision_tracking_forensic_lead
      evidence_required: investigation_decision_tracking_integrity_alert_record
    investigation_decision_tracking_enforcement_authorization:
      condition: investigation_decision_tracking_violation_confirmed == true AND investigation_decision_tracking_evidence_complete == true
      action: issue_investigation_decision_tracking_enforcement_order
      approval_required: investigation_decision_tracking_enforcement_officer
      evidence_required: investigation_decision_tracking_violation_evidence_package
    investigation_decision_tracking_regulator_inquiry_response:
