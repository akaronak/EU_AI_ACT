maturity_model:
  level_1_initial:
    characteristics:
      Ad hoc Root Cause Analysis activities without documented controls.
    required_capabilities:
      - manual_processes
    required_controls:
      - basic_logging
    required_evidence:
      - informal_notes
    required_metrics:
      - completion_count
  level_2_repeatable:
    characteristics:
      Repeatable Root Cause Analysis procedures with basic documentation.
    required_capabilities:
      - documented_workflow
    required_controls:
      - root_cause_analysis_procedure_checklist
    required_evidence:
      - root_cause_analysis_process_log
    required_metrics:
      - root_cause_analysis_process_adherence_rate
  level_3_defined:
    characteristics:
      Standardized Root Cause Analysis enterprise-wide.
    required_capabilities:
      - root_cause_analysis_standard_control_set
    required_controls:
      - root_cause_analysis_control_register
    required_evidence:
      - root_cause_analysis_audit_evidence
    required_metrics:
      - root_cause_analysis_effectiveness_score
  level_4_managed:
    characteristics:
      Measured Root Cause Analysis with KPI optimization.
    required_capabilities:
      - root_cause_analysis_automated_controls
    required_controls:
      - root_cause_analysis_telemetry_controls
    required_evidence:
      - root_cause_analysis_assurance_package
    required_metrics:
      - root_cause_analysis_kpi_dashboard
  level_5_optimized:
    characteristics:
      Optimized Root Cause Analysis with predictive analytics.
    required_capabilities:
      - root_cause_analysis_autonomous_governance
    required_controls:
      - root_cause_analysis_adaptive_controls
    required_evidence:
      - root_cause_analysis_regulator_ready_portfolio
    required_metrics:
      - root_cause_analysis_predictive_risk_index
dependencies:
  required:
    - audit_and_enforcement/core/audit_metadata.yaml
    - audit_and_enforcement/core/enforcement_framework.yaml
  optional:
    - audit_and_enforcement/evidence_preservation/evidence_management.yaml
outputs:
  - root_cause_analysis_report
  - root_cause_analysis_evidence_package
  - root_cause_analysis_attestation
  - root_cause_analysis_enforcement_record
artifacts:
  - name: root_cause_analysis_policy
    retention_years: 10
    classification: RESTRICTED
  - name: root_cause_analysis_procedure
    retention_years: 10
    classification: RESTRICTED
  - name: root_cause_analysis_checklist
    retention_years: 10
    classification: RESTRICTED
  - name: root_cause_analysis_template
    retention_years: 10
    classification: RESTRICTED
records:
