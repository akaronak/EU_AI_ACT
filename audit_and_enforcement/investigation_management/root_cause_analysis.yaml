controls:
  - control_id: AAE-INV-ROOT_CAUSE-ROOTINVESTI
    control_name: root_investigation_intake_screener
    control_category: preventive
    control_objective:
      >
        Operational control ensuring investigation intake screener for Root Cause Analysis across
        investigation_management.
    governance_rationale:
      >
        root_investigation_intake_screener is required to govern Root Cause Analysis risks under EU AI
        Act and enterprise audit-enforcement policy; failure enables undetected investigation management
        failures.
    implementation_guidance:
      >
        Implement root_investigation_intake_screener as automated policy in root_cause_analysis
        orchestration layer; wire to telemetry bus; block non-compliant state transitions; log evidence
        to immutable store.
    monitoring_method: root_investigation_intake_screener_continuous_telemetry_dashboard
    validation_method:
      root_investigation_intake_screener_quarterly_design_and_operating_effectiveness_test
    testing_method: root_investigation_intake_screener_statistical_sampling_with_exception_tracking
    control_owner: root_cause_analysis_control_owner
    evidence_generated: root_investigation_intake_screener_control_execution_log
    audit_considerations:
      >
        Auditors verify root_investigation_intake_screener design, operation, and evidence sufficiency
        per ISO 19011.
    enforcement_considerations:
      >
        root_investigation_intake_screener outputs may trigger enforcement under root_cause_analysis
