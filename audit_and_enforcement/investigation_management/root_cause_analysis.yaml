decision_logic:
  decision_inputs:
    - root_cause_analysis_severity_score
    - root_cause_analysis_evidence_completeness
    - root_cause_analysis_regulatory_context
    - root_cause_analysis_risk_exposure_index
  decision_conditions:
    - root_cause_analysis_critical_threshold_breach
    - root_cause_analysis_evidence_integrity_failure
    - root_cause_analysis_regulatory_notification_required
  decision_thresholds:
    critical_severity: root_cause_analysis_severity_score >= 90
    high_severity: root_cause_analysis_severity_score >= 70
    evidence_complete: root_cause_analysis_evidence_completeness >= 0.98
  decision_rules:
    root_cause_analysis_high_severity_violation:
      condition: root_cause_analysis_severity_score >= 90
      action: initiate_root_cause_analysis_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: root_cause_analysis_investigation_report
    root_cause_analysis_evidence_compromise_detected:
      condition: root_cause_analysis_integrity_status == compromised
      action: activate_root_cause_analysis_forensic_lockdown
      approval_required: root_cause_analysis_forensic_lead
      evidence_required: root_cause_analysis_integrity_alert_record
    root_cause_analysis_enforcement_authorization:
      condition: root_cause_analysis_violation_confirmed == true AND root_cause_analysis_evidence_complete == true
      action: issue_root_cause_analysis_enforcement_order
      approval_required: root_cause_analysis_enforcement_officer
      evidence_required: root_cause_analysis_violation_evidence_package
    root_cause_analysis_regulator_inquiry_response:
      condition: root_cause_analysis_regulator_request_received == true
      action: compile_root_cause_analysis_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: root_cause_analysis_regulatory_evidence_index
  decision_outputs:
    - root_cause_analysis_enforcement_decision
    - root_cause_analysis_escalation_notice
    - root_cause_analysis_remediation_directive
    - root_cause_analysis_audit_disposition
  approval_requirements:
    enforcement_actions: [root_cause_analysis_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - root_cause_analysis_severity_score >= 90
    - root_cause_analysis_evidence_integrity_failure == true
    - root_cause_analysis_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_root_cause_analysis_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: root_cause_analysis_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Root Cause Analysis may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
