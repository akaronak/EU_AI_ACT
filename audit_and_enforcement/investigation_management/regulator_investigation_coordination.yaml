decision_logic:
  decision_inputs:
    - regulator_investigation_coordination_severity_score
    - regulator_investigation_coordination_evidence_completeness
    - regulator_investigation_coordination_regulatory_context
    - regulator_investigation_coordination_risk_exposure_index
  decision_conditions:
    - regulator_investigation_coordination_critical_threshold_breach
    - regulator_investigation_coordination_evidence_integrity_failure
    - regulator_investigation_coordination_regulatory_notification_required
  decision_thresholds:
    critical_severity: regulator_investigation_coordination_severity_score >= 90
    high_severity: regulator_investigation_coordination_severity_score >= 70
    evidence_complete: regulator_investigation_coordination_evidence_completeness >= 0.98
  decision_rules:
    regulator_investigation_coordination_high_severity_violation:
      condition: regulator_investigation_coordination_severity_score >= 90
      action: initiate_regulator_investigation_coordination_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: regulator_investigation_coordination_investigation_report
    regulator_investigation_coordination_evidence_compromise_detected:
      condition: regulator_investigation_coordination_integrity_status == compromised
      action: activate_regulator_investigation_coordination_forensic_lockdown
      approval_required: regulator_investigation_coordination_forensic_lead
      evidence_required: regulator_investigation_coordination_integrity_alert_record
    regulator_investigation_coordination_enforcement_authorization:
      condition: regulator_investigation_coordination_violation_confirmed == true AND regulator_investigation_coordination_evidence_complete == true
      action: issue_regulator_investigation_coordination_enforcement_order
      approval_required: regulator_investigation_coordination_enforcement_officer
      evidence_required: regulator_investigation_coordination_violation_evidence_package
    regulator_investigation_coordination_regulator_inquiry_response:
      condition: regulator_investigation_coordination_regulator_request_received == true
      action: compile_regulator_investigation_coordination_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: regulator_investigation_coordination_regulatory_evidence_index
  decision_outputs:
    - regulator_investigation_coordination_enforcement_decision
    - regulator_investigation_coordination_escalation_notice
    - regulator_investigation_coordination_remediation_directive
    - regulator_investigation_coordination_audit_disposition
  approval_requirements:
    enforcement_actions: [regulator_investigation_coordination_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - regulator_investigation_coordination_severity_score >= 90
    - regulator_investigation_coordination_evidence_integrity_failure == true
    - regulator_investigation_coordination_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_regulator_investigation_coordination_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: regulator_investigation_coordination_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Regulator Investigation Coordination may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
