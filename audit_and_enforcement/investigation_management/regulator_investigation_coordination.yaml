controls:
  - control_id: AAE-INV-REGULATOR_-REGULATORIN
    control_name: regulator_investigation_intake_screener
    control_category: preventive
    control_objective:
      >
        Operational control ensuring investigation intake screener for Regulator Investigation
        Coordination across investigation_management.
    governance_rationale:
      >
        regulator_investigation_intake_screener is required to govern Regulator Investigation
        Coordination risks under EU AI Act and enterprise audit-enforcement policy; failure enables
        undetected investigation management failures.
    implementation_guidance:
      >
        Implement regulator_investigation_intake_screener as automated policy in
        regulator_investigation_coordination orchestration layer; wire to telemetry bus; block non-
        compliant state transitions; log evidence to immutable store.
    monitoring_method: regulator_investigation_intake_screener_continuous_telemetry_dashboard
    validation_method:
      regulator_investigation_intake_screener_quarterly_design_and_operating_effectiveness_test
    testing_method:
      regulator_investigation_intake_screener_statistical_sampling_with_exception_tracking
    control_owner: regulator_investigation_coordination_control_owner
    evidence_generated: regulator_investigation_intake_screener_control_execution_log
    audit_considerations:
      >
        Auditors verify regulator_investigation_intake_screener design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        regulator_investigation_intake_screener outputs may trigger enforcement under
        regulator_investigation_coordination escalation rules.
