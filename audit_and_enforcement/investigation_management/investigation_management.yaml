decision_logic:
  decision_inputs:
    - investigation_management_severity_score
    - investigation_management_evidence_completeness
    - investigation_management_regulatory_context
    - investigation_management_risk_exposure_index
  decision_conditions:
    - investigation_management_critical_threshold_breach
    - investigation_management_evidence_integrity_failure
    - investigation_management_regulatory_notification_required
  decision_thresholds:
    critical_severity: investigation_management_severity_score >= 90
    high_severity: investigation_management_severity_score >= 70
    evidence_complete: investigation_management_evidence_completeness >= 0.98
  decision_rules:
    investigation_management_high_severity_violation:
      condition: investigation_management_severity_score >= 90
      action: initiate_investigation_management_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: investigation_management_investigation_report
    investigation_management_evidence_compromise_detected:
      condition: investigation_management_integrity_status == compromised
      action: activate_investigation_management_forensic_lockdown
      approval_required: investigation_management_forensic_lead
      evidence_required: investigation_management_integrity_alert_record
    investigation_management_enforcement_authorization:
      condition: investigation_management_violation_confirmed == true AND investigation_management_evidence_complete == true
      action: issue_investigation_management_enforcement_order
      approval_required: investigation_management_enforcement_officer
      evidence_required: investigation_management_violation_evidence_package
    investigation_management_regulator_inquiry_response:
      condition: investigation_management_regulator_request_received == true
      action: compile_investigation_management_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: investigation_management_regulatory_evidence_index
  decision_outputs:
    - investigation_management_enforcement_decision
    - investigation_management_escalation_notice
    - investigation_management_remediation_directive
    - investigation_management_audit_disposition
  approval_requirements:
    enforcement_actions: [investigation_management_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - investigation_management_severity_score >= 90
    - investigation_management_evidence_integrity_failure == true
    - investigation_management_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_investigation_management_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: investigation_management_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Investigation Management may trigger EU AI Act Articles 71, 73 reporting, market
      surveillance cooperation, and conformity assessment suspension; all outputs must be litigation-
      defensible.
