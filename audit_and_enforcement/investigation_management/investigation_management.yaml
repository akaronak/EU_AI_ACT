controls:
  - control_id: AAE-INV-INVESTIGAT-INVESTIGATIO
    control_name: investigation_investigation_intake_screener
    control_category: preventive
    control_objective:
      >
        Operational control ensuring investigation intake screener for Investigation Management across
        investigation_management.
    governance_rationale:
      >
        investigation_investigation_intake_screener is required to govern Investigation Management risks
        under EU AI Act and enterprise audit-enforcement policy; failure enables undetected
        investigation management failures.
    implementation_guidance:
      >
        Implement investigation_investigation_intake_screener as automated policy in
        investigation_management orchestration layer; wire to telemetry bus; block non-compliant state
        transitions; log evidence to immutable store.
    monitoring_method: investigation_investigation_intake_screener_continuous_telemetry_dashboard
    validation_method:
      investigation_investigation_intake_screener_quarterly_design_and_operating_effectiveness_test
    testing_method:
      investigation_investigation_intake_screener_statistical_sampling_with_exception_tracking
    control_owner: investigation_management_control_owner
    evidence_generated: investigation_investigation_intake_screener_control_execution_log
    audit_considerations:
      >
        Auditors verify investigation_investigation_intake_screener design, operation, and evidence
        sufficiency per ISO 19011.
    enforcement_considerations:
      >
        investigation_investigation_intake_screener outputs may trigger enforcement under
        investigation_management escalation rules.
