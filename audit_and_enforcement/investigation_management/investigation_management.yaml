purpose:
  >
    Establish production-grade Investigation Management governance within
    audit_and_enforcement/investigation_management, delivering regulator-ready, audit-ready, and
    enforcement-ready controls for case-managed investigation workflows with regulator coordination.
    Integrates with the EU AI Act governance ecosystem through machine-evaluable obligations,
    evidence preservation, and conformity-assessment-ready artifacts.
scope:
  >
    All organizational AI systems, governance processes, audit activities, enforcement actions,
    investigations, and evidence artifacts governed by Investigation Management across enterprise
    and cross-border operations within audit_and_enforcement/investigation_management.
objectives:
  - Operationalize Investigation Management with regulator-defensible controls and evidence chains
  - Enable automated validation of Investigation Management conformance across investigation_management
  - Preserve audit-grade and forensic-grade records for all Investigation Management activities
  - Support conformity assessments, notified body reviews, and market surveillance
  - Integrate Investigation Management with enterprise enforcement, investigation, and remediation workflows
  - Maintain continuous improvement and post-enforcement monitoring for Investigation Management
definitions:
  investigation_management_governance_domain:
    >
      The operational jurisdiction of Investigation Management encompassing controlled audit,
      enforcement, investigation, and evidence processes within investigation_management.
  investigation_management_audit_evidence:
    >
      Machine-readable and human-readable records demonstrating Investigation Management control
      effectiveness, process adherence, and regulatory conformity.
  investigation_management_enforcement_action:
    >
      A documented restriction, corrective obligation, sanction, or operational intervention
      authorized through Investigation Management decision logic.
  investigation_management_forensic_artifact:
    >
      Tamper-evident record suitable for investigation, litigation, or regulatory proceedings produced
      by Investigation Management processes.
  investigation_management_traceability_chain:
    >
      Immutable linkage from triggering event through decisions, actions, and outcomes within
      Investigation Management operations.
  investigation_management_conformity_assertion:
    >
      Formal statement that Investigation Management requirements are met, supported by indexed
      evidence and validation attestations.
