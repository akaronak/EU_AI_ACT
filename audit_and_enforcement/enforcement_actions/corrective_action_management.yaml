      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: corrective_action_management_forensic_lead
    corrective_action_management_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    corrective_action_management_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: corrective_action_management_enforcement_officer
  risk_tolerance:
    corrective_action_management_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: corrective_action_management_risk_score >= 60
    critical: corrective_action_management_risk_score >= 85
