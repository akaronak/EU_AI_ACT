decision_logic:
  decision_inputs:
    - corrective_action_management_severity_score
    - corrective_action_management_evidence_completeness
    - corrective_action_management_regulatory_context
    - corrective_action_management_risk_exposure_index
  decision_conditions:
    - corrective_action_management_critical_threshold_breach
    - corrective_action_management_evidence_integrity_failure
    - corrective_action_management_regulatory_notification_required
  decision_thresholds:
    critical_severity: corrective_action_management_severity_score >= 90
    high_severity: corrective_action_management_severity_score >= 70
    evidence_complete: corrective_action_management_evidence_completeness >= 0.98
  decision_rules:
    corrective_action_management_high_severity_violation:
      condition: corrective_action_management_severity_score >= 90
      action: initiate_corrective_action_management_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: corrective_action_management_investigation_report
    corrective_action_management_evidence_compromise_detected:
      condition: corrective_action_management_integrity_status == compromised
      action: activate_corrective_action_management_forensic_lockdown
      approval_required: corrective_action_management_forensic_lead
      evidence_required: corrective_action_management_integrity_alert_record
    corrective_action_management_enforcement_authorization:
      condition: corrective_action_management_violation_confirmed == true AND corrective_action_management_evidence_complete == true
      action: issue_corrective_action_management_enforcement_order
      approval_required: corrective_action_management_enforcement_officer
      evidence_required: corrective_action_management_violation_evidence_package
    corrective_action_management_regulator_inquiry_response:
      condition: corrective_action_management_regulator_request_received == true
      action: compile_corrective_action_management_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: corrective_action_management_regulatory_evidence_index
  decision_outputs:
    - corrective_action_management_enforcement_decision
    - corrective_action_management_escalation_notice
    - corrective_action_management_remediation_directive
    - corrective_action_management_audit_disposition
  approval_requirements:
    enforcement_actions: [corrective_action_management_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - corrective_action_management_severity_score >= 90
    - corrective_action_management_evidence_integrity_failure == true
    - corrective_action_management_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_corrective_action_management_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: corrective_action_management_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Corrective Action Management may trigger EU AI Act Articles 71, 73 reporting,
      market surveillance cooperation, and conformity assessment suspension; all outputs must be
      litigation-defensible.
