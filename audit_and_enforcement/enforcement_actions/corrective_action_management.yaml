purpose:
  >
    Establish production-grade Corrective Action Management governance within
    audit_and_enforcement/enforcement_actions, delivering regulator-ready, audit-ready, and
    enforcement-ready controls for sanctions, corrective measures, restrictions, prohibitions,
    enforcement execution. Integrates with the EU AI Act governance ecosystem through machine-
    evaluable obligations, evidence preservation, and conformity-assessment-ready artifacts.
scope:
  >
    All organizational AI systems, governance processes, audit activities, enforcement actions,
    investigations, and evidence artifacts governed by Corrective Action Management across
    enterprise and cross-border operations within audit_and_enforcement/enforcement_actions.
objectives:
  - Operationalize Corrective Action Management with regulator-defensible controls and evidence chains
  - Enable automated validation of Corrective Action Management conformance across enforcement_actions
  - Preserve audit-grade and forensic-grade records for all Corrective Action Management activities
  - Support conformity assessments, notified body reviews, and market surveillance
  - Integrate Corrective Action Management with enterprise enforcement, investigation, and remediation workflows
  - Maintain continuous improvement and post-enforcement monitoring for Corrective Action Management
definitions:
  corrective_action_management_governance_domain:
    >
      The operational jurisdiction of Corrective Action Management encompassing controlled audit,
      enforcement, investigation, and evidence processes within enforcement_actions.
  corrective_action_management_audit_evidence:
    >
      Machine-readable and human-readable records demonstrating Corrective Action Management control
      effectiveness, process adherence, and regulatory conformity.
  corrective_action_management_enforcement_action:
    >
      A documented restriction, corrective obligation, sanction, or operational intervention
      authorized through Corrective Action Management decision logic.
  corrective_action_management_forensic_artifact:
    >
      Tamper-evident record suitable for investigation, litigation, or regulatory proceedings produced
      by Corrective Action Management processes.
  corrective_action_management_traceability_chain:
    >
      Immutable linkage from triggering event through decisions, actions, and outcomes within
      Corrective Action Management operations.
  corrective_action_management_conformity_assertion:
    >
      Formal statement that Corrective Action Management requirements are met, supported by indexed
      evidence and validation attestations.
