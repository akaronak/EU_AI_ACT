      impact: critical
      severity: 95
      velocity: slow
      detectability: high
      risk_owner: emergency_enforcement_controls_forensic_lead
    emergency_enforcement_controls_regulatory_sanction_scenario:
      likelihood: medium
      impact: high
      severity: 85
      velocity: medium
      detectability: medium
      risk_owner: chief_compliance_officer
    emergency_enforcement_controls_enforcement_failure_scenario:
      likelihood: low
      impact: high
      severity: 75
      velocity: fast
      detectability: high
      risk_owner: emergency_enforcement_controls_enforcement_officer
  risk_tolerance:
    emergency_enforcement_controls_residual_risk_ceiling: 0.25
  risk_thresholds:
    warning: emergency_enforcement_controls_risk_score >= 60
    critical: emergency_enforcement_controls_risk_score >= 85
  residual_risk:
    >
      Residual risk after Emergency Enforcement Controls controls documented in
      emergency_enforcement_controls_risk_register with quarterly review.
  risk_treatment:
    - emergency_enforcement_controls_preventive_control_reinforcement
    - emergency_enforcement_controls_detective_monitoring_enhancement
    - emergency_enforcement_controls_corrective_remediation_plan
  risk_monitoring:
    telemetry: emergency_enforcement_controls_risk_dashboard
    review_frequency: monthly
evidence_lifecycle:
  evidence_creation:
    >
      Automated capture at Emergency Enforcement Controls workflow events with provenance anchor and
      emergency_enforcement_controls_hash_chain_init
  evidence_collection:
