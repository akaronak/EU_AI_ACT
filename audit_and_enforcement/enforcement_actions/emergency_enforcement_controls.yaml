risk_model:
  risk_sources:
    - emergency_enforcement_controls_control_failure
    - emergency_enforcement_controls_evidence_compromise
    - emergency_enforcement_controls_regulatory_non_compliance
    - emergency_enforcement_controls_enforcement_delay
  risk_events:
