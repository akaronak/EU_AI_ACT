decision_logic:
  decision_inputs:
    - operational_restriction_enforcement_severity_score
    - operational_restriction_enforcement_evidence_completeness
    - operational_restriction_enforcement_regulatory_context
    - operational_restriction_enforcement_risk_exposure_index
  decision_conditions:
    - operational_restriction_enforcement_critical_threshold_breach
    - operational_restriction_enforcement_evidence_integrity_failure
    - operational_restriction_enforcement_regulatory_notification_required
  decision_thresholds:
    critical_severity: operational_restriction_enforcement_severity_score >= 90
    high_severity: operational_restriction_enforcement_severity_score >= 70
    evidence_complete: operational_restriction_enforcement_evidence_completeness >= 0.98
  decision_rules:
    operational_restriction_enforcement_high_severity_violation:
      condition: operational_restriction_enforcement_severity_score >= 90
      action: initiate_operational_restriction_enforcement_regulatory_escalation
      approval_required: chief_compliance_officer
      evidence_required: operational_restriction_enforcement_investigation_report
    operational_restriction_enforcement_evidence_compromise_detected:
      condition: operational_restriction_enforcement_integrity_status == compromised
      action: activate_operational_restriction_enforcement_forensic_lockdown
      approval_required: operational_restriction_enforcement_forensic_lead
      evidence_required: operational_restriction_enforcement_integrity_alert_record
    operational_restriction_enforcement_enforcement_authorization:
      condition: operational_restriction_enforcement_violation_confirmed == true AND operational_restriction_enforcement_evidence_complete == true
      action: issue_operational_restriction_enforcement_enforcement_order
      approval_required: operational_restriction_enforcement_enforcement_officer
      evidence_required: operational_restriction_enforcement_violation_evidence_package
    operational_restriction_enforcement_regulator_inquiry_response:
      condition: operational_restriction_enforcement_regulator_request_received == true
      action: compile_operational_restriction_enforcement_regulatory_disclosure_package
      approval_required: regulatory_liaison
      evidence_required: operational_restriction_enforcement_regulatory_evidence_index
  decision_outputs:
    - operational_restriction_enforcement_enforcement_decision
    - operational_restriction_enforcement_escalation_notice
    - operational_restriction_enforcement_remediation_directive
    - operational_restriction_enforcement_audit_disposition
  approval_requirements:
    enforcement_actions: [operational_restriction_enforcement_enforcement_officer, chief_compliance_officer]
    regulatory_submissions: [regulatory_liaison, legal_counsel]
  escalation_conditions:
    - operational_restriction_enforcement_severity_score >= 90
    - operational_restriction_enforcement_evidence_integrity_failure == true
    - operational_restriction_enforcement_regulatory_deadline_breach == true
  exception_conditions:
    - regulatory_override_with_legal_concurrence
    - emergency_containment_under_operational_restriction_enforcement_crisis_protocol
  override_conditions:
    authority: chief_compliance_officer
    documentation: operational_restriction_enforcement_override_register_entry
    dual_approval: true
  regulatory_implications:
    >
      Decisions under Operational Restriction Enforcement may trigger EU AI Act Articles 71, 73
      reporting, market surveillance cooperation, and conformity assessment suspension; all outputs
      must be litigation-defensible.
