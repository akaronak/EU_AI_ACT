purpose:
  >
    Executable compliance scoring skill for Deployment Validation Scoring within
    compliance_scoring/deployment_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for deployment readiness scoring, boundary scoring, environment risk scoring.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Deployment Validation Scoring across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Deployment Validation Scoring
  - Enable executive and board decision intelligence from Deployment Validation Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Deployment Validation Scoring
  - Support conformity assessment and notified body review with Deployment Validation Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  deployment_validation_scoring_composite_score:
    >
      Normalized 0-1 compliance score for Deployment Validation Scoring computed from weighted
      dimensions.
  deployment_validation_scoring_score_confidence:
    >
      Statistical confidence in Deployment Validation Scoring score based on evidence completeness and
      freshness.
  deployment_validation_scoring_weighted_dimension_score:
    Individual dimension score contributing to Deployment Validation Scoring composite.
  deployment_validation_scoring_score_degradation_signal:
    >
      Alert when Deployment Validation Scoring score drops below improvement threshold over rolling
      window.
  deployment_validation_scoring_regulatory_alignment_index:
    Degree of Deployment Validation Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: deployment_validation_scoring_scoring_taxonomy
  scoring_phase:
