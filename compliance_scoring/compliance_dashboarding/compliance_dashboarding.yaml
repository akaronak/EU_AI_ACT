requirements:
  - All Compliance Dashboarding scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Compliance Dashboarding score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Compliance Dashboarding scores must refresh per defined measurement_frequency with staleness alerts
