purpose:
  >
    Executable compliance scoring skill for Compliance Dashboarding within
    compliance_scoring/compliance_dashboarding. Delivers measurable, monitorable, auditable
    compliance intelligence for executive dashboards, scorecard generation, trend analytics.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Compliance Dashboarding across EU AI Act high-risk and GPAI
    systems.
objectives:
  - Compute verifiable, auditable compliance scores for Compliance Dashboarding
  - Enable executive and board decision intelligence from Compliance Dashboarding score outputs
  - Detect score degradation and trigger prioritized remediation for Compliance Dashboarding
  - Support conformity assessment and notified body review with Compliance Dashboarding scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  compliance_dashboarding_composite_score:
    Normalized 0-1 compliance score for Compliance Dashboarding computed from weighted dimensions.
  compliance_dashboarding_score_confidence:
    >
      Statistical confidence in Compliance Dashboarding score based on evidence completeness and
      freshness.
  compliance_dashboarding_weighted_dimension_score:
    Individual dimension score contributing to Compliance Dashboarding composite.
  compliance_dashboarding_score_degradation_signal:
    Alert when Compliance Dashboarding score drops below improvement threshold over rolling window.
  compliance_dashboarding_regulatory_alignment_index:
    Degree of Compliance Dashboarding score alignment with EU AI Act obligation coverage.
