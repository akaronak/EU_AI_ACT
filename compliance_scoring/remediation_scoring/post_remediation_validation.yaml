workflows:
  - workflow_id: WF-CS-POST_REMEDIATION
    workflow_name: post_remediation_validation_scoring_workflow
    workflow_owner: post_remediation_validation_scoring_owner
    trigger: post_remediation_validation_score_calculation_due
    inputs:
      - post_remediation_validation_evidence_feed
      - post_remediation_validation_control_telemetry
    activities:
      - evidence_ingestion
      - dimension_scoring
      - weight_application
      - confidence_calculation
      - threshold_evaluation
      - score_publication
      - remediation_trigger
    decision_points:
      - post_remediation_validation_threshold_breach_decision
    approvals:
      - post_remediation_validation_scoring_analyst_review
    outputs:
      - post_remediation_validation_composite_score
    evidence_generated:
      - post_remediation_validation_score_calculation_log
    success_criteria:
      - post_remediation_validation_composite_score_published
      - evidence_confidence_above_minimum
    failure_conditions:
      - insufficient_evidence
      - formula_integrity_failure
decision_logic:
  post_remediation_validation_score_publication_gate:
    condition: post_remediation_validation_score_confidence >= 0.80 AND post_remediation_validation_methodology_valid == true
    action: publish_post_remediation_validation_composite_score
    approval_required: post_remediation_validation_scoring_owner
  post_remediation_validation_remediation_trigger:
    condition: post_remediation_validation_composite_score < 0.75
    action: initiate_post_remediation_validation_remediation_workflow
    approval_required: compliance_officer
scoring_model:
  score_name: post_remediation_validation_composite_score
  score_type: composite_weighted
  score_purpose: Measure Post Remediation Validation compliance posture
  scoring_methodology: post_remediation_validation_weighted_dimension_scoring
  weighting_model: post_remediation_validation_domain_weights
  aggregation_logic: weighted_average_with_confidence_adjustment
  confidence_model: post_remediation_validation_evidence_confidence
  severity_model: post_remediation_validation_gap_severity_tiers
  maturity_model: five_level_compliance_maturity
  validation_method: post_remediation_validation_scoring_methodology_audit
  review_frequency: monthly
  minimum_score: 0.0
  maximum_score: 1.0
  target_score: 0.85
  warning_threshold: 0.75
  critical_threshold: 0.65
  improvement_threshold: 0.05
scoring_methodology:
  evaluation_dimensions:
    - post_remediation_validation_control_effectiveness
    - post_remediation_validation_evidence_quality
    - post_remediation_validation_regulatory_alignment
    - post_remediation_validation_governance_maturity
    - post_remediation_validation_risk_posture
  weighting_factors: post_remediation_validation_domain_weight_matrix
  scoring_formula: sum(dimension_score * weight) * confidence_factor
