purpose:
  >
    Executable compliance scoring skill for Post Remediation Validation within
    compliance_scoring/remediation_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for remediation effectiveness, corrective action scoring, recovery scoring.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Post Remediation Validation across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Post Remediation Validation
  - Enable executive and board decision intelligence from Post Remediation Validation score outputs
  - Detect score degradation and trigger prioritized remediation for Post Remediation Validation
  - Support conformity assessment and notified body review with Post Remediation Validation scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  post_remediation_validation_composite_score:
    >
      Normalized 0-1 compliance score for Post Remediation Validation computed from weighted
      dimensions.
  post_remediation_validation_score_confidence:
    >
      Statistical confidence in Post Remediation Validation score based on evidence completeness and
      freshness.
  post_remediation_validation_weighted_dimension_score:
    Individual dimension score contributing to Post Remediation Validation composite.
  post_remediation_validation_score_degradation_signal:
    >
      Alert when Post Remediation Validation score drops below improvement threshold over rolling
      window.
  post_remediation_validation_regulatory_alignment_index:
    Degree of Post Remediation Validation score alignment with EU AI Act obligation coverage.
taxonomy:
  root: post_remediation_validation_scoring_taxonomy
