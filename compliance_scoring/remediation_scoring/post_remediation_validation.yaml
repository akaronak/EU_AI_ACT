requirements:
  - All Post Remediation Validation scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Post Remediation Validation score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Post Remediation Validation scores must refresh per defined measurement_frequency with staleness alerts
