purpose:
  >
    Executable compliance scoring skill for Provider Compliance Scoring within
    compliance_scoring/provider_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for provider obligation scoring, accountability scoring, transparency scoring.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Provider Compliance Scoring across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Provider Compliance Scoring
  - Enable executive and board decision intelligence from Provider Compliance Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Provider Compliance Scoring
  - Support conformity assessment and notified body review with Provider Compliance Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  provider_compliance_scoring_composite_score:
    >
      Normalized 0-1 compliance score for Provider Compliance Scoring computed from weighted
      dimensions.
  provider_compliance_scoring_score_confidence:
    >
      Statistical confidence in Provider Compliance Scoring score based on evidence completeness and
      freshness.
  provider_compliance_scoring_weighted_dimension_score:
    Individual dimension score contributing to Provider Compliance Scoring composite.
  provider_compliance_scoring_score_degradation_signal:
    >
      Alert when Provider Compliance Scoring score drops below improvement threshold over rolling
      window.
  provider_compliance_scoring_regulatory_alignment_index:
    Degree of Provider Compliance Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: provider_compliance_scoring_scoring_taxonomy
  scoring_phase:
