requirements:
  - All Provider Compliance Scoring scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Provider Compliance Scoring score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Provider Compliance Scoring scores must refresh per defined measurement_frequency with staleness alerts
