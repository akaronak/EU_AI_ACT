      - formula_integrity_failure
decision_logic:
  assurance_maturity_scoring_score_publication_gate:
    condition: assurance_maturity_scoring_score_confidence >= 0.80 AND assurance_maturity_scoring_methodology_valid == true
    action: publish_assurance_maturity_scoring_composite_score
    approval_required: assurance_maturity_scoring_scoring_owner
  assurance_maturity_scoring_remediation_trigger:
    condition: assurance_maturity_scoring_composite_score < 0.75
    action: initiate_assurance_maturity_scoring_remediation_workflow
    approval_required: compliance_officer
scoring_model:
  score_name: assurance_maturity_scoring_composite_score
  score_type: composite_weighted
  score_purpose: Measure Assurance Maturity Scoring compliance posture
  scoring_methodology: assurance_maturity_scoring_weighted_dimension_scoring
  weighting_model: assurance_maturity_scoring_domain_weights
  aggregation_logic: weighted_average_with_confidence_adjustment
  confidence_model: assurance_maturity_scoring_evidence_confidence
  severity_model: assurance_maturity_scoring_gap_severity_tiers
  maturity_model: five_level_compliance_maturity
  validation_method: assurance_maturity_scoring_scoring_methodology_audit
  review_frequency: monthly
  minimum_score: 0.0
  maximum_score: 1.0
  target_score: 0.85
  warning_threshold: 0.75
  critical_threshold: 0.65
  improvement_threshold: 0.05
scoring_methodology:
