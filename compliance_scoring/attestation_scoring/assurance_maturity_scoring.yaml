requirements:
  - All Assurance Maturity Scoring scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Assurance Maturity Scoring score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Assurance Maturity Scoring scores must refresh per defined measurement_frequency with staleness alerts
