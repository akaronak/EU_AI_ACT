purpose:
  >
    Executable compliance scoring skill for Assurance Maturity Scoring within
    compliance_scoring/attestation_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for attestation integrity, assurance maturity, certification confidence. Functions
    as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Assurance Maturity Scoring across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Assurance Maturity Scoring
  - Enable executive and board decision intelligence from Assurance Maturity Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Assurance Maturity Scoring
  - Support conformity assessment and notified body review with Assurance Maturity Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  assurance_maturity_scoring_composite_score:
    >
      Normalized 0-1 compliance score for Assurance Maturity Scoring computed from weighted
      dimensions.
  assurance_maturity_scoring_score_confidence:
    >
      Statistical confidence in Assurance Maturity Scoring score based on evidence completeness and
      freshness.
  assurance_maturity_scoring_weighted_dimension_score:
    Individual dimension score contributing to Assurance Maturity Scoring composite.
  assurance_maturity_scoring_score_degradation_signal:
    >
      Alert when Assurance Maturity Scoring score drops below improvement threshold over rolling
      window.
  assurance_maturity_scoring_regulatory_alignment_index:
    Degree of Assurance Maturity Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: assurance_maturity_scoring_scoring_taxonomy
  scoring_phase:
