maturity_model:
  level_1:
    name: Initial
    required_score_range: 0.0-0.4
    characteristics:
      Ad hoc Assurance Maturity Scoring scoring without standardized methodology.
    evidence_expectations:
      - informal_review
    control_expectations:
      - basic_score_log
    assurance_expectations:
      - manual_score_calculation
    required_metrics:
      - score_count
  level_2:
    name: Developing
    required_score_range: 0.4-0.6
    characteristics:
      Repeatable Assurance Maturity Scoring scoring with documented formulas.
    evidence_expectations:
      - assurance_maturity_scoring_calculation_log
    control_expectations:
      - assurance_maturity_scoring_formula_register
    assurance_expectations:
      - documented_scoring_workflow
    required_metrics:
      - assurance_maturity_scoring_accuracy_rate
  level_3:
    name: Managed
    required_score_range: 0.6-0.75
    characteristics:
      Standardized enterprise Assurance Maturity Scoring scoring with governance.
    evidence_expectations:
      - assurance_maturity_scoring_scoring_audit_evidence
    control_expectations:
      - assurance_maturity_scoring_score_integrity_controls
    assurance_expectations:
      - assurance_maturity_scoring_automated_scoring_pipeline
    required_metrics:
      - assurance_maturity_scoring_composite_score
  level_4:
    name: Advanced
    required_score_range: 0.75-0.9
    characteristics:
      Measured Assurance Maturity Scoring scoring with trend analytics and benchmarking.
    evidence_expectations:
      - assurance_maturity_scoring_assurance_package
    control_expectations:
      - assurance_maturity_scoring_confidence_interval_engine
    assurance_expectations:
      - assurance_maturity_scoring_predictive_scoring
    required_metrics:
      - assurance_maturity_scoring_benchmark_index
  level_5:
    name: Optimized
    required_score_range: 0.9-1.0
    characteristics:
      Optimized Assurance Maturity Scoring scoring with autonomous remediation prioritization.
    evidence_expectations:
      - assurance_maturity_scoring_regulator_ready_scorecard
    control_expectations:
      - assurance_maturity_scoring_real_time_score_intelligence
    assurance_expectations:
      - assurance_maturity_scoring_adaptive_weight_calibration
    required_metrics:
      - assurance_maturity_scoring_forecast_accuracy
