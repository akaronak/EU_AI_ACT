purpose:
  >
    Executable compliance scoring skill for Altai Scoring Alignment within
    compliance_scoring/crosswalks. Delivers measurable, monitorable, auditable compliance
    intelligence for regulatory alignment scoring, cross-border scoring, framework mapping scores.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Altai Scoring Alignment across EU AI Act high-risk and GPAI
    systems.
objectives:
  - Compute verifiable, auditable compliance scores for Altai Scoring Alignment
  - Enable executive and board decision intelligence from Altai Scoring Alignment score outputs
  - Detect score degradation and trigger prioritized remediation for Altai Scoring Alignment
  - Support conformity assessment and notified body review with Altai Scoring Alignment scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  altai_scoring_alignment_composite_score:
    Normalized 0-1 compliance score for Altai Scoring Alignment computed from weighted dimensions.
  altai_scoring_alignment_score_confidence:
    >
      Statistical confidence in Altai Scoring Alignment score based on evidence completeness and
      freshness.
  altai_scoring_alignment_weighted_dimension_score:
    Individual dimension score contributing to Altai Scoring Alignment composite.
  altai_scoring_alignment_score_degradation_signal:
    Alert when Altai Scoring Alignment score drops below improvement threshold over rolling window.
  altai_scoring_alignment_regulatory_alignment_index:
    Degree of Altai Scoring Alignment score alignment with EU AI Act obligation coverage.
taxonomy:
  root: altai_scoring_alignment_scoring_taxonomy
  scoring_phase:
