requirements:
  - All Altai Scoring Alignment scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Altai Scoring Alignment score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Altai Scoring Alignment scores must refresh per defined measurement_frequency with staleness alerts
