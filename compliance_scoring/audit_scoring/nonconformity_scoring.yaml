requirements:
  - All Nonconformity Scoring scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Nonconformity Scoring score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Nonconformity Scoring scores must refresh per defined measurement_frequency with staleness alerts
