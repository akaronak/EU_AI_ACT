purpose:
  >
    Executable compliance scoring skill for Nonconformity Scoring within
    compliance_scoring/audit_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for audit readiness scoring, audit evidence scoring, audit maturity. Functions as
    scoring, governance measurement, risk scoring, conformity scoring, assurance, audit readiness,
    evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Nonconformity Scoring across EU AI Act high-risk and GPAI
    systems.
objectives:
  - Compute verifiable, auditable compliance scores for Nonconformity Scoring
  - Enable executive and board decision intelligence from Nonconformity Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Nonconformity Scoring
  - Support conformity assessment and notified body review with Nonconformity Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  nonconformity_scoring_composite_score:
    Normalized 0-1 compliance score for Nonconformity Scoring computed from weighted dimensions.
  nonconformity_scoring_score_confidence:
    >
      Statistical confidence in Nonconformity Scoring score based on evidence completeness and
      freshness.
  nonconformity_scoring_weighted_dimension_score:
    Individual dimension score contributing to Nonconformity Scoring composite.
  nonconformity_scoring_score_degradation_signal:
    Alert when Nonconformity Scoring score drops below improvement threshold over rolling window.
  nonconformity_scoring_regulatory_alignment_index:
    Degree of Nonconformity Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: nonconformity_scoring_scoring_taxonomy
  scoring_phase:
    - evidence_ingestion
    - dimension_scoring
    - aggregation
    - validation
    - publication
    - monitoring
  nonconformity_scoring_score_status:
    - draft
    - computed
    - validated
    - published
    - degraded
    - superseded
  score_consumer:
