  oversight_body: Compliance Scoring Governance Committee
  domain: audit_scoring
  review_cadence: monthly
roles_and_responsibilities:
  nonconformity_scoring_scoring_owner:
    responsibilities:
      - Accountable for Nonconformity Scoring score methodology, accuracy, and publication
  nonconformity_scoring_scoring_analyst:
    responsibilities:
      - Executes Nonconformity Scoring score calculations and evidence validation
  nonconformity_scoring_methodology_auditor:
    responsibilities:
      - Independently validates Nonconformity Scoring scoring methodology quarterly
  executive_scorecard_owner:
    responsibilities:
      - Ensures Nonconformity Scoring scores feed executive decision scorecards
