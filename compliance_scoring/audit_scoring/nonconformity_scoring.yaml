workflows:
  - workflow_id: WF-CS-NONCONFORMITY_SC
    workflow_name: nonconformity_scoring_scoring_workflow
    workflow_owner: nonconformity_scoring_scoring_owner
    trigger: nonconformity_scoring_score_calculation_due
    inputs:
      - nonconformity_scoring_evidence_feed
      - nonconformity_scoring_control_telemetry
    activities:
      - evidence_ingestion
      - dimension_scoring
      - weight_application
      - confidence_calculation
      - threshold_evaluation
      - score_publication
      - remediation_trigger
    decision_points:
      - nonconformity_scoring_threshold_breach_decision
    approvals:
      - nonconformity_scoring_scoring_analyst_review
    outputs:
      - nonconformity_scoring_composite_score
    evidence_generated:
      - nonconformity_scoring_score_calculation_log
    success_criteria:
      - nonconformity_scoring_composite_score_published
      - evidence_confidence_above_minimum
    failure_conditions:
      - insufficient_evidence
      - formula_integrity_failure
decision_logic:
  nonconformity_scoring_score_publication_gate:
    condition: nonconformity_scoring_score_confidence >= 0.80 AND nonconformity_scoring_methodology_valid == true
    action: publish_nonconformity_scoring_composite_score
    approval_required: nonconformity_scoring_scoring_owner
  nonconformity_scoring_remediation_trigger:
    condition: nonconformity_scoring_composite_score < 0.75
    action: initiate_nonconformity_scoring_remediation_workflow
    approval_required: compliance_officer
scoring_model:
  score_name: nonconformity_scoring_composite_score
  score_type: composite_weighted
  score_purpose: Measure Nonconformity Scoring compliance posture
  scoring_methodology: nonconformity_scoring_weighted_dimension_scoring
  weighting_model: nonconformity_scoring_domain_weights
  aggregation_logic: weighted_average_with_confidence_adjustment
  confidence_model: nonconformity_scoring_evidence_confidence
  severity_model: nonconformity_scoring_gap_severity_tiers
  maturity_model: five_level_compliance_maturity
  validation_method: nonconformity_scoring_scoring_methodology_audit
  review_frequency: monthly
  minimum_score: 0.0
  maximum_score: 1.0
  target_score: 0.85
  warning_threshold: 0.75
  critical_threshold: 0.65
  improvement_threshold: 0.05
scoring_methodology:
  evaluation_dimensions:
    - nonconformity_scoring_control_effectiveness
    - nonconformity_scoring_evidence_quality
    - nonconformity_scoring_regulatory_alignment
    - nonconformity_scoring_governance_maturity
    - nonconformity_scoring_risk_posture
  weighting_factors: nonconformity_scoring_domain_weight_matrix
  scoring_formula: sum(dimension_score * weight) * confidence_factor
  normalization_method: min_max_with_regulatory_baseline
  aggregation_method: weighted_average_with_confidence_adjustment
  confidence_calculation: nonconformity_scoring_evidence_confidence
  severity_calculation: nonconformity_scoring_gap_severity_tiers
  trend_analysis: nonconformity_scoring_rolling_30_90_180_day_trend
  forecasting_method: nonconformity_scoring_bayesian_score_forecast
  benchmarking_method: nonconformity_scoring_peer_regulatory_industry_benchmark
score_categories:
  overall_compliance_score:
