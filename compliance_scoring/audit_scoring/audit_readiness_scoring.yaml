purpose:
  >
    Executable compliance scoring skill for Audit Readiness Scoring within
    compliance_scoring/audit_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for audit readiness scoring, audit evidence scoring, audit maturity. Functions as
    scoring, governance measurement, risk scoring, conformity scoring, assurance, audit readiness,
    evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Audit Readiness Scoring across EU AI Act high-risk and GPAI
    systems.
objectives:
  - Compute verifiable, auditable compliance scores for Audit Readiness Scoring
  - Enable executive and board decision intelligence from Audit Readiness Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Audit Readiness Scoring
  - Support conformity assessment and notified body review with Audit Readiness Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  audit_readiness_scoring_composite_score:
    Normalized 0-1 compliance score for Audit Readiness Scoring computed from weighted dimensions.
  audit_readiness_scoring_score_confidence:
    >
      Statistical confidence in Audit Readiness Scoring score based on evidence completeness and
      freshness.
  audit_readiness_scoring_weighted_dimension_score:
    Individual dimension score contributing to Audit Readiness Scoring composite.
  audit_readiness_scoring_score_degradation_signal:
    Alert when Audit Readiness Scoring score drops below improvement threshold over rolling window.
  audit_readiness_scoring_regulatory_alignment_index:
    Degree of Audit Readiness Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: audit_readiness_scoring_scoring_taxonomy
  scoring_phase:
    - evidence_ingestion
    - dimension_scoring
