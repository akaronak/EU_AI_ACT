purpose:
  >
    Executable compliance scoring skill for Regulatory Compliance Metrics within
    compliance_scoring/compliance_metrics. Delivers measurable, monitorable, auditable compliance
    intelligence for compliance metrics, continuous monitoring metrics, regulatory metrics.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Regulatory Compliance Metrics across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Regulatory Compliance Metrics
  - Enable executive and board decision intelligence from Regulatory Compliance Metrics score outputs
  - Detect score degradation and trigger prioritized remediation for Regulatory Compliance Metrics
  - Support conformity assessment and notified body review with Regulatory Compliance Metrics scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  regulatory_compliance_metrics_composite_score:
    >
      Normalized 0-1 compliance score for Regulatory Compliance Metrics computed from weighted
      dimensions.
  regulatory_compliance_metrics_score_confidence:
    >
      Statistical confidence in Regulatory Compliance Metrics score based on evidence completeness and
      freshness.
  regulatory_compliance_metrics_weighted_dimension_score:
    Individual dimension score contributing to Regulatory Compliance Metrics composite.
  regulatory_compliance_metrics_score_degradation_signal:
    >
      Alert when Regulatory Compliance Metrics score drops below improvement threshold over rolling
      window.
  regulatory_compliance_metrics_regulatory_alignment_index:
    Degree of Regulatory Compliance Metrics score alignment with EU AI Act obligation coverage.
taxonomy:
  root: regulatory_compliance_metrics_scoring_taxonomy
