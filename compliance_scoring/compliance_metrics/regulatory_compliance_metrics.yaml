requirements:
  - All Regulatory Compliance Metrics scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Regulatory Compliance Metrics score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Regulatory Compliance Metrics scores must refresh per defined measurement_frequency with staleness alerts
