workflows:
  - workflow_id: WF-CS-REGULATORY_COMPL
    workflow_name: regulatory_compliance_metrics_scoring_workflow
    workflow_owner: regulatory_compliance_metrics_scoring_owner
    trigger: regulatory_compliance_metrics_score_calculation_due
    inputs:
      - regulatory_compliance_metrics_evidence_feed
      - regulatory_compliance_metrics_control_telemetry
    activities:
      - evidence_ingestion
      - dimension_scoring
      - weight_application
      - confidence_calculation
      - threshold_evaluation
      - score_publication
      - remediation_trigger
    decision_points:
      - regulatory_compliance_metrics_threshold_breach_decision
    approvals:
      - regulatory_compliance_metrics_scoring_analyst_review
    outputs:
      - regulatory_compliance_metrics_composite_score
    evidence_generated:
      - regulatory_compliance_metrics_score_calculation_log
    success_criteria:
      - regulatory_compliance_metrics_composite_score_published
      - evidence_confidence_above_minimum
    failure_conditions:
      - insufficient_evidence
      - formula_integrity_failure
decision_logic:
  regulatory_compliance_metrics_score_publication_gate:
    condition: regulatory_compliance_metrics_score_confidence >= 0.80 AND regulatory_compliance_metrics_methodology_valid == true
    action: publish_regulatory_compliance_metrics_composite_score
    approval_required: regulatory_compliance_metrics_scoring_owner
  regulatory_compliance_metrics_remediation_trigger:
    condition: regulatory_compliance_metrics_composite_score < 0.75
    action: initiate_regulatory_compliance_metrics_remediation_workflow
    approval_required: compliance_officer
scoring_model:
  score_name: regulatory_compliance_metrics_composite_score
  score_type: composite_weighted
  score_purpose: Measure Regulatory Compliance Metrics compliance posture
  scoring_methodology: regulatory_compliance_metrics_weighted_dimension_scoring
  weighting_model: regulatory_compliance_metrics_domain_weights
  aggregation_logic: weighted_average_with_confidence_adjustment
  confidence_model: regulatory_compliance_metrics_evidence_confidence
  severity_model: regulatory_compliance_metrics_gap_severity_tiers
  maturity_model: five_level_compliance_maturity
  validation_method: regulatory_compliance_metrics_scoring_methodology_audit
  review_frequency: monthly
  minimum_score: 0.0
  maximum_score: 1.0
  target_score: 0.85
  warning_threshold: 0.75
  critical_threshold: 0.65
  improvement_threshold: 0.05
scoring_methodology:
  evaluation_dimensions:
    - regulatory_compliance_metrics_control_effectiveness
    - regulatory_compliance_metrics_evidence_quality
    - regulatory_compliance_metrics_regulatory_alignment
    - regulatory_compliance_metrics_governance_maturity
    - regulatory_compliance_metrics_risk_posture
  weighting_factors: regulatory_compliance_metrics_domain_weight_matrix
  scoring_formula: sum(dimension_score * weight) * confidence_factor
  normalization_method: min_max_with_regulatory_baseline
  aggregation_method: weighted_average_with_confidence_adjustment
  confidence_calculation: regulatory_compliance_metrics_evidence_confidence
  severity_calculation: regulatory_compliance_metrics_gap_severity_tiers
  trend_analysis: regulatory_compliance_metrics_rolling_30_90_180_day_trend
  forecasting_method: regulatory_compliance_metrics_bayesian_score_forecast
  benchmarking_method: regulatory_compliance_metrics_peer_regulatory_industry_benchmark
score_categories:
  overall_compliance_score:
    score_engine: regulatory_compliance_metrics_overall_compliance_score_engine
    primary: False
    weight: 0.05
    target: 0.85
    warning_threshold: 0.75
    critical_threshold: 0.65
  regulatory_readiness_score:
