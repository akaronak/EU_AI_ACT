purpose:
  >
    Executable compliance scoring skill for Runtime Operational Scoring within
    compliance_scoring/operational_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for operational resilience, human oversight scoring, incident response scoring.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Runtime Operational Scoring across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Runtime Operational Scoring
  - Enable executive and board decision intelligence from Runtime Operational Scoring score outputs
  - Detect score degradation and trigger prioritized remediation for Runtime Operational Scoring
  - Support conformity assessment and notified body review with Runtime Operational Scoring scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  runtime_operational_scoring_composite_score:
    >
      Normalized 0-1 compliance score for Runtime Operational Scoring computed from weighted
      dimensions.
  runtime_operational_scoring_score_confidence:
    >
      Statistical confidence in Runtime Operational Scoring score based on evidence completeness and
      freshness.
  runtime_operational_scoring_weighted_dimension_score:
    Individual dimension score contributing to Runtime Operational Scoring composite.
  runtime_operational_scoring_score_degradation_signal:
    >
      Alert when Runtime Operational Scoring score drops below improvement threshold over rolling
      window.
  runtime_operational_scoring_regulatory_alignment_index:
    Degree of Runtime Operational Scoring score alignment with EU AI Act obligation coverage.
taxonomy:
  root: runtime_operational_scoring_scoring_taxonomy
  scoring_phase:
