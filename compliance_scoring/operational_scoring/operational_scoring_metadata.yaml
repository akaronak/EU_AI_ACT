requirements:
  - All Operational Scoring Metadata scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Operational Scoring Metadata score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Operational Scoring Metadata scores must refresh per defined measurement_frequency with staleness alerts
