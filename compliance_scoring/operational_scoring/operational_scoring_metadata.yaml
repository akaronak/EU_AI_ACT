assessment_framework:
  assessment_scope: Operational Scoring Metadata compliance scoring dimensions
  assessment_methodology: operational_scoring_metadata_iso_19011_scoring_assessment
  acceptance_threshold: 0.85
validation_framework:
  validation_method: operational_scoring_metadata_scoring_methodology_audit
  review_frequency: monthly
  independent_review: operational_scoring_metadata_methodology_auditor
risk_model:
  risk_sources:
    - operational_scoring_metadata_score_input_degradation
    - operational_scoring_metadata_evidence_quality_failure
    - operational_scoring_metadata_methodology_drift
    - operational_scoring_metadata_regulatory_misalignment
  risk_scenarios:
    operational_scoring_metadata_false_compliance_confidence_scenario:
      severity: 90
      risk_owner: operational_scoring_metadata_scoring_owner
    operational_scoring_metadata_score_manipulation_scenario:
      severity: 95
      risk_owner: operational_scoring_metadata_scoring_owner
    operational_scoring_metadata_stale_score_decision_scenario:
      severity: 75
      risk_owner: operational_scoring_metadata_scoring_owner
  residual_risk_ceiling: 0.20
  risk_monitoring: operational_scoring_metadata_scoring_risk_dashboard
metrics:
  - metric_name: operational_scoring_metadata_compliance_score
    metric_category: scoring
    formula: computed_operational_scoring_metadata_compliance_score_from_operational_scoring_metadata_engine
    target: >= 0.85
    warning_threshold: < 0.75
    critical_threshold: < 0.65
    measurement_frequency: weekly
    owner: operational_scoring_metadata_scoring_owner
    data_source: operational_scoring_metadata_score_warehouse
