purpose:
  >
    Executable compliance scoring skill for Operational Scoring Metadata within
    compliance_scoring/operational_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for operational resilience, human oversight scoring, incident response scoring.
    Functions as scoring, governance measurement, risk scoring, conformity scoring, assurance, audit
    readiness, evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Operational Scoring Metadata across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Operational Scoring Metadata
  - Enable executive and board decision intelligence from Operational Scoring Metadata score outputs
  - Detect score degradation and trigger prioritized remediation for Operational Scoring Metadata
  - Support conformity assessment and notified body review with Operational Scoring Metadata scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  operational_scoring_metadata_composite_score:
    >
      Normalized 0-1 compliance score for Operational Scoring Metadata computed from weighted
      dimensions.
  operational_scoring_metadata_score_confidence:
    >
      Statistical confidence in Operational Scoring Metadata score based on evidence completeness and
      freshness.
  operational_scoring_metadata_weighted_dimension_score:
    Individual dimension score contributing to Operational Scoring Metadata composite.
  operational_scoring_metadata_score_degradation_signal:
    >
      Alert when Operational Scoring Metadata score drops below improvement threshold over rolling
      window.
  operational_scoring_metadata_regulatory_alignment_index:
    Degree of Operational Scoring Metadata score alignment with EU AI Act obligation coverage.
