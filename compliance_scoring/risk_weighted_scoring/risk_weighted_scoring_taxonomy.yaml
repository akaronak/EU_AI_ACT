    validation_method: risk_dynamic_risk_weight_calibration_methodology_audit
    testing_method: risk_dynamic_risk_weight_calibration_backtesting_and_sampling
    control_owner: risk_weighted_scoring_taxonomy_scoring_owner
    evidence_generated: risk_dynamic_risk_weight_calibration_scoring_record
