requirements:
  - All Risk Weighted Scoring Taxonomy scores must be computed from auditable, versioned formulas
  - Evidence completeness below 0.80 must reduce Risk Weighted Scoring Taxonomy score confidence proportionally
  - Score publication requires dual validation by scoring analyst and methodology owner
  - Risk Weighted Scoring Taxonomy scores must refresh per defined measurement_frequency with staleness alerts
