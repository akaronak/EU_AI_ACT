purpose:
  >
    Executable compliance scoring skill for Risk Weighted Scoring Taxonomy within
    compliance_scoring/risk_weighted_scoring. Delivers measurable, monitorable, auditable compliance
    intelligence for residual risk scoring, dynamic weighting, high-risk AI scoring. Functions as
    scoring, governance measurement, risk scoring, conformity scoring, assurance, audit readiness,
    evidence scoring, certification scoring, and executive intelligence skill.
scope:
  >
    All compliance telemetry, evidence inputs, control assessments, score outputs, and executive
    intelligence artifacts governed by Risk Weighted Scoring Taxonomy across EU AI Act high-risk and
    GPAI systems.
objectives:
  - Compute verifiable, auditable compliance scores for Risk Weighted Scoring Taxonomy
  - Enable executive and board decision intelligence from Risk Weighted Scoring Taxonomy score outputs
  - Detect score degradation and trigger prioritized remediation for Risk Weighted Scoring Taxonomy
  - Support conformity assessment and notified body review with Risk Weighted Scoring Taxonomy scoring evidence
  - Aggregate cross-domain compliance intelligence for enterprise assurance reporting
definitions:
  risk_weighted_scoring_taxonomy_composite_score:
    >
      Normalized 0-1 compliance score for Risk Weighted Scoring Taxonomy computed from weighted
      dimensions.
  risk_weighted_scoring_taxonomy_score_confidence:
    >
      Statistical confidence in Risk Weighted Scoring Taxonomy score based on evidence completeness
      and freshness.
  risk_weighted_scoring_taxonomy_weighted_dimension_score:
    Individual dimension score contributing to Risk Weighted Scoring Taxonomy composite.
  risk_weighted_scoring_taxonomy_score_degradation_signal:
    >
      Alert when Risk Weighted Scoring Taxonomy score drops below improvement threshold over rolling
      window.
  risk_weighted_scoring_taxonomy_regulatory_alignment_index:
    Degree of Risk Weighted Scoring Taxonomy score alignment with EU AI Act obligation coverage.
taxonomy:
  root: risk_weighted_scoring_taxonomy_scoring_taxonomy
  scoring_phase:
    - evidence_ingestion
    - dimension_scoring
    - aggregation
    - validation
    - publication
    - monitoring
  risk_weighted_scoring_taxonomy_score_status:
