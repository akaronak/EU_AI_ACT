metrics:
  - metric_name: "supervision_effectiveness_assessment_human_intervention_effectiveness_score"
    formula: "COUNT(successful_interventions) / COUNT(total_interventions)"
    target: "1.00"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "WEEKLY"
    owner: "Oversight Coordinator"
    data_source: "intervention_events_log"
    evidence_generated: "Weekly Intervention Status report."
  - metric_name: "supervision_effectiveness_assessment_override_success_rate"
    formula: "COUNT(successful_override_events) / COUNT(total_override_events)"
    target: "0.98"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "WEEKLY"
    owner: "Supervisor"
    data_source: "override_events_log"
    evidence_generated: "Weekly Override Events report."
  - metric_name: "supervision_effectiveness_assessment_supervisory_review_quality_score"
    formula: "COUNT(passed_review_scorecards) / COUNT(total_review_scorecards)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Supervisor"
    data_source: "supervisory_scorecard_vault"
    evidence_generated: "Weekly Supervisory scorecard."
  - metric_name: "supervision_effectiveness_assessment_decision_accountability_score"
    formula: "COUNT(assigned_owners) / COUNT(total_system_roles)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
