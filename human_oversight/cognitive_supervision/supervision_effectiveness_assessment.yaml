  escalation_contact: "oversight_safety@enterprise.ai"
roles_and_responsibilities:
  compliance_steward: "Primary owner of Supervision Effectiveness Assessment compliance registries and documentation audits."
  supervisor: "Responsible for model run review evaluations and updating Supervision Effectiveness Assessment override logs."
  oversight_coordinator: "Responsible for coordinating human oversight controls and threshold validations."
