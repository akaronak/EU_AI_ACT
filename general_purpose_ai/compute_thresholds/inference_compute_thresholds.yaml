metrics:
  - metric_name: "inference_compute_thresholds_gpai_assurance_score"
    formula: "COUNT(signed_evidence_records) / COUNT(total_evidence_requirements)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "MONTHLY"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_db"
    evidence_generated: "Monthly Compliance Assurance report."
  - metric_name: "inference_compute_thresholds_gpai_governance_score"
    formula: "COUNT(implemented_controls) / COUNT(total_required_controls)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.80"
    measurement_frequency: "QUARTERLY"
    owner: "Compliance Steward"
    data_source: "gpai_control_registry"
    evidence_generated: "Quarterly Control Implementation report."
  - metric_name: "inference_compute_thresholds_systemic_risk_score"
    formula: "COUNT(failed_simulations) / COUNT(total_simulations)"
    target: "0.10"
    warning_threshold: "0.08"
    critical_threshold: "0.05"
    measurement_frequency: "WEEKLY"
    owner: "Safety Lead"
    data_source: "systemic_risk_telemetry"
    evidence_generated: "Weekly Systemic Risk assessment reports."
  - metric_name: "inference_compute_thresholds_ecosystem_governance_score"
    formula: "COUNT(partner_compliance_checks) / COUNT(total_registered_partners)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.80"
    measurement_frequency: "MONTHLY"
    owner: "Safety Lead"
    data_source: "partner_compliance_vault"
    evidence_generated: "Monthly Partner Audit reports."
  - metric_name: "inference_compute_thresholds_transparency_compliance_score"
    formula: "COUNT(validated_declarations) / COUNT(total_declarations)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "ON_RELEASE"
    owner: "Compliance Steward"
    data_source: "model_card_log"
    evidence_generated: "Signed Model Card Attestation certificate."
  - metric_name: "inference_compute_thresholds_autonomy_risk_score"
    formula: "COUNT(unauthorized_steps) / COUNT(total_execution_steps)"
    target: "0.15"
    warning_threshold: "0.12"
    critical_threshold: "0.10"
    measurement_frequency: "REAL_TIME"
    owner: "Safety Lead"
    data_source: "agent_decision_logs"
    evidence_generated: "Weekly Autonomy Review report."
  - metric_name: "inference_compute_thresholds_capability_management_score"
    formula: "COUNT(completed_evals) / COUNT(total_candidate_builds)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Compliance Steward"
    data_source: "eval_db"
    evidence_generated: "Weekly Model Evaluation Attestation report."
  - metric_name: "inference_compute_thresholds_accountability_effectiveness_score"
    formula: "COUNT(assigned_owners) / COUNT(total_system_roles)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "QUARTERLY"
    owner: "Compliance Steward"
    data_source: "gpai_accountability_vault"
    evidence_generated: "Quarterly Accountability Assignment reports."
  - metric_name: "inference_compute_thresholds_gpai_operational_readiness_score"
    formula: "COUNT(passed_readiness_checks) / COUNT(total_readiness_checks)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.80"
    measurement_frequency: "ON_RELEASE"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_db"
    evidence_generated: "Signed Pre-Release Attestation certificate."
  - metric_name: "inference_compute_thresholds_gpai_maturity_score"
    formula: "current_maturity_level / 6.0"
    target: "0.83"
    warning_threshold: "0.67"
    critical_threshold: "0.50"
    measurement_frequency: "ANNUALLY"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_db"
    evidence_generated: "Annual Maturity Assessment certificate."
kpis:
  - "inference_compute_thresholds_gpai_assurance_score"
  - "inference_compute_thresholds_systemic_risk_score"
kris:
  - "inference_compute_thresholds_autonomy_risk_score"
  - "inference_compute_thresholds_gpai_maturity_score"
thresholds:
  - "Warning: inference_compute_thresholds_gpai_assurance_score < 0.98"
  - "Critical: inference_compute_thresholds_gpai_assurance_score < 0.95"
