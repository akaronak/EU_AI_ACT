metrics:
  - metric_name: "compliance_reporting_report_accuracy_score"
    formula: "COUNT(accurate_reports) / COUNT(total_compiled_reports)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "MONTHLY"
    owner: "Reporting Officer"
    data_source: "reporting_logs_db"
    evidence_generated: "Monthly Report Accuracy report."
  - metric_name: "compliance_reporting_report_timeliness_score"
    formula: "COUNT(on_time_filings) / COUNT(total_required_filings)"
    target: "0.98"
    warning_threshold: "0.95"
    critical_threshold: "0.90"
    measurement_frequency: "MONTHLY"
    owner: "Reporting Officer"
    data_source: "reporting_logs_db"
    evidence_generated: "Monthly Report Timeliness report."
  - metric_name: "compliance_reporting_report_completeness_score"
    formula: "COUNT(complete_reports) / COUNT(total_compiled_reports)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Reporting Officer"
