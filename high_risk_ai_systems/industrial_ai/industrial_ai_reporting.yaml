  governance_structure: "Enterprise High-Risk AI Oversight Council - Industrial Ai"
  roles_and_responsibilities:
    compliance_steward: "Responsible for leading general obligations and documentation checks for Industrial Ai Reporting."
    risk_engineer: "Responsible for conducting risk evaluations and mitigations for Industrial Ai Reporting."
    oversight_coordinator: "Responsible for managing human oversight controls and intervention triggers for Industrial Ai Reporting."
  stakeholders:
