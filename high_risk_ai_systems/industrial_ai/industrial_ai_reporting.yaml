  - "Compile verifiable evidence reports to prove readiness for Article 6-20 and Article 26/43 obligations."
definitions:
  industrial_ai_reporting_governance_policy: "The primary operational high-risk AI governance policy guidelines for Industrial Ai Reporting."
  industrial_ai_reporting_telemetry_payload: "Structured telemetry bundle containing risk events, capability indicators, and safety scores."
