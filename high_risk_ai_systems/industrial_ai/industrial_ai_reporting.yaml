metrics:
  - metric_name: "industrial_ai_reporting_high_risk_compliance_score"
    formula: "COUNT(passed_compliance_checks) / COUNT(total_compliance_checks)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Compliance Steward"
    data_source: "compliance_ledger_db"
    evidence_generated: "Weekly Compliance status report."
  - metric_name: "industrial_ai_reporting_fundamental_rights_assurance_score"
    formula: "COUNT(passed_rights_checks) / COUNT(total_rights_checks)"
    target: "0.95"
    warning_threshold: "0.90"
    critical_threshold: "0.80"
    measurement_frequency: "MONTHLY"
    owner: "Risk Engineer"
    data_source: "rights_scorecard_vault"
    evidence_generated: "Monthly Rights Impact scorecard."
  - metric_name: "industrial_ai_reporting_human_oversight_effectiveness_score"
    formula: "COUNT(supervisor_signoffs) / COUNT(total_override_events)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "WEEKLY"
    owner: "Oversight Coordinator"
    data_source: "override_events_log"
    evidence_generated: "Weekly Oversight Review report."
  - metric_name: "industrial_ai_reporting_conformity_readiness_score"
    formula: "COUNT(passed_conformity_checks) / COUNT(total_conformity_requirements)"
    target: "1.00"
    warning_threshold: "0.98"
    critical_threshold: "0.95"
    measurement_frequency: "ON_RELEASE"
    owner: "Compliance Steward"
    data_source: "conformity_checklists_db"
